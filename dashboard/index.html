<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9876;</text></svg>">
<title>Comp Forge</title>
<style>
:root{
  --bg:#E8EBEE; --surface:#F4F6F8; --surface-2:#DEE3E8; --sunk:#D6DCE2;
  --ink:#161C23; --ink-2:#4A5763; --ink-3:#71808D;
  --rule:#C6CED6; --rule-2:#B2BCC6;
  --brass:#8A6420; --brass-bright:#A87C32; --brass-wash:#EFE6D4;
  --gap:#A63D37; --gap-wash:#F2DEDC;
  --ok:#3F6B4C;
  --over:#5E4E8C;
  --shadow:0 1px 2px rgba(22,28,35,.07), 0 8px 24px -12px rgba(22,28,35,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#141B23; --surface-2:#1D262F; --sunk:#0A0F14;
    --ink:#E4E9EE; --ink-2:#94A3B1; --ink-3:#6B7A88;
    --rule:#29343E; --rule-2:#38454F;
    --brass:#D2A251; --brass-bright:#E5BC72; --brass-wash:#2A2416;
    --gap:#D4665E; --gap-wash:#2E1A18;
    --ok:#6FA983;
    --over:#9B87D4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#141B23; --surface-2:#1D262F; --sunk:#0A0F14;
  --ink:#E4E9EE; --ink-2:#94A3B1; --ink-3:#6B7A88;
  --rule:#29343E; --rule-2:#38454F;
  --brass:#D2A251; --brass-bright:#E5BC72; --brass-wash:#2A2416;
  --gap:#D4665E; --gap-wash:#2E1A18;
  --ok:#6FA983;
  --over:#9B87D4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brass-bright); outline-offset:2px; border-radius:3px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule); background:var(--surface);
  padding:18px 28px; display:flex; flex-wrap:wrap; gap:20px 28px; align-items:baseline;
}
.brandmark{display:flex; align-items:baseline; gap:12px}
.brandmark h1{font-size:22px; letter-spacing:-.01em}
.brandmark .sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3);
}
.masthead .spacer{flex:1}
.chip{
  font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  padding:4px 9px; border:1px solid var(--rule-2); border-radius:2px; color:var(--ink-2);
  display:inline-flex; gap:7px; align-items:center; white-space:nowrap;
}
.chip .dot{width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none}
.about-link{
  font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--brass); text-decoration:none; white-space:nowrap;
  padding:4px 0; border-bottom:1px solid transparent;
}
.about-link:hover{border-bottom-color:var(--brass)}

/* ---------- shell ---------- */
.shell{
  display:grid; grid-template-columns:minmax(280px,340px) minmax(0,1fr);
  gap:0; align-items:start; max-width:1500px; margin:0 auto;
}
@media (max-width:960px){ .shell{grid-template-columns:1fr} }

.rail{
  border-right:1px solid var(--rule); padding:24px 22px 60px;
  display:flex; flex-direction:column; gap:26px;
  position:sticky; top:0; max-height:100vh; overflow-y:auto;
}
@media (max-width:960px){ .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule)} }

.main{padding:24px 28px 80px; display:flex; flex-direction:column; gap:26px; min-width:0}

.sec-label{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); display:flex; align-items:center; gap:10px; margin-bottom:11px;
}
.sec-label::after{content:""; flex:1; height:1px; background:var(--rule)}

/* ---------- setup ---------- */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
.field label{font-size:12px; color:var(--ink-2)}
select, .text-input{
  font:inherit; font-family:var(--mono); font-size:13px; padding:7px 9px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--rule-2); border-radius:3px; width:100%;
}
.text-input::placeholder{color:var(--ink-3)}
.share-btn{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
  width:100%; padding:8px; margin-top:10px;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:3px; color:var(--ink-2);
}
.share-btn:hover{border-color:var(--brass); color:var(--brass)}
.clear-btn:hover{border-color:var(--gap); color:var(--gap)}
.clear-btn[data-armed="1"]{border-color:var(--gap); color:var(--gap); background:var(--gap-wash)}
.size-row{display:flex; gap:4px; flex-wrap:wrap; align-items:center}
.size-btn{
  font-family:var(--mono); font-size:13px; min-width:32px; height:30px; padding:0 6px;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:3px;
  color:var(--ink-2);
}
.size-btn[aria-pressed="true"]{
  background:var(--brass); border-color:var(--brass); color:var(--surface); font-weight:600;
}
:root[data-theme="dark"] .size-btn[aria-pressed="true"],
html:not([data-theme="light"]) .size-btn[aria-pressed="true"]{color:#0D1218}
.size-input{
  font-family:var(--mono); font-size:14px; width:58px; height:30px; text-align:center;
  background:var(--surface); color:var(--ink); border:1px solid var(--rule-2); border-radius:3px;
}
.size-hint{font-size:11px; color:var(--ink-3); margin-top:5px; line-height:1.5}
.btn-row{display:flex; gap:8px; margin-top:10px}
.btn-row .share-btn{margin-top:0; flex:1}
.notice{
  font-size:11.5px; line-height:1.45; color:var(--ink-2);
  background:var(--gap-wash); border-left:2px solid var(--gap);
  padding:7px 10px; margin-top:8px; border-radius:0 3px 3px 0;
}

/* ---------- roster — champion-select styling. Each row is "lit" by its
   own weapon render (right-aligned, masked to a glow) and carries a
   role-colored edge, lobby style. Role hues match the badge palette. ---------- */
.roster{display:flex; flex-direction:column; gap:5px}
.tally{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px}
.tally .t{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  padding:3px 8px; border:1px solid var(--rule-2); border-radius:2px; color:var(--ink-2);
}
.tally .t b{color:var(--ink); font-weight:600}
.tally .t[data-pfilter]{cursor:pointer}
.tally .t[data-pfilter]:hover{border-color:currentColor}
.tally .t[aria-pressed="true"]{
  background:var(--surface-2); border-color:currentColor;
  box-shadow:inset 0 0 0 1px currentColor;
}
.tally .t-tank{color:#6A8FC9; border-color:#6A8FC9}
.tally .t-healer{color:var(--ok); border-color:var(--ok)}
.tally .t-melee{color:#BA5C72; border-color:#BA5C72}
.tally .t-range{color:#C97B4A; border-color:#C97B4A}
.tally .t-support{color:var(--over); border-color:var(--over)}
.tally .t[data-pfilter] b{color:inherit}

/* Add-weapon chip bar: the picker's own facet chips (role + provides) */
.pchips{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:9px; align-items:center}
.pchips .lbl2{font-family:var(--mono); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); margin-right:2px}
.pchip{
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; padding:2px 7px; background:transparent;
  border:1px solid var(--rule-2); border-radius:2px; color:var(--ink-2);
}
.pchip:hover{border-color:currentColor}
.pchip[aria-pressed="true"]{
  background:var(--surface-2); border-color:currentColor;
  box-shadow:inset 0 0 0 1px currentColor;
}
.pchip.b-tank,.pchip.t-tank{color:#6A8FC9}
.pchip.b-heal,.pchip.t-healer{color:var(--ok)}
.pchip.b-peel{color:#45A3AD}
.pchip.b-cc{color:var(--over)}
.pchip.b-aoe,.pchip.t-range{color:#C97B4A}
.pchip.b-st,.pchip.t-melee{color:#BA5C72}
.pchip.b-dps{color:#948A45}
.pchip.t-support{color:var(--over)}
.slot{
  display:flex; align-items:center; gap:9px; padding:9px 10px; min-height:50px;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  position:relative; overflow:hidden;
  --role:var(--rule-2);
  border-left:3px solid var(--role);
}
.slot.role-tank{--role:#6A8FC9} .slot.role-healer{--role:var(--ok)}
.slot.role-melee{--role:#BA5C72} .slot.role-range{--role:#C97B4A}
.slot.role-support{--role:var(--over)}
.slot::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:var(--wbg); background-repeat:no-repeat;
  background-position:left -18px center; background-size:96px;
  opacity:.13; filter:saturate(1.25);
  -webkit-mask-image:linear-gradient(90deg,#000 28%,transparent 70%);
  mask-image:linear-gradient(90deg,#000 28%,transparent 70%);
}
.slot:hover{border-color:var(--role); border-left-color:var(--role)}
.slot:hover::before{opacity:.26}
.slot > *{position:relative}
.slot .n{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); width:14px; flex:none}
.slot .nm{flex:1; font-size:13.5px; min-width:0}
.fn{
  font-family:var(--mono); font-size:10px; color:var(--ink-3);
  letter-spacing:.04em; display:block; margin-top:1px;
}
.icon{flex:none; border-radius:3px; vertical-align:middle}
span.icon.ph{display:inline-block; background:var(--sunk); border:1px dashed var(--rule-2)}
.nm-btn{appearance:none; background:none; border:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer}
.nm-btn:hover{color:var(--brass); text-decoration:underline; text-underline-offset:2px}
.info{
  font-family:var(--mono); font-size:9.5px; color:var(--ink-3); flex:none; cursor:pointer;
  border:1px solid var(--rule-2); border-radius:50%; width:16px; height:16px;
  display:inline-flex; align-items:center; justify-content:center; font-style:italic;
}
.info:hover{color:var(--brass); border-color:var(--brass)}
/* weapon detail drawer */
.dt-head{display:flex; gap:12px; align-items:center; margin-bottom:6px}
.dt-head b{font-family:var(--serif); font-size:18px}
.dt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:4px 32px; align-items:start}
#drawer h4{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); margin:12px 0 5px; font-weight:400;
}
.sp-list{list-style:none; margin:0; padding:0}
.sp-list li{font-size:12.5px; padding:2.5px 0; display:flex; gap:9px; align-items:baseline}
.sp-list .idx{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); min-width:20px; flex:none; letter-spacing:.05em}
.sp-list li.pick, .sp-list li.pick .idx{color:var(--brass); font-weight:600}
.lo-box{
  border:1px solid var(--brass); border-radius:3px; background:var(--brass-wash);
  padding:8px 12px; font-size:12.5px; margin-top:10px; line-height:1.7;
}
.lo-box .who{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--brass)}
.fieldnote{
  font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:4px;
}
.fieldnote span{color:var(--ink-3); font-size:10px}
.fn .least{color:var(--gap); font-weight:600}
/* per-member swap advice (engine swapReview) */
.fn.swap{margin-top:3px; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:baseline}
.fn.swap .offcomp{color:var(--gap); font-weight:600}
.fn.swap .swap-lbl{color:var(--brass)}
.swap-opt{
  appearance:none; background:none; border:0; padding:0; font:inherit; cursor:pointer;
  color:var(--ink-2); text-decoration:underline; text-underline-offset:2px;
}
.swap-opt:hover{color:var(--brass)}
.meta-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:2px 28px}
.meta-row{display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px}
.meta-row .rk{font-family:var(--mono); font-size:10px; color:var(--ink-3); width:14px; flex:none}
.meta-row .pct{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); margin-left:auto}
.slot .x{
  background:none; border:0; color:var(--ink-3); font-size:16px; line-height:1;
  padding:2px 5px; border-radius:3px; flex:none;
}
.slot .x:hover{color:var(--gap); background:var(--gap-wash)}
.slot.next{
  border-style:dashed; border-color:var(--brass); background:transparent;
  color:var(--brass); font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase;
}
.slot.next .n{color:var(--brass)}
.slot.more{
  border:0; background:transparent; color:var(--ink-3);
  font-family:var(--mono); font-size:11px; letter-spacing:.05em; padding:2px 10px;
}

/* ---------- weapon picker ---------- */
.pick-grid{display:flex; flex-direction:column; gap:3px}
.pick{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  padding:7px 9px; background:transparent; border:1px solid transparent; border-radius:3px;
}
.pick:hover:not(:disabled){background:var(--surface-2); border-color:var(--rule)}
.pick:disabled{opacity:.38; cursor:not-allowed}
.pick .nm{flex:1; font-size:13.5px; min-width:0}
.prov{
  font-family:var(--mono); font-size:9px; letter-spacing:.06em; padding:2px 5px;
  border-radius:2px; flex:none; text-transform:uppercase;
}
.prov.curated{background:var(--brass-wash); color:var(--brass)}
.prov.draft{background:var(--surface-2); color:var(--ink-3)}

/* ---------- capability badges: what a weapon PROVIDES, at a glance.
   A chip appears only at defining strength (score >= 2) — score-1 trickles
   are minor by the magnitude rule and would drown the signal. Mid-tone hues
   hold up on both themes; the label itself is the legend. ---------- */
.bdg{
  display:inline-block; font-family:var(--mono); font-size:8.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; padding:1px 4px; margin-left:4px;
  border-radius:2px; border:1px solid currentColor; vertical-align:1.5px;
  line-height:1.4; opacity:.92; cursor:pointer;
}
.bdg:hover{opacity:1; background:var(--surface-2)}
.facet{
  display:flex; align-items:center; gap:8px; margin:-4px 0 8px;
  font-family:var(--mono); font-size:11px; color:var(--ink-2);
}
.facet .fx{
  background:none; border:1px solid var(--rule-2); border-radius:2px;
  color:var(--ink-3); font-size:12px; line-height:1; padding:2px 6px;
}
.facet .fx:hover{color:var(--gap); border-color:var(--gap)}
.b-tank{color:#6A8FC9}
.b-heal{color:var(--ok)}
.b-peel{color:#45A3AD}
.b-cc{color:var(--over)}
.b-aoe{color:#C97B4A}
.b-st{color:#BA5C72}
.b-dps{color:#948A45}

/* ---------- command bar: state left, action right ---------- */
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.cmdbar{
  display:grid; grid-template-columns:minmax(240px,1fr) minmax(320px,1.35fr);
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  overflow:hidden; box-shadow:var(--shadow);
}
@media (max-width:880px){ .cmdbar{grid-template-columns:1fr} }
.cb-fit{padding:16px 20px 18px; border-right:1px solid var(--rule); display:flex; flex-direction:column; gap:9px}
@media (max-width:880px){ .cb-fit{border-right:0; border-bottom:1px solid var(--rule)} }
.cb-fit .num{font-family:var(--mono); font-size:38px; font-weight:600; line-height:1; letter-spacing:-.02em}
.cb-fit .of{font-family:var(--mono); font-size:13px; color:var(--ink-3)}
.meter-track{height:7px; background:var(--sunk); border-radius:4px; overflow:hidden}
.meter-fill{height:100%; background:linear-gradient(180deg,var(--brass-bright),var(--brass)); border-radius:4px; transition:width .35s cubic-bezier(.4,0,.2,1)}
.cb-next{
  padding:16px 20px; background:var(--brass-wash); display:flex; flex-direction:column;
  gap:4px; justify-content:center; position:relative; overflow:hidden;
}
.cb-next::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:var(--wbg); background-repeat:no-repeat;
  background-position:right -26px center; background-size:150px;
  opacity:.12; filter:saturate(1.25);
  -webkit-mask-image:linear-gradient(90deg,transparent 45%,#000 85%);
  mask-image:linear-gradient(90deg,transparent 45%,#000 85%);
}
.cb-next > *{position:relative}
.cb-next .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass)}
.cb-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.cb-next .nm{font-family:var(--serif); font-size:24px; letter-spacing:-.01em; line-height:1.2}
.cb-next .rl{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.cb-add{
  margin-left:auto; padding:9px 16px; background:var(--brass); color:var(--surface);
  border:0; border-radius:3px; font-size:13.5px; font-weight:600; white-space:nowrap;
}
:root[data-theme="dark"] .cb-add, html:not([data-theme="light"]) .cb-add{color:#0D1218}
.cb-add:hover{background:var(--brass-bright)}
.cb-forge{
  padding:8px 13px; background:transparent; color:var(--brass);
  border:1px solid var(--brass); border-radius:3px; font-size:12px; white-space:nowrap;
}
.cb-forge:hover{background:var(--brass-wash)}
.cb-full{font-size:13.5px; color:var(--ink-2)}

/* ---------- diagnosis | prescription band ---------- */
.duo{display:grid; grid-template-columns:minmax(250px,330px) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:1100px){ .duo{grid-template-columns:1fr} }

/* ---------- capability readout ---------- */
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:2px 30px}
.grp{padding:12px 0 4px}
.grp h3{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); margin-bottom:9px; padding-bottom:5px; border-bottom:1px solid var(--rule);
}
.cap{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:5px 0; align-items:center}
.cap-name{
  font-family:var(--mono); font-size:12px; color:var(--ink-2);
  background:none; border:0; padding:0; text-align:left; letter-spacing:.01em;
}
.cap-name:hover{color:var(--brass); text-decoration:underline; text-underline-offset:2px}
.cap-val{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.cap-bar{grid-column:1/-1; height:5px; background:var(--sunk); border-radius:3px; position:relative; overflow:hidden}
.cap-bar i{position:absolute; inset:0 auto 0 0; border-radius:3px; transition:width .35s cubic-bezier(.4,0,.2,1)}
.cap-bar i.met{background:var(--ok)}
.cap-bar i.part{background:var(--brass)}
.cap-bar i.none{background:var(--gap)}
.cap-bar i.over{background:var(--over)}
.cap.floor-hit .cap-name{color:var(--gap); font-weight:600}
.tag{font-family:var(--mono); font-size:9px; letter-spacing:.05em; padding:1px 4px; border-radius:2px; margin-left:5px}
.tag.floor{background:var(--gap-wash); color:var(--gap)}
.tag.over{background:var(--surface-2); color:var(--over)}

/* ---------- weaknesses: needed now vs nice to have ---------- */
.weak-list{display:flex; flex-direction:column; gap:8px}
.weak-sub{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gap); margin:2px 0 -2px;
}
.weak-sub.nice{color:var(--brass)}
.weak{
  display:flex; align-items:baseline; gap:12px; padding:11px 14px;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--gap); border-radius:0 3px 3px 0;
}
.weak.nice{border-left-color:var(--brass); padding:8px 14px}
.weak.nice .txt{font-size:12.5px; color:var(--ink-2)}
.weak.nice .sc{color:var(--brass)}
.weak .rank{font-family:var(--mono); font-size:10px; color:var(--ink-3); flex:none}
.weak .txt{flex:1; font-size:13.5px; line-height:1.45}
.weak .txt b{font-family:var(--mono); font-size:12.5px; font-weight:600}
.weak .sc{font-family:var(--mono); font-size:12px; color:var(--gap); flex:none}
.weak-none{font-size:12.5px; color:var(--ink-2); padding:4px 0}

/* ---------- recommendation ---------- */
.rec{
  background:var(--surface); border:1px solid var(--brass); border-radius:4px;
  overflow:hidden; box-shadow:var(--shadow);
}
.rec-top{padding:18px 20px; border-bottom:1px solid var(--rule); background:var(--brass-wash)}
.rec-eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--brass); margin-bottom:8px;
}
.rec-name{font-family:var(--serif); font-size:27px; letter-spacing:-.01em; margin-bottom:3px}
.rec-role{font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}
.rec-body{padding:16px 20px; display:flex; flex-direction:column; gap:16px}
.why{font-size:14px; line-height:1.6; margin:0}
.why em{color:var(--brass); font-style:normal; font-weight:600}
.terms{display:flex; flex-direction:column; gap:3px}
.term{
  display:grid; grid-template-columns:58px 1fr auto; gap:12px; align-items:center;
  font-family:var(--mono); font-size:12px; padding:4px 0;
}
.term .d{color:var(--ok); text-align:right; font-weight:600}
.term .c{color:var(--ink-2)}
.term .mv{color:var(--ink-3); font-size:11px}
.formula{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); line-height:1.7;
  border-top:1px solid var(--rule); padding-top:12px;
}
.formula .k{color:var(--ink-2)}
.alts{display:flex; flex-direction:column; gap:5px}
.alt{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:9px 12px; background:transparent; border:1px solid var(--rule); border-radius:3px;
}
.alt:hover{border-color:var(--brass); background:var(--surface-2)}
.alt .sc{font-family:var(--mono); font-size:12px; color:var(--brass); width:44px; flex:none; font-weight:600}
.alt .nm{flex:1; font-size:13.5px}
.alt .rz{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); text-align:right}
.add{
  width:100%; padding:11px; background:var(--brass); color:var(--surface);
  border:0; border-radius:3px; font-size:14px; font-weight:600; letter-spacing:.01em;
}
:root[data-theme="dark"] .add, html:not([data-theme="light"]) .add{color:#0D1218}
.add:hover{background:var(--brass-bright)}

.warn{
  background:var(--gap-wash); border:1px solid var(--gap); border-radius:4px;
  padding:14px 16px; display:flex; gap:12px; align-items:flex-start;
  flex-direction:column; margin-top:12px;
}
.warn .t{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gap); flex:none; padding-top:2px;
}
.warn .b{font-size:13.5px; line-height:1.5}
.warn .b code{font-family:var(--mono); font-size:12px}

/* ---------- live party (companion) ---------- */
.companion{margin-top:14px; border-top:1px solid var(--rule); padding-top:14px}
.comp-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--ink-3); margin-right:7px; vertical-align:1px;
}
.companion[data-live="true"] .comp-dot{background:var(--ok)}
.companion .status{font-family:var(--mono); font-size:11px; color:var(--ink-2); margin:7px 0}
.companion .status .sub{color:var(--ink-3); display:block; margin-top:2px; line-height:1.5}
.comp-members{display:flex; flex-direction:column; gap:3px; margin:8px 0}
.comp-m{
  display:flex; align-items:center; gap:8px; font-size:12px;
  padding:4px 7px; background:var(--surface); border:1px solid var(--rule); border-radius:3px;
}
.comp-m .cm-role{width:6px; height:6px; border-radius:50%; background:var(--rule-2); flex:none}
.comp-m.role-tank .cm-role{background:#6A8FC9} .comp-m.role-healer .cm-role{background:var(--ok)}
.comp-m.role-melee .cm-role{background:#BA5C72} .comp-m.role-range .cm-role{background:#C97B4A}
.comp-m.role-support .cm-role{background:var(--over)}
.comp-m .cm-name{flex:none; color:var(--ink-2)}
.comp-m .cm-wpn{flex:1; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.comp-m .cm-wpn.unknown{color:var(--ink-3); font-style:italic}
.companion .load-btn{
  width:100%; padding:9px; margin-top:6px; background:var(--brass); color:var(--surface);
  border:0; border-radius:3px; font-family:var(--mono); font-size:11.5px;
  letter-spacing:.06em; text-transform:uppercase; font-weight:600;
}
:root[data-theme="dark"] .companion .load-btn,
html:not([data-theme="light"]) .companion .load-btn{color:#0D1218}
.companion .load-btn:hover{background:var(--brass-bright)}
.companion .load-btn:disabled{opacity:.4; cursor:not-allowed}

/* ---------- evidence drawer ---------- */
.drawer{
  position:fixed; inset:auto 0 0 0; background:var(--surface);
  border-top:2px solid var(--brass); box-shadow:0 -8px 32px -12px rgba(0,0,0,.35);
  padding:18px 24px 22px; max-height:52vh; overflow-y:auto; z-index:20;
  transform:translateY(101%); transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.drawer[data-open="true"]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){
  .drawer{transition:none}
  .meter-fill,.cap-bar i{transition:none}
}
.drawer-hd{display:flex; align-items:baseline; gap:14px; margin-bottom:14px; flex-wrap:wrap}
.drawer-hd h3{font-family:var(--mono); font-size:13px; letter-spacing:.04em}
.drawer-hd .close{margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:20px; line-height:1; padding:2px 7px}
.drawer-hd .close:hover{color:var(--ink)}
.ev-tbl{width:100%; border-collapse:collapse; font-size:13px}
.ev-tbl th{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); text-align:left; padding:0 14px 7px 0; font-weight:400;
  border-bottom:1px solid var(--rule);
}
.ev-tbl td{padding:8px 14px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.ev-tbl .sc{font-family:var(--mono); font-weight:600}
.ev-tbl .sp{font-family:var(--mono); font-size:11.5px; color:var(--brass)}
.ev-tbl .pend{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-style:italic}
.ev-empty{font-size:13px; color:var(--ink-2); padding:6px 0}
.scroll-x{overflow-x:auto}

.footnote{
  font-size:12px; line-height:1.6; color:var(--ink-2);
  border-top:1px solid var(--rule); padding-top:14px;
}
.footnote code{font-family:var(--mono); font-size:11.5px; color:var(--brass)}
</style>
</head>
<body>

<header class="masthead">
  <div class="brandmark">
    <h1>Comp Forge</h1>
    <span class="sub">Albion composition engine</span>
  </div>
  <div class="spacer"></div>
  <a class="about-link" href="how-it-works.html">How it works <span aria-hidden="true">→</span></a>
  <span class="chip"><span class="dot" id="parity-dot"></span><span id="parity-chip">parity — checking</span></span>
  <span class="chip">dataset <span class="mono" id="build-stamp">—</span></span>
</header>

<div class="shell">
  <aside class="rail">
    <section>
      <div class="sec-label">Setup</div>
      <div class="field">
        <label for="content">Content type</label>
        <select id="content">
          <option value="castle_outpost">Castle Outpost</option>
          <option value="roads" disabled>Roads of Avalon — template pending</option>
          <option value="hellgate5" disabled>Hellgate 5v5 — template pending</option>
          <option value="openworld" disabled>Open-world skirmish — template pending</option>
        </select>
      </div>
      <div class="field">
        <label for="style">Playstyle</label>
        <select id="style"></select>
        <div class="size-hint" id="style-blurb"></div>
      </div>
      <div class="field">
        <label for="size-input">Party size — however many you have</label>
        <div class="size-row">
          <button class="size-btn" id="size-minus" aria-label="one fewer">&minus;</button>
          <input class="size-input" id="size-input" type="number" min="2" max="60" inputmode="numeric">
          <button class="size-btn" id="size-plus" aria-label="one more">+</button>
          <span id="size-presets"></span>
        </div>
        <div class="size-hint" id="size-hint"></div>
      </div>
      <div id="size-notice"></div>
      <div class="btn-row">
        <button class="share-btn" id="share">copy share link</button>
        <button class="share-btn" id="export">copy comp text</button>
      </div>
      <div class="btn-row">
        <button class="share-btn clear-btn" id="clear">clear comp</button>
      </div>
      <div class="companion" id="companion" data-live="false">
        <button class="share-btn" id="companion-connect">connect live party</button>
        <div class="status" id="companion-status" hidden></div>
        <div class="comp-members" id="companion-members"></div>
        <button class="load-btn" id="companion-load" hidden>load party into comp</button>
      </div>
    </section>

    <section>
      <div class="sec-label">Party</div>
      <div class="tally" id="tally"></div>
      <div class="roster" id="roster"></div>
    </section>

    <section>
      <div class="sec-label">Add weapon</div>
      <div class="field">
        <select id="tree-filter" aria-label="Filter by weapon tree"></select>
      </div>
      <div class="field">
        <input class="text-input" id="pick-filter" placeholder="filter — type a weapon name" aria-label="Filter weapons" autocomplete="off">
      </div>
      <div id="picker-chips"></div>
      <div id="facet-slot"></div>
      <div class="pick-grid" id="picker"></div>
    </section>
  </aside>

  <main class="main">
    <section class="cmdbar">
      <div class="cb-fit">
        <div class="lbl">Composition fitness</div>
        <div><span class="num" id="fit-num">0.0</span> <span class="of" id="fit-of">/ 0</span></div>
        <div class="meter-track"><div class="meter-fill" id="fit-bar" style="width:0%"></div></div>
      </div>
      <div class="cb-next" id="cb-next"></div>
    </section>

    <section class="duo">
      <div>
        <div class="sec-label">Biggest weaknesses</div>
        <div class="weak-list" id="weaknesses"></div>
        <div id="warn-slot"></div>
      </div>
      <div>
        <div class="sec-label" id="rec-label">Why this pick</div>
        <div id="rec-slot"></div>
      </div>
    </section>

    <section>
      <div class="sec-label">Capability supply vs. target</div>
      <div class="groups" id="groups"></div>
    </section>

    <section id="meta-sec" hidden>
      <div class="sec-label" id="meta-label">This week on the killboard</div>
      <div class="meta-grid" id="meta-strip"></div>
    </section>

    <p class="footnote" id="footnote"></p>
  </main>
</div>

<div class="drawer" id="drawer" data-open="false" role="dialog" aria-label="Evidence">
  <div class="drawer-hd">
    <h3 id="drawer-title">evidence</h3>
    <span class="chip" id="drawer-rule">every nonzero score cites an equippable spell</span>
    <button class="close" id="drawer-close" aria-label="Close evidence">&times;</button>
  </div>
  <div class="scroll-x"><div id="drawer-body"></div></div>
</div>
<script>
/* Composition scoring — JavaScript port of engine/engine.py.
 *
 * SINGLE SOURCE OF MATH: engine/engine.py is authoritative; this file must
 * mirror it exactly and tests/test_js_parity.py verifies that it does
 * (same fitness, same rankings, across all templates, on random parties).
 * If you change one, change both, then run the parity test.
 *
 * Used two ways:
 *   - inlined into dashboard/index.html by build_dashboard.py (browser —
 *     dashboard/_app.js is rendering-only and calls this engine)
 *   - require()'d by tests/js_parity_runner.js (node)
 */
(function (root) {
  "use strict";

  /* Mechanics-affected capability families (MECHANICS_TODO.md): mirrors
     AOE_ESCALATION_CAPS / RESILIENCE_CAPS in engine.py. */
  var AOE_ESCALATION_CAPS = ["burst_aoe"];
  var RESILIENCE_CAPS = ["burst_st", "execute"];

  function CompEngine(data, content, size, style) {
    this.data = data;
    this.weapons = data.weapons;
    this.scoring = data.scoring;
    var w = this.scoring.weights;
    this.alpha = w.alpha; this.beta = w.beta;
    this.delta = w.delta; this.gamma = w.gamma;
    this.metaPrior = this.scoring.meta_prior || {};
    /* meta_prior is a FLAT {weapon: value} map or SIZE-BUCKETED
       {small|mid|large: {weapon: value}} (usage-derived, Q17). Mirrors
       engine.py meta_bucketed. */
    var mpKeys = Object.keys(this.metaPrior);
    this.metaBucketed = mpKeys.length > 0 &&
      mpKeys.every(function (k) { return k === "small" || k === "mid" || k === "large"; });
    this.synergies = (this.scoring.capability_synergies || []).map(function (s) {
      return [s.a, s.b, s.bonus];
    });
    this.mechanics = data.mechanics || {};
    this.setContent(content || "castle_outpost", size, style);
  }

  CompEngine.prototype.setContent = function (content, size, style) {
    this.template = this.data.templates[content];
    this.content = content;
    this.baseSize = this.template.base_size || size;
    this.size = (size === undefined || size === null) ? this.baseSize : size;
    this.reqs = this.template.requirements;
    this.floors = this.template.hard_floors || {};
    /* Playstyle overlay: multiplies capability WEIGHTS only; hard floors
       stay on the base weight (mirrors engine.py). */
    this.style = style || "balanced";
    var styles = this.data.styles || {};
    this.styleMults = (styles[this.style] || {}).multipliers || {};
    /* Mechanics overlay: ABSOLUTE physics by size, anchored to (balanced,
       base size) — base size unchanged, above it single-target damage is
       taxed harder (more focus fire) and AoE boosted (more escalation).
       Sub-linear growth (0.5) capped at 8. Mirrors engine.py set_content. */
    var styleMech = (styles[this.style] || {}).mechanics || {};
    var baseMech = (styles.balanced || {}).mechanics || {};
    var scale = this.baseSize ? this.size / this.baseSize : 1.0;
    var grow = function (p) {
      return p ? Math.min(8.0, p * (1.0 + 0.5 * (scale - 1.0))) : p;
    };
    this.mechMults = {};
    var i;
    for (i = 0; i < AOE_ESCALATION_CAPS.length; i++) {
      this.mechMults[AOE_ESCALATION_CAPS[i]] =
        this._escalationMult(grow(styleMech.expected_aoe_targets))
        / this._escalationMult(baseMech.expected_aoe_targets);
    }
    for (i = 0; i < RESILIENCE_CAPS.length; i++) {
      this.mechMults[RESILIENCE_CAPS[i]] =
        this._resilienceEff(grow(styleMech.focus_attackers))
        / this._resilienceEff(baseMech.focus_attackers);
    }
  };

  CompEngine.prototype._tableClamp = function (table, x) {
    var maxK = 0;
    for (var k in table) { var ki = parseInt(k, 10); if (ki > maxK) maxK = ki; }
    return Math.max(1, Math.min(Math.round(x), maxK));
  };

  CompEngine.prototype._escalationMult = function (targets) {
    var table = (this.mechanics.aoe_escalation || {}).damage_bonus_by_targets || {};
    var empty = true;
    for (var k in table) { empty = false; break; }
    if (empty || !targets) return 1.0;
    return 1.0 + table[String(this._tableClamp(table, targets))];
  };

  CompEngine.prototype._resilienceEff = function (attackers) {
    var table = (this.mechanics.focus_fire || {}).damage_reduction_unmounted || {};
    var empty = true;
    for (var k in table) { empty = false; break; }
    if (empty || !attackers) return 1.0;
    return 1.0 - table[String(this._tableClamp(table, attackers))];
  };

  CompEngine.prototype.weight = function (cap) {
    var m = this.styleMults[cap];
    return this.reqs[cap].weight * (m === undefined ? 1.0 : m);
  };

  CompEngine.prototype.extrapolated = function () {
    var v = this.template.validated_sizes || [this.baseSize];
    return v.indexOf(this.size) === -1;
  };

  CompEngine.prototype.target = function (cap) {
    var r = this.reqs[cap];
    return r.scales ? r.target * this.size / this.baseSize : r.target;
  };

  CompEngine.prototype.softCap = function (cap) {
    var r = this.reqs[cap];
    return r.scales ? r.soft_cap * this.size / this.baseSize : r.soft_cap;
  };

  CompEngine.prototype.capsOf = function (weapon) {
    return this.weapons[weapon].capabilities;
  };

  CompEngine.prototype.supply = function (party) {
    /* Raw capability units summed over the party (sheet numbers). */
    var s = {};
    for (var i = 0; i < party.length; i++) {
      var caps = this.capsOf(party[i]);
      for (var cap in caps) s[cap] = (s[cap] || 0) + caps[cap];
    }
    return s;
  };

  CompEngine.prototype.effectiveSupply = function (party) {
    /* Supply after style-delivery physics (AoE escalation, Resilience).
       Balanced is the identity. All scoring reads THIS (mirrors engine.py). */
    var s = this.supply(party);
    for (var cap in this.mechMults) {
      var m = this.mechMults[cap];
      if (m !== 1.0 && cap in s) s[cap] = s[cap] * m;
    }
    return s;
  };

  CompEngine.prototype._floorPenalty = function (cap, have) {
    var f = this.floors[cap];
    if (!f || this.size < f.min_party_size || have >= f.floor_units) return 0.0;
    var w = this.reqs[cap].weight;
    return f.penalty_mult * w * (f.floor_units - have) / f.floor_units;
  };

  CompEngine.prototype.fitness = function (party) {
    var s = this.effectiveSupply(party), total = 0.0;
    for (var cap in this.reqs) {
      var have = s[cap] || 0.0, target = this.target(cap), soft = this.softCap(cap);
      /* style multiplies the VALUE of coverage; over-stack economics and
         floors stay on the base weight (mirrors engine.py, see T10) */
      total += this.weight(cap) * Math.pow(Math.min(1.0, have / target), this.gamma);
      if (have > soft) total -= 0.5 * this.reqs[cap].weight * (have - soft) / target;
      total -= this._floorPenalty(cap, have);
    }
    return total;
  };

  CompEngine.prototype.maxFitness = function () {
    var t = 0;
    for (var cap in this.reqs) t += this.weight(cap);
    return t;
  };

  CompEngine.prototype.synergy = function (party) {
    var s = this.effectiveSupply(party), total = 0.0;
    for (var i = 0; i < this.synergies.length; i++) {
      var a = this.synergies[i][0], c = this.synergies[i][1], b = this.synergies[i][2];
      total += b * Math.min(s[a] || 0, s[c] || 0);
    }
    return total;
  };

  /* ---- loadout model (mirrors engine.py; a player equips one spell per slot,
     so a candidate's marginal is its BEST single loadout, not the whole menu).
     Base-party supply stays flat-union; only the evaluated candidate is
     loadout-limited. Enumeration ORDER matches itertools.product exactly so
     the argmax picks the same loadout in both engines (parity). */
  CompEngine.prototype._eff = function (caps) {
    var out = {}, m;
    for (var c in caps) { m = this.mechMults[c]; out[c] = caps[c] * (m === undefined ? 1.0 : m); }
    return out;
  };

  CompEngine.prototype._loadoutEff = function (weapon) {
    var lo = this.weapons[weapon].loadout;
    var hasSlots = lo && lo.slots && lo.slots.length;
    var hasAlways = lo && lo.always && Object.keys(lo.always).length;
    if (!lo || (!hasSlots && !hasAlways))
      return { always: this._eff(this.capsOf(weapon)), slots: [] };
    var self = this;
    return {
      always: this._eff(lo.always || {}),
      slots: (lo.slots || []).map(function (slot) {
        return slot.map(function (b) { return self._eff(b); });
      }),
    };
  };

  CompEngine.prototype._margFitFrom = function (s, extra) {
    var total = 0.0;
    for (var cap in extra) {
      var gain = extra[cap];
      if (!(cap in this.reqs) || !gain) continue;
      var have = s[cap] || 0.0, target = this.target(cap), soft = this.softCap(cap);
      var baseW = this.reqs[cap].weight;
      total += this.weight(cap) * (Math.pow(Math.min(1.0, (have + gain) / target), this.gamma)
                                   - Math.pow(Math.min(1.0, have / target), this.gamma));
      total += this._floorPenalty(cap, have) - this._floorPenalty(cap, have + gain);
      var ob = have > soft ? 0.5 * baseW * (have - soft) / target : 0.0;
      var oa = (have + gain) > soft ? 0.5 * baseW * (have + gain - soft) / target : 0.0;
      total -= oa - ob;
    }
    return total;
  };

  CompEngine.prototype._margSynFrom = function (s, baseSyn, extra) {
    var total = 0.0;
    for (var i = 0; i < this.synergies.length; i++) {
      var a = this.synergies[i][0], c = this.synergies[i][1], b = this.synergies[i][2];
      total += b * Math.min((s[a] || 0) + (extra[a] || 0), (s[c] || 0) + (extra[c] || 0));
    }
    return total - baseSyn;
  };

  CompEngine.prototype.bestLoadout = function (s, baseSyn, weapon) {
    var le = this._loadoutEff(weapon), always = le.always, slots = le.slots;
    /* each slot equips exactly ONE spell (no empty option) — see engine.py */
    var choices = slots.filter(function (slot) { return slot.length; });
    var combos = [[]], i, j, k, next;
    for (i = 0; i < choices.length; i++) {           /* cartesian product, itertools order */
      next = [];
      for (j = 0; j < combos.length; j++)
        for (k = 0; k < choices[i].length; k++)
          next.push(combos[j].concat([choices[i][k]]));
      combos = next;
    }
    var best = null;

  const m = (USAGE.meta || {})[key];

  const n = (USAGE.buckets[key] || {})[w] || 0;

/* ------------------------------------------------ live party (companion)

   mixed-content blocking, so the HTTPS page can read it directly. */
const COMPANION_URL = "http://localhost:53321";
let companionOn = false, companionTimer = null, companionData = null;

async function companionPoll(){
  try {
    const r = await fetch(COMPANION_URL + "/party", {cache: "no-store"});
    if (!r.ok) throw new Error("http " + r.status);
    companionData = await r.json();

document.addEventListener("click", e => {
  /* chip facets first: badges/role chips nest inside add/detail buttons,
     so they must win the closest() race */
  const pf = e.target.closest("[data-pfilter]");
  if (pf){
    PARTY_FACET = PARTY_FACET === pf.dataset.pfilter ? null : pf.dataset.pfilter;
    /* update pressed states IN PLACE — rebuilding the tally would replace
       the chip mid-click and a double-click would toggle straight back off */
    document.querySelectorAll("#tally .t[data-pfilter]").forEach(el =>
      el.setAttribute("aria-pressed", String(el.dataset.pfilter === PARTY_FACET)));
    renderRoster(); return;
  }
  const bf = e.target.closest("[data-bfilter]");
  if (bf){ setFacet({type: "badge", v: bf.dataset.bfilter},
                    !bf.closest("#picker-chips")); return; }
  const rf = e.target.closest("[data-rfilter]");
  if (rf){ setFacet({type: "role", v: rf.dataset.rfilter},
                    !rf.closest("#picker-chips")); return; }
  if (e.target.closest("#facet-clear")){ setFacet(null); return; }
  const sw = e.target.closest("[data-swapat]");
  if (sw){ party[+sw.dataset.swapat] = sw.dataset.swapto; render(); return; }
  const det = e.target.closest("[data-detail]");
  if (det){ renderDetail(det.dataset.detail); return; }
  const add = e.target.closest("[data-add]");
  if (add){ if (party.length < HARD_CAP){
    party.push(add.dataset.add);
    PARTY_FACET = null;   /* the new member must be visible */
    render(); } return; }
  if (e.target.closest("#forge")){
    /* Greedy auto-build: repeatedly take the engine's top pick. */
    const goal = Math.min(SIZE, HARD_CAP);
    while (party.length < goal){
      const r = recommend(party, 1);
      if (!r.length) break;
      party.push(r[0].w);
    }
    PARTY_FACET = null;   /* show the whole forged comp, not a filtered view */
    render();
    return;
  }
  const rm = e.target.closest("[data-remove]");
  if (rm){ party.splice(+rm.dataset.remove, 1); render(); return; }
  if (e.target.closest("#companion-connect")){ toggleCompanion(); return; }
  if (e.target.closest("#companion-load")){ loadCompanionParty(); return; }
  if (e.target.closest("#clear")){
    /* two-step: first click arms, second within 2.2s clears — a misclick
       must never wipe a 20-slot comp */
    const b = $("clear");
    if (b.dataset.armed === "1"){
      delete b.dataset.armed; b.textContent = "clear comp";
      party = []; PARTY_FACET = null; render();
    } else {
      b.dataset.armed = "1"; b.textContent = "really clear? click again";
      setTimeout(() => { delete b.dataset.armed; b.textContent = "clear comp"; }, 2200);
    }
    return;
  }
  const sz = e.target.closest("[data-size]");
  if (sz){ PLANNED = +sz.dataset.size; render(); return; }
  if (e.target.closest("#size-minus")){ PLANNED = Math.max(2, PLANNED - 1); render(); return; }
  if (e.target.closest("#size-plus")){ PLANNED = Math.min(HARD_CAP, PLANNED + 1); render(); return; }
  const cap = e.target.closest("[data-cap]");
  if (cap){ renderEvidence(cap.dataset.cap); return; }
  if (e.target.closest("#share")){
    saveHash();
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(location.href).then(() =>
        flashBtn("share", "copied", "copy share link"));
    return;
  }
  if (e.target.closest("#export")){
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(compText()).then(() =>
        flashBtn("export", "copied", "copy comp text"));
    return;
  }
  if (e.target.closest("#drawer-close")){ $("drawer").dataset.open = "false"; return; }
  if (!e.target.closest("#drawer")) $("drawer").dataset.open = "false";
});
document.addEventListener("change", e => {
  if (e.target.id === "content"){ CONTENT = e.target.value; PLANNED = baseSize(); party = []; PARTY_FACET = null; render(); }
  if (e.target.id === "style"){ STYLE = e.target.value; render(); }
  if (e.target.id === "tree-filter"){ treeFilter = e.target.value; renderPicker(); }
  if (e.target.id === "size-input"){
    const v = Math.round(+e.target.value);
    if (v >= 2 && v <= HARD_CAP){ PLANNED = v; render(); } else { e.target.value = PLANNED; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "pick-filter"){ pickFilter = e.target.value; renderPicker(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ")
      && e.target.matches("[data-bfilter],[data-rfilter],[data-pfilter]")){
    e.preventDefault(); e.target.click(); return;
  }
  if (e.key === "Escape"){ $("drawer").dataset.open = "false"; return; }
  /* "/" jumps to the weapon filter from anywhere outside a text field */
  if (e.key === "/" && !e.target.closest("input,select,textarea")){
    e.preventDefault(); $("pick-filter").focus();
  }
});
/* Enter in the filter adds the top match — repeatable for duplicate picks */
$("pick-filter").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const keys = filteredWeapons();
  if (keys.length && party.length < HARD_CAP){ party.push(keys[0]); render(); }
});
/* A pasted share-link hash applies without a reload. saveHash() uses
   replaceState, which never fires hashchange, so this cannot loop. The
   party view-filter resets — it described the previous comp. */
window.addEventListener("hashchange", () => {
  if (loadHash()){ PARTY_FACET = null; render(); }
});

$("build-stamp").textContent = `v${META.version} · ${META.weapons_curated}/${META.weapons_total} curated`;

/* Boot: a shared link restores content/size/party; otherwise seed with the
   design doc's worked example (§4.3), if those sheets exist. */
const SEED = ["2H_LONGBOW","MAIN_ARCANESTAFF_UNDEAD","2H_ICECRYSTAL_UNDEAD"].filter(w => WEAPONS[w]);
if (!loadHash() && !loadStored()) party = SEED;
renderTreeFilter();
syncEngine();
render();

/* Parity guard. PARITY_EXPECTED is injected at build time by running
   engine/engine.py over the same seed party, so this compares the client
   against the Python engine's ACTUAL output rather than a hardcoded name that
   goes stale the moment a sheet is curated. Reported in the masthead chip. */
(function parity(){
  if (typeof PARITY_EXPECTED === "undefined" || !SEED.length) return;
  const e2 = new CompEngine(DATASET, "castle_outpost", 7);
  const got = {
    fitness: +e2.fitness(SEED).toFixed(2),
    recs: e2.recommend(SEED, 4).map(r => r.weapon),
    weaknesses: e2.weaknesses(SEED).map(x => x.cap),
  };
  const ok = JSON.stringify(got) === JSON.stringify(PARITY_EXPECTED);
  (ok ? console.info : console.error)("engine parity vs engine.py:",
    ok ? "OK" : "MISMATCH", ok ? got : {got, expected: PARITY_EXPECTED});
  const chip = $("parity-chip"), dot = $("parity-dot");
  if (chip) chip.textContent = ok ? "parity vs engine.py — OK" : "PARITY MISMATCH — do not trust";
  if (dot && !ok) dot.style.background = "var(--gap)";
})();
</script>
</body>
