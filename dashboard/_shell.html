/* ---------- capability badges: what a weapon PROVIDES, at a glance ---------- */
.bdg{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; padding:2px; margin-left:4px;
  border-radius:5px; border:1px solid currentColor; vertical-align:-6px;
  opacity:.88; cursor:pointer; transition:opacity .15s var(--ease), background .15s var(--ease);
}
.bdg .sem-icon{width:18px; height:18px}
.bdg:hover{opacity:1; background:var(--surface-2)}
.facet{
  display:flex; align-items:center; gap:8px; margin:-4px 0 8px;
  font-family:var(--mono); font-size:11px; color:var(--ink-2);
}
.facet .fx{
  background:none; border:1px solid var(--rule-2); border-radius:99px;
  color:var(--ink-3); font-size:12px; line-height:1; padding:2px 8px;
}
.facet .fx:hover{color:var(--gap); border-color:var(--gap)}
.b-tank{color:var(--role-tank)}
.b-heal{color:var(--role-healer)}
.b-peel{color:var(--role-peel)}
.b-cc{color:var(--over)}
.b-aoe{color:var(--role-range)}
.b-st{color:var(--role-melee)}
.b-dps{color:var(--role-support)}

/* ---------- the forge wheel stage: the page's centerpiece ----------
   An iron ring of weapon cards riding the rim, a brass notch marking the
   focused pick at 12 o'clock, and the party's role rings closing around
   the hub — the composition literally fills in at the center of the
   picking experience. Analysis flanks it: fitness + weaknesses left,
   the engine's reasoning right. */
.lbl{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
.ws-fit{margin-bottom:14px}
.ws-fit .num{
  font-family:var(--mono); font-size:40px; font-weight:700; line-height:1; letter-spacing:-.03em;
  background:linear-gradient(180deg, #FFFFFF, #B9BFDC);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.ws-fit .of{font-family:var(--mono); font-size:13px; color:var(--ink-3)}
.ws-fit .meter-track{margin-top:8px}
.meter-track{height:8px; background:var(--sunk); border-radius:99px; overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
/* the kit's signature: fitness fills as a cool→hot neon sweep */
.meter-fill{height:100%;
  background:linear-gradient(90deg, #189FC4, #4D8DFF 36%, #9D5CFF 68%, #E00063);
  border-radius:99px; transition:width .45s var(--ease);
  box-shadow:0 0 12px rgba(157,92,255,.5)}

/* the wheel proper — all rim geometry derives from --wd so the whole
   instrument scales with its column (100cqi = the center column's width) */
.wheel{
  position:relative; margin:10px auto 4px;
  --wd:min(720px, calc(100vw - 64px));
  --wd:min(720px, 100cqi);
  --card-w:clamp(76px, calc(var(--wd)*.185), 134px);
  --card-h:clamp(80px, calc(var(--wd)*.175), 128px);
  --wr:calc(var(--wd)/2 - var(--card-h)/2 - 8px);
  /* SEMICIRCLE stage (owner 2026-08-27, reference wheels): the box is no
     longer square — cards ride the top arc of a virtual --wd circle whose
     center sits at (50%, --wd/2), and the hub is a smaller circle in the
     arc's open mouth. Height = top arc + the hub's lower half; the width
     freed goes to the comp board below. Drag-to-rotate math derives the
     center from the WIDTH (see angleOf), never the box height. */
  /* 0.30 (was 0.21): the role rings ride out to just shy of the rim cards,
     so the hub interior breathes instead of leaving a dead moat of track.
     The min() guard keeps a 10px moat at narrow widths, where the cards'
     clamp() floors stop shrinking with --wd and would otherwise collide */
  --hub-r:min(calc(var(--wd)*0.30), calc(var(--wr) - var(--card-h)/2 - 10px));
  width:var(--wd);
  /* 0.85: the hub's lower arc holds nothing below the Add button — the
     box ends early and the hub's bottom fades out over the foot instead
     of pushing it a dead half-circle down */
  height:calc(var(--wd)/2 + var(--hub-r)*0.85);
}
.wheel:focus-visible{outline:2px solid var(--brass-bright); outline-offset:4px; border-radius:24px}
.wheel-track{
  /* the full --wd circle, anchored to the top; its lower arc fades out
     under the hub so only the semicircle reads */
  position:absolute; left:2px; top:2px;
  width:calc(var(--wd) - 4px); height:calc(var(--wd) - 4px);
  border-radius:50%;
  border:1px solid var(--rule);
  background:radial-gradient(closest-side,
    transparent 60%, rgba(18,21,28,.55) 62%, rgba(8,10,15,.6) 82%,
    rgba(255,201,58,.10) 96%, transparent);
  box-shadow:inset 0 0 30px rgba(0,0,0,.5);
  -webkit-mask-image:linear-gradient(180deg, #000 50%, rgba(0,0,0,.4) 60%, transparent 70%);
  mask-image:linear-gradient(180deg, #000 50%, rgba(0,0,0,.4) 60%, transparent 70%);
}
.wheel-notch{
  position:absolute; top:-4px; left:50%; z-index:3;
  width:12px; height:12px; transform:translateX(-50%) rotate(45deg);
  background:linear-gradient(135deg, var(--brass-bright), var(--brass-deep));
  border-radius:2px; box-shadow:0 0 14px rgba(255,201,58,.65);
}
.wheel-ring{position:absolute; left:0; top:0;
  width:var(--wd); height:var(--wd); transform-origin:50% 50%}
.wheel.spun .wheel-ring{animation:wheel-spin 1.15s cubic-bezier(.16,.7,.25,1)}
@keyframes wheel-spin{from{transform:rotate(2turn)}to{transform:rotate(0)}}
/* rim cards ride the wheel: rotate to their angle, push out to the rim,
   and stay tilted with it — like chest segments on a fortune wheel */
/* frameless rim cards (owner 2026-08-27: the weapon art is the star, no
   box) — the card is an invisible hit area; the icon carries the weight
   and the focused weapon glows instead of wearing a border */
.wseg{
  position:absolute; left:50%; top:50%;
  width:var(--card-w); height:var(--card-h);
  margin-left:calc(var(--card-w)/-2); margin-top:calc(var(--card-h)/-2);
  transform:rotate(var(--a,0deg)) translateY(calc(var(--wr)*-1));
  opacity:var(--fade,1);
  transition:transform .45s var(--ease), opacity .45s var(--ease);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  padding:0; background:none; border:0; box-shadow:none;
}
.wseg .icon{
  width:clamp(52px, calc(var(--wd)*0.105), 82px); height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) saturate(1.1);
  transition:filter .18s var(--ease);
}
.wseg:hover .icon{filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) saturate(1.2) brightness(1.12)}
.wseg.on{
  opacity:1;
  transform:rotate(var(--a,0deg)) translateY(calc(var(--wr)*-1)) scale(1.14);
}
.wseg.on .icon{
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,201,58,.55)) saturate(1.2);
}
.wseg .ws-nm{
  font-size:10.5px; line-height:1.2; text-align:center; color:var(--ink-2);
  max-width:100%; padding:0 3px; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  text-shadow:0 2px 6px rgba(0,0,0,.8);
}
.wseg.on .ws-nm{color:var(--brass-bright)}

/* the hub: party role rings closing around the focused weapon.
   Every fixed size in here is min()-capped against --wd so a narrower
   center column (setup rail open, three-column stage) shrinks the
   contents with the circle instead of cropping the weapon's name */
.wheel-hub{
  /* the hub floats in the arc's mouth: a --hub-r circle centered on the
     virtual wheel center, decoupled from the rim radius */
  position:absolute; left:50%; top:calc(var(--wd)/2);
  width:calc(var(--hub-r)*2); height:calc(var(--hub-r)*2);
  transform:translate(-50%, -50%); border-radius:50%;
  background:radial-gradient(closest-side, rgba(24,28,37,.94), rgba(13,16,22,.97));
  border:1px solid var(--rule-2);
  box-shadow:inset 0 0 42px rgba(0,0,0,.55), 0 0 34px -14px rgba(255,201,58,.3);
  /* the lower arc dissolves before the foot row (the wheel box ends at
     0.85 of the hub radius); the fade starts below the Add button (~82%) */
  -webkit-mask-image:linear-gradient(180deg, #000 84%, transparent 97%);
  mask-image:linear-gradient(180deg, #000 84%, transparent 97%);
}
/* overflow MUST stay visible: an <svg> clips at its viewport by default,
   and the outermost ring (r 94 + half its 6.5 stroke = 97.25) plus the
   .done glow reaches past the viewBox's 100 half-width - which cut the
   glow into a hard square, worst on the outermost (yellow) ring. The
   5px inset leaves room for it to spill inside the hub. */
.hub-rings{position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px);
  overflow:visible}
.hub-rings circle{fill:none; stroke-width:6.5;
  /* 180deg turns the circle's start to 9 o'clock sweeping over the top —
     the rings ride the same semicircle as the rim cards (renderHubRings
     halves the dash so 100% spans exactly that top arc) */
  transform:rotate(180deg); transform-origin:100px 100px}
.hub-rings .ring-track{stroke:rgba(255,255,255,.055)}
.hub-rings .ring-fill{stroke-linecap:round; transition:stroke-dasharray .5s var(--ease);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.hub-rings .ring-fill.empty{opacity:0}
.hub-rings .ring-fill.done{
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)) drop-shadow(0 0 5px currentColor)}
/* the band wears the wheel's material: a top-lit / bottom-shaded lip over
   the rings only (the mask keeps the hub interior clean), so they read as
   tread on the instrument instead of flat strokes floating on it */
.wheel-hub::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  pointer-events:none; z-index:1;
  background:
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%,
      rgba(0,0,0,.38) 97%),
    radial-gradient(closest-side, transparent 74%, rgba(0,0,0,.28) 78%,
      transparent 86%, rgba(0,0,0,.5) 99.5%);
  -webkit-mask-image:radial-gradient(closest-side, transparent 68%, #000 72%);
  mask-image:radial-gradient(closest-side, transparent 68%, #000 72%);
}
.hub-body{
  /* 20%: the mouth-hub is a touch smaller than the old ring-bound one,
     so the body claims a little more of its radius */
  position:absolute; inset:18%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:min(5px, calc(var(--wd)*0.009));
  text-align:center; min-width:0;
}
.hub-body .icon{filter:drop-shadow(0 6px 14px rgba(0,0,0,.6)) saturate(1.15);
  width:min(88px, calc(var(--wd)*0.15)); height:min(88px, calc(var(--wd)*0.15))}
/* the weapon art stands on its own — the old elemental aura halo read as
   a smeared square behind the icon and was removed (owner 2026-09-01);
   renderHub still stamps data-aura on the hub if a future skin wants it */
.hub-art-slot{position:relative; display:grid; place-items:center}
.hub-nm{
  font-family:var(--serif); font-size:min(20px, calc(var(--wd)*0.036));
  line-height:1.15; max-width:100%; flex:none;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
/* the glance row: the scored kit's top capabilities as icons — prose
   used to truncate here ("sustained dam…"); glyphs never do */
.hub-caps{display:flex; gap:5px; align-items:center; justify-content:center; margin:2px 0}
.hub-cap{
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:min(29px, calc(var(--wd)*0.054)); height:min(29px, calc(var(--wd)*0.054));
  border:1px solid var(--rule-2); border-radius:7px; background:rgba(255,255,255,.03);
  cursor:help; transition:border-color .15s var(--ease);
}
.hub-cap:hover{border-color:var(--brass-deep)}
.hub-cap .sem-icon{width:74%; height:74%}
.hub-cap.hub-cap-txt{
  width:auto; padding:0 8px; font-family:var(--mono);
  font-size:min(10px, calc(var(--wd)*0.019)); letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap;
}
.hub-score{font-size:min(13px, calc(var(--wd)*0.024)); color:var(--brass)}
.hub-score .offcomp{font-style:normal}
.hub-empty{font-size:12px; line-height:1.5; color:var(--ink-2); padding:0 6px}
.cb-add{
  padding:10px 18px;
  background:linear-gradient(180deg, var(--brass-bright), var(--brass));
  color:#1A1206; border:0; border-radius:11px; font-size:13.5px; font-weight:700; white-space:nowrap;
  box-shadow:0 2px 14px -4px rgba(255,201,58,.55), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s var(--ease), box-shadow .15s var(--ease), filter .15s var(--ease);
}
.cb-add:hover{filter:brightness(1.07); transform:translateY(-1px);
  box-shadow:0 4px 20px -4px rgba(255,201,58,.65), inset 0 1px 0 rgba(255,255,255,.35)}
.cb-add:active{transform:translateY(0)}
.hub-add{
  padding:min(9px, calc(var(--wd)*0.016)) min(19px, calc(var(--wd)*0.034));
  font-size:min(13px, calc(var(--wd)*0.024)); margin-top:min(6px, calc(var(--wd)*0.01));
}
.cb-forge{
  padding:9px 14px; background:transparent; color:var(--brass);
  border:1px solid rgba(255,201,58,.5); border-radius:11px; font-size:12px; white-space:nowrap;
  transition:background .15s var(--ease), border-color .15s var(--ease);
}
.cb-forge:hover{background:var(--brass-wash); border-color:var(--brass)}

/* beneath the wheel: ONE status row — the colour-matched ring legend, the
   over-plan warning, and the filter count — layered above the wheel's
   faded bottom arc, in the space it gave up */
.wheel-foot{display:flex; flex-direction:column; gap:7px; margin-top:0;
  position:relative; z-index:5}
.wheel-foot .wf-row{
  display:flex; align-items:center; justify-content:center; gap:10px 16px; flex-wrap:wrap;
}
.wf-count{font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.wf-over{font-family:var(--mono); font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--amber)}
.wf-rings{display:flex; gap:6px 14px; flex-wrap:wrap; justify-content:center}
.wf-ring{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase}
.wf-ring b{color:var(--ink); font-weight:600}
/* the comp board (owner 2026-08-27): roster under the wheel, one column
   per main role — equal columns filling the wheel column's full width,
   entries sized to read (the semicircle handed this row its space) */
.wf-comp{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:10px; width:100%; max-width:calc(var(--wd, 720px) + 40px); margin:0 auto;
  align-items:start}
.wf-col{display:flex; flex-direction:column; gap:3px;
  background:var(--sunk); border:1px solid var(--rule); border-top:2px solid var(--rc);
  border-radius:12px; padding:9px 10px 10px; min-width:0}
.wf-col-h{font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--rc); white-space:nowrap; margin-bottom:4px}
/* board members are FULL dm tiles — same popover, same kit/dossier/remove
   actions as the party strip (the board is on course to replace it) */
.wf-comp .dm{display:block}
.wf-mcard{
  width:100%; height:auto; min-height:52px;
  justify-content:flex-start; gap:10px; padding:5px 8px;
  border-radius:10px; border-bottom-width:2px;
}
.wf-mcard .icon{flex:none; border-radius:7px}
.wf-mnm{
  flex:1; min-width:0; text-align:left; font-size:12.5px; line-height:1.15;
  color:var(--ink-2);
}
.wf-mnm small{display:block; font-family:var(--mono); font-size:8.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  margin-top:1px; overflow:hidden; text-overflow:ellipsis}
.wf-mcard .n{position:static; margin-left:auto; font-size:9px; color:var(--ink-3); flex:none}
/* row tiles don't zoom like the strip's squares — highlight in place */
.wf-comp .dm:hover .dm-card, .wf-comp .dm:focus-within .dm-card{
  transform:none; background:var(--surface-2); border-color:var(--rule-2);
  box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:6;
}
.wf-comp .dm:hover + .dm .dm-card, .wf-comp .dm:has(+ .dm:hover) .dm-card{transform:none}
.wf-comp .dm .dm-pop{z-index:44}
.wf-comp .dm:first-child .dm-pop{left:50%; transform:translateX(-50%)}
.wf-comp .dm:last-child .dm-pop{left:50%; right:auto; transform:translateX(-50%)}
/* the open-slots column: the strip's dashed next-slot card, rehomed */
.wf-col-open{--rc:var(--brass-deep); border-style:dashed; background:transparent}
.wf-col-open .wf-col-h{color:var(--brass)}
.wf-mcard.next{border:0; background:transparent; box-shadow:none; cursor:default;
  justify-content:center; gap:8px}
.wf-mcard.next .n{margin-left:0; color:var(--brass)}
.wf-mcard.next .dm-plus{font-size:20px; line-height:1; color:var(--brass); opacity:.8}
/* notes rail under the board: duplicate-interaction notices + the open
   kit editor (the strip's roster-notes, rehomed with its class kept so
   the lo-panel rules still apply) */
.wf-notes{width:100%; max-width:calc(var(--wd, 720px) + 40px); margin:2px auto 0;
  text-align:left}

/* ---------- party dash: the comp board in a right-edge pop-out ----------
   (owner 2026-09-01: "make a clean dash on the right side which pops in
   and out and put the party members there so we can see them all"). One
   role section per row, every member a full dm tile with the same popover
   and kit/dossier/remove actions — renderWheelFoot fills #pdash-body. */
/* one column per role section — full-width tiles read in one scan, and
   the 256px popover fits the panel without horizontal clipping */
.epanel .wf-comp{grid-template-columns:1fr; max-width:none; gap:7px}
.epanel .wf-notes{max-width:none}
/* the whole party fits the viewport at once: tiles are compact and their
   height divides the available run by the member count (--pdn, stamped by
   renderWheelFoot), clamped so they never balloon or become unreadable */
.epanel .wf-col{gap:2px; padding:6px 8px 7px; border-radius:10px}
.epanel .wf-col-h{margin-bottom:2px}
.epanel .wf-mcard{
  min-height:clamp(30px, calc((100vh - 330px) / max(var(--pdn, 15), 1)), 42px);
  gap:8px; padding:2px 7px; border-radius:8px;
}
.epanel .wf-mcard .icon{width:28px; height:28px}
.epanel .wf-mnm{font-size:12px}
.epanel .wf-mnm small{margin-top:0}
/* popovers open BELOW the tile: above would clip at the panel's top edge,
   below just extends the scrollable area (touch widths — the tap-sheet
   path; on hover widths the kit flyout replaces them entirely) */
.epanel .dm-pop{bottom:auto; top:calc(100% + 10px); z-index:46}
.epanel .dm-pop::after{top:auto; bottom:100%}
@media (min-width:961px){ .epanel .wf-comp .dm-pop{display:none} }

/* -- the kit flyout: ONE hover surface left of the dash — worn kit,
   scored spells, role and fit on top, then the member's FULL dossier
   (owner 2026-09-01: "combine the dossier and the popout into one thing").
   Near full height, scrolls; the drawer stays for non-party dossiers. -- */
.pdash-fly{
  position:absolute; right:calc(100% + 10px); top:10px; bottom:10px;
  width:min(640px, calc(100vw - 520px)); z-index:41;
  overflow-y:auto; overscroll-behavior:contain;
  background:rgba(11,13,18,.99); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--rule-2); border-radius:14px;
  box-shadow:var(--shadow-lift); padding:14px 16px 16px;
}
.pdash-fly[hidden]{display:none}
/* hover bridge across the gap between flyout and panel */
.pdash-fly::after{content:""; position:absolute; left:100%; top:0; bottom:0; width:12px}
.pf-head{display:flex; align-items:center; gap:9px}
.pf-head .icon{flex:none; border-radius:8px}
.pf-head .n{margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--ink-3)}
.pf-nm{font-size:13.5px; min-width:0}
.pf-role{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--rc, var(--ink-3)); margin-top:2px}
.pf-sec{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:8px 0 4px}
/* two columns keep the kit and spell lists short — full names ride the
   chip tooltips, the labels ellipsize */
.pf-gear{display:grid; grid-template-columns:1fr 1fr; gap:5px}
.pf-g{display:inline-flex; align-items:center; gap:7px; padding:3px 8px 3px 4px;
  background:rgba(255,255,255,.03); border:1px solid var(--rule); border-radius:8px;
  font-size:11.5px; color:var(--ink-2); cursor:help; min-width:0}
.pf-g img{border-radius:6px; flex:none}
.pf-g span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pf-spells{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px;
  font-size:12px; color:var(--ink-2)}
.pf-spells > div{display:flex; align-items:center; gap:6px; min-width:0}
.pf-spells .pf-spnm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pf-spells .sp-ic{width:26px; height:26px; border-radius:6px; flex:none}
.pf-spells .k{font-family:var(--mono); font-size:9.5px; color:var(--brass);
  display:inline-block; width:12px; flex:none}
/* the sticky kit editor, inlined under the actions */
.pf-kit{border-top:1px solid var(--rule); margin-top:10px; padding-top:10px}
/* the merged popover block: statically embedded under the kit sections —
   the weapon's name is already the flyout's header, so only its badge row,
   verdict line and actions carry down */
.pdash-fly .dm-pop{position:static; visibility:visible; opacity:1; width:auto;
  transform:none;   /* the base rule's translateX(-50%) survives position:static */
  background:none; border:0; box-shadow:none; padding:8px 0 0; margin-top:9px;
  border-top:1px solid var(--rule); border-radius:0}
.pdash-fly .dm-pop::after{display:none}
.pdash-fly .dm-pop .dm-nm .nm-btn{display:none}
.pdash-fly .dm-pop .dm-nm{margin-bottom:4px}
.pdash-fly .dm-actions{margin-top:7px}
.pdash-fly .lo-ref{margin-top:8px}
/* removal moved onto the tiles (hover ×) — the flyout drops its button;
   the dossier is inlined below, so its button goes too */
.pdash-fly .dm-act.dm-x{display:none}
.pdash-fly .dm-act[data-detail]{display:none}
/* the inlined dossier: separated from the kit block; its own header
   duplicates the flyout's (name, badges, role) and is dropped */
.pf-dossier{border-top:1px solid var(--rule); margin-top:12px; padding-top:12px}
.pf-dossier .dt-head{display:none}
.pf-dossier .dt-grid{grid-template-columns:1fr; gap:4px}

/* hover ×: appears over the slot number on hover-capable screens; rides
   the same delegated data-remove action the popover button used */
.wf-x{
  position:absolute; top:50%; right:7px; transform:translateY(-50%);
  width:20px; height:20px; display:none; align-items:center; justify-content:center;
  border-radius:50%; border:1px solid var(--rule-2); background:rgba(13,16,22,.92);
  /* above the hovered card, which climbs to z-index:6 (board hover rule) */
  color:var(--ink-3); font-size:13px; line-height:1; padding:0; cursor:pointer; z-index:7;
  transition:color .15s var(--ease), border-color .15s var(--ease);
}
.wf-x:hover{color:var(--gap); border-color:var(--gap); background:var(--gap-wash)}
@media (hover:hover){
  .epanel .wf-dm{position:relative}
  .epanel .wf-dm:hover .wf-x, .epanel .wf-dm:focus-within .wf-x{display:inline-flex}
  .epanel .wf-dm:hover .wf-mcard .n{opacity:0}
}

/* ---------- capability readout ---------- */
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px 22px; align-items:start}
.grp{padding:12px 0 4px}
.grp h3{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-2); margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:7px;
}
/* the group's hue rides its header - the same hue its radar axis wears */
.grp h3::before{content:""; width:8px; height:8px; border-radius:50%;
  background:var(--gcol, var(--ink-3)); flex:none}
.cap{display:grid; grid-template-columns:auto 1fr auto; gap:2px 8px; padding:3px 0; align-items:center}
.cap-name{
  font-family:var(--mono); font-size:12px; color:var(--ink-2);
  background:none; border:0; padding:0; text-align:left; letter-spacing:.01em;
}
.cap-name:hover{color:var(--brass-bright); text-decoration:underline; text-underline-offset:2px;
  text-decoration-color:var(--brass-deep)}
.cap-val{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
/* ---- capability RINGS (2026-09-02) ----
   Nested semicircles, one per capability, faceted one panel per group.
   Same ruler as the bars they replace and as the radar (owner 2026-08-27):
   100% = the comp-fitted ceiling, the brass tick marks the target minimum,
   and beyond-ceiling stacking shows as a pip, never as a longer arc.
   Arc colour is the reserved STATUS palette (met/part/none/over), never a
   group hue - the group's hue lives on the panel header. */
/* NOT overflow:visible - a ring drawn outside its box must clip, so a
   geometry mistake reads as a truncated arc instead of silently
   painting over the legend (tests/test_display_math.js guards it) */
.cap-rings{display:block; width:100%; height:auto; margin:2px 0 6px}
.cap-rings .ring-track{fill:none; stroke:#1B202B; stroke-linecap:round}
.cap-rings .ring{fill:none; stroke-linecap:round; transition:stroke-dashoffset .45s var(--ease)}
.cap-rings .ring.met{stroke:var(--ok)}
.cap-rings .ring.part{stroke:var(--amber)}
.cap-rings .ring.none{stroke:var(--gap)}
.cap-rings .ring.over{stroke:var(--over)}
.cap-rings .ring-tick{stroke:var(--brass-deep); stroke-width:2; stroke-linecap:round}
.cap-rings .ring-over{fill:var(--over)}
/* the legend IS the table view: every exact value stays readable with no
   hover, and each row keeps its evidence-drawer button */
.cap-legend{list-style:none; margin:0; padding:0}
.cap-sw{width:8px; height:8px; border-radius:2px; display:inline-block; flex:none}
.cap-sw.met{background:var(--ok)}
.cap-sw.part{background:var(--amber)}
.cap-sw.none{background:var(--gap)}
.cap-sw.over{background:var(--over)}
.cap.floor-hit .cap-name{color:var(--gap); font-weight:600}
.tag{font-family:var(--mono); font-size:9px; letter-spacing:.05em; padding:1px 5px; border-radius:3px; margin-left:5px}
.tag.floor{background:var(--gap-wash); color:var(--gap)}
.tag.over{background:rgba(157,92,255,.14); color:var(--over)}
.tag.style-up{background:rgba(224,166,61,.14); color:var(--brand, #E0A63D)}
.tag.style-down{background:rgba(122,135,165,.14); color:#8FA7CF}

/* ---------- weaknesses: needed now vs nice to have ---------- */
.weak-list{display:flex; flex-direction:column; gap:8px}
.weak-sub{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gap); margin:2px 0 -2px;
}
.weak-sub.nice{color:var(--brass)}
/* image-first cards (owner 2026-08-21): the weapons that close the gap
   lead at full size, the gap wears a short player-voiced title, order
   alone carries priority */
.weak{
  display:flex; align-items:center; gap:13px; padding:10px 13px;
  background:linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
  border:1px solid var(--rule);
  border-left:3px solid var(--gap); border-radius:0 12px 12px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.weak.nice{border-left-color:var(--brass-deep)}
.weak.nice .weak-name{color:var(--ink-2)}
.weak-none{font-size:12.5px; color:var(--ink-2); padding:4px 0}
.weak-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.weak-name{font-size:13.5px; font-weight:600; line-height:1.25; cursor:help}
.weak-have{font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap}
.weak-floor{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--gap);
}
.weak-picks{display:flex; gap:6px; flex:none; align-items:center}
.weak-add{
  background:none; border:1px solid var(--rule); border-radius:9px; padding:2px;
  cursor:pointer; line-height:0; transition:border-color .12s, transform .12s;
}
.weak-add:hover, .weak-add:focus-visible{border-color:var(--brass); transform:translateY(-1px); outline:none}
.weak-add .icon{border-radius:7px; display:block}

/* ---------- recommendation ---------- */
.rec{
  background:linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
  border:1px solid rgba(255,201,58,.42); border-radius:16px;
  overflow:hidden; box-shadow:var(--shadow), 0 0 40px -18px rgba(255,201,58,.35);
}
.rec-body{padding:18px 22px; display:flex; flex-direction:column; gap:16px}
.why{font-size:14px; line-height:1.65; margin:0}
.why em{color:var(--brass-bright); font-style:normal; font-weight:600}
.terms{display:flex; flex-direction:column; gap:3px}
.term{
  display:grid; grid-template-columns:58px 1fr auto; gap:12px; align-items:center;
  font-family:var(--mono); font-size:12px; padding:4px 0;
}
.term .d{color:var(--ok-bright); text-align:right; font-weight:600}
.term .c{color:var(--ink-2)}
.term .mv{color:var(--ink-3); font-size:11px}
.formula{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); line-height:1.7;
  border-top:1px solid var(--rule); padding-top:12px;
}
.formula .k{color:var(--ink-2)}
/* the deep math folds away so the alternatives sit above the fold;
   the disclosure keeps its open state across re-renders */
.rec-math{border-top:1px solid var(--rule); padding-top:11px}
.rec-math > summary{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); cursor:pointer; list-style:none; user-select:none;
  display:flex; align-items:center; gap:8px;
  transition:color .18s var(--ease);
}
.rec-math > summary::-webkit-details-marker{display:none}
.rec-math > summary::before{
  content:"\25B8"; font-size:9px; color:var(--brass-deep);
  transition:transform .18s var(--ease);
}
.rec-math[open] > summary::before{transform:rotate(90deg)}
.rec-math > summary:hover{color:var(--brass)}
.rec-math .math-body{display:flex; flex-direction:column; gap:14px; margin-top:13px}
.rec-math .formula{border-top:0; padding-top:0}
/* observed killboard context (PR #5) — an evidence aside, visually cool
   (tank-blue) so it never reads as the engine's own gold voice */
.obs-note{
  padding:9px 11px; border:1px solid rgba(77,141,255,.22); border-radius:10px;
  background:rgba(77,141,255,.06); font-size:11.5px; line-height:1.5; color:var(--ink-2);
}
.obs-note .obs-k{display:block; font-family:var(--mono); font-size:9px;
  letter-spacing:.16em; text-transform:uppercase; color:#8FA7CF; margin-bottom:3px}
.obs-note b{color:#A9C9FF; font-family:var(--mono)}
.obs-note small{display:block; margin-top:3px; color:var(--ink-3); font-size:9.5px}
/* one-ahead residuals: what stays thin after the recommended pick joins */
.after-pick{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.after-pick .ap-k{font-family:var(--mono); font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3)}
.after-pick .ap-gap{
  font-family:var(--mono); font-size:9.5px; padding:3px 8px; border-radius:99px;
  border:1px solid rgba(255,84,112,.28); color:var(--gap); background:var(--gap-wash);
}
.after-pick .ap-ok{
  font-family:var(--mono); font-size:9.5px; padding:3px 8px; border-radius:99px;
  border:1px solid rgba(35,191,110,.25); color:var(--ok-bright); background:rgba(35,191,110,.07);
}
/* contextual killboard strip rows + footnote */
.meta-aff .pct{min-width:150px; text-align:right}
.ka-note{grid-column:1/-1; font-family:var(--mono); font-size:9px; line-height:1.5;
  color:var(--ink-3); padding:7px 2px 0; border-top:1px solid var(--rule); margin-top:3px}
/* partial-roster neighbours (roadmap item 6): observed baskets as rosters —
   shared picks lit, the rest muted dossier links */
.ka-nb{grid-column:1/-1; padding:8px 2px 2px; border-top:1px solid var(--rule); margin-top:4px}
.ka-nb-label{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.nb-row{display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding:3px 0}
.nb-ov{font-family:var(--mono); font-size:10px; color:var(--ink-2); width:34px; flex:none}
.nb-w{display:inline-flex; border:0; background:none; padding:1px; border-radius:6px;
  opacity:.45; cursor:pointer; filter:saturate(.7)}
.nb-w.match{opacity:1; filter:none; cursor:default;
  outline:1px solid rgba(35,191,110,.4); outline-offset:1px}
.nb-more{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); margin-left:2px}
/* recurring observed families (roadmap item 7): anchor pair leads, counts
   beside it, the frequent cast trails smaller; roster-carried pieces lit */
.ka-fam{grid-column:1/-1; padding:8px 2px 2px; border-top:1px solid var(--rule); margin-top:4px}
.fam-row{display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; padding:4px 0}
.fam-row.mine{background:rgba(35,191,110,.04); border-radius:8px; padding:4px 6px; margin:0 -6px}
.fam-anchor{display:inline-flex; gap:2px}
.fam-anchor .nb-w{opacity:.9; filter:none}
.fam-meta{font-family:var(--mono); font-size:10px; color:var(--ink-2)}
.fam-yours{color:var(--ok-bright); font-weight:600}
.fam-cast{display:inline-flex; align-items:center; gap:2px}
.fam-cast i{font-style:normal; font-family:var(--mono); font-size:9px; color:var(--ink-3); margin-right:2px}
.fam-load{font-family:var(--mono); font-size:9.5px; padding:2px 8px; border-radius:99px;
  border:1px solid var(--rule-2); background:var(--sunk); color:var(--ink-2); cursor:pointer}
.fam-load:hover{border-color:var(--brass); color:var(--brass-bright)}
.alts{display:flex; flex-direction:column; gap:6px}
/* alternative cards: art leads at 40px, the name owns a full horizontal
   line with the score at its right, badges flow in a row beneath with
   the gain right-aligned — nothing stacks vertically in a narrow cell */
.alt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:10px 12px; background:transparent; border:1px solid var(--rule); border-radius:12px;
  transition:border-color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
}
.alt:hover{border-color:rgba(255,201,58,.5); background:var(--surface-2); transform:translateX(2px)}
.alt > .icon{flex:none}
.alt-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.alt-top{display:flex; align-items:baseline; gap:10px}
.alt-top .nm{
  flex:1; min-width:0; font-size:13.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.alt-top .sc{font-family:var(--mono); font-size:12px; color:var(--brass); font-weight:600; flex:none}
.alt-sub{display:flex; align-items:center; gap:4px; flex-wrap:wrap; min-width:0}
.alt-sub .bdg{margin-left:0}
.alt-sub .rz{
  margin-left:auto; padding-left:6px; font-family:var(--mono);
  font-size:10.5px; color:var(--ink-3); white-space:nowrap;
}
.add{
  width:100%; padding:12px;
  background:linear-gradient(180deg, var(--brass-bright), var(--brass));
  color:#1A1206; border:0; border-radius:12px; font-size:14px; font-weight:700; letter-spacing:.01em;
  box-shadow:0 2px 14px -4px rgba(255,201,58,.55), inset 0 1px 0 rgba(255,255,255,.35);
}
.add:hover{filter:brightness(1.07)}

#warn-slot:empty{display:none}  /* no phantom flex-gap slot when quiet */
.warn{
  background:var(--gap-wash); border:1px solid rgba(255,84,112,.35); border-radius:14px;
  padding:14px 16px; display:flex; gap:12px; align-items:flex-start;
  flex-direction:column; margin-top:12px;
}
.warn .t{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gap); flex:none; padding-top:2px;
}
.warn .b{font-size:13.5px; line-height:1.5}
.warn .b code{font-family:var(--mono); font-size:12px}

/* ---------- live party feed: one card per in-game member ---------- */
.livefeed{border-top:1px solid var(--rule); padding-top:4px}
.lf-bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.lf-btn{width:auto; margin-top:0}
.lf-sync{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
  font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
  cursor:pointer; user-select:none}
.lf-sync input{accent-color:var(--brass)}
.comp-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--ink-3); margin-right:7px; vertical-align:1px;
}
.livefeed[data-live="true"] .comp-dot{background:var(--ok-bright); box-shadow:0 0 8px var(--ok-bright)}
.livefeed .status{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.livefeed .status .sub{color:var(--ink-3); display:block; margin-top:2px; line-height:1.5}
.comp-members{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0}
.comp-m{
  display:flex; flex-direction:column; align-items:flex-start; gap:5px; font-size:12px;
  padding:10px 12px; min-width:150px; max-width:220px; position:relative;
  background:linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
  border:1px solid var(--rule); border-radius:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.comp-m .cm-role{position:absolute; top:11px; right:11px;
  width:7px; height:7px; border-radius:50%; background:var(--rule-2); flex:none;
  box-shadow:0 0 8px 0 currentColor}
.comp-m.role-tank .cm-role{background:var(--role-tank); color:var(--role-tank)}
.comp-m.role-healer .cm-role{background:var(--role-healer); color:var(--role-healer)}
.comp-m.role-melee .cm-role{background:var(--role-melee); color:var(--role-melee)}
.comp-m.role-range .cm-role{background:var(--role-range); color:var(--role-range)}
.comp-m.role-support .cm-role{background:var(--role-support); color:var(--role-support)}
.comp-m .cm-name{color:var(--ink-2); font-family:var(--mono); font-size:10.5px;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:14px}
.comp-m .cm-wpn{color:var(--ink); width:100%; min-width:0; display:flex; align-items:center; gap:7px}
.comp-m .cm-wpn > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.comp-m .cm-wpn.unknown{color:var(--ink-3); font-style:italic}
.livefeed .load-btn{
  padding:10px 16px;
  background:linear-gradient(180deg, var(--brass-bright), var(--brass));
  color:#1A1206; border:0; border-radius:11px; font-family:var(--mono); font-size:11.5px;
  letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  box-shadow:0 2px 14px -4px rgba(255,201,58,.55), inset 0 1px 0 rgba(255,255,255,.35);
}
.livefeed .load-btn:hover{filter:brightness(1.07)}
.livefeed .load-btn:disabled{opacity:.4; cursor:not-allowed; filter:none}

/* ---------- evidence drawer ---------- */
.drawer{
  position:fixed; inset:auto 0 0 0;
  background:rgba(13,16,22,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,201,58,.5);
  box-shadow:0 -12px 48px -12px rgba(0,0,0,.8);
  padding:18px 26px 24px; max-height:52vh; overflow-y:auto; z-index:20;
  transform:translateY(101%); transition:transform .32s var(--ease);
}
.drawer[data-open="true"]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important; animation:none !important}
}
.drawer-hd{display:flex; align-items:baseline; gap:14px; margin-bottom:14px; flex-wrap:wrap}
.drawer-hd h3{font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--brass-bright)}
.drawer-hd .close{margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:20px; line-height:1; padding:2px 8px; border-radius:5px}
.drawer-hd .close:hover{color:var(--ink); background:var(--surface-2)}
.ev-tbl{width:100%; border-collapse:collapse; font-size:13px}
.ev-tbl th{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); text-align:left; padding:0 14px 7px 0; font-weight:400;
  border-bottom:1px solid var(--rule-2);
}
.ev-tbl td{padding:8px 14px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.ev-tbl .sc{font-family:var(--mono); font-weight:600}
.ev-tbl .sp{font-family:var(--mono); font-size:11.5px; color:var(--brass)}
.ev-tbl .pend{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-style:italic}
.ev-empty{font-size:13px; color:var(--ink-2); padding:6px 0}
.scroll-x{overflow-x:auto}

/* .foot-chips retired 2026-09-02 — the parity and dataset chips moved up
   into the status bar's second line */
.footnote{
  font-size:12px; line-height:1.65; color:var(--ink-3);
  border-top:1px solid var(--rule); padding-top:16px;
}
.footnote code{font-family:var(--mono); font-size:11.5px; color:var(--brass)}

/* ---- loadout layer (_loadout.js): per-member gear + spell picks -------- */
.lo-open{
  flex:none; display:flex; align-items:center; gap:4px; padding:3px 7px;
  font:600 10px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); background:transparent; cursor:pointer;
  border:1px solid var(--rule); border-radius:5px;
  transition:color .15s var(--ease), border-color .15s var(--ease);
}
.lo-open:hover{ color:var(--brass); border-color:var(--brass-deep); }
.lo-open.on{ color:var(--brass-bright); border-color:var(--brass); background:var(--brass-wash); }
.lo-open i{
  font-style:normal; font:700 9px/1 var(--mono); padding:2px 4px; border-radius:3px;
  color:var(--bg-deep); background:var(--brass);
}
.lo-panel{
  margin:-4px 0 6px; padding:11px 12px 12px;
  background:var(--sunk); border:1px solid var(--rule); border-top:none;
  border-radius:0 0 8px 8px;
}
.lo-row{ display:flex; flex-wrap:wrap; gap:7px; }
.lo-row + .lo-row{ margin-top:9px; }
.lo-tile{
  display:flex; flex-direction:column; align-items:center; gap:3px; width:56px;
  padding:5px 3px; cursor:pointer; border-radius:6px;
  background:var(--panel-lo); border:1px solid var(--rule);
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.lo-tile:hover{ border-color:var(--rule-2); background:var(--surface-2); }
.lo-tile.set{ border-color:var(--brass-deep); }
.lo-tile.on{ border-color:var(--brass); background:var(--brass-wash); }
.lo-tile img{ display:block; width:34px; height:34px; object-fit:contain; }
.lo-empty{
  width:34px; height:34px; border-radius:4px; border:1px dashed var(--rule-2);
  opacity:.5;
}
.lo-tag{
  font:600 8px/1 var(--sans); letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:100%;
}
.lo-spells{ align-items:center; }
.lo-sp{ display:flex; align-items:center; gap:5px; }
.lo-sp > span{
  font:600 9px/1 var(--sans); letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-3);
}
.lo-sp select{
  font:400 11px/1.3 var(--sans); color:var(--ink); padding:4px 6px; max-width:190px;
  background:var(--panel-lo); border:1px solid var(--rule); border-radius:5px;
}
.lo-ref{
  margin-top:9px; font:400 10px/1.5 var(--sans); color:var(--ink-3);
  border-top:1px solid var(--rule); padding-top:7px;
}
.lo-ref b{ color:var(--ink-2); font-weight:600; }
/* the engine-kit mark: scored defaults, never a fielded build */
.lo-ref.lo-eng{color:var(--brass); cursor:help}
.lo-eng-mark{color:var(--brass); margin-left:3px; font-style:normal}
.lo-picker{
  margin-top:10px; padding-top:9px; border-top:1px solid var(--rule);
}
.lo-picker-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.lo-picker-head input{
  flex:1; min-width:0; font:400 11px/1.3 var(--sans); color:var(--ink);
  padding:5px 8px; background:var(--panel-lo);
  border:1px solid var(--rule); border-radius:5px;
}
.lo-picker-head input:focus{ outline:none; border-color:var(--brass-deep); }
.lo-clear{
  flex:none; font:600 9px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); background:transparent; cursor:pointer;
  border:1px solid var(--rule); border-radius:5px; padding:5px 7px;
}
.lo-clear:hover{ color:var(--gap); border-color:var(--gap); }
.lo-count{ flex:none; font:400 10px/1 var(--mono); color:var(--ink-3); }
.lo-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr));
  gap:4px; max-height:212px; overflow-y:auto;
}
.lo-opt{
  display:flex; align-items:center; gap:6px; padding:4px 6px; cursor:pointer;
  text-align:left; border:1px solid transparent; border-radius:5px;
  background:transparent; transition:background .12s var(--ease);
}
.lo-opt:hover{ background:var(--surface-2); }
.lo-opt.on{ border-color:var(--brass); background:var(--brass-wash); }
.lo-opt img{ flex:none; width:30px; height:30px; object-fit:contain; }
.lo-opt span{
  font:400 11px/1.25 var(--sans); color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis;
}
.lo-none{ font:400 11px/1.4 var(--sans); color:var(--ink-3); padding:6px; }

/* ---- item stats bank (fetch_item_stats.py) ---------------------------- */
.st-tbl td:first-child{ color:var(--ink-3); }
.st-tbl td.sc{ font-family:var(--mono); color:var(--ink); text-align:right; white-space:nowrap; }
.st-note{
  font:400 9px/1 var(--sans); color:var(--ink-3); margin-left:5px;
  text-transform:uppercase; letter-spacing:.06em;
}
.st-ip{
  margin-top:6px; font:400 10px/1.5 var(--mono); color:var(--ink-3);
}
.st-ip b{ color:var(--ink-2); font-weight:600; }

/* ==================================================== MOBILE PASS ======
   Owner-approved design 2026-08-21: tuned wheel, tap -> bottom sheet for
   member details, setup collapsed to a summary bar, party as a
   horizontal snap strip. Placed LAST so equal-specificity overrides of
   the desktop rules win by order. */


@media (max-width:960px){

  /* --- member details: hover popover becomes a scrimmed bottom sheet --- */
  .dm:hover .dm-pop, .dm:focus-within .dm-pop{visibility:hidden; opacity:0}
  .dm:hover .dm-card, .dm:focus-within .dm-card{transform:none}  /* no fish-eye on touch */
  .dm:hover + .dm .dm-card, .dm:has(+ .dm:hover) .dm-card{transform:none}
  .dm.sheet-open .dm-card{border-color:var(--brass-deep);
    box-shadow:0 0 14px -4px rgba(255,201,58,.5)}
  .dm.sheet-open .dm-pop{
    position:fixed; left:10px; right:10px; bottom:10px; top:auto; width:auto;
    transform:none; visibility:visible; opacity:1; z-index:70;
    border-radius:16px; padding:18px 16px 14px;
    box-shadow:0 -12px 48px rgba(0,0,0,.65), var(--shadow-lift);
  }
  .dm.sheet-open .dm-pop::after{display:none}  /* no hover bridge on a sheet */
  .dm.sheet-open .dm-pop::before{               /* drag-handle affordance */
    content:""; display:block; width:44px; height:4px; border-radius:99px;
    background:var(--rule-2); margin:0 auto 12px;
  }
  .dm-scrim{
    position:fixed; inset:0; z-index:60; border:0; padding:0;
    background:rgba(5,5,8,.6);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  .dm-actions .dm-act, .dm-actions .lo-open{padding:10px 15px; font-size:11px}

}

@media (max-width:640px){
  /* --- density --- */
  .masthead{padding:10px 12px; gap:8px 12px}
  .masthead .share-btn{padding:7px 10px; font-size:10px}
  .brandmark h1{font-size:18px}
  .brandmark .sub{display:none}
  .ws-fit .num{font-size:34px}
  .rec-body{padding:14px 14px; gap:14px}
  .term{grid-template-columns:48px 1fr auto; gap:8px}
  .drawer{max-height:72vh; padding:14px 14px 18px}

  /* --- filters: bigger touch targets; the bar WRAPS down here - its
     nowrap segments exceed a phone viewport and it may never scroll
     (overflow would clip the tree menu, chip flyouts and search popover) */
  .wf-bar{flex-wrap:wrap}
  .wf-seg{padding:0 8px}
  .wf-seg-btn, .wf-search-btn, .wf-bar .pchip{padding-top:10px; padding-bottom:10px}
  .pgroup-t{padding:10px 15px; font-size:10.5px}
  .pchip{padding:8px 13px; font-size:11px}

  /* --- party: one row, side-scroll with snap --- */
  .roster{
    flex-wrap:nowrap; overflow-x:auto; align-items:flex-end;
    scroll-snap-type:x proximity; padding:6px 2px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .roster .dm{flex:none; scroll-snap-align:start}
  .roster .dock-note{flex:none; white-space:nowrap; align-self:center}
  .roster::-webkit-scrollbar{height:5px}

  /* --- wheel: touch-size floors; the Add action moves to the thumb zone
     as a full-width bar under the wheel (the hub can't hold a tappable
     button at this width without crushing the name) --- */
  .wheel{
    --card-w:clamp(80px, calc(var(--wd)*.24), 108px);
    --card-h:clamp(82px, calc(var(--wd)*.23), 104px);
  }
  .hub-rings circle{stroke-width:5}
  .hub-body{inset:21%}
  .hub-body .icon{width:42px; height:42px}
  .hub-nm{font-size:13px}
  .hub-cap{width:22px; height:22px}
  .hub-cap.hub-cap-txt{font-size:9px}
  .hub-score{font-size:10px}
  .hub-add{display:none}
  .wf-add-mobile{width:100%; padding:13px; font-size:14px; border-radius:12px}

  /* --- image-first cards keep their art readable but tighter --- */
  .weak{gap:10px; padding:9px 11px}
  .weak-add .icon{width:34px; height:34px}
  .alt > .icon{width:34px; height:34px}
}
/* desktop: the mobile add bar stays out of the way */
@media (min-width:641px){ .wf-add-mobile{display:none} }
</style>
</head>
<body>

<header class="masthead">
  <div class="mh-top">
  <div class="brandmark">
    <span class="sigil" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E5B45C" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l10.5 10.5M4 4v3.5M4 4h3.5"/><path d="M20 4L9.5 14.5M20 4v3.5M20 4h-3.5"/><path d="M7 17l-2.4 2.4M17 17l2.4 2.4"/><path d="M5.2 15.2l3.6 3.6M18.8 15.2l-3.6 3.6"/></svg></span>
    <div>
      <h1>Comp Forge</h1>
      <span class="sub">Albion composition engine</span>
    </div>
  </div>
  <div class="ws-fit sb-fit">
    <div class="sec-label">Composition fitness</div>
    <div><span class="num" id="fit-num">0.0</span> <span class="of" id="fit-of">/ 0</span></div>
    <div class="meter-track"><div class="meter-fill" id="fit-bar" style="width:0%"></div></div>
  </div>
  <div class="sb-identity" id="sb-identity"></div>
  <div class="spacer"></div>
  <a class="about-link" href="how-it-works.html">How it works <span aria-hidden="true">→</span></a>
  <button class="share-btn lf-btn" id="companion-connect">connect live party</button>
  <label class="lf-sync" id="companion-sync-wrap" hidden
         title="keep the loaded comp following the live party: weapon swaps update their slot, newly visible weapons fill in, real Q/W picks flow into the loadouts — no re-load needed">
    <input type="checkbox" id="companion-sync"> live sync</label>
  </div>
  <div class="mh-bar">
    <label class="sb-field"><span>style</span><select id="style"></select></label>
    <label class="sb-field"><span>size</span>
      <span class="size-row">
        <button class="size-btn" id="size-minus" aria-label="one fewer">&minus;</button>
        <input class="size-input" id="size-input" type="number" min="2" max="60" inputmode="numeric">
        <button class="size-btn" id="size-plus" aria-label="one more">+</button>
      </span></label>
    <label class="sb-field"><span>content</span><select id="content">
      <option value="castle_outpost">Castle Outpost</option>
    </select></label>
    <span class="chip warn" id="size-notice-mh" hidden></span>
    <span class="sb-count" id="sb-count">0/0</span>
    <span class="mh-forge" id="forge-slot"></span>
    <div class="spacer"></div>
    <span class="chip"><span class="dot" id="parity-dot"></span><span id="parity-chip">parity — checking</span></span>
    <span class="chip">dataset <span class="mono" id="build-stamp">—</span></span>
  </div>
</header>

<div class="shell" id="shell">

  <main class="main">
    <!-- The forge wheel stage: analysis flanks left, the wheel centers,
         reasoning flanks right. The wheel replaces the old rail picker. -->
    <section class="wheelstage">
      <!-- the party dock RETIRED 2026-08-27 (owner: the wheel's comp board
           "is meant to replace the party section below") — the roster,
           its notes and the kit editor all live in the wheel foot now -->
      <div class="ws-center">
        <!-- ONE tight row (owner 2026-09-02): kicker, tree, search, facets.
             The text filter lives behind the search icon, but an active
             query stays ON the button - a silently narrowed wheel with no
             visible cause was the thing to avoid. -->
        <div class="wf-bar">
          <div class="wf-seg wf-tree">
            <button class="wf-seg-btn" id="tree-btn" aria-haspopup="listbox"
              aria-expanded="false" aria-controls="tree-menu" title="filter by weapon tree">
              <span class="wf-face" id="tree-btn-face"></span>
              <svg class="wf-caret" viewBox="0 0 24 24" width="11" height="11" fill="none"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="wf-menu" id="tree-menu" role="listbox" hidden
              aria-label="Weapon tree"></div>
          </div>
          <div class="wf-seg wf-search">
            <button class="wf-search-btn" id="pick-search-btn" aria-expanded="false"
              aria-controls="pick-search-pop" title="search weapons — press /">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
              <span class="wf-q" id="pick-search-q" hidden></span>
            </button>
            <button class="wf-search-x" id="pick-search-clear" hidden
              aria-label="Clear the weapon search">&times;</button>
            <div class="wf-pop" id="pick-search-pop" hidden>
              <input class="text-input" id="pick-filter" placeholder="type a weapon name"
                aria-label="Filter weapons" autocomplete="off">
              <div class="wf-pop-hits" id="pick-search-hits"></div>
            </div>
          </div>
          <div class="wf-seg" id="picker-chips"></div>
          <div class="wf-seg" id="facet-slot"></div>
        </div>
        <div class="wheel" id="wheel" role="listbox" tabindex="0"
          aria-label="Weapon wheel. Arrow keys rotate, Enter adds the focused weapon">
          <div class="wheel-track" aria-hidden="true"></div>
          <div class="wheel-notch" aria-hidden="true"></div>
          <div class="wheel-ring" id="wheel-ring"></div>
          <div class="wheel-hub">
            <svg class="hub-rings" id="hub-rings" viewBox="0 0 200 200" aria-hidden="true"></svg>
            <div class="hub-body" id="hub-body"></div>
          </div>
        </div>
        <div class="wheel-foot" id="wheel-foot"></div>
      </div>

      <div class="ws-flank ws-right">
        <div class="sec-label">Biggest weaknesses</div>
        <div class="weak-list" id="weaknesses"></div>
        <div class="sec-label" id="rec-label">Why this pick</div>
        <div id="rec-slot"></div>
      </div>
    </section>

    <!-- Forge honesty reports + lookahead warnings: never hidden (rehomed
         2026-08-22 from the analysis flank; owner 2026-08-23: it lives
         UNDER THE WHEEL — the hero grid pins it to the wheel column, and
         stacked layouts read it right after the stage). Empty when quiet. -->
    <div id="warn-slot"></div>

    <!-- id so the grid can place it: #groups is the inner board, this
         section is the actual .main child -->
    <section id="supply-sec">
      <div class="sec-label">Capability supply vs. target</div>
      <div class="groups" id="groups"></div>
    </section>

    <section id="meta-sec" hidden>
      <div class="sec-label" id="meta-label">This week on the killboard</div>
      <div class="meta-grid" id="meta-strip"></div>
    </section>

    <p class="footnote" id="footnote"></p>
  </main>
</div>

<!-- edge panel rails: one stacked tab column per viewport edge. Tabs are
     addressed by data-panel, so adding a surface is one button + one aside. -->
<div class="epanel-rail" data-edge="left">
  <button class="epanel-tab" data-panel="setup-panel" aria-expanded="false"
    title="show or hide setup">setup</button>
  <button class="epanel-tab" data-panel="tools-panel" aria-expanded="false"
    title="show or hide caller tools - player pool and swap impact">tools</button>
</div>
<div class="epanel-rail" data-edge="right">
  <button class="epanel-tab" data-panel="pdash" aria-expanded="false"
    title="show or hide the party board">party <b id="pdash-count">0/0</b></button>
  <button class="epanel-tab" data-panel="live-panel" aria-expanded="false"
    title="show or hide the live party feed">live</button>
</div>

<aside class="epanel" data-edge="left" data-open="false" id="setup-panel" aria-label="Setup">
  <div class="epanel-body">
    <div class="sec-label">Setup</div>
    <div class="field">
      <div class="size-hint" id="style-blurb"></div>
    </div>
    <div class="field">
      <label>Party size presets</label>
      <span id="size-presets"></span>
      <div class="size-hint" id="size-hint"></div>
    </div>
    <div id="size-notice"></div>
    <div class="btn-row">
      <button class="share-btn" id="share">copy share link</button>
      <button class="share-btn" id="export">copy comp text</button>
    </div>
    <div class="btn-row">
      <button class="share-btn clear-btn" id="clear">clear comp</button>
    </div>
  </div>
</aside>

<aside class="epanel" data-edge="left" data-open="false" id="tools-panel" aria-label="Caller tools">
  <div class="epanel-body" id="tools-panel-body"></div>
</aside>

<aside class="epanel" data-edge="right" data-open="false" id="live-panel" aria-label="Live party">
  <div class="epanel-body">
  <!-- Live party feed: the companion's home, one card per in-game member -->
  <section class="livefeed" id="companion" data-live="false">
    <div class="sec-label">Live party</div>
    <div class="lf-bar">
      <div class="status" id="companion-status" hidden></div>
      <button class="load-btn lf-btn" id="companion-load" hidden>load party into comp</button>
    </div>
    <div class="comp-members" id="companion-members"></div>
    </section>
  </div>
</aside>

<!-- Party dash: the comp board in a right-edge pop-out, toggled by its tab -->
<aside class="epanel" data-edge="right" data-open="false" id="pdash" aria-label="Party board">
  <div class="epanel-body" id="pdash-body"></div>
  <!-- kit flyout: fills on hover over a member tile (showPdashFly) -->
  <div class="pdash-fly" id="pdash-fly" hidden></div>
</aside>

<div class="drawer" id="drawer" data-open="false" role="dialog" aria-label="Evidence">
  <div class="drawer-hd">
    <h3 id="drawer-title">evidence</h3>
    <span class="chip" id="drawer-rule">every nonzero score cites an equippable spell</span>
    <button class="close" id="drawer-close" aria-label="Close evidence">&times;</button>
  </div>
  <div class="scroll-x"><div id="drawer-body"></div></div>
</div>
