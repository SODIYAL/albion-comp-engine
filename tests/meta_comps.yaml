# tests/meta_comps.yaml — REAL published/shared comps for V4 (meta-comp
# reproduction, see VALIDATION.md). Rule: NEVER invent an entry; every comp
# cites its source. Engine-side runner does leave-one-out: drop one weapon
# slot, feed the rest, the dropped weapon (or its role) must appear in the
# engine's top-3.
#
# Schema per slot:
#   raw:      the weapon cell exactly as written in the source
#   weapons:  catalog UniqueName(s) — a list when the source names
#             alternatives ("Dawns/Rotcaller"); validated against the dataset
#   role:     curator annotation (NOT source data) — coarse tag for the V4
#             role-level match: main_tank | tank | support | healer | dps
#   role_raw: the source's own role label, verbatim, when the source has one
#   skills:   verbatim skill-loadout cell (e.g. "q3, w2, p1" = Q option 3,
#             W option 2, passive 1) — real expert default-kit data, the thing
#             V5 catch #1 established has NO public statistical source
#   potion, food: verbatim consumable columns when the source has them
#   battlemount: raw mount name for rider slots; these are OUTSIDE the weapon
#             capability model (mounts are not weapons). `weapons` then holds
#             the weapon carried while dismounted.
#   gear:     offhand/helm/armor/boots/cape + note, verbatim from the source.
#             Recorded as future gear-sheet input (design doc §2.4) — no gear
#             sheets exist yet, so nothing consumes these fields today.
#
# RUNNER PREREQUISITE: these parties are size 20 (large-scale ZvZ). The only
# existing template is castle_outpost fitted at size 7 — V4 cannot run on
# this comp until a large_scale_zvz template exists. Deriving that template's
# weights FROM this same comp would be circular; weights need the expert,
# this file is validation data only.

