# Pinned upstream inputs — the source_snapshot declaration for the evidence
# layer (pipeline/README.md, "Moving to a new game patch"). Every game-data
# input is fetched from THIS
# exact commit by pipeline/fetch_snapshot.py; nothing follows a moving branch.
#
# To move to a new game patch: update `commit`/`commit_timestamp` (from
# https://api.github.com/repos/ao-data/ao-bin-dumps/commits/master), run
#   py -3 pipeline/fetch_snapshot.py
#   py -3 pipeline/parse_dumps.py
#   py -3 pipeline/fetch_item_stats.py
#   py -3 pipeline/fetch_gear_lines.py
#   py -3 pipeline/effect_catalogue.py pipeline/out/dumps_cache/<sha12> --report
#   py -3 pipeline/evidence_review.py   (re-read the rows of every STALE id, then --accept)
#   py -3 pipeline/build_dataset.py
# and re-run the full gate list in CLAUDE.md. The manifest
# (pipeline/out/source_manifest.json) records what was actually fetched.

ao-bin-dumps:
  repository: https://github.com/ao-data/ao-bin-dumps
  commit: 47e4f5aca4d30b7495afa5a625ce0d5795e32050
  commit_timestamp: "2026-09-23T11:25:19Z"
  # The server environment these dumps describe. ao-bin-dumps extracts the
  # live-server client; there is no per-server split in this repository.
  environment: live
  # Nearest game patch at/preceding the commit, from out/patch_history.json
  # (patch_history.py over the same repository's git history).
  game_patch:
    date: "2026-09-23"
    message: "Update bin dumps 2026-09-23"
  # The pin is master HEAD at the time it was taken; the decision log
  # records each move (VALIDATION.md, The game data moves to the newer
  # snapshot).
  files:
    - items.json
    - spells.json
    - localization.json
    - formatted/items.json
    - formatted/items.txt
