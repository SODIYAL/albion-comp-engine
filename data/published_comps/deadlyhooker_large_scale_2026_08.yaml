# CONTENT CANDIDATES (owner ruling 2026-08-28). This record's stated
# content names a FORMAT, not one of the engine's content templates:
# "zvz 20man can be blackzone roaming or castle outposts or castle
# defense, same with zvz 7man, it can also be avalonian roads", and
# "any comp doing outposts or castles or roaming in blackzone could do
# so in faction aswell". So it is evidence for SEVERAL templates rather
# than one — which is how the four never-comp-fitted templates (castle,
# castle_outpost, faction_war, roads) get real numbers instead of the
# hand-set provisionals they still carry.
