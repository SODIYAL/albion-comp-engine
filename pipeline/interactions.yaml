# PvP interaction records — curated, spell-keyed ("new prompt" spec §1-§4).
#
# Identity is the SPELL UniqueName, not the weapon: two different bows running
# the same W share one named effect, and two different weapons with
# same-stat-but-differently-named debuffs (Aftershock's HP cut vs Shrinking
# Curse) must never be auto-merged. Compiled + validated by
# pipeline/build_interactions.py into out/interactions.json.
#
# Field contract:
#   spell            UniqueName (must exist in spell_index + be equippable)
#   effect_name      the named buff/debuff identity, verbatim-ish
#   duplicate        rollup enum: full | damage_only | refresh | override |
#                    shared_stack | unique_effect_only | partial |
#                    does_not_stack | unknown
#   components       [{id, kind: damage|dot|ground_dot|buff|debuff|cc,
#                      cc_type?, reflect?, purge?, cleanse?, duplicate?,
#                      notes?}] — component enums add not_applicable/unknown
#   badges           display chips for the dossier (derived ones are added
#                    automatically: NON-REFLECTABLE, DUPLICATE:<X>)
#   nonstacking_caps capability names whose PARTY SUPPLY counts once when two
#                    members equip this same spell. ONLY honored when
#                    confidence == verified; requires scoring_note. Unknown
#                    never changes a score.
#   confidence       verified | likely | community_reported | unknown
#                    verified   = the game's own data states it
#                    likely     = baseline game behavior (e.g. independent
#                                 damage instances), not individually stated
#   source, as_of, verified_patch — chapter-2 provenance conventions
#
# Every non-unknown claim cites its source. Missing facts stay unknown —
# never guessed (§12).

- spell: SPEEDARCHER_KITE
  effect_name: "Enchanted Quiver (self arrow enchant)"
  duplicate: full
  confidence: verified
  source: >
    Spell description @ ao-bin-dumps 5cf2e8e9: "Enchant 4 of YOUR arrows …
    YOUR Auto-Attack Speed / physical Auto-Attack damage" — a self-targeted
    buff; each caster enchants their own arrows, so duplicates are fully
    independent. (Corrects the stale community example of a shared
    resistance-reduction Quiver — no such component exists in current data.)
  as_of: 2026-08-19
  verified_patch: "2026-07-21"
  badges: [SELF-BUFF]
  components:
    - id: arrow_enchant
      kind: buff
      reflect: not_applicable
      purge: unknown            # buff purgeability is not stated in the dumps
      cleanse: not_applicable
      duplicate: full

