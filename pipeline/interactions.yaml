# PvP interaction records — curated, spell-keyed ("new prompt" spec §1-§4).
#
# Identity is the SPELL UniqueName, not the weapon: two different bows running
# the same W share one named effect, and two different weapons with
# same-stat-but-differently-named debuffs (Aftershock's HP cut vs Shrinking
# Curse) must never be auto-merged. Compiled + validated by
# pipeline/build_interactions.py into out/interactions.json.
#
# Field contract:
#   spell            UniqueName (must exist in spell_index + be equippable)
#   effect_name      the named buff/debuff identity, verbatim-ish
#   duplicate        rollup enum: full | damage_only | refresh | override |
#                    shared_stack | unique_effect_only | partial |
#                    does_not_stack | unknown
#   components       [{id, kind: damage|dot|ground_dot|buff|debuff|cc,
#                      cc_type?, reflect?, purge?, cleanse?, duplicate?,
#                      notes?}] — component enums add not_applicable/unknown
#   badges           display chips for the dossier (derived ones are added
#                    automatically: NON-REFLECTABLE, DUPLICATE:<X>)
#   nonstacking_caps capability names whose PARTY SUPPLY counts once when two
#                    members equip this same spell. ONLY honored when
#                    confidence == verified; requires scoring_note. Unknown
#                    never changes a score.
#   confidence       verified | likely | community_reported | unknown
#                    verified   = the game's own data states it
#                    likely     = baseline game behavior (e.g. independent
#                                 damage instances), not individually stated
#   source, as_of, verified_patch — chapter-2 provenance conventions
#
# Every non-unknown claim cites its source. Missing facts stay unknown —
# never guessed (§12).

- spell: REFLECTAREA
  effect_name: "Protection of the Fiends (Demon Armor group reflect aura)"
  duplicate: full
  confidence: verified
  source: >
    Spell description @ ao-bin-dumps 5cf2e8e9: "Create an aura with a 7
    radius around you while channeling ... Reflects 0.5 of incoming damage
    to you and up to 9 allies as magical damage. Increases all damage
    resistances of the affected allies by 0.43. Decreases your damage
    resistances by 0.37." Structural: reflectdamageactive @amountpercent
    0.50 @target friendotherplayers, plus magicresistance+/physicalarmor+
    on ally and magicresistance-/physicalarmor- on self.
    The aura is applied to OTHER players, so a second wearer stands inside
    the first's aura and vice versa — each one's self-penalty is repaid by
    the other's grant (-0.37 own vs +0.43 received). The duplicates are
    independent auras (full stacking of the reflect itself).
  as_of: 2026-08-28
  verified_patch: "2026-07-21"
  scoring_note: >
    self_cost_offset_min_copies 2 — the ONLY super-additive duplicate rule in
    the model, and deliberately narrow (owner 2026-08-28: "duplicate is worth
    more only in special cases like demon armor"). With one wearer the
    self-penalty stands; with two or more the wearers cover each other, so
    the penalty is not charged. Corroborated by the observed effect quotas:
    reflect shells appear 3,3,4,3,3 across the five near-complete 20-man
    rosters in the corpus and NEVER as a single copy. This offsets a cost
    only — it never adds supply, so a duplicate can never score better than
    two independent first copies.
  self_cost_offset_min_copies: 2
  badges: [GROUP REFLECT, SELF-COST]
  components:
    - id: group_reflect
      kind: buff
      reflect: not_applicable
      purge: unknown
      cleanse: not_applicable
      duplicate: full
      notes: 50% of incoming damage returned for the wearer and up to 9 allies
    - id: ally_resistances
      kind: buff
      reflect: not_applicable
      purge: unknown
      cleanse: not_applicable
      duplicate: full
      notes: +0.43 damage resistances to affected allies
    - id: wearer_resistance_cost
      kind: debuff
      reflect: not_applicable
      purge: unknown
      cleanse: not_applicable
      duplicate: full
      notes: -0.37 damage resistances on the wearer while the aura runs

