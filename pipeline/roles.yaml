# ---------------------------------------------------------------------------
# KIT DOCTRINE (increment 2, owner-approved 2026-08-25: "yes its the
# whole build. infact we might even need to include food, potion and
# capes and you are right about passive defaults"). Two parts:
#
# 1. PASSIVE DEFAULTS below — the tree-passive PICK per gear class,
#    keyed by the wearer's seat class where the tree splits. Values name
#    the passive FAMILY (an id substring); the build resolves each
#    piece's actual passive id from its own dumps menu
#    (gear_spells.json) and parses the magnitude from the spell
#    description — no hand numbers. Resolution failure on an armor tree
#    blocks the release (fail closed).
# 2. Per-seat kit POOLS are DERIVED at build time from observed
#    reference builds (builds_index — the seat's member weapons' real
#    kits, cited by build_id) and shipped as each role's `kit:`; the
#    chest is additionally hard-gated by the seat uniform. Derived,
#    never hand-listed (out/roles_report.json `kit_doctrine` is the
#    audit board).
kit_doctrine:
  # OWNER OVERRIDES on the mined pools (grading board 2026-08-26): the
  # pools stay derived, these are cited rulings applied on top. `drop`
  # must name an item the mining actually produced for that seat+slot
  # (else the ruling is stale and the build blocks); `add` must name a
  # cataloged item (count 0 — owner-ruled, not observed). Audit trail in
  # out/roles_report.json kit_doctrine `overrides`.
  overrides:
    engage_tank:
      potion:
        drop:
          - {id: T7_POTION_STONESKIN, source: "owner:2026-08-26 (grading board: Resistance Potion wrong for the engage seat)"}
    stopper_tank:
      cape:
        drop:
          - {id: CAPEITEM_FW_LYMHURST, source: "owner:2026-08-26 (grading board: Lymhurst Cape wrong for the stopper seat)"}
      offhand:
        drop:
          - {id: OFF_TOME_CRYSTAL, source: "owner:2026-08-26 (grading board: 'leering cane' — Timelocked Grimoire out)"}
        # OFF_JESTERCANE_HELL add RETIRED 2026-09-01: the killboard stream
        # now OBSERVES the cane on stopper weapons directly (the owner's
        # 'incubus is mostly paired with leering cane' — confirmed by
        # data), so the hand-add became a redundant ruling and the build
        # correctly blocked on it. The ruling's substance is superseded
        # by observation; the R17 affinity override stands unchanged.
    brawl_healer:
      offhand:
        drop:
          - {id: OFF_TOWERSHIELD_UNDEAD, source: "owner:2026-08-26 (grading board: Sarcophagus wrong for the brawl-heal seat)"}
        # OFF_TORCH_CRYSTAL add REMOVED 2026-08-29 — VINDICATED, not reversed.
        # The owner ruled it in on 2026-08-26 ("blueflame torch if user is on
        # judicator armor too"). The 23 albioncompo comps ingested 2026-08-29
        # put Blueflame Torch in this seat's OBSERVED doctrine tier on its own,
        # so the manual add became redundant and build_dataset's provenance
        # gate refused the build rather than ship a ruling that no longer does
        # anything ("add of OFF_TORCH_CRYSTAL already observed"). The ruling
        # was right; the evidence caught up with it. Nothing about the
        # resulting tier changed.
  passives:
    cloth:
      default: INCREASED_DAMAGE
      source: >
        owner:2026-08-25 ("most cloth users will take the damage passive
        on equipment to increase damage even higher"; confirmed as the
        default); dumps Aggression: +8% damage AND Healing Cast — one
        passive covers both cloth dps and cloth healers.
    leather:
      default: CD_REDUCTION
      source: >
        owner:2026-08-25 (confirmed defaults); dumps Quick Thinker: +5%
        Cooldown Rate. No cooldown channel exists in build_stats, so the
        pick is doctrine-display only — it never invents score.
    plate:
      frontline: CCDURATION
      default: INCREASED_CCR
      source: >
        owner:2026-08-25 ("plate = CC-duration for tanks" confirmed);
        dumps Authority: +10% Crowd Control duration (feeds
        cc_mult_caps); Tenacity: +20% Crowd Control Resistance (feeds
        the tankiness-per-CCR channel) for plate off the frontline.

# ---------------------------------------------------------------------------
# NEED PROFILES (increment 3, owner-ruled 2026-08-26). Fine-seat bands +
# function coverage the forge must field, on top of the coarse
# composition/style bands (healers and dps totals stay THERE — never
# duplicated here). Derived from the blind round + the evidence:
#   - owner blind calls (VALIDATION.md 2026-08-26 blind round)
#   - 8 curated near-complete rosters (roles_report kit evidence layer)
#   - 139 near-complete killboard fight rosters (out/roster_mixes.json,
#     sample_rosters.py): healer mode 4/20; engage > stopper everywhere
#     (live 1.95 vs 1.09, curated 2.6 vs 1.8); pierce fielded by 100%
#     of party rosters, heal-cut 92%, purge 71% (not gated — soft)
#   - Wardergrip ZvZ guide ("4-5 tanks, 3-4 supports, 4 healers")
# Owner ruling: engage-leaning default; stopper-heavy is the
# territory-defense shape ("add more stop tanks to really control
# people in the terry"). Counts scale by size/reference_size
# (half-up), arm at min_size. SEAT keys count a weapon's PRIMARY menu
# seat; FUNCTION keys (pierce/anti_heal/purge/shield_break) count any
# primary or secondary membership and take `min` only.
need_profiles:
  min_size: 15
  reference_size: 20
  defaults:
    engage_tank: {min: 2, max: 3}
    stopper_tank: {min: 1, max: 2}
    off_tank: {max: 1}
    shield_support: {min: 1, max: 3}
    zone_support: {max: 1}
    pierce: {min: 1}
    anti_heal: {min: 1}
  overrides:
    territory_defense:
      engage_tank: {min: 1, max: 3}
      stopper_tank: {min: 2, max: 4}

# ---------------------------------------------------------------------------
# GEAR AFFINITY OVERRIDES (owner rulings on the items board). The
# structural stat-profile mapping in classify_gear stays the default;
# an entry here replaces one item's derived role_affinity with the
# owner's cited call. Unknown item or role ids block the release.
gear_affinity_overrides:
  OFF_JESTERCANE_HELL:
    affinity: [stopper_tank]
    source: >
      owner:2026-08-26 ("leering cane is not for brawl healer, its
      mostly for stop tanks that are one hand" — the CC-duration stat
      pairs with a 1H stopper kit, not the caster-support families its
      small cooldown stat structurally matched).

# ---------------------------------------------------------------------------
# GEAR EFFECTS (owner correction 2026-08-25: "the aura support i feel
# should be broken down in individual type of auras/effects. for example
# there is also the demon armor aura, judicator armor aura, guardian armor
# aura"). Team auras and signature actives are GEAR-CARRIED effects, typed
# individually — they attach to whatever role wears them (a Guardian-Armor
# engage tank stays an engage tank CARRYING the weaken aura); "aura
# support" as a lumped seat is dissolved. `items` grant the effect (`id`
