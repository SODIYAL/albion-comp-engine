# ---------------------------------------------------------------------------
# KIT DOCTRINE (increment 2): the kit is the whole build — armor, head,
# shoes, cape, offhand, food, potion and the passive defaults. Two parts:
#
# 1. PASSIVE DEFAULTS below — the tree-passive PICK per gear class,
#    keyed by the wearer's seat class where the tree splits. Values name
#    the passive FAMILY (an id substring); the build resolves each
#    piece's actual passive id from its own dumps menu
#    (gear_spells.json) and parses the magnitude from the spell
#    description — no hand numbers. Resolution failure on an armor tree
#    blocks the release (fail closed).
# 2. Per-seat kit POOLS are DERIVED at build time from observed
#    reference builds (builds_index — the seat's member weapons' real
#    kits, cited by build_id) and shipped as each role's `kit:`; the
#    chest is additionally hard-gated by the seat uniform. Derived,
#    never hand-listed (out/roles_report.json `kit_doctrine` is the
#    audit board).
kit_doctrine:
  # CURATION OVERRIDES on the mined pools (role grading round): the
  # pools stay derived, these are cited corrections applied on top. `drop`
  # must name an item the mining actually produced for that seat+slot
  # (else the override is stale and the build blocks); `add` must name a
  # cataloged item (count 0 — curation judgment, not observed). Audit
  # trail in out/roles_report.json kit_doctrine `overrides`.
  overrides:
    engage_tank:
      potion:
        drop:
          - {id: T7_POTION_STONESKIN, source: "curation:2026-08-26 (role grading round: Resistance Potion wrong for the engage seat)"}
    stopper_tank:
      cape:
        drop:
          - {id: CAPEITEM_FW_LYMHURST, source: "curation:2026-08-26 (role grading round: Lymhurst Cape wrong for the stopper seat)"}
      offhand:
        drop:
          - {id: OFF_TOME_CRYSTAL, source: "curation:2026-08-26 (role grading round: Leering Cane is the stopper offhand — Timelocked Grimoire out)"}
        # OFF_JESTERCANE_HELL add RETIRED: the killboard stream now
        # OBSERVES the cane on stopper weapons directly (Incubus is mostly
        # paired with Leering Cane — confirmed by data), so the hand-add
        # became a redundant override and the build correctly blocked on
        # it. Its substance is superseded by observation; the R17 affinity
        # override stands unchanged.
    brawl_healer:
      offhand:
        drop:
          - {id: OFF_TOWERSHIELD_UNDEAD, source: "curation:2026-08-26 (role grading round: Sarcophagus wrong for the brawl-heal seat)"}
        # OFF_TORCH_CRYSTAL add REMOVED — VINDICATED, not reversed. The add
        # (Blueflame Torch for a brawl healer in Judicator Armor) was a
        # curation judgment; the 23 albioncompo comps ingested afterwards
        # put Blueflame Torch in this seat's OBSERVED doctrine tier on its
        # own, so the manual add became redundant and build_dataset's
        # provenance gate refused the build rather than ship an override
        # that no longer does anything ("add of OFF_TORCH_CRYSTAL already
        # observed"). The judgment was right; the evidence caught up with
        # it. Nothing about the resulting tier changed.
  passives:
    cloth:
      default: INCREASED_DAMAGE
      source: >
        curation:2026-08-25 (most cloth wearers take the damage passive
        to push damage higher; confirmed as the default); dumps
        Aggression: +8% damage AND Healing Cast — one passive covers both
        cloth dps and cloth healers.
    leather:
      default: CD_REDUCTION
      source: >
        curation:2026-08-25 (confirmed default); dumps Quick Thinker: +5%
        Cooldown Rate. No cooldown channel exists in build_stats, so the
        pick is doctrine-display only — it never invents score.
    plate:
      frontline: CCDURATION
      default: INCREASED_CCR
      source: >
        curation:2026-08-25 (plate frontline takes CC duration; confirmed);
        dumps Authority: +10% Crowd Control duration (feeds
        cc_mult_caps); Tenacity: +20% Crowd Control Resistance (feeds
        the tankiness-per-CCR channel) for plate off the frontline.

# ---------------------------------------------------------------------------
# NEED PROFILES (increment 3). Fine-seat bands + function coverage the
# forge must field, on top of the coarse composition/style bands (healers
# and dps totals stay THERE — never duplicated here). Derived from the
# validation round + the evidence:
#   - the validation-round calls (VALIDATION.md 2026-08-26)
#   - 8 curated near-complete rosters (roles_report kit evidence layer)
#   - 139 near-complete killboard fight rosters (out/roster_mixes.json,
#     sample_rosters.py): healer mode 4/20; engage > stopper everywhere
#     (live 1.95 vs 1.09, curated 2.6 vs 1.8); pierce fielded by 100%
#     of party rosters, heal-cut 92%, purge 71% (not gated — soft)
#   - Wardergrip ZvZ guide ("4-5 tanks, 3-4 supports, 4 healers")
# Rule: engage-leaning default; stopper-heavy is the territory-defense
# shape (more stopper tanks to control the point). Counts scale by
# size/reference_size
# (half-up), arm at min_size. SEAT keys count a weapon's PRIMARY menu
# ---------------------------------------------------------------------------
# TILE LABELS (the labels validation round: a Mace reading "engage" is
# fine, a Grovekeeper reading only "engage" is confusing — a weapon may
# carry several labels, primary role first, then secondary). DISPLAY ONLY
# — nothing here seats a weapon, gates a kit or
# scores. A weapon's label is `PRIMARY · tag · tag`:
#   primary  = the seat's `word` below (healers read their heal PROFILE
#              instead: Burst / Sustain, whichever heal score is higher;
#              a tie reads Burst with `sustain` as the first tag)
#   tags     = the weapon's cited FUNCTION roles on its primary menu
#              (purge / pierce / shield break / anti-heal — a job the
#              book seats it for) first, then the weapon's own curated
#              capabilities at >= min_score
#              (two supply units), at most max_tags, E-FIRST (the
#              standing unique-ability-first rule: capabilities the E's
#              evidence grounds outrank Q/W tools), then score, then the
#              vocabulary order below; capabilities the primary word
#              already says (`implied`) never repeat; healers tag their
#              LINE word (holy / nature) instead
#   overrides = cited curation entries that replace a weapon's derived tags
# build_dataset stamps `label` on every weapon and `word` on every role;
# the board tile and popover read them. Contracts: tests/test_roles.py R37.
labels:
  min_score: 4
  max_tags: 2
  words:
    engage_tank: Engage
    stopper_tank: Stopper
    off_tank: Bruiser
    main_healer: Healer
    kite_healer: Healer
    brawl_healer: Healer
    shield_support: Support
    zone_support: Support
    curse_support: Support
    # function roles share their capability's word so a job never reads
    # twice (anti_heal + heal_reduction = one "heal cut")
    pierce: pierce
    purge: purge
    shield_break: shield break
    anti_heal: heal cut
    ranged_aoe: Ranged AoE
    sustained_brawler: Melee
    bomb_aoe: Bomb
    dive_cleanup: Dive
    battlemount_pilot: Pilot
    caller: Caller
    scout: Scout
  # the fallback primary for a weapon off every seat
  class_words: {frontline: Tank, healer: Healer, support: Support, dps: DPS}
  # ordered: earlier wins a tie; capability -> the word on the tile
  vocab:
    - [silence, silence]
    - [purge, purge]
    - [stun, stun]
    - [peel, peel]
    - [root, root]
    - [anti_dive, anti-dive]
    - [catch, catch]
    - [clump_create, clump]
    - [cleanse, cleanse]
    - [resist_shred, pierce]
    - [heal_reduction, heal cut]
    - [interrupt, interrupt]
    - [knockback_displace, knockback]
    - [slow, slow]
    - [zone_control, zone]
    - [disengage, disengage]
    - [mobility, mobility]
    - [burst_aoe, aoe burst]
    - [sustained_dps, sustain dps]
    - [burst_st, single burst]
    - [execute, execute]
    - [buff_allies, buffs]
    - [damage_debuff, weaken]
    - [anti_zone, anti-zone]
    - [heal_burst, burst heal]
    - [heal_sustain, sustain heal]
    - [self_sustain, self-sustain]
    - [engage, engage]
    - [tankiness, tanky]
  # what the primary word already says (never repeated as a tag)
  implied:
    frontline: [tankiness]
    healer: [heal_burst, heal_sustain]
    engage_tank: [engage]
    ranged_aoe: [burst_aoe, ranged_presence]
    sustained_brawler: [sustained_dps]
    bomb_aoe: [burst_aoe]
    dive_cleanup: [execute]
  healer_lines: {holystaff: holy, naturestaff: nature}
  # WEAPON: {tags: [...], source: "curation:YYYY-MM-DD (...)"} — cited, wins
  overrides: {}

# seat; FUNCTION keys (pierce/anti_heal/purge/shield_break) count any
# primary or secondary membership and take `min` only.
need_profiles:
  min_size: 15
  reference_size: 20
  defaults:
    engage_tank: {min: 2, max: 3}
    stopper_tank: {min: 1, max: 2}
    off_tank: {max: 1}
    shield_support: {min: 1, max: 3}
    zone_support: {max: 1}
    pierce: {min: 1}
    anti_heal: {min: 1}
  overrides:
    territory_defense:
      engage_tank: {min: 1, max: 3}
      stopper_tank: {min: 2, max: 4}

# ---------------------------------------------------------------------------
# GEAR AFFINITY OVERRIDES (cited corrections from the items board). The
# structural stat-profile mapping in classify_gear stays the default;
# an entry here replaces one item's derived role_affinity with a cited
# curation judgment. Unknown item or role ids block the release.
gear_affinity_overrides:
  OFF_JESTERCANE_HELL:
    affinity: [stopper_tank]
    source: >
      curation:2026-08-26 (Leering Cane is not a brawl-healer offhand;
      it is worn by one-handed stopper tanks — the CC-duration stat
      pairs with a 1H stopper kit, not the caster-support families its
      small cooldown stat structurally matched).

# ---------------------------------------------------------------------------
# GEAR EFFECTS: "aura support" is not one seat — it breaks down into
# individual aura/effect types (Demon Armor aura, Judicator Armor aura,
# Guardian Armor aura, the energy and cooldown auras). Team auras and
# signature actives are GEAR-CARRIED effects, typed
# individually — they attach to whatever role wears them (a Guardian-Armor
# engage tank stays an engage tank CARRYING the weaken aura); "aura
# support" as a lumped seat is dissolved. `items` grant the effect (`id`
# when the gear catalog models it, `named` when it does not yet);
# `carriers` are weapons EVIDENCED to take a dedicated carrier seat with
# that effect. Detection reports "role + carrying".
gear_effects:
  - id: energy_font
    name: Energy aura
    kind: team_aura
    items:
      - {id: ARMOR_PLATE_ROYAL, source: "gear catalog: Royal Armor (Energy Source: 13 energy/1s to 10 allies within 15m; wiki /wiki/Energy_Source); curation:2026-08-25 (Royal Armor gives the team the extra energy it needs); linked 2026-09-04 (it had shipped as a named-only item)"}
    carriers:
      - {id: 2H_AXE_AVALON, source: "curation:2026-08-25 (the Realmbreaker royal-armor example); guide:albiononlinegrind clap-kite comp 'Realmbreaker Support' slot"}
      - {id: 2H_CLEAVER_HELL, source: "curation:2026-09-04 (in a clap Carving Sword is not a DPS seat but a tanky support that pierces with its E and carries Royal Armor for team energy); killboard:party_rosters 10+ parties: Royal Armor on 62 of 180 brawl appearances and 7 of 29 clap appearances, the modal chest in every style it is fielded in"}
  - id: cooldown_banner
    name: Cooldown aura
    kind: team_aura
    items:
      - {id: ARMOR_LEATHER_ROYAL, source: "gear catalog: Royal Banner (+50% ally Cooldown Rate; wiki /wiki/Royal_Banner)"}
    carriers:
      - {id: 2H_AXE_AVALON, source: "curation:2026-08-25 (Royal Jacket for extra cooldowns when the team needs them)"}
      - {id: 2H_DUALMACE_AVALON, source: "guide:metabattle Oathkeepers Support ZvZ ('the perfect support for Bomb Squads', Royal Jacket)"}
      - {id: 2H_ARCANESTAFF_HELL, source: "guide:metabattle Occult Staff ZvZ Support ('good CD reduction for your group', Royal Jacket)"}
  - id: weaken_aura
    name: Enemy-weaken aura
    kind: enemy_aura
    items:
      - {id: ARMOR_PLATE_SET3, source: "gear catalog: Guardian Armor Enfeeble Aura (damage_debuff 5 + peel 3)"}
    carriers: []
  - id: force_shield
    name: Ally force shield
