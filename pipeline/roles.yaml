# The ROLE BOOK (roles-design.md, owner-approved 2026-08-25).
#
# Roles are the PRIMARY objects ("i dont think we build the 137 role menu.
# different items and weapons fall into different roles" — owner). Each
# record: id, class (frontline/healer/support/dps; `meta` roles are
# recorded but NEVER forged), the job, the gear uniform (chest classes;
# item ids where the gear catalog models them), spell doctrine where
# ruled, and MEMBERSHIP with an evidence source per entry:
#   comp:<id>      slot label in data/published_comps (curated evidence)
#   guide:<src>    2026-08-25 online research (albiononlinegrind builds +
#                  its 18-slot clap-kite comp, albionzvzmanual.github.io,
#                  metabattle, bananatools; urls in the research record,
#                  tests/VALIDATION.md round 10)
#   owner:<date>   owner ruling, quoted in VALIDATION.md
#   derived:<sig>  structural signature (clump_core group, foundation
#                  healer set, zone supply)
# NO GUESSED MEMBERSHIPS: a weapon with no evidence stays off every menu
# and falls back to its coarse role_hint class. The membership board
# (out/roles_report.json) goes to the owner for grading; corrections land
# here as cited rulings. Menu order within a weapon follows list order
# below per role — the build derives role_menu (primary first by the
# role-record order in this file).

roles:
  # ------------------------------------------------------------ frontline
  - id: engage_tank
    class: frontline
    name: Engage / Clump Tank
    job: >
      Creates hittable clumps and commits the fight — pulls, chained CC,
      the shotcaller's opener ("create hittable clumps",
      albionzvzmanual.github.io/roles/).
    uniform: {chest: [plate]}
    weapons:
      - {id: 2H_HAMMER_AVALON, source: "derived:clump_core (flat clump_create >= 4); guide:metabattle Hand of Justice ZvZ ('a great choice for a shotcaller')"}
      - {id: 2H_MACE_MORGANA, source: "derived:clump_core; comp:timothy_blap_blackzone_roam_2026_08 (main_tank)"}
      - {id: MAIN_ARCANESTAFF_UNDEAD, source: "derived:clump_core (Witchwork pull)"}
      - {id: 2H_SHAPESHIFTER_KEEPER, source: "comp:deadlyhooker_large_scale_2026_08 (main_tank); guide:albiononlinegrind 'Engage Tank (Earthrune Staff)'"}
      - {id: MAIN_MACE, source: "comp:albioncompo_bist_roam15_2026_01 + timothy_blap (tank); guide:albiononlinegrind clap-kite comp 'Engage Tank (1H Mace + Mistcaller)'"}
      - {id: 2H_POLEHAMMER, source: "comp:tank x4 (bist, sortasaucy, deadlyhooker); sheet engage 6 (Slowing Charge identity)"}
      - {id: 2H_HAMMER, source: "comp:deadlyhooker (main_tank) + sortasaucy_7man (tank)"}
      - {id: MAIN_MACE_CRYSTAL, source: "comp:albioncompo_push_monkey_7 + timothy_blap (tank); crystal cost gate composes"}
      # --- seat-all pass (owner:2026-09-01 "lets fix seat for all weapons";
      # killboard = party_rosters.json observed builds, 2026-08 harvest) ---
      - {id: MAIN_HAMMER, source: "killboard:party_rosters (51 builds, 100% plate); hammer-family engage precedent (2H_HAMMER, HAMMER_AVALON); owner:2026-09-01 seat-all"}
      - {id: 2H_HAMMER_UNDEAD, source: "killboard:party_rosters (11 builds, 82% plate); hammer-family engage precedent; owner:2026-09-01 seat-all"}
      - {id: 2H_RAM_KEEPER, source: "killboard:party_rosters (10 builds, 100% plate); charge-slam engage E; owner:2026-09-01 seat-all"}
      - {id: 2H_TWINSCYTHE_HELL, source: "killboard:party_rosters (19 builds, 89% plate); drag-to-self clump E (golden T18 catch geometry); owner:2026-09-01 seat-all"}
      - {id: 2H_FLAIL, source: "owner:2026-09-01 seat-all (killboard: 0 builds — thin); pull E + tank role_hint, mace/flail clump family"}
  - id: stopper_tank
    class: frontline
    name: Defensive / Stopper Tank
    job: >
      Stops enemy paths, peels divers, covers exits, denies ground — the
      d-tank ("stopping enemy paths, covering exits",
      albionzvzmanual.github.io/roles/).
    uniform: {chest: [plate]}
    weapons:
      - {id: 2H_MACE, source: "owner:2026-08-25 ('3 heavy maces in party and 0 engage tanks would be an obvious flag' — Heavy Mace is the stopper archetype); guide:albiononlinegrind 'Defensive Tank (Heavy Mace)'; comp:tank x3"}
      - {id: MAIN_ROCKMACE_KEEPER, source: "comp:tank x4 (sob_blaze, deadlyhooker); sheet peel 6 (the air-jet wall)"}
      - {id: 2H_QUARTERSTAFF_AVALON, source: "owner:2026-08-25 ('grailseeker is primarily a d-tank weapon which helps stop or catch enemies'); dumps: E deals 125, root wall"}
      - {id: MAIN_MACE_HELL, source: "owner:2026-08-25 ('the support or tank'); guide:albiononlinegrind 'Inncubus ZvZ Support' (Judicator Armor)"}
      # 2H_IRONCLADEDSTAFF removed owner:2026-08-26 (grading board) —
      # consistent with its standing >=10 viability exclusion
      - {id: 2H_ROCKSTAFF_KEEPER, source: "comp:timothy_blap (tank) + sob_blaze (support); anti-heal aura wall"}
      - {id: 2H_SHAPESHIFTER_SET3, source: "owner:2026-08-24 ('an alright d-tank especially for zoning'); comp:sortasaucy_7man (tank)"}
    doctrine:
      MAIN_MACE_HELL: "Sacred Ground Q + Snare Charge W (owner:2026-08-25 — 'incubus usually has sacred ground and snare charge not guard rune')"
  - id: off_tank
    class: frontline
    name: Off-Tank / Bruiser
    job: >
      Second-line frontliner: soaks pressure and brawls without owning
      engage or stopping duty.
    uniform: {chest: [plate, leather]}
    weapons:
      - {id: 2H_HAMMER_CRYSTAL, source: "guide:albiononlinegrind 'Off-Tank (Truebolt Hammer, Soldier Helmet + Duskweaver)'"}
      - {id: 2H_DUALMACE_AVALON, source: "comp:deadlyhooker (tank x2)"}
      # --- seat-all pass (owner:2026-09-01) ---
      - {id: 2H_COMBATSTAFF_MORGANA, source: "killboard:party_rosters (14 builds, 93% plate); second-line plate brawler — shield_break stays its primary FUNCTION (owner:2026-08-26 removed it from shield_support); owner:2026-09-01 seat-all"}
      - {id: 2H_QUARTERSTAFF, source: "killboard:party_rosters (32 builds, 81% leather); peel/disengage bruiser kit; owner:2026-09-01 seat-all"}
      # seat-all pass: 2H_IRONCLADEDSTAFF stays OFF every menu — the
      # 2026-08-26 grading removal + standing >=10 viability exclusion
      # stand until the owner re-rules (killboard 17 builds, 53% leather)

  # --------------------------------------------------------------- healer
  - id: main_healer
    class: healer
    name: Main / Clump Healer
    job: >
      The party's healing foundation: big group heals on the clump; the
      primary_heal minimum is their seat.
    uniform: {chest: [cloth]}
    weapons:
      - {id: MAIN_HOLYSTAFF_AVALON, source: "derived:foundation set (full_healer + group scale, round 2); comp:healer x10"}
      - {id: 2H_HOLYSTAFF_UNDEAD, source: "derived:foundation set; comp:healer x4"}
      - {id: 2H_NATURESTAFF_HELL, source: "derived:foundation set; comp:healer x4"}
      - {id: 2H_NATURESTAFF_KEEPER, source: "derived:foundation set; comp:deadlyhooker (healer)"}
      # 2H_HOLYSTAFF removed owner:2026-08-26 (grading board) — Great Holy
      # is the brawl anchor, not a main/clump seat; brawl_healer entry stands
      - {id: 2H_HOLYSTAFF_HELL, source: "derived:foundation set; guide:albiononlinegrind Fallen Healer"}
      - {id: MAIN_NATURESTAFF, source: "derived:foundation set (heal_scale group + full_healer; Great Nature is the ruled single-scale sibling and stays OFF)"}
      - {id: 2H_WILDSTAFF, source: "derived:foundation set"}
      # --- seat-all pass (owner:2026-09-01): SEAT membership only — the
      # single-ally-heal generation gate (never generated at 10+) and the
      # foundation set are untouched; these heal, so they sit a healer seat ---
      - {id: MAIN_HOLYSTAFF, source: "killboard:party_rosters (36 builds, 86% cloth); single-scale healer (gang seat; the 10+ generation gate rides); owner:2026-09-01 seat-all"}
      - {id: 2H_DIVINESTAFF, source: "killboard:party_rosters (6 builds, cloth majority — thin); holy-family healer; owner:2026-09-01 seat-all"}
      - {id: MAIN_NATURESTAFF_CRYSTAL, source: "killboard:party_rosters (22 builds, 55% cloth); GROUP heal scale (the ruled hybrid — cost gate bars it below 30 regardless); owner:2026-09-01 seat-all"}
  - id: kite_healer
    class: healer
    name: Backline / Kite Healer
    job: >
      Heals on the move from range; the kite comp's healing seat — mostly
      a kit-flavor of the same weapons (owner: healers split "just
      depending on their equipment and composition").
    uniform: {chest: [cloth]}
    weapons:
      - {id: MAIN_HOLYSTAFF_AVALON, source: "sheet identity 'mobile peeling healer'"}
      - {id: 2H_WILDSTAFF, source: "derived:foundation set; kite doctrine (mobility kit)"}
      # --- seat-all pass (owner:2026-09-01) ---
      - {id: 2H_NATURESTAFF, source: "killboard:party_rosters (43 builds, 63% cloth); regen/mobile heal identity — the owner's foundation ruling keeps it OFF main_healer, this is the kite flavor; owner:2026-09-01 seat-all"}
      - {id: MAIN_HOLYSTAFF_MORGANA, source: "killboard:party_rosters (7 builds, 100% cloth — thin); mobility/utility heal E; owner:2026-09-01 seat-all"}
      - {id: MAIN_NATURESTAFF_KEEPER, source: "killboard:party_rosters (10 builds, 80% cloth); regen kiting healer (owner: Druidic out of the FOUNDATION set — seat only); owner:2026-09-01 seat-all"}
      - {id: MAIN_NATURESTAFF_AVALON, source: "owner:2026-09-01 seat-all (killboard: 2 builds — thin); nature-family mobile healer"}
  - id: brawl_healer
    class: healer
    name: Tanky Brawl Healer
    job: >
      Heals from inside the melee ball in heavier gear — the owner's
      "tanky brawl heal" flavor.
    uniform: {chest: [plate, leather]}
    weapons:
      - {id: 2H_HOLYSTAFF, source: "owner:2026-08-23 (Great Holy brawl-only for suggestions — the stationary anchor)"}
      - {id: MAIN_HOLYSTAFF_AVALON, source: "comp:timothy_blap (brawl comp healer x2)"}

  # -------------------------------------------------------------- support
  # Function-named (owner correction 2026-08-25: "shouldnt those weapons
  # be in like the pierce, purge, healcut role/category" — the FUNCTION is
  # the role, never the weapon tree). The `class` on these cross-tree
  # function roles is the TYPICAL seat for display; band counting always
  # uses the weapon's own coarse role_class. Team auras are NOT roles —
  # they are gear-carried effects (see `gear_effects` below) attached to
  # whatever role wears them.
  - id: shield_support
    class: support
    name: Shield / Cleanse Support
    job: >
      Owns the danger lane — cleanse, shields, resistance, protection
      (albionzvzmanual.github.io/roles/ 'Supports').
    uniform: {chest: [plate, cloth]}
    weapons:
      - {id: 2H_ARCANESTAFF, source: "comp:support x5 (bist, sob_blaze, deadlyhooker)"}
      - {id: 2H_ENIGMATICORB_MORGANA, source: "comp:support x3 (deadlyhooker, timothy_blap); sheet: continuous group cleanse bubble"}
      - {id: 2H_ENIGMATICSTAFF, source: "guide:heaven-guardian shield support; sheet bubble-shield"}
      - {id: MAIN_ARCANESTAFF, source: "comp:deadlyhooker (support x3)"}
      - {id: 2H_HOLYSTAFF_CRYSTAL, source: "comp:deadlyhooker (support x3); composition.roles.overrides precedent (fielded as the cleanse/zone-denial slot)"}
      # MAIN_ARCANESTAFF_UNDEAD removed owner:2026-08-26 (grading board:
      # "witchwork does not play for cleanse, its a clump and damage
      # weapon" — its engage_tank seat stands)
      - {id: 2H_SHAPESHIFTER_SET2, source: "comp:support x3; guide:albiononlinegrind 'Nature (Rootbound) Support'"}
      # 2H_COMBATSTAFF_MORGANA removed owner:2026-08-26 (grading board:
      # "blackmonk staff does not shield team, it purges shields from
      # enemy" — shield_break stays its primary function role)
  - id: pierce
    class: support
    name: Pierce (resistance cut)
    job: >
      Cuts the enemy clump's resistances so the whole damage line lands —
      the "armor shredder" function, whatever tree carries it. FUNCTION
      role: no uniform of its own — it rides along with the member's seat
      (Incubus cuts heals in tank plate, Carrioncaller in brawler
      leather), so kits are judged against seat roles only.
    # NOTE: secondary pierce is NEAR-UNIVERSAL — shred Q/Ws at the
    # 2-point rung exist on ~77/137 weapons (Iron Breaker, Sunder Armor,
    # Frazzle, Piercing Arrow, Frost Lance, the curse Armor Piercer ...).
    # Kept at the standard bar because the owner's own example (curse
    # pierce W, ladder 2) lives there; a per-role `secondary_min` knob
    # exists if the owner ever wants this tier to discriminate harder.
    uniform: {chest: []}
    weapons:
      - {id: 2H_CURSEDSTAFF_MORGANA, source: "owner:2026-08-25 ('damnation adds an amazing pierce on a huge size'); comp:deadlyhooker (dps)"}
      - {id: 2H_HARPOON_HELL, source: "owner:2026-08-24 (Spirithunter 'massive pierce that enables the whole dps line'); guide:yt role guide 'armor shredder'; comp:deadlyhooker (dps) + albioncompo_20v20 (rdps)"}
  - id: purge
    class: support
    name: Purge (buff removal)
    job: >
      Strips enemy buffs off the clump — defensive stances, damage
      steroids, auras. FUNCTION role (no uniform; rides with the seat).
      TRUE purge only — shield breaking is its own role below (owner
      2026-08-25: "hammers i think only break shield on q, it isnt
      really a purge").
    uniform: {chest: []}
    weapons:
      - {id: MAIN_CURSEDSTAFF_UNDEAD, source: "comp:support x3 (bist, deadlyhooker, timothy_blap); owner:2026-08-25 ('lifecurse purges enemy buffs, a good all round weapon')"}
      - {id: 2H_KNUCKLES_AVALON, source: "sheet: Purifying Fist purges all buffs from all enemies hit (purge 4, E-audit 2026-08-24, owner-bumped)"}
  - id: shield_break
    class: support
    name: Shield break
    job: >
      Breaks active shields (and blocks new ones) without touching other
      buffs — narrower than purge by the 2026-08-21 ruling
      (shield-break < true full purge). FUNCTION role; owner 2026-08-25:
      "shield break is like the primary role of black monk". The
      `spells` list claims the shield-break evidence spells so the sweep
      routes them here instead of purge; primary_min 2 because the
      shield-break ladder is deliberately held below the purge ladder.
    uniform: {chest: []}
    primary_min: 2
    spells: [COMBATSTAFF_SLASH, DISEMBOWEL, IRONBREAKER]
    weapons: []
  - id: anti_heal
    class: support
    name: Anti-heal (heal cut)
    job: >
      Denies or reduces enemy healing on the kill window — the heal-cut
      function across every tree (round-9 ladder: the 100%-negate and
      -40%/-50% class hold 4). FUNCTION role (no uniform; rides with the
      seat).
    uniform: {chest: []}
    weapons:
      - {id: MAIN_CURSEDSTAFF_CRYSTAL, source: "owner:2026-08-25 (2s heal NEGATE, 'great for a clap and clap kite comp')"}
      - {id: 2H_HALBERD_MORGANA, source: "sheet: Shockwave -40% Healing Received on a piercing line (heal_reduction 4)"}
      - {id: MAIN_MACE_HELL, source: "sheet: Shrinking Curse -40% Healing CAST, 8s cone (heal_reduction 4)"}
      - {id: 2H_FIRE_RINGPAIR_AVALON, source: "sheet: Dawnsong -40% Healing Received inside the fire (heal_reduction 4)"}
      - {id: 2H_ROCKSTAFF_KEEPER, source: "sheet: -50% Healing Received aura (heal_reduction 4)"}
      - {id: 2H_ARCANE_RINGPAIR_AVALON, source: "sheet: Dark Auras -15% Healing Received stacking 3x (heal_reduction 3, round-9 owner trim — weaker than the negate class)"}
  - id: zone_support
    class: support
    name: Zone / Slow Support
    job: >
      Ground denial and mass slows — the ice support seat
      (albiononlinegrind 'Ice (Icicle) Support').
    uniform: {chest: [cloth, plate]}
    weapons:
      - {id: 2H_ICEGAUNTLETS_HELL, source: "guide:albiononlinegrind 'Ice (Icicle) Support'; comp:deadlyhooker (tank)"}
      - {id: MAIN_FROSTSTAFF_KEEPER, source: "comp:deadlyhooker (support) + albioncompo_20v20 (tank)"}
      - {id: MAIN_FROSTSTAFF_AVALON, source: "sheet: the crystal-save support (Frozen Crystal ally save)"}
      # owner:2026-08-26 (grading board) — three removals: Glacial "is
      # more DPS than a support" and Permafrost "is dps and engage dps"
      # (both keep their ranged_aoe seats), Chillhowl "not good for
      # group content" (off every menu)
      # seat-all pass (owner:2026-09-01): 2H_SHAPESHIFTER_CRYSTAL stays OFF
      # every menu — the 2026-08-26 grading ruling ("not good for group
      # content") stands until the owner re-rules; killboard is thin
      # (6 builds) either way
  - id: curse_support
    class: support
    name: Curse Support / Pressure
    job: >
      The curse line's stacking-pressure seat — vile curses, debuff
      auras and purge/pierce/heal-cut riders on the enemy clump. The
      engine's derived curse_pressure job group made the LINE a comp
      object in 2026-08; this seat (seat-all pass, owner:2026-09-01)
      gives its members a uniform: the killboard fields them in PLATE
      and CLOTH (Lifecurse 76% plate of 133 builds, Damnation 64% cloth
      of 83 — the front-rank curses tank up, the artillery ones stay
      cloth).
    uniform: {chest: [cloth, plate]}
    weapons:
      - {id: MAIN_CURSEDSTAFF_UNDEAD, source: "killboard:party_rosters (133 builds, 76% plate); its purge FUNCTION role stands; comp:support x3 (bist, deadlyhooker, timothy_blap); owner:2026-09-01 seat-all"}
      - {id: 2H_CURSEDSTAFF_MORGANA, source: "killboard:party_rosters (83 builds, 64% cloth / 36% plate); its pierce FUNCTION role stands; comp:deadlyhooker (dps); owner:2026-09-01 seat-all"}
      - {id: MAIN_CURSEDSTAFF_AVALON, source: "killboard:party_rosters (63 builds, 76% plate); owner:2026-09-01 seat-all"}
      - {id: MAIN_CURSEDSTAFF, source: "killboard:party_rosters (26 builds, leather/cloth near-tie 13/11 — cited as observed); owner:2026-09-01 seat-all"}
      - {id: 2H_SKULLORB_HELL, source: "killboard:party_rosters (7 builds, 57% cloth — thin); debuff-aura orb; owner:2026-09-01 seat-all"}
      - {id: 2H_DEMONICSTAFF, source: "killboard:party_rosters (7 builds, mixed — thin); cursed-line artifact; owner:2026-09-01 seat-all"}
      - {id: 2H_CURSEDSTAFF, source: "owner:2026-09-01 seat-all (killboard: 2 builds — thin); cursed-line staple"}

