# Runtime corrections to the BUILT artifacts (out/effect_catalogue.json,
# out/spell_index.json), applied by effect_lookup.py. DATA, not code.
#
# WHY THIS FILE EXISTS: the catalogue and spell index are built from an
# ao-bin-dumps clone that is not kept in the repo, so parse bugs found between
# rebuilds are corrected here, at lookup time, where the seeder and the
# evidence lint both see them. Every entry cites the dumps description text it
# was verified against. Delete an entry once the parser bug it works around is
# fixed and the artifacts are rebuilt after the next game patch.
#
# Found during the second curation batch.

# ---------------------------------------------------------------------------
# Structured-effect direction rewrites: spell -> effect -> the CORRECT dirs.
# The parser tagged self-armor procs as ally+enemy+self, which made
# "YOUR damage resistances increase" passives lint-valid evidence for
# buff_allies/peel — a false-negative hole in the CI gate (bear_paws draft
# seeded exactly that error).
dir_overrides:
  PASSIVE_ARMORCHANCE_AXE:            # "Every 5 Auto-Attacks, your damage resistances increase by 0.29"
    magicresistance+: [self]
    physicalarmor+: [self]
  PASSIVE_ARMORCHANCE_SWORD:          # "Every 5 Auto-Attacks, increase your damage resistances by 0.23"
    magicresistance+: [self]
    physicalarmor+: [self]
  PASSIVE_ARMOR_CASTER_ARCANESTAFF:   # "After every 5 spells cast increase your damage resistances"
    magicresistance+: [self]
    physicalarmor+: [self]
  PASSIVE_ARMOR_CASTER_NATURESTAFF:   # same text, nature line
    magicresistance+: [self]
    physicalarmor+: [self]
  PASSIVE_SHAPESHIFT_ATTACK_BUFF:     # "you increase your Max and Current Health" — self; parser said ally+self
    hitpointsmaxbonus+: [self]

# ---------------------------------------------------------------------------
# Structured effects that are ARTIFACTS, not abilities: drop them entirely.
# Iron Will "Grants you immunity to purges" — the game data references the
# purge-type effects it is immune TO, and the parser read them as purges the
# spell performs. Iron Will removes nothing from anyone.
suppress_effects:
  DEFENSERUN: ["remove:buff", "remove:buff_damageshield", "remove:heal",
               "remove:invisibility", "remove:movementbuff"]
  # Ghost Strike's cooldown-reset condition REFERENCES Sunder Armor / Assassin
  # Spirit charges; the parser walked into those spells' effects and credited
  # the E with the Q spells' shred and damage buffs. The E itself only deals
  # damage, stealths, and cuts energy costs (full text verified 2026-08-12).
  GHOSTSTRIKE: ["magicattackdamagebonus+", "magicspelldamagebonus+",
                "physicalattackdamagebonus+", "physicalspelldamagebonus+",
                "magicresistance-", "physicalarmor-"]
  # Cripple's text: "Purges all Move Speed buffs" — ONLY movement buffs. The
  # parser expanded the purge reference into the full removal family.
  # remove:movementbuff is kept (real).
  LEGBREAKER: ["remove:buff", "remove:buff_damageshield", "remove:heal",
               "remove:invisibility"]

# ---------------------------------------------------------------------------
# Prose flags that misfired on drawback or unrelated wording: drop the flag.
suppress_flags:
  SHAPESHIFT_IMP: [stun]              # "While healing YOU are stunned" — a self-stun drawback, not enemy CC
  SHAPE_W_POLYMORPH: [heal]           # "decrease their max and current Health" tripped the heal regex
  DEFENSERUN: [purge]                 # "immunity to PURGES" — resists purges, performs none
  CURSE_SKELETON_BARF_FDHR: [shield]  # nothing shield-like in the text; flag noise
  SUNDERSHOT: [heal]                  # "Health the targeted enemy has LEFT" — a shred scaler, no healing
  CHARGINGBLADE: [stun, root, slow]   # "immune to Stuns, Roots and Slows" — immunity wording, not enemy CC
  CROSSBOW_CONE_ULTIMATE: [heal]      # "0.03 of their Current Health as true damage" — no healing anywhere
  LEGBREAKER: [purge]                 # movement-buff strip maps to catch/peel by design (remove:movementbuff), not purge
  LETHAL_CLEAVER: [heal]              # "Decreases Max and current Health" — a max-HP cut, no healing
  BLOOD_BLADE: [heal]                 # Blood Ritual — "take X of your Max Health as true damage": self-COST, no heal
  LAUNCHER: [shield]                  # "Decreases Crowd Control Resistance by 0.15" tripped the shield regex: an enemy CC-resistance cut, nothing shield-like

# ---------------------------------------------------------------------------
# Real mechanics the structured vocabulary cannot express (damage-absorb
# shields and ally-repositioning are not effect nodes — same class as raw
# damage/heals). Each entry adds a candidate the curator may then score.
add:
  SHAPE_Q_DAMAGE_AND_SHIELD:          # "Applies a shield to yourself and up to 5 allies that absorbs 150"
    buff_allies: "ally damage-absorb shield; absorb shields are outside the structured vocab"
  SHAPE_W_TETHERBEAM:                 # "Applies a shield that absorbs 300... if the ally is a guild/alliance/party member, pull them to your position"
    # No peel: Tether Shift shields the ally and pulls the ALLY to the caster;
    # its enemy half only dashes the caster to the target. Nothing in it
    # touches an enemy or cancels enemy CC (the peel rule below), so it falls
    # in the absorb-shield class.
    buff_allies: "300-absorb shield on the tethered ally; absorb shields are outside the structured vocab"
    anti_dive: "a 300 absorb shield on the tethered ally, who is pulled to the caster (the anti-dive rule: absorb shield)"
  SHAPE_W_AREA_PULL:                  # "pulling up to 5 enemies towards you, rooting them for 1.35"
    clump_create: "a 5-target enemy pull stacks enemies for AoE; the parser only captured the root"
  PBAOE_PULL:                         # Air Compressor — "Create a vacuum in a 7 radius around you, pulling all enemies towards you after 1.5"
    clump_create: "a 7m pull of every enemy to the caster stacks them for AoE; the parser captured only the self slow"
  SHAPE_W_POLYMORPH:                  # "transforming the first unmounted, not transformed player hit into a helpless animal for 2.5"
    peel: >-
      transformation CC on an ENEMY — a polymorphed diver is disabled outright.
      The parser captured only the mob-case max-health debuff, so the
      transformation itself is invisible to the vocabulary (the map knows the
      concept only in negative form: immunity:transformationcc and
      dr:DRTransformationCC). Re-cited here: the shapeshifter pool's
      peel row used to cite Tether Shift, which shields and pulls the ALLY and
      never touches an enemy — wrong spell for a real capability.
  CURSEDHANDS_STACKUP:                # "Enchant the targeted ally's Auto-Attacks for the next 10"
    buff_allies: "ally auto-attack damage enchant; direct damage adds are outside the structured vocab"
  # HAMMERTACKLE clump_create — REMOVED (curation). Dumps text: "knocking
  # back all enemies you pass through". A knockback along the dash line
  # displaces and scatters; it does not pull into a pile — the drag/pull
  # rule applies (Grovekeeper / Permafrost precedent, T12).
  # TOMBSTONE: do NOT re-add on the post-patch override re-check; the
  # displacement is captured as knockback_displace on the sheet.
  SHAPESHIFT_ENT:                     # "Growth: Increases the Max and Current Health of up to {0} allies in a 11 radius by 0.08"
    buff_allies: "group Max-HP grant on transform; HP grants are outside the structured vocab"
    # Barbed Roots (ENT_CHANNEL_TREE, a form ability on no equip menu):
    # "Slows all enemies within a 11 radius by 0.5... allies gain a shield
    # that absorbs up to 175 damage during the next 3 and grants immunity
    # to Forced Movement effects"
    peel: "form ability Barbed Roots grants allies in 11m Forced Movement immunity; form abilities are not separately equippable spells"
    slow: "Barbed Roots slows enemies within 11m by 50% for the channel; same gap"
    anti_dive: "Barbed Roots shields the dived allies and slows the divers among them; same gap"
  SHOVEL:                             # Fling — "pulling them 10 behind you"
    catch: "single-target pull INTO your team is the pick tool"
    knockback_displace: "enemy-directed forced repositioning; parser captured no displacement"
  HOLYSHIELD:                         # Divine Protection — "shield absorbing up to 456.3 damage" on an ally
    buff_allies: "ally damage-absorb shield; absorb shields are outside the structured vocab"
    anti_dive: "a 456 absorb shield cast on the dived ally (the anti-dive rule: absorb shield)"
  CRYSTALWAVE:                       # Hyperstatic — "Allies in the area gain a Shield, absorbing up to 350"
    buff_allies: "group absorb shield; outside the structured vocab"
  # ANTI-DIVE RULE: anti_dive is what denies a dive. It counts an effect
  # landed on the diver (the effect map's enemy rows) and a protection
  # placed on OTHER allies at the moment of the dive: an absorb shield, a
  # damage immunity or a damage redirection on an ally, and a protective
  # zone or aura (an area that stays and raises the damage resistances of
  # the allies inside it). None of these is peel (the peel rule below: peel
  # touches the enemy or cancels the enemy's CC). A resistance buff on one
  # targeted ally, or an instant buff with no area that stays, remains
  # buff_allies. Each ally-protection claim the effect map does not already
  # offer is added here per spell; pipeline/audit_form_abilities.py lists
  # the class.
  INVULNERABILITY:                    # Protective Beam — refreshing 240 absorb bubble on an ally
    buff_allies: "channeled ally absorb shield; outside the structured vocab"
    anti_dive: "an absorb bubble re-applied every second around the dived ally denies the dive its kill (the anti-dive rule)"
  SHIELDFRIENDLY:                     # Arcane Protection — "applying a shield that absorbs up to 300 damage ... during the next 2"
    anti_dive: "a 300 absorb shield cast on the dived ally (the anti-dive rule: absorb shield)"
  HOLY_ULTIMATE:                      # Salvation — "heals up to 20 allies for 270 Health and makes them immune to further damage for 2"
    anti_dive: "a 2s damage immunity for the allies in the circle (the anti-dive rule: damage immunity)"
  GUARDRUNE:                          # Guard Rune — a 5 radius rune for 5s: +6% damage resistances, Forced Movement and Stun immunity for 10 allies
    anti_dive: "a protective zone dropped on the dived allies (the anti-dive rule: zone)"
  REFLECTAREA:                        # Protection of the Fiends — "an aura with a 7 radius ... Increases all damage resistances of the affected allies by 0.43"
    anti_dive: "a protective aura on the allies around the wearer (the anti-dive rule: aura)"
  VOID:                               # The Void — an entropic bubble for the allies within: cleanse, "Increases damage resistances by 0.3"
    anti_dive: "a protective zone for the allies inside the bubble (the anti-dive rule: zone)"
  SOUL_LINK:                          # "Redirects 0.5 of the damage taken by one target to the other"
    # No peel: damage redirection halves what the ally takes but does nothing
    # to the enemy — protection, not peel (the peel rule below).
    buff_allies: "damage redirection off a focused ally; redirection is outside the vocab"
    anti_dive: "half the dived ally's damage moves to the linked ally (the anti-dive rule: damage redirection)"
  SHAPESHIFT_PANTHER:                 # "On the Prowl — you will turn invisible to players"
    engage: "stealth opener; the conditional invisibility was not parsed as an effect node"
    disengage: "stealth escape; same gap"
    # form abilities (on no equip menu): Infected Scrapes "Decreases healing
    # received by 0.04 (stacks up to 5 times)"; Sinister Swipes "Charge
    # through the targeted enemy"; Pounce "Leap towards target position"
    heal_reduction: "form passive Infected Scrapes cuts the target's Healing Received; form abilities are not separately equippable spells"
    mobility: "form abilities Sinister Swipes (charges) and Pounce (leap); same gap"
  # ---- form abilities of the other shapeshifter staves (curated with the
  # form text of audit_form_abilities.py; none sits on an equip menu)
  SHAPESHIFT_ROCK_ELEMENTAL:          # Boulder Crash "Stuns for 1.2"; Tectonic Shift "knocks back enemies by 2. Pulls all enemies between you and the wall towards you"; Tectonic Slam "Throws all enemies hit into the air"
    stun: "form ability Boulder Crash stuns a 3.5 radius for 1.2s; form abilities are not separately equippable spells"
    clump_create: "form ability Tectonic Shift pulls the enemies between the wall and the golem in; same gap"
    knockback_displace: "Tectonic Shift's wall knocks enemies back, Tectonic Slam throws them in the air; same gap"
  SHAPESHIFT_BEAR:                    # Feral Bash "stunning all enemies hit for 0.9"; Wild Onslaught "Dash in target direction ... Decreases damage resistances by 0.15 for 3"; Roar "Enemies hit will flee from you for 1"
    stun: "form ability Feral Bash stuns a 4 radius for 0.9s on a Shift Charge; form abilities are not separately equippable spells"
    resist_shred: "form ability Wild Onslaught cuts damage resistances by 15% for 3s; same gap"
    mobility: "the Wild Onslaught dash; same gap"
    peel: "form ability Roar makes the enemies in its cone flee for 1s: enemy CC on the divers; same gap"
  SHAPESHIFT_CRYSTAL_COBRA:           # Crystalburst "Reduce enemies' healing received by 0.2"; Neurotoxin "Decreases all damage affected enemies deal by 0.12"
    heal_reduction: "form ability Crystalburst cuts Healing Received by 20% in its area; form abilities are not separately equippable spells"
    damage_debuff: "form passive Neurotoxin cuts the damage poisoned enemies deal by 12%; same gap"
  SHAPESHIFT_IMP:                     # Fireflash Orb "Teleports you to the explosion"
    mobility: "form ability Fireflash Orb teleports the imp to its explosion; form abilities are not separately equippable spells"
  SHAPESHIFT_WEREWOLF:                # wolf form's lunge/chase abilities are the form payload
    catch: "form abilities (Tear Open / Rip Through lunges) are not separately equippable spells"
    mobility: "same — the wolf's movement kit lives inside the form"
  # ---- gear actives (full-build member model, 2026-08-20). Same misfire
  # classes on armor/shoe abilities: teleports/dashes not in the node vocab,
  # ally-immunity and absorb shields outside it, self-centered AoE direction.
  PBAOE_KNOCKBACK:                    # Force Field — "knocking back all enemies within a 6 radius around you by 9 (ignoring CCR)"
    peel: "a self-centered CCR-ignoring shove IS the dive-peel button"
    anti_dive: "same shove, thrown at the divers on you"
  ICEBLOCK2:                          # Ice Block — "immune to damage for {0} (can be used while stunned or silenced)"
    tankiness: "a damage-immune channel usable under CC; immunity windows are outside the vocab"
  SELF_CLEANSE:                       # Cleanse — "cleansing all Crowd Control effects and debuffs"
    tankiness: "self CC/debuff removal under fire is survivability; self-cleanse has no vocab entry"
  IMMORTAL:                           # Immortal — "impossible to drop below 1 Health"
    tankiness: "a cannot-die window is the purest tankiness; health floors are outside the vocab"
  ELECTRICSHOCK:                      # Electric Discharge — expanding AoE stun around self
    anti_dive: "a self-centered AoE stun is fired at the divers on you"
  # PEEL RULE: peel must hit the enemy or cancel the enemy's CC. Pure damage
  # protection on an ally is buff_allies / tankiness, not peel — the `peel:`
  # lines below were REMOVED (the ally-armor rule and the absorb-shield
  # class). Before the rule, Force Shield made Judicator Armor the
  # highest-peel gear in the game on nothing but +0.25 ally resistances.
  EMERGENCY_SHIELD:                   # "Emergency Shield for up to 10 allies... absorbing damage"
    buff_allies: "10-ally shield grant; same class as HOLYSHIELD/CRYSTALWAVE"
  FORCESHIELD:                        # Force Shield — "Increases damage resistances by 0.25" zone for allies
    buff_allies: "group resist grant inside the zone"
    anti_dive: "a protective zone dropped on the dived allies (the anti-dive rule: zone)"
  WINDWALL:                           # Wind Wall — "Purges... Knocks back all enemies to the wall's edge"
    peel: "the wall shoves divers out and blocks the follow-up"
    anti_dive: "same wall, cast on your backline"
  ENFEEBLEAURA:                       # Enfeeble Aura — "Decreases all damage affected enemies deal by 0.6"
    damage_debuff: "-60% damage dealt IS the damage debuff; parser captured only the slow"
    peel: "gutting the divers' damage output protects the focused ally"
  ARMOR_WEB:                          # Mythical Web — web zone under your feet, slows attackers
    anti_dive: "a slow zone at your own feet punishes melee divers specifically"
  CASTBUBBLE:                         # Energy Emission — "Enemies touching the bubble will get knocked back by 12"
    peel: "a 12m bubble shove off the carried ally/self is peel"
  DMG_BLINK:                          # Raging Blink — "Teleport towards the targeted position"
    mobility: "a teleport is movement; 'teleport' is not an effect node the vocab knows"
    engage: "blink in + stacking damage buff is a commit tool"
  CHARGE_IN:                          # Crush Charge — "Dash... knocking all enemies you pass through 15"
    engage: "an uninterruptible frontline dash is the commit button; parser captured only the stun"
    knockback_displace: "15m mass knock along the charge line"
    mobility: "the dash itself"
  CLEANSE_DASH:                       # Break Free — "Dash... Removes all Crowd Control Effects"
    disengage: "a CC-breaking dash is the escape button"
    mobility: "the dash itself"
  SPRINTHOT:                          # Rejuvenating Sprint — "increasing your Move Speed by 0.8"
    mobility: "the sprint half; parser captured only the heal-over-time"
  # ---- gear combat expansion (2026-08-27). Same misfire classes on the
  # remaining combat pieces: teleports/dashes/sprints not in the node
  # vocab, self-cleanse and immunity windows outside it, self-centered
  # trails/auras direction-misread, ally shields outside it.
  HOWL:                               # "Decreases damage dealt by 0.3 for 4" on enemies hit
    damage_debuff: "the -30% damage half; parser captured only the slow"
  SMELLOFBLOOD:                       # Mortal Agony — "Enemies hit below 0.5 Health will have their damage resistances reduced by 0.35"
    resist_shred: "enemy resist cut; direction misread as self/ally"
  NASTY_WOUNDS:                       # "Enemies entering the swirl... Healing Received and Healing Cast decreased by 0.5 for 4"
    heal_reduction: "enemy-directed heal cut; direction misread as ally heal"
  SPIDER_THREAD:                      # "2nd Hunt Prey: Dash to the enemy hit by Spider's Thread"
    catch: "combo dash onto the slowed target; dashes are outside the vocab"
  MAGICCIRCLE:                        # Magic Rune — "Increases magical damage and Healing Cast by 0.1... for up to 6 allies"
    buff_allies: "6-ally damage/heal/cast-speed rune; ally output buffs read as ally heal"
  LIFESAVIOR:                         # Everlasting Spirit — "you will become immune to further damage for 3"
    tankiness: "a triggered damage-immunity window; ICEBLOCK2 class"
  IMMUNEAREA:                         # Wings of Fire — "While inside the area, enemies outside it cannot affect you"
    tankiness: "untargetable by enemies outside the 5.5m landing area for 6s; untargetability is outside the vocab"
  REFLECT_CHANNEL:                    # Requite — "the shield shoots a magic orb, silencing the attacker for 2"
    anti_dive: "punishes whoever hits you while channeling; ELECTRICSHOCK class"
  HOVER_SPRINT:                       # Hover — "increasing your Move Speed... Grants immunity to Roots and Slows"
    disengage: "root/slow immunity while running IS the escape half"
    mobility: "the speed half; immunity wording parsed as root/slow"
  FROSTWALK:                          # Frost Walk — "Increases your Move Speed by 0.6"
    mobility: "the speed half; parser captured only the trail slow"
  DEMONWALK:                          # Rotten Ground — "Move Speed by 0.3... damage resistances decreased by 0.15 and Healing Received decreased by 0.15"
    mobility: "the speed half"
    resist_shred: "enemy resist cut on the trail; direction misread"
    heal_reduction: "enemy heal cut on the trail; direction misread"
  GLASS_MOVESPEED:                    # Defenseless Rush — "increasing your Move Speed by 0.75 and all damage by 0.75"
    mobility: "the speed half; the self -defense drawback misread as enemy shred"
  CHANNELED_RUN:                      # Focused Run — "Move Speed by 0.7... immunity to Stuns, Roots and Slows"
    disengage: "CC-immune running is the escape button"
    mobility: "the speed half"
  BLINK:                              # Blink — "Teleport to the targeted position... immunity to damage and purges for 0.2"
    disengage: "an instant teleport is the escape; teleports are outside the vocab"
    mobility: "a teleport is movement; DMG_BLINK class"
  DELAYED_TELEPORT:                   # "Teleport to the targeted position after 1"
    disengage: "delayed escape teleport"
    mobility: "a teleport is movement"
  CC_BLOCK:                           # Premonition — "cleansing all Crowd Control effects and increasing your Move Speed by 1.2... immunity to Stuns, Roots, Slows"
    disengage: "a CC-replace self-cleanse + speed burst is the escape; CLEANSE_DASH class"
    tankiness: "forced-movement immunity window; immunity windows are outside the vocab"
  BERSERK_SPRINT:                     # Vengeful Sprint — "Each Vengeance Charge increases your Move Speed by 0.05 and your damage by 0.05"
    mobility: "the sprint half; parser captured only the self-heal scaling"
  SHOULDERTACKLE:                     # Elbow Smash — "Dash towards the targeted position, throwing all enemies... in the air"
    engage: "an AoE knock-up dash is the commit button; CHARGE_IN class"
  ROYAL_MARCH:                        # "March towards the targeted position... Grants immunity to Roots and Slows"
    mobility: "the stacking speed march; immunity wording parsed as root/slow"
    engage: "an unstoppable march to the fight is the frontline walk-in"
  CHARGE_SHIELD:                      # Shield Charge — "Charge towards the target... If the target is an ally, the shield is also applied to the target"
    engage: "the charge half; dashes are outside the vocab"
    # No peel: Shield Charge shields the ally and never touches the enemy —
    # protection, not peel (the peel rule above).
    anti_dive: "a 250 absorb shield on the ally charged to (the anti-dive rule: absorb shield)"
  MAXHEALTHBUFF:                      # Giant — "increasing your Max and Current Health by 0.25, and your Move Speed by 0.25"
    tankiness: "self max-HP grant; hitpoints grants misread via reference chain"
    mobility: "the speed half"
  BATTLEFRENZY:                       # Battle Frenzy — "Move Speed by 0.55... immunity to Stuns, Roots, and Slows. Cleanses all Crowd Control effects (except Stuns)"
    disengage: "CC-immune speed + partial self-cleanse is the escape"
