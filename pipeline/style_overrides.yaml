# Curated overrides for the weapon style-fit derivation (identity system,
# owner-specified 2026-08-23: a weapon's identity comes from its E first,
# then chosen Q/W, equipment, and team role).
#
# The structural rule in build_dataset.py derives, per weapon, a fit verdict
# (fits / situational / unfit) for every playstyle x size band from the E's
# delivery facts (cast range, radius, burst_aoe claim), the weapon's
# autoattack range, and its utility points. Structure cannot capture caller
# judgment — an override is evidence, not taste: every entry needs a reason
# and a source, exactly like ranged_overrides.yaml.
#
# Shape:
#   - weapon: <key>
#     set:                # style ('*' = all) -> band ('*' = all) -> verdict
#       '*': {gang: unfit, group: unfit}
#     reason: ...
#     source: ...
#     as_of: YYYY-MM-DD
#
# Styles: brawl, clap, kite, brawl_clap ('*' = all four)
# Bands:  trio (<=3), gang (4-9), group (10+)   ('*' = all three)
# Verdicts: fits, situational, unfit
#
# Validated at dataset build: unknown weapons, styles, bands or verdicts
# fail the release.

- weapon: 2H_HOLYSTAFF
  set:
    clap: {gang: unfit, group: unfit}
    kite: {gang: unfit, group: unfit}
    clap_kite: {gang: unfit, group: unfit}
  reason: >
    Owner ruling (forge-quality blind round): "great holy is not a good fit
    for clap, it has to stop moving and needs everyone to clump in place to
    heal with e. that's not good" and "great holy I feel isn't really that
    good of a weapon in general but I only see it being useful in like
    brawl situations." The derivation grades healers style-flexible; the
    E-first rule overrules that here — Holy Explosion anchors the party in
    place, the opposite of what clap's engage-bomb-reset and kite's
    never-take-the-fight delivery need. Brawl (and brawl_clap's grind half)
    keep it; trio bands gate nothing by the standing Phase C rule.
  source: Owner ruling 2026-08-23 (forge-quality session, in-chat).
  as_of: 2026-08-23

- weapon: 2H_KNUCKLES_HELL
  set:
    clap: {gang: situational, group: situational}
  reason: >
    Owner ruling (forge-quality round 4): "flex bomber like hellfire, it's
    usually a brawl-clap weapon and not a clap option. realmbreaker gives
    multiple things like health cut, range e, easy way to engage followup —
    that's why it can work in clap." The flex all-rounder derivation grades
    both as clap-fits; the owner splits them: Hellfire's Boulder Toss is a
    brawler's ranged tool, not a clap bomb core, so clap drops to
    situational (the generation-fit gate then keeps it out of DEFAULT clap
    comps while brawl-clap — its home — keeps it, and a caller can always
    pick it manually). Realmbreaker stays as derived.
  source: Owner ruling 2026-08-24 (forge-quality session, in-chat).
  as_of: 2026-08-24

- weapon: MAIN_AXE
  set:
    "*": {gang: unfit, group: unfit}
  reason: >
    Owner ruling (V3-adjacent identity session): "although it's an axe and
    provides healthcut and possibilities for mobility on its w spell, it
    doesn't fit in most group play styles bigger than 3 because its e spell,
    the primary identity, doesn't do as much damage as other options for a
    group setting (5+)." The derivation reads its utility points (catch,
    engage, healthcut, root) as exempting it to 'situational'; the E-first
    identity rule overrules that — Axe Throw (burst_st 2, radius 1.5) is
    not a group damage tool, and the utility pieces do not carry a group
    slot on their own.
  source: Owner ruling 2026-08-23 (identity design session, in-chat).
  as_of: 2026-08-23

- weapon: 2H_WARBOW
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Owner ruling (round 7, observed-family reconciliation): "warbow on the
    other hand would be terrible in a group setting because its e is single
    target damage and it can get easily blocked." The derivation read Magic
    Arrow's max_targets 5 as group-scale, but its footprint is a 3.0 x 2.5
    line — in practice the first body eats it, exactly the blockable
    solo-arrow class the owner names. The E-first rule stands: max
    effective at 3, okay at 5, falls off hard beyond.
  source: Owner ruling 2026-08-24 (round 7, in-chat).
  as_of: 2026-08-24

- weapon: MAIN_FIRESTAFF
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Owner ruling (round 7): "any primarily solo target abilities, like
    dagger pair 1 hand fire etc are max affective in 3 man situations and
    then good/okay at 5 man and then start falling off hard if party
    grows." Pyroblast is a channeled projectile that detonates on the
    FIRST enemy hit (dump text: "upon impact with an enemy") — a blockable
    solo nuke the derivation graded group-scale from its impact radius.
  source: Owner ruling 2026-08-24 (round 7, in-chat).
  as_of: 2026-08-24

- weapon: 2H_SHAPESHIFTER_HELL
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Owner ruling (round 7): "hellspawn staff is another staff which is
    primarily single target damage and therefore not good in above 5
    member parties normally." The E is the Hellfire Imp transformation
    (self-target, very high single-target offense) — the form's damage is
    solo-target; the derivation had graded the weapon group-scale through
    its sheet caps.
  source: Owner ruling 2026-08-24 (round 7, in-chat).
  as_of: 2026-08-24

- weapon: 2H_HARPOON_HELL
  set:
    clap: {gang: fits, group: fits}
    clap_kite: {gang: fits, group: fits}
  reason: >
    Owner ruling (round 7, refining the 2026-08-23 situational grade):
    "spirithunter is great in clap and clap kite, just read the e ability,
    it has a massive pierce that enables the whole dps line." The dump
    text agrees: Corrupting Steel pierces THROUGH all enemies, cuts damage
    resistances of every enemy hit, and its trail cuts magical resistance
    further — the pierce lens's own capability, delivered line-wide. The
    derivation grades the weapon single-scale because the E's damage (80)
    is incidental; the E's JOB is the Pierce stage of the CLAP chain
    (engage-clump-pierce-burst), so clap and its clap_kite hybrid take it
    as a fit. Brawl/kite keep the derived situational grade — the
    killboard fields it inside the brawl-ball family too (68% of F1's
    cohorts), but the owner promoted only the clap halves.
  source: Owner ruling 2026-08-24 (round 7, in-chat).
  as_of: 2026-08-24

- weapon: 2H_TRIDENT_UNDEAD
  set:
    "*": {group: unfit}
  reason: >
    Owner ruling (round 7 E-audit follow-up): "trinity spear seems like a
    group tool but no one is doing auto attack damage usually so its never
    used in large scale. only time its used is for a swap for hitting
    castle gates or terry walls. to get the attack speed and start taking
    walls faster.. but never as the main weapon in party." The E derives
    group-fits (root-all + area impact + ally mist), but its headline
    buff is an AUTO-ATTACK steroid — worthless in large fights where
    nobody auto-attacks; the real large-scale use is a structure-siege
    weapon SWAP, not a comp slot. Gang keeps the derived verdict (the
    ruling names large scale only); manual picks score as always.
  source: Owner ruling 2026-08-24 (round 7, in-chat).
  as_of: 2026-08-24
