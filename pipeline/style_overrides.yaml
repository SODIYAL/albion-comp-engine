# Curated overrides for the weapon style-fit derivation (identity system:
# a weapon's identity comes from its E first, then chosen Q/W, equipment,
# and team role).
#
# The structural rule in build_dataset.py derives, per weapon, a fit verdict
# (fits / situational / unfit) for every playstyle x size band from the E's
# delivery facts (cast range, radius, burst_aoe claim), the weapon's
# autoattack range, and its utility points. Structure cannot capture caller
# judgment — an override is evidence, not taste: every entry needs a reason
# and a source, exactly like ranged_overrides.yaml.
#
# Shape:
#   - weapon: <key>
#     set:                # style ('*' = all) -> band ('*' = all) -> verdict
#       '*': {gang: unfit, group: unfit}
#     reason: ...
#     source: ...
#     as_of: YYYY-MM-DD
#
# Styles: brawl, clap, kite, brawl_clap ('*' = all four)
# Bands:  trio (<=3), gang (4-9), group (10+)   ('*' = all three)
# Verdicts: fits, situational, unfit
#
# Validated at dataset build: unknown weapons, styles, bands or verdicts
# fail the release.

- weapon: 2H_HOLYSTAFF
  set:
    clap: {gang: unfit, group: unfit}
    kite: {gang: unfit, group: unfit}
    clap_kite: {gang: unfit, group: unfit}
  reason: >
    Curation judgment (forge-quality validation round): Great Holy is not
    a clap fit — it has to stop moving and needs everyone clumped in place
    to heal with its E — and in general it is only useful in brawl
    situations. The derivation grades healers style-flexible; the
    E-first rule overrules that here — Holy Explosion anchors the party in
    place, the opposite of what clap's engage-bomb-reset and kite's
    never-take-the-fight delivery need. Brawl (and brawl_clap's grind half)
    keep it; trio bands gate nothing by the standing Phase C rule.
  source: "curation:2026-08-23 (forge-quality validation round)."
  as_of: 2026-08-23

- weapon: 2H_KNUCKLES_HELL
  set:
    clap: {gang: situational, group: situational}
  reason: >
    Curation judgment (forge-quality validation round 4): a flex bomber
    like Hellfire is usually a brawl-clap weapon, not a clap option;
    Realmbreaker works in clap because it brings several things at once —
    a health cut, a ranged E, an easy engage follow-up. The flex
    all-rounder derivation grades both as clap-fits; the split: Hellfire's
    Boulder Toss is a
    brawler's ranged tool, not a clap bomb core, so clap drops to
    situational (the generation-fit gate then keeps it out of DEFAULT clap
    comps while brawl-clap — its home — keeps it, and a caller can always
    pick it manually). Realmbreaker stays as derived.
  source: "curation:2026-08-24 (forge-quality validation round)."
  as_of: 2026-08-24

- weapon: MAIN_AXE
  set:
    "*": {gang: unfit, group: unfit}
  reason: >
    Curation judgment (identity validation round): although the Battleaxe
    provides a health cut and W-slot mobility, it fits no group playstyle
    above 3 because its E, the primary identity, deals too little damage
    for a group setting (5+). The derivation reads its utility points (catch,
    engage, healthcut, root) as exempting it to 'situational'; the E-first
    identity rule overrules that — Axe Throw (burst_st 2, radius 1.5) is
    not a group damage tool, and the utility pieces do not carry a group
    slot on their own.
  source: "curation:2026-08-23 (identity validation round)."
  as_of: 2026-08-23

- weapon: 2H_WARBOW
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Curation judgment (round 7, observed-family reconciliation): Warbow is
    poor in a group setting because its E is single-target damage that is
    easily blocked. The derivation read Magic
    Arrow's max_targets 5 as group-scale, but its footprint is a 3.0 x 2.5
    line — in practice the first body eats it, exactly the blockable
    solo-arrow class. The E-first rule stands: max
    effective at 3, okay at 5, falls off hard beyond.
  source: "curation:2026-08-24 (validation round 7)."
  as_of: 2026-08-24

- weapon: MAIN_FIRESTAFF
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Curation judgment (round 7): primarily single-target abilities (Dagger
    Pair, 1H Fire and the like) are most effective at 3, acceptable at 5,
    and fall off hard as the party grows. Pyroblast is a channeled
    projectile that detonates on the
    FIRST enemy hit (dump text: "upon impact with an enemy") — a blockable
    solo nuke the derivation graded group-scale from its impact radius.
  source: "curation:2026-08-24 (validation round 7)."
  as_of: 2026-08-24

- weapon: 2H_SHAPESHIFTER_HELL
  set:
    "*": {gang: situational, group: unfit}
  reason: >
    Curation judgment (round 7): Hellspawn Staff is primarily single-target
    damage and therefore normally not good in parties above 5. The E is
    the Hellfire Imp transformation
    (self-target, very high single-target offense) — the form's damage is
    solo-target; the derivation had graded the weapon group-scale through
    its sheet caps.
  source: "curation:2026-08-24 (validation round 7)."
  as_of: 2026-08-24

- weapon: 2H_HARPOON_HELL
  set:
    clap: {gang: fits, group: fits}
    clap_kite: {gang: fits, group: fits}
  reason: >
    Curation judgment (round 7, refining the earlier situational grade):
    Spirithunter is strong in clap and clap-kite — its E is a massive
    pierce that enables the whole dps line. The dump
    text agrees: Corrupting Steel pierces THROUGH all enemies, cuts damage
    resistances of every enemy hit, and its trail cuts magical resistance
    further — the pierce lens's own capability, delivered line-wide. The
    derivation grades the weapon single-scale because the E's damage (80)
    is incidental; the E's JOB is the Pierce stage of the CLAP chain
    (engage-clump-pierce-burst), so clap and its clap_kite hybrid take it
    as a fit. Brawl/kite keep the derived situational grade — the
    killboard fields it inside the brawl-ball family too (68% of F1's
    cohorts), but only the clap halves are promoted.
  source: "curation:2026-08-24 (validation round 7)."
  as_of: 2026-08-24

- weapon: 2H_TRIDENT_UNDEAD
  set:
    "*": {group: unfit}
  reason: >
    Curation judgment (round 7 E-audit follow-up): Trinity Spear looks like
    a group tool, but nobody auto-attacks at large scale, so it is never
    fielded there — its only large-scale use is a weapon swap for taking
    castle gates and territory walls faster, never as a party's main
    weapon. The E derives
    group-fits (root-all + area impact + ally mist), but its headline
    buff is an AUTO-ATTACK steroid — worthless in large fights where
    nobody auto-attacks; the real large-scale use is a structure-siege
    weapon SWAP, not a comp slot. Gang keeps the derived verdict (the
    judgment names large scale only); manual picks score as always.
  source: "curation:2026-08-24 (validation round 7)."
  as_of: 2026-08-24
