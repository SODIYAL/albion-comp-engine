- weapon: 2H_KNUCKLES_KEEPER
  spell: PUMMELING_STRIKES
  decision: deny
  reason: >
    The cone channel reaches ~11m but the weapon is fielded as a diving
    kidnap/brawl pick, not ranged clump pressure; its clump value is
    curated separately (clump_create via Triple Kick).
  source: >
    Timothy's blap sheet — "E on engage EARLY, kidnap healers or
    overcommitted tanks" (2026-08).
  as_of: 2026-08-19

- weapon: MAIN_FIRESTAFF_CRYSTAL
  spell: FLAMEDASH
  decision: deny
  reason: >
    "Transform into a Fireball … Fly up to 14 towards the targeted position,
    deals damage to all enemies in a radius" — the wielder IS the projectile;
    damage lands around self at the destination. Same body-delivery class as
    the melee leaps.
  source: Spell description (ao-bin-dumps 5cf2e8e9).
  as_of: 2026-08-19
