# Curated overrides for the ranged_presence derivation (the evidence layer,
# pipeline/README.md).
#
# The structural rule in build_dataset.py grants ranged_presence to a loadout
# bundle when its curated burst_aoe evidence spell is ground/enemy-delivered
# with cast_range >= 9, and denies it when the spell carries the wielder
# (`caster_moves`, parsed from the spell's own dash or leap): a gap-closer's
# area lands where the body lands, an engage, never ranged pressure from
# outside the clump. This file holds the cited exceptions, both ways: a
# caster-moving spell whose payload still lands from range is a grant, and a
# deny names what structure misses. An override is evidence, not taste:
# every entry needs a reason and a source.
#
# decision: deny  — the spell must NOT ground ranged_presence
# decision: grant — force a grant the structural rule misses (cite why)
#
# Validated at dataset build: the weapon must exist, the spell must be
# equippable on it and claim burst_aoe, and a deny must not repeat the
# caster_moves rule, or the release fails.

- weapon: 2H_KNUCKLES_KEEPER
  spell: PUMMELING_STRIKES
  decision: deny
  reason: >
    The cone channel reaches ~11m but the weapon is fielded as a diving
    kidnap/brawl pick, not ranged clump pressure; its clump value is
    curated separately (clump_create via Triple Kick).
  source: >
    Timothy's blap sheet — "E on engage EARLY, kidnap healers or
    overcommitted tanks" (2026-08).
  as_of: 2026-08-19

- weapon: 2H_KNUCKLES_SET3
  spell: IMPULSE_PUNCH
  decision: deny
  reason: >
    "Unleash a powerful punch in a cone in front of you" — the cone is
    anchored at the wielder, a brawler's engage the same class as Ursine
    Maulers' Pummeling Strikes. The parser carries no area for the cone, so
    the structural rule reads only its 13 cast range.
  source: >
    Spell description (ao-bin-dumps 47e4f5aca4d3); curation:2026-10-08 —
    a brawler's cone in front of the wielder is not ranged pressure.
  as_of: 2026-10-08

# Validation round on the 18-man clap roster (notes/validation/2026-09b.md):
# the caster-moving Es the structural rule granted were judged one by one.
# Fists of Avalon and Skystrider are recorded as GRANTS so the decision
# lives in data and the caster_moves rule does not flip them.

- weapon: 2H_KNUCKLES_AVALON
  spell: TRIPLECOMBO_DIVEKICK
  decision: grant
  reason: >
    The dive kick leaps to the targeted position (caster moves), which the
    gap-closer rule denies; the ranged grant stands (curation
    judgment) — the combo is fielded as a 12m knock-up bomb thrown onto
    the clump.
  source: >
    curation:2026-09-15 — Fists of Avalon keeps its structural grant
    (target ground, cast_range 12).
  as_of: 2026-09-15

- weapon: 2H_BOW_CRYSTAL
  spell: AIR_RAID
  decision: grant
  reason: >
    "Leap to the targeted position and conjure a foothold in the air,
    becoming Untargetable" then "Sky Bolt: shoot a lightning-infused arrow
    at the targeted position" — the wielder moves, but the payload is an
    arrow from an untargetable perch, ranged pressure on the clump.
  source: >
    Spell description (ao-bin-dumps); curation:2026-09-15 — Skystrider
    is ranged.
  as_of: 2026-09-15
