              MAIN_FROSTSTAFF, 2H_DUALSWORD, 2H_FIRE_RINGPAIR_AVALON,
              2H_SHAPESHIFTER_HELL, 2H_INFERNOSTAFF_MORGANA,
              2H_CLEAVER_HELL, 2H_DUALSICKLE_UNDEAD, 2H_CROSSBOW_CANNON_AVALON,
              2H_BOW_KEEPER, 2H_CROSSBOWLARGE_MORGANA,
              2H_AXE_AVALON, 2H_CLAYMORE_AVALON, 2H_BOW,
              2H_KNUCKLES_SET2, 2H_BOW_HELL, 2H_DOUBLEBLADEDSTAFF,
              2H_CLAWPAIR, 2H_DUALCROSSBOW_HELL, MAIN_AXE,
              # tree pass (2026-08-12) — unambiguous DPS only; supports
