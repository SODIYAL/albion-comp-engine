# Scoring configuration (design doc §4.1, §4.2). Data, not code.

weights:
  alpha: 0.55   # marginal capability gain
  beta:  0.20   # synergy
  delta: 0.15   # meta prior
  gamma: 0.70   # concavity of the utility curve U_c(s) = w * min(1, s/target)^gamma
  # Over-stack penalty asymptote, as a fraction of a capability's BASE weight
  # (2026-08-18). The penalty used to be LINEAR AND UNBOUNDED
  # (0.5*w*(have-soft)/target), which had two consequences neither intended:
  #   1. a saturated capability could score deeply NEGATIVE, so fitness peaked
  #      at ~10 players and fell monotonically to 20 — the model preferred
  #      bringing FEWER bodies to a ZvZ, and a 13-of-20 subset of a forged
  #      20-man out-scored the full comp by 24 points.
  #   2. dividing by `target` meant threshold caps (scales:false, target 2.0)
  #      were punished ~6x harder per excess unit than burst_aoe (target 12).
  # Now saturating and scaled by soft_cap: pen = max * w * x/(1+x), where
  # x = (have - soft_cap)/soft_cap. Bounded by max*w, so redundancy always
  # costs something but can never invert a covered capability's value. The
  # rational form (not exp) keeps Python/JS bit-identical for the parity test.
  overstack_max: 0.5

# Capability-level synergy: pairs worth more across players than their sum
# (design doc §4.2.1). Applies to any weapons supplying the pair — no
# per-weapon-pair maintenance.
capability_synergies:
  - {a: clump_create,   b: burst_aoe,      bonus: 1.5}
  - {a: engage,         b: catch,          bonus: 0.8}
  - {a: resist_shred,   b: burst_st,       bonus: 0.8}
  - {a: heal_reduction, b: sustained_dps,  bonus: 0.8}

# Meta prior (design doc §4.1): guards against weapons that fit on paper but
# nobody plays. HAND-SET PLACEHOLDER VALUES — real win-lift arrives in Phase 3
# from battle data (§8), with Bayesian shrinkage and minimum-n gates. Keyed by
# weapon unique_name.
meta_prior:
  MAIN_HOLYSTAFF_AVALON: 1.0   # Hallowfall
  2H_MACE:               1.0   # Heavy Mace
  2H_HAMMER:             0.8   # Great Hammer
  2H_ICECRYSTAL_UNDEAD:  0.8   # Permafrost Prism
  2H_HOLYSTAFF:          0.6   # Great Holy Staff
  2H_LONGBOW:            0.6   # Longbow
  MAIN_MACE:             0.6   # Mace

# Role sets used by the golden regression suite (tests/test_golden.py).
# These are test fixtures, not engine inputs — the engine has no role concept.
role_sets:
  # 2H_HOLYSTAFF_UNDEAD (Redemption) was curated batch-1 but never listed —
  # caught when it legitimately topped T5's recommendation (2026-08-12).
  # Tree pass (2026-08-12) added the full holy + nature rosters.
  healers:   [MAIN_HOLYSTAFF_AVALON, 2H_HOLYSTAFF, 2H_NATURESTAFF_HELL,
              MAIN_HOLYSTAFF_MORGANA, MAIN_HOLYSTAFF, 2H_HOLYSTAFF_UNDEAD,
              2H_DIVINESTAFF, 2H_HOLYSTAFF_CRYSTAL, 2H_HOLYSTAFF_HELL,
              2H_NATURESTAFF, 2H_NATURESTAFF_KEEPER, 2H_WILDSTAFF,
