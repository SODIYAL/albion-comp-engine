              MAIN_NATURESTAFF_CRYSTAL, MAIN_NATURESTAFF_KEEPER]
  # 2H_POLEHAMMER added batch-2, 2H_HAMMER_AVALON batch-5, 2H_QUARTERSTAFF
  # batch-7 (role_hint: tank — the dedicated peel bruiser)
  frontline: [2H_MACE, 2H_HAMMER, MAIN_MACE, 2H_RAM_KEEPER, 2H_POLEHAMMER,
              2H_HAMMER_AVALON, 2H_QUARTERSTAFF, 2H_DUALHAMMER_HELL,
              2H_HAMMER_CRYSTAL, 2H_HAMMER_UNDEAD, MAIN_HAMMER,
              2H_FLAIL, 2H_MACE_MORGANA, MAIN_MACE_CRYSTAL, MAIN_MACE_HELL,
              MAIN_ROCKMACE_KEEPER, 2H_DUALMACE_AVALON,
              2H_IRONCLADEDSTAFF, 2H_ROCKSTAFF_KEEPER, 2H_SHAPESHIFTER_KEEPER]
  # 2H_DUALAXE_KEEPER + 2H_BOW_AVALON added with batch-2 curation: DPS picks,
  # not first-slot comp anchors (Bear Paws' bruiser sustain notwithstanding)
  # batch-3 + batch-4 additions (2026-08-12). MAIN_CURSEDSTAFF_CRYSTAL
  # (Rotcaller, role_hint: support) is deliberately in NO set: it is neither
