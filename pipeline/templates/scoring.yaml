# Swap-advisor display thresholds (dashboard). PROVISIONAL like every other
# tunable — kept in the data layer so the expert pass can see and adjust
# them; nothing engine-side reads these (the engine returns data, the UI
# applies the verdict policy).
#   min_rank     — hints stay silent for members ranked better than this
#   min_gain     — options below this score gain are noise, not advice
#   offcomp_rank — at/after this rank the label escalates to "off-comp"
swap_advisor:
  min_rank: 15
  min_gain: 1.0
  offcomp_rank: 60
