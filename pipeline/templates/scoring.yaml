# Scoring configuration (design doc §4.1, §4.2). Data, not code.

# Capability-score scale (2026-08-20): sheets grade 1-7. The old 0-3
# ordinals moved to the EVEN slots (1->2, 2->4, 3->6) — odd slots exist for
# finer rulings (1 = weaker than anything previously scored, 7 = beyond the
# old top). score_unit is how many 1-7 points equal ONE supply unit: 2
# keeps every template target, floor and synergy bonus calibrated exactly
# as before — the migration is bit-identical by construction.
score_unit: 2

weights:
  alpha: 0.55   # marginal capability gain
  beta:  0.20   # synergy
  delta: 0.15   # meta prior
  gamma: 0.70   # concavity of the utility curve U_c(s) = w * min(1, s/target)^gamma
  # Over-stack penalty asymptote, as a fraction of a capability's BASE weight
  # (2026-08-18). The penalty used to be LINEAR AND UNBOUNDED
  # (0.5*w*(have-soft)/target), which had two consequences neither intended:
  #   1. a saturated capability could score deeply NEGATIVE, so fitness peaked
  #      at ~10 players and fell monotonically to 20 — the model preferred
  #      bringing FEWER bodies to a ZvZ, and a 13-of-20 subset of a forged
  #      20-man out-scored the full comp by 24 points.
  #   2. dividing by `target` meant threshold caps (scales:false, target 2.0)
  #      were punished ~6x harder per excess unit than burst_aoe (target 12).
  # Now saturating and scaled by soft_cap: pen = max * w * x/(1+x), where
  # x = (have - soft_cap)/soft_cap. Bounded by max*w, so redundancy always
  # costs something but can never invert a covered capability's value. The
  # rational form (not exp) keeps Python/JS bit-identical for the parity test.
  overstack_max: 0.5
  # Exact-weapon redundancy weight (design doc §4.1's rho term, implemented
  # 2026-08-18 — it was documented but missing from the engine). Each copy of
  # a weapon beyond its penalty-free allowance (composition.yaml duplication)
  # costs rho * (copy_index - free): the 2nd extra copy costs twice the 1st,
  # deliberately NON-saturating — the capability over-stack penalty saturates,
  # which is exactly how a 3rd basic Cursed Staff used to become nearly free.
  # PROVISIONAL magnitude: the design doc suggested 0.10 for the weight blend;
  # 0.25 is set so one extra copy (~0.25) outweighs the ~0.1-0.2 marginal
  # coverage a duplicate typically adds to an already-filled comp.
  rho: 0.25
  # Viability-tier prior weight (composition.yaml viability.core). Same scale
  # as delta: a core-listed weapon gets +viability * core_bonus. PROVISIONAL.
  viability: 0.15
  # Headroom slope (2026-08-18): supply between target and soft_cap earns a
  # small linear bonus, capped at headroom * weight when supply reaches the
  # soft cap. Rationale: the coverage curve min(1, s/target)^gamma flatlines
  # AT the target, so in a fixed-size roster every body past coverage was
  # worth exactly zero and the forge's tail slots went NET NEGATIVE (comp
  # score peaked below the requested size — the "negative filler" failure).
  # The template model already declares target..soft_cap a legitimate range
  # ("supply beyond soft_cap starts costing" — so below it, more of a good
  # thing is mildly good, not worthless). PROVISIONAL magnitude.
  headroom: 0.1

# Capability-level synergy: pairs worth more across players than their sum
# (design doc §4.2.1). Applies to any weapons supplying the pair — no
# per-weapon-pair maintenance.
#
# ENGINE RULES (2026-08-18 rework; engine.py synergy()):
#   1. A pair is INACTIVE unless BOTH capabilities are in the active content
#      template's requirements. Before this, a capability the template
#      deliberately omitted (castle_outpost has no burst_st — the expert
#      zeroed it) still paid synergy UNCAPPED, which is how Cursed Staff
#      earned resist_shred x burst_st value in a template that values
#      neither burst_st nor the pair.
#   2. "Across players" is enforced: the pair pays
#         bonus * max(0, min(cap_a(S_a), cap_b(S_b)) - J)
#      where J is the LARGEST single member's joint supply
#      min(member_a, member_b). One weapon supplying both halves cannot
#      self-trigger the pair (a lone 1H Cursed shreds, then bursts, with no
#      teammate amplified); two members each covering one half pay in full.
#      PROVISIONAL formulation — the subtraction (rather than a hard
#      two-member gate) keeps partial credit for mixed parties.
capability_synergies:
  - {a: clump_create,   b: burst_aoe,      bonus: 1.5}
  - {a: engage,         b: catch,          bonus: 0.8}
  - {a: resist_shred,   b: burst_st,       bonus: 0.8}
  - {a: heal_reduction, b: sustained_dps,  bonus: 0.8}

# Meta prior (design doc §4.1): guards against weapons that fit on paper but
# nobody plays. HAND-SET PLACEHOLDER VALUES — real win-lift arrives in Phase 3
# from battle data (§8), with Bayesian shrinkage and minimum-n gates. Keyed by
# weapon unique_name.
meta_prior:
  MAIN_HOLYSTAFF_AVALON: 1.0   # Hallowfall
  2H_MACE:               1.0   # Heavy Mace
  2H_HAMMER:             0.8   # Great Hammer
  2H_ICECRYSTAL_UNDEAD:  0.8   # Permafrost Prism
  2H_HOLYSTAFF:          0.6   # Great Holy Staff
  2H_LONGBOW:            0.6   # Longbow
  MAIN_MACE:             0.6   # Mace

# Role sets used by the golden regression suite (tests/test_golden.py).
# These are test fixtures, not engine inputs — the engine has no role concept.
role_sets:
  # 2H_HOLYSTAFF_UNDEAD (Redemption) was curated batch-1 but never listed —
  # caught when it legitimately topped T5's recommendation (2026-08-12).
  # Tree pass (2026-08-12) added the full holy + nature rosters.
  healers:   [MAIN_HOLYSTAFF_AVALON, 2H_HOLYSTAFF, 2H_NATURESTAFF_HELL,
              MAIN_HOLYSTAFF_MORGANA, MAIN_HOLYSTAFF, 2H_HOLYSTAFF_UNDEAD,
              2H_DIVINESTAFF, 2H_HOLYSTAFF_CRYSTAL, 2H_HOLYSTAFF_HELL,
              2H_NATURESTAFF, 2H_NATURESTAFF_KEEPER, 2H_WILDSTAFF,
              MAIN_NATURESTAFF, MAIN_NATURESTAFF_AVALON,
              MAIN_NATURESTAFF_CRYSTAL, MAIN_NATURESTAFF_KEEPER]
  # 2H_POLEHAMMER added batch-2, 2H_HAMMER_AVALON batch-5, 2H_QUARTERSTAFF
  # batch-7 (role_hint: tank — the dedicated peel bruiser)
  frontline: [2H_MACE, 2H_HAMMER, MAIN_MACE, 2H_RAM_KEEPER, 2H_POLEHAMMER,
              2H_HAMMER_AVALON, 2H_QUARTERSTAFF, 2H_DUALHAMMER_HELL,
              2H_HAMMER_CRYSTAL, 2H_HAMMER_UNDEAD, MAIN_HAMMER,
              2H_FLAIL, 2H_MACE_MORGANA, MAIN_MACE_CRYSTAL, MAIN_MACE_HELL,
              MAIN_ROCKMACE_KEEPER, 2H_DUALMACE_AVALON,
              2H_IRONCLADEDSTAFF, 2H_ROCKSTAFF_KEEPER, 2H_SHAPESHIFTER_KEEPER]
  # 2H_DUALAXE_KEEPER + 2H_BOW_AVALON added with batch-2 curation: DPS picks,
  # not first-slot comp anchors (Bear Paws' bruiser sustain notwithstanding)
  # batch-3 + batch-4 additions (2026-08-12). MAIN_CURSEDSTAFF_CRYSTAL
  # (Rotcaller, role_hint: support) is deliberately in NO set: it is neither
  # healer, frontline, nor pure DPS — the first support-class weapon curated.
  pure_dps:  [2H_LONGBOW, MAIN_ARCANESTAFF_UNDEAD, 2H_ICECRYSTAL_UNDEAD,
              2H_DAGGERPAIR, MAIN_RAPIER_MORGANA, 2H_HARPOON_HELL,
              2H_DUALAXE_KEEPER, 2H_BOW_AVALON,
              MAIN_FROSTSTAFF, 2H_DUALSWORD, 2H_FIRE_RINGPAIR_AVALON,
              2H_SHAPESHIFTER_HELL, 2H_INFERNOSTAFF_MORGANA,
              2H_CLEAVER_HELL, 2H_DUALSICKLE_UNDEAD, 2H_CROSSBOW_CANNON_AVALON,
              2H_BOW_KEEPER, 2H_CROSSBOWLARGE_MORGANA,
              2H_AXE_AVALON, 2H_CLAYMORE_AVALON, 2H_BOW,
              2H_KNUCKLES_SET2, 2H_BOW_HELL, 2H_DOUBLEBLADEDSTAFF,
              2H_CLAWPAIR, 2H_DUALCROSSBOW_HELL, MAIN_AXE,
              # tree pass (2026-08-12) — unambiguous DPS only; supports
              # (arcane utility, curse line, Chillhowl, Rotcaller class)
              # stay deliberately unclassified
              2H_BOW_CRYSTAL, 2H_LONGBOW_UNDEAD, 2H_WARBOW,
              2H_CROSSBOW, 2H_CROSSBOWLARGE, 2H_DUALCROSSBOW_CRYSTAL,
              2H_REPEATINGCROSSBOW_UNDEAD, MAIN_1HCROSSBOW,
              2H_DAGGERPAIR_CRYSTAL, 2H_DAGGER_KATAR_AVALON,
              2H_IRONGAUNTLETS_HELL, MAIN_DAGGER, MAIN_DAGGER_HELL,
              2H_CLAYMORE, 2H_DUALSCIMITAR_UNDEAD, MAIN_SCIMITAR_MORGANA,
              MAIN_SWORD, MAIN_SWORD_CRYSTAL,
              2H_FIRESTAFF, 2H_FIRESTAFF_HELL, 2H_INFERNOSTAFF,
              MAIN_FIRESTAFF, MAIN_FIRESTAFF_CRYSTAL, MAIN_FIRESTAFF_KEEPER,
              2H_FROSTSTAFF, 2H_FROSTSTAFF_CRYSTAL, 2H_GLACIALSTAFF,
              2H_ICEGAUNTLETS_HELL, MAIN_FROSTSTAFF_KEEPER,
              2H_AXE, 2H_HALBERD, 2H_HALBERD_MORGANA, 2H_SCYTHE_CRYSTAL,
              2H_SCYTHE_HELL,
              2H_KNUCKLES_AVALON, 2H_KNUCKLES_CRYSTAL, 2H_KNUCKLES_HELL,
              2H_KNUCKLES_KEEPER, 2H_KNUCKLES_MORGANA, 2H_KNUCKLES_SET1,
              2H_KNUCKLES_SET3,
              2H_GLAIVE, 2H_GLAIVE_CRYSTAL, 2H_SPEAR, 2H_TRIDENT_UNDEAD,
