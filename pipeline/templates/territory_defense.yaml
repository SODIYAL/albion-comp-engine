# ---------------------------------------------------------------------------
# COMP-FITTED RECALIBRATION 2026-08-21 (owner directive: real comps set the
# numbers). Rows marked (comp-fit) re-fitted from the three Deadlyhooker
# parties measured in CURRENT engine units (geometric AoE included); same
# fitting rule as blackzone_roam (see that header). anti_zone now fits the
# standing Exalted slot every party fields (2.0 units > the old 1.7 soft -
# audit F3). Rows where the parties disagree (incl. tankiness/stun, where
# P2/P3 carry their frontline on battlemounts) were left untouched.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.833 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~17% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Territory Defense (20-man objective fight).
#
# PROVISIONAL — created 2026-08-12, weights NOT yet expert-adjudicated.
# Role-ratio calibration comes from Deadlyhooker's large-content comp
# (data/published_comps/, castle/territory/mass roam, 3×20): per party
# roughly 5–6 frontline/utility, 3 arcane-class supports, an Exalted slot in
# ALL three parties (cleanse + zone denial), 2–3 healers, and an AoE bomb
# core (Permafrost ×2, Occult beam, Hoarfrost obelisk). Battlemount slots
# (up to a third of parties 2–3) are OUTSIDE the weapon model and were
# ignored for calibration.
# CIRCULARITY NOTE (VALIDATION V4): a V4 leave-one-out run against the
# Deadlyhooker comp is weakened evidence for the same reason as
# blackzone_roam vs blap — role counts informed these numbers. The clean
# test needs an independent territory comp.
#
# Identity vs blackzone_roam: the fight comes to YOU at a fixed objective.
# Zone control and stall (tankiness) are the win condition; anti_zone is
# worth more than anywhere else (attackers will stack zones on the point —
# hence the standing Exalted slot); catch/mobility/disengage matter less;
# clump punishment (drag + burst_aoe) matters more because chokes and the
# point force stacking.

content: territory_defense
name: Territory Defense
base_size: 20
validated_sizes: [20]

requirements:
  heal_sustain:   {target: 6.7,  weight: 10, soft_cap: 13.1, scales: true}  # (comp-fit 2026-08-21)
  heal_burst:     {target: 7.7,  weight: 6,  soft_cap: 12.6,  scales: true}  # (comp-fit 2026-08-21)
  tankiness:      {target: 10.0, weight: 9,  soft_cap: 14.2, scales: true}
  peel:           {target: 22.5,  weight: 8,  soft_cap: 60.6, scales: true}  # (comp-fit 2026-08-21)
  burst_aoe:      {target: 10.8, weight: 9,  soft_cap: 16.7, scales: true}
  zone_control:   {target: 6.7,  weight: 6,  soft_cap: 16.1, scales: true}  # (comp-fit 2026-08-21)
  engage:         {target: 4.2,  weight: 7,  soft_cap: 16.1,  scales: true}  # (comp-fit 2026-08-21)
  stun:           {target: 4.2,  weight: 4,  soft_cap: 8.3, scales: true}
  sustained_dps:  {target: 14.4,  weight: 4,  soft_cap: 19.7, scales: true}  # (comp-fit 2026-08-21)
  catch:          {target: 12.9,  weight: 4,  soft_cap: 26.3,  scales: true}  # (comp-fit 2026-08-21)
  mobility:       {target: 4.2,  weight: 3,  soft_cap: 18.4, scales: true}  # (comp-fit 2026-08-21)
  # focused damage; chokes reward AoE) — expert ruling 2026-08-14. Token weight.
  burst_st:       {target: 1.7,  weight: 1,  soft_cap: 3.3,  scales: true}
  # PROVISIONAL (2026-08-18) — ranged positioning, same rationale and
  # per-player rate as blackzone_roam (0.25/player, weight 4): zone bombs on
  # the point come from range. Was only on blackzone_roam, so this template
  # forged melee balls for clap comps.
  ranged_presence: {target: 5.0,  weight: 4,  soft_cap: 10.0, scales: true}
  # threshold needs
  clump_create:   {target: 2.5,  weight: 8,  soft_cap: 4.2,  scales: false}
  purge:          {target: 3.6,  weight: 6,  soft_cap: 5.8,  scales: false}  # (comp-fit 2026-08-21)
  heal_reduction: {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  resist_shred:   {target: 5.0,  weight: 5,  soft_cap: 10.9,  scales: false}  # (comp-fit 2026-08-21)
  cleanse:        {target: 7.2,  weight: 5,  soft_cap: 9.2,  scales: false}  # (comp-fit 2026-08-21)
  silence:        {target: 1.7,  weight: 4,  soft_cap: 5.8,  scales: false}  # (comp-fit 2026-08-21)
  buff_allies:    {target: 2.5,  weight: 4,  soft_cap: 6.9,  scales: false}  # (comp-fit 2026-08-21)
  disengage:      {target: 6.3,  weight: 3,  soft_cap: 11.5,  scales: false}  # (comp-fit 2026-08-21)
  execute:        {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}  # single-target kill-secure; weak at scale
  # REWEIGHT 2026-08-18 (see blackzone_roam.yaml note): from-zero windfall of
  # these provisional niche weights dominated tail recommendations (weight 3+
  # = a +3.0 pick score at saturated margins). anti_zone kept ABOVE the other
  # contents (2, not 1): the standing Exalted slot in all three Deadlyhooker
  # parties is territory/castle evidence. Still flat, still PROVISIONAL.
  anti_zone:      {target: 1.8,  weight: 2,  soft_cap: 2.3,  scales: false}  # (comp-fit 2026-08-21)
  damage_debuff:  {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}

# Absolute-unit floors, same rationale + PROVISIONAL penalty_mult as
# blackzone_roam (see that file / castle_outpost.yaml for the history).
hard_floors:
  heal_sustain: {min_party_size: 10, floor_units: 4.2, penalty_mult: 2.0}
  tankiness:    {min_party_size: 10, floor_units: 3.3, penalty_mult: 1.0}
