# Playstyles — caller-intent overlays on top of a content template.
#
# PROVISIONAL — created 2026-08-13, weights NOT expert-adjudicated. Every
# multiplier scales a capability's WEIGHT in the chosen content template
# (targets, soft caps and hard floors are untouched: a kite comp still
# needs its healers — style changes what you emphasise, not what keeps the
# party alive; floor penalties are computed on the BASE weight for the
# same reason). A capability absent from the template's requirements is
# unaffected by its multiplier.
#
# Vocabulary from the shotcaller world: brawl (stand and grind), clap
# (stack them, one bomb), kite (never take the fight, bleed them),
# brawl-clap (grind until they clump, then bomb). "Balanced" is the
# identity — free mode, no thumb on the scale.
#
# `mechanics` blocks (added 2026-08-13; Q14 CLOSED 2026-08-25): how the
# style DELIVERS damage. The owner delegated the magnitudes — "i cant give
# you numbers for that you have to use logic to figure that out" — under
# one confirmed ORDERING constraint: "for clap and kite and clap kite and
# brawl clap, the number will usually be higher than brawl" (the values
# below satisfy it: brawl 3 is the floor). Adjust by reasoning + gate
# evidence, keep the ordering.
#   expected_aoe_targets — enemies a typical AoE hits under this style;
#     feeds the AoE Escalation curve (mechanics.yaml) into burst_aoe supply.
#   focus_attackers — players concentrating on one called target; feeds the
#     Focus Fire / Resilience curve into burst_st + execute supply.
# The engine NORMALIZES both curves to the balanced style's parameters, so
# balanced stays the identity and template calibration is untouched; styles
# diverge by RELATIVE physics only. Weight multipliers say what a style
# VALUES; mechanics say what a style's delivery makes EFFECTIVE.
#
# `constraint_overrides` blocks (2026-08-23 owner ruling, forge-quality
# blind round): per-style ROLE-BAND overrides on top of composition.yaml's
# constraint_bands — the bands were calibrated on BRAWL evidence (blap) and
# were style-blind, so every style forged toward brawl-shaped rosters
# ("having 5 healers in a party of 20 feels like too much, especially in
# clap and kite. for kite you are mostly kiting so don't need as many
# healers usually and would rather get teammates that facilitate movement").
# Owner-ruled healer counts: at 20 brawl 3-4 / clap 2-3 / kite 2; at 7
# kite 1, brawl 1-2 (base). Rows follow constraint_bands semantics (first
# matching min_size/max_size row wins; a listed role key REPLACES the base
# band's entry for that role; unlisted keys keep the base band). Frontline
# tightenings come from the same round (20-brawl forged 6 frontline — "too
# many tanks ... not enough damage"; blap runs 5. 10-clap kept 3 hammers —
# "instead of a great hammer, there are better options ... more movement
# like occult or a half tank half damage like icicle"). Values at sizes the
# owner did not explicitly grade are PROVISIONAL interpolations awaiting
# the next grading round. Hybrids (brawl_clap, clap_kite) deliberately
# carry no overrides yet — un-ruled. Like every constraint, this shapes
# GENERATION only; manual rosters always score.
#
# `chain` blocks (fight-chain explanation, roadmap item 1, 2026-08-23):
# the SEQUENCE a caller thinks this style in — each stage names the
# capabilities that execute it. The engine's fight_chain() grades every
# stage against the comp-fitted template targets (the same lens the kill-
# pressure checklist uses; capabilities a content does not require are
# skipped) — DESCRIPTIVE only, nothing here scores. Stage names and cap
# groupings are PROVISIONAL owner vocabulary: reword or re-map freely,
# the engine follows the data. Balanced carries no chain — it falls back
# to the detected identity's chain.

styles:
  balanced:
    name: Balanced
    blurb: no thumb on the scale — the content template as fitted
    multipliers: {}
    mechanics: {expected_aoe_targets: 4, focus_attackers: 4}

  brawl:
    name: Brawl
    blurb: stand and grind — sustain, stall and attrition win
    multipliers:
      tankiness: 1.35
      heal_sustain: 1.3
      sustained_dps: 1.35
      heal_reduction: 1.25
      # a melee ball is a legitimate brawl answer — blap fields zero ranged
      ranged_presence: 0.5
      cleanse: 1.2
      resist_shred: 1.2
      peel: 1.15
      execute: 1.1
      # 0.85 -> 0.7 (2026-08-18): consistency with this style's own rule
      # above — the ranged BOMB the ball doesn't field was still valued at
      # near-parity, so leave-one-out on a real brawl ball recommended
      # Permafrost/Damnation bombs over the tanks and healers the caller
      # actually runs. Direction was always "less AoE"; magnitude is the
      # PROVISIONAL part (header) and is deepened to match ranged_presence.
      burst_aoe: 0.7
      clump_create: 0.8
      disengage: 0.85
      catch: 0.8
      mobility: 0.75
    # spread melee ball: cleaves clip ~3, damage split across whoever's in
    # reach, so few attackers stack on any one enemy
    mechanics: {expected_aoe_targets: 3, focus_attackers: 3}
    # owner-ruled 2026-08-23: at 20, brawl runs 3-4 healers and ~5 frontline
    # (blap's count; the style-blind band let 6 through — "too many tanks")
    constraint_overrides:
      - {min_size: 20, max_size: 29, healer: {min: 3, max: 4}, frontline: {min: 4, max: 5}}
    # owner's brawl sequence: contact -> pressure -> sustain -> denial -> secure
    chain:
      - {name: Contact, caps: [engage, tankiness]}
      - {name: Pressure, caps: [sustained_dps, resist_shred]}
      - {name: Sustain, caps: [heal_sustain, cleanse, self_sustain]}
      - {name: Denial, caps: [heal_reduction, purge, peel]}
      - {name: Secure, caps: [execute, max_health_cut]}

  clap:
    name: Clap
    blurb: stack them and delete them — one engage, one bomb
    multipliers:
      clump_create: 1.7
      burst_aoe: 1.6
      # the bomb has to land from OUTSIDE the clump you just made
      ranged_presence: 1.6
      engage: 1.4
      silence: 1.3
      purge: 1.25
      stun: 1.2
      tankiness: 0.9
      heal_sustain: 0.9
      catch: 0.9
      mobility: 0.85
      heal_reduction: 0.8
      sustained_dps: 0.6
    # synced bombs on a manufactured clump: AoE rides the escalation curve
    # toward its 8-target cap; ST damage is incidental (few attackers each)
    mechanics: {expected_aoe_targets: 7, focus_attackers: 3}
    # owner-ruled 2026-08-23: "clap requires extreme damage and movement" —
    # healers 2-3 at 20; the 10-man clap forge kept three hammers, ruled one
    # too many (engage tank + one, then damage/movement bodies). 15-19 rows
    # are PROVISIONAL interpolation. ranged_aoe_core 7 at 20 owner-ruled
    # 2026-08-26 (increment-3 round: the melee-heavy clap forge defect;
    # "range large aoe damage dealers instead of melee") — the 15-19 value
    # is the scaled interpolation (7 * 15/20, half-up).
    constraint_overrides:
      - {min_size: 10, max_size: 14, frontline: {min: 2, max: 2}}
      - {min_size: 15, max_size: 19, healer: {min: 2, max: 3}, frontline: {min: 3, max: 4}, ranged_aoe_core: {min: 5}}
      - {min_size: 20, max_size: 29, healer: {min: 2, max: 3}, frontline: {min: 3, max: 5}, ranged_aoe_core: {min: 7}}
    # owner's clap sequence: engage -> clump -> pierce -> burst -> secure -> reset
    chain:
      - {name: Engage, caps: [engage, stun]}
      - {name: Clump, caps: [clump_create, catch]}
      - {name: Pierce, caps: [resist_shred]}
      - {name: Burst, caps: [burst_aoe]}
      - {name: Secure, caps: [heal_reduction, silence, execute]}
      - {name: Reset, caps: [disengage, mobility]}

  kite:
    name: Kite
    blurb: never take the fight — range, tempo and chip damage
    multipliers:
      mobility: 1.6
      disengage: 1.5
      ranged_presence: 1.8
      catch: 1.45
      sustained_dps: 1.3
      heal_reduction: 1.2
      burst_st: 1.15
      zone_control: 1.1
      stun: 0.9
      burst_aoe: 0.85
      engage: 0.7
      tankiness: 0.7
      clump_create: 0.7
    # ranged poke on the advancing clump; focus fire only on caught divers
    mechanics: {expected_aoe_targets: 4, focus_attackers: 4}
    # owner-ruled 2026-08-23: kite runs 1 healer at 7 and 2 at 20 ("mostly
    # kiting so don't need as many healers usually and would rather get
    # teammates that facilitate movement like occult staff or bedrock for
    # safety"). Frontline tightenings + 10-19 healer rows are PROVISIONAL
    # interpolation in the same spirit.
    constraint_overrides:
      - {min_size: 5,  max_size: 9,  healer: {min: 1, max: 1}}
      - {min_size: 10, max_size: 14, healer: {min: 1, max: 2}, frontline: {min: 1, max: 3}}
      - {min_size: 15, max_size: 19, healer: {min: 2, max: 2}, frontline: {min: 2, max: 4}}
      - {min_size: 20, max_size: 29, healer: {min: 2, max: 2}, frontline: {min: 2, max: 5}}
    # owner's kite sequence: space -> slow -> peel -> ranged pressure -> reset
    chain:
      - {name: Space, caps: [mobility, disengage]}
      - {name: Slow, caps: [slow, root]}
      - {name: Peel, caps: [peel, anti_dive]}
      - {name: Ranged pressure, caps: [sustained_dps, burst_st, ranged_presence]}
      - {name: Reset, caps: [heal_sustain, cleanse]}

  brawl_clap:
    name: Brawl-Clap
    blurb: grind until they clump, then bomb — the hybrid
    multipliers:
      clump_create: 1.4
      burst_aoe: 1.35
      ranged_presence: 1.1
      tankiness: 1.2
      engage: 1.2
      heal_sustain: 1.15
      sustained_dps: 1.1
      catch: 0.85
      mobility: 0.85
    # the hybrid: grind spreads damage until the clump forms, then bomb it
    mechanics: {expected_aoe_targets: 5, focus_attackers: 3}
    chain:
      - {name: Contact, caps: [engage, tankiness]}
      - {name: Grind, caps: [sustained_dps, heal_sustain]}
      - {name: Clump, caps: [clump_create]}
      - {name: Bomb, caps: [burst_aoe, resist_shred]}
      - {name: Secure, caps: [heal_reduction, execute]}

  clap_kite:
    name: Clap-Kite
    blurb: bomb from range, reset on cooldowns — kite between windows
    # Owner-identified playstyle (2026-08-23, blind-label rounds): the
    # ranged twin of brawl-clap. Both real 20-man comps the owner labeled
    # (Deadlyhooker P1, albioncompo 20v20) "have both clap potential and
    # kite potential" — bomb pieces AND the mobility to reset between
    # windows. Multipliers are a PROVISIONAL clap/kite blend (weights not
    # expert-adjudicated, same header rule as every style here).
    multipliers:
      burst_aoe: 1.45
      clump_create: 1.35
      ranged_presence: 1.6
      mobility: 1.3
      disengage: 1.3
      catch: 1.2
      silence: 1.15
      purge: 1.1
      burst_st: 1.05
      engage: 0.95
      heal_sustain: 0.95
      sustained_dps: 0.85
      tankiness: 0.8
    # bombs on manufactured clumps between kite resets: escalation rides
    # toward the cap in the windows; focus fire stays incidental
    mechanics: {expected_aoe_targets: 6, focus_attackers: 3}
    # owner-ruled 2026-08-24 (round 5): "clap kite at 20 doesn't need 5
    # healers, maybe 3 or 4 max". ranged_aoe_core 7 at 20 owner-ruled
    # 2026-08-26 (the melee-heavy clap_kite forge was the increment-3
    # motivating defect); 15-19 is the scaled interpolation.
    constraint_overrides:
      - {min_size: 15, max_size: 19, ranged_aoe_core: {min: 5}}
      - {min_size: 20, max_size: 29, healer: {min: 3, max: 4}, ranged_aoe_core: {min: 7}}
    chain:
      - {name: Kite window, caps: [mobility, disengage]}
      - {name: Catch, caps: [catch, slow]}
      - {name: Clump, caps: [clump_create, engage]}
      - {name: Pierce, caps: [resist_shred]}
      - {name: Bomb, caps: [burst_aoe]}
      - {name: Reset, caps: [disengage, heal_sustain]}
