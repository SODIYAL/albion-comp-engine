# Playstyles — caller-intent overlays on top of a content template.
#
# The weight MULTIPLIERS remain unvalidated; `mechanics` (Q14) and
# `constraint_overrides` are validated rules. Every multiplier scales a
# capability's
# WEIGHT in the chosen content template; hard floors are untouched (a kite
# comp still needs its healers; floor penalties use the BASE weight).
# Targets and soft caps are NOT untouched any more: `target_mults` below
# scale them, and at 10+ a DECLARED style reads the GENERATED per-style
# rows in templates/style_bands.yaml after the content row (tests/VALIDATION.md
# 'Style x band rows'). A capability absent from the template's requirements is
# unaffected by its multiplier.
#
# Vocabulary from the shotcaller world: brawl (stand and grind), clap
# (stack them, one bomb), kite (never take the fight, bleed them),
# brawl-clap (grind until they clump, then bomb), clap-kite (the ranged
# twin of brawl-clap: bomb from range, throw them back — identified in the
# validation label rounds). "Balanced" is the identity — free mode, no thumb
# on the scale.
#
# `mechanics` blocks (Q14 CLOSED): how the style DELIVERS damage. The
# magnitudes are reasoned, not measured; the one validated constraint is
# the ORDERING: clap, kite, clap-kite and brawl-clap all hit more targets
# per AoE than brawl (the values below satisfy it: brawl 3 is the floor).
# Adjust by reasoning + gate evidence, keep the ordering.
#   expected_aoe_targets — enemies a typical AoE hits under this style;
#     feeds the AoE Escalation curve (mechanics.yaml) into burst_aoe supply.
#   focus_attackers — players concentrating on one called target; feeds the
#     Focus Fire / Resilience curve into burst_st + execute supply.
# The engine NORMALIZES both curves to the balanced style's parameters, so
# balanced stays the identity and template calibration is untouched; styles
# diverge by RELATIVE physics only. Weight multipliers say what a style
# VALUES; mechanics say what a style's delivery makes EFFECTIVE.
#
# `constraint_overrides` blocks (forge-quality validation round): per-style
# ROLE-BAND overrides on top of composition.yaml's constraint_bands — the
# bands were calibrated on BRAWL evidence (blap) and were style-blind, so
# every style forged toward brawl-shaped rosters (five healers in a 20-man
# is too many for clap and kite; a kite comp needs fewer healers and more
# bodies that facilitate movement). Clap uses floor(size/5) as a healer
# minimum, no cap; kite keeps its lower minima without its old exact-count
# caps. Brawl and hybrid rules remain separate. Rows follow constraint_bands
# semantics (first matching min_size/max_size row wins; a listed role key
# REPLACES the base band's entry for that role; unlisted keys keep the base
# band). Frontline tightenings come from the same round (a forged 20-brawl
# fielded 6 frontline — too many tanks, not enough damage; blap runs 5. A
# forged 10-clap kept 3 hammers where one engage tank plus movement bodies
# such as Occult or a half-tank half-damage Icicle serve better). Values at
# sizes no validation round graded are PROVISIONAL interpolations awaiting
# the next round. Hybrid rules are specified in their own sections.
# `role_min_per_players` replaces a role band after these overrides, using
# floor(size/per) from size >= per, and removes that role's maximum.
# Like every constraint, this shapes
# GENERATION only; manual rosters always score.
# No row here carries a `ranged_aoe_core` minimum: it is GENERATED per
# style x band from the harvest (composition.yaml, the note above
# constraint_bands) and a hand-set one fails the build (S7).
#
# `chain` blocks (fight-chain explanation, roadmap item 1, 2026-08-23):
# the SEQUENCE a caller thinks this style in — each stage names the
# capabilities that execute it. The engine's fight_chain() grades every
# stage against the comp-fitted template targets (the same lens the kill-
# pressure checklist uses; capabilities a content does not require are
# skipped) — DESCRIPTIVE only, nothing here scores. Stage names and cap
# groupings are PROVISIONAL caller vocabulary: reword or re-map freely,
# the engine follows the data. Balanced carries no chain — it falls back
# to the detected identity's chain.
#
# `target_mults` blocks (2026-08-28) — the per-style REQUIREMENT overlay.
# `multipliers` say what a style VALUES (weight); these say HOW MUCH OF IT it
# NEEDS (target and soft cap). The distinction: a clap comp REQUIRES more
# peel and disengage than a brawl comp — not merely that a
# clap comp values disengage more, but that it needs a larger amount before
# it is covered. Target and soft cap scale TOGETHER so the headroom band keeps
# its shape. Hard floors do NOT scale, for the same reason the weight overlay
# never touched them: a kite comp still needs its healers.
#
# EVERY STYLE SHIPS EMPTY AND THE MECHANISM IS THE IDENTITY until a value
# is validated. This is deliberate. The corpus CANNOT fit these: of the eight
# published blackzone_roam comps, brawl has 3 and kite has 2, while clap,
# brawl_clap and clap_kite have exactly ONE each — so any per-style number
# fitted today would be one comp's idiosyncrasy wearing a style's name. The
# measurement that exists is recorded in
# notes/findings/2026-08-28-fielded-supply-per-person.md; the one
# suggestive, replicated signal is disengage (brawl 0.77/person vs kite
# 1.64/person, kite n=2), which points the same way the requirement claim
# does. Per "never invent a number to fill a hole": a row appears here only
# when a validation round sets it or real comps supply the measurement. The
# harvest DOES
# supply per-style measurements now — templates/style_bands.yaml, generated
# by derive_style_bands.py, is where those rows live; nothing is hand-written
# here. The burst_aoe multiplier is GENERATED at build from the generated
# ranged_aoe_core minima (build_dataset.derive_target_mults); a hand
# burst_aoe value fails the build.

styles:
  balanced:
    name: Balanced
    blurb: no thumb on the scale — the content template as fitted
    multipliers: {}
    # balanced is the identity by definition — this must stay empty
    target_mults: {}
    mechanics: {expected_aoe_targets: 4, focus_attackers: 4}

  brawl:
    name: Brawl
    blurb: stand and grind — sustain, stall and attrition win
    multipliers:
      tankiness: 1.35
      heal_sustain: 1.3
      sustained_dps: 1.35
      heal_reduction: 1.25
      # a melee ball is a legitimate brawl answer — blap fields zero ranged
      ranged_presence: 0.5
      cleanse: 1.2
      resist_shred: 1.2
      peel: 1.15
      execute: 1.1
      # 0.85 -> 0.7 (2026-08-18): consistency with this style's own rule
      # above — the ranged BOMB the ball doesn't field was still valued at
      # near-parity, so leave-one-out on a real brawl ball recommended
      # Permafrost/Damnation bombs over the tanks and healers the caller
      # actually runs. Direction was always "less AoE"; magnitude is the
      # PROVISIONAL part (header) and is deepened to match ranged_presence.
      burst_aoe: 0.7
      clump_create: 0.8
      disengage: 0.85
      catch: 0.8
      mobility: 0.75
    # target_mults: UNSET. Identity until a validation round sets values
    # — see the header note on why the corpus cannot fit them (this style
    # has 3 published comps).
    target_mults: {}
    # spread melee ball: cleaves clip ~3, damage split across whoever's in
    # reach, so few attackers stack on any one enemy
    mechanics: {expected_aoe_targets: 3, focus_attackers: 3}
    # One healer per five members, rounded down, as a MINIMUM with no
    # maximum — 4 at 20-24, 5 at 25-29 (the clap rule extended to brawl and
    # the hybrids; F16). Harvest check: 77% of full 20-man brawl killer
    # parties field exactly 4 healers (n=22). Supersedes the old 3-4 band's
    # cap.
    role_min_per_players: {healer: 5}
    # At 20, brawl runs ~5 frontline (blap's count; the style-blind band
    # let 6 through — too many tanks); the healer entry below is replaced
    # by role_min_per_players above.
    constraint_overrides:
      - {min_size: 20, max_size: 29, healer: {min: 3, max: 4}, frontline: {min: 4, max: 5}}
    # brawl sequence: contact -> pressure -> sustain -> denial -> secure
    chain:
      - {name: Contact, caps: [engage, tankiness]}
      - {name: Pressure, caps: [sustained_dps, resist_shred]}
      - {name: Sustain, caps: [heal_sustain, cleanse, self_sustain]}
      - {name: Denial, caps: [heal_reduction, purge, peel]}
      - {name: Secure, caps: [execute, max_health_cut]}

  clap:
    name: Clap
    blurb: stack them and delete them — one engage, one bomb
    multipliers:
      clump_create: 1.7
      burst_aoe: 1.6
      # the bomb has to land from OUTSIDE the clump you just made
      ranged_presence: 1.6
      engage: 1.4
      silence: 1.3
      purge: 1.25
      stun: 1.2
      tankiness: 0.9
      heal_sustain: 0.9
      catch: 0.9
      mobility: 0.85
      heal_reduction: 0.8
      sustained_dps: 0.6
    # burst_aoe is GENERATED at build (build_dataset.derive_target_mults):
    # the ratio of clap's generated ranged_aoe_core minimum to the pooled
    # one, mean over 15-19 and 20 (the rule the hand 1.71 was derived by,
    # from the hand minima this file once carried); a hand value fails the
    # build. A clap comp fields more of the burst-AoE core than the typical
    # winner, so scoring it against the base target would hand it free
    # over-coverage. The same derivation was run for healing and tankiness
    # and REJECTED (it widened coverage spread on the published comps).
    # Where a style row states the target (10+) the row supersedes it; it
    # reads below 10, in soft-cap-only rows and in the Dragon Portal pools'
    # own rows.
    target_mults: {}
    # synced bombs on a manufactured clump: AoE rides the escalation curve
    # toward its 8-target cap; ST damage is incidental (few attackers each)
    mechanics: {expected_aoe_targets: 7, focus_attackers: 3}
    # Supersedes the old 2-3 healer cap: one healer per five people,
    # rounded DOWN, as a MINIMUM (20-24 -> 4, 25-29 -> 5; F16). Applies
    # from five members; no healer maximum is imposed.
    role_min_per_players: {healer: 5}
    # Clap fields fewer tanks and more damage and movement bodies: frontline
    # 2 at 10-14 (F16; a forged 10-man clap kept three hammers — one too
    # many; engage tank + one, then damage/movement bodies). 15-19 rows are
    # PROVISIONAL interpolation. The ranged large-AoE core a clap wants
    # (the melee-heavy clap forge defect of the increment-3 validation
    # round) is the generated ranged_aoe_core minimum of clap's winners.
    constraint_overrides:
      - {min_size: 10, max_size: 14, frontline: {min: 2, max: 2}}
      - {min_size: 15, max_size: 19, frontline: {min: 3, max: 4}}
      - {min_size: 20, max_size: 29, frontline: {min: 3, max: 5}}
    # clap sequence: engage -> clump -> pierce -> burst -> secure -> reset
    chain:
      - {name: Engage, caps: [engage, stun]}
      - {name: Clump, caps: [clump_create, catch]}
      - {name: Pierce, caps: [resist_shred]}
      - {name: Burst, caps: [burst_aoe]}
      - {name: Secure, caps: [heal_reduction, silence, execute]}
      - {name: Reset, caps: [disengage, mobility]}

  kite:
    name: Kite
    blurb: never take the fight — range, tempo and chip damage
    multipliers:
      mobility: 1.6
      disengage: 1.5
      ranged_presence: 1.8
      catch: 1.45
      sustained_dps: 1.3
      heal_reduction: 1.2
      burst_st: 1.15
      zone_control: 1.1
      stun: 0.9
      burst_aoe: 0.85
      engage: 0.7
      tankiness: 0.7
      clump_create: 0.7
    # OBSERVED (where a style row states the target, at 10+, the row
    # supersedes these).
    #   burst_aoe — GENERATED at build from the generated minima (the clap
    #     note); kite's minimum equals the pooled one at 15-19 and 20, so it
    #     reads identity.
    #   peel 1.25 — REPLICATED in two independent samples: 1.23x brawl in the
    #     published corpus, 1.27x in the author-labelled sample. Kite really
    #     does peel more, which is the half of the requirement claim the
    #     evidence supports (clap does NOT — it flips sign between samples).
    #   disengage 1.20 — direction replicated in both samples (kite above
    #     brawl in each) but the magnitude is unstable, 2.13x and 1.17x, so
    #     this takes the CONSERVATIVE end rather than the mean.
    target_mults: {peel: 1.25, disengage: 1.20}
    # ranged poke on the advancing clump; focus fire only on caught divers
    mechanics: {expected_aoe_targets: 4, focus_attackers: 4}
    # Kite may use fewer healers than clap, but it must not be forced to an
    # exact low count: the existing minima stay and the healer maxima are
    # removed so scoring can justify more (F16). Basis: kite runs 1 healer
    # at 7 and 2 at 20 (a kiting comp needs fewer healers and more
    # teammates that facilitate movement — an Occult Staff or a Bedrock for
    # safety). Frontline tightenings + 10-19 healer rows are PROVISIONAL
    # interpolation in the same spirit. The ranged-AoE core (the
    # kite-forge validation round: the melee-heavy kite forge read "split
    # identity" at 65% melee) is the generated ranged_aoe_core minimum of
    # kite's winners, below clap's because kite pressure includes
    # curse/sustained ranged damage the burst-AoE predicate does not count.
    constraint_overrides:
      - {min_size: 5,  max_size: 9,  healer: {min: 1}}
      - {min_size: 10, max_size: 14, healer: {min: 1}, frontline: {min: 1, max: 3}}
      - {min_size: 15, max_size: 19, healer: {min: 2}, frontline: {min: 2, max: 4}}
      - {min_size: 20, max_size: 29, healer: {min: 2}, frontline: {min: 2, max: 5}}
    # kite sequence: space -> slow -> peel -> ranged pressure -> reset
    chain:
      - {name: Space, caps: [mobility, disengage]}
      - {name: Slow, caps: [slow, root]}
      - {name: Peel, caps: [peel, anti_dive]}
      - {name: Ranged pressure, caps: [sustained_dps, burst_st, ranged_presence]}
      - {name: Reset, caps: [heal_sustain, cleanse]}

  brawl_clap:
    name: Brawl-Clap
    blurb: grind until they clump, then bomb — the hybrid
    multipliers:
      clump_create: 1.4
      burst_aoe: 1.35
      ranged_presence: 1.1
      tankiness: 1.2
      engage: 1.2
      heal_sustain: 1.15
      sustained_dps: 1.1
      catch: 0.85
      mobility: 0.85
    # target_mults: UNSET. Identity until a validation round sets values
    # — see the header note on why the corpus cannot fit them (this style
    # has 1 published comp).
    target_mults: {}
    # the hybrid: grind spreads damage until the clump forms, then bomb it
    mechanics: {expected_aoe_targets: 5, focus_attackers: 3}
    # The one-healer-per-five minimum applies to the hybrids too (4 at
    # 20-24, 5 at 25-29, no maximum; F16).
    role_min_per_players: {healer: 5}
    chain:
      - {name: Contact, caps: [engage, tankiness]}
      - {name: Grind, caps: [sustained_dps, heal_sustain]}
      - {name: Clump, caps: [clump_create]}
      - {name: Bomb, caps: [burst_aoe, resist_shred]}
      - {name: Secure, caps: [heal_reduction, execute]}

  clap_kite:
    name: Clap-Kite
    blurb: bomb from range, reset on cooldowns — kite between windows
    # Playstyle identified in the validation label rounds: the ranged twin
    # of brawl-clap. Both real 20-man comps labelled with it (Deadlyhooker
    # P1, albioncompo 20v20) carry both clap potential and kite potential —
    # bomb pieces AND the mobility to reset between windows. Multipliers
    # are a PROVISIONAL clap/kite blend (weights unvalidated, same header
    # rule as every style here).
    multipliers:
      burst_aoe: 1.45
      clump_create: 1.35
      ranged_presence: 1.6
      mobility: 1.3
      disengage: 1.3
      catch: 1.2
      silence: 1.15
      purge: 1.1
      burst_st: 1.05
      engage: 0.95
      heal_sustain: 0.95
      sustained_dps: 0.85
      tankiness: 0.8
    # OBSERVED (where a style row states the target, at 10+, the row
    # supersedes these).
    #   burst_aoe — GENERATED at build from the generated minima (the clap
    #     note).
    #   peel 1.25 — replicated: 1.17x brawl published, 1.29x declared.
    #     No disengage row: the two samples flip sign on it (0.84x, 1.10x).
    target_mults: {peel: 1.25}
    # bombs on manufactured clumps between kite resets: escalation rides
    # toward the cap in the windows; focus fire stays incidental
    mechanics: {expected_aoe_targets: 6, focus_attackers: 3}
    # One healer per five members as a MINIMUM, no maximum (4 at 20-24, 5
    # at 25-29), extending the clap rule to the hybrids (F16). Harvest note
    # recorded with the rule: 55% of full 20-man clap_kite killer parties
    # field 3 healers and 23% field 4 (n=64) — the minimum sits above the
    # observed mode here; curation judgment, on record.
    role_min_per_players: {healer: 5}
    # A 20-man clap-kite does not need 5 healers; 3-4 is the band
    # (validation round 5; the healer entry below is now replaced by
    # role_min_per_players). The ranged-AoE core (the melee-heavy
    # clap_kite forge was the increment-3 round's motivating defect) is
    # the generated ranged_aoe_core minimum of clap_kite's winners.
    constraint_overrides:
      - {min_size: 20, max_size: 29, healer: {min: 3, max: 4}}
    chain:
      - {name: Kite window, caps: [mobility, disengage]}
      - {name: Catch, caps: [catch, slow]}
      - {name: Clump, caps: [clump_create, engage]}
      - {name: Pierce, caps: [resist_shred]}
      - {name: Bomb, caps: [burst_aoe]}
      - {name: Reset, caps: [disengage, heal_sustain]}
