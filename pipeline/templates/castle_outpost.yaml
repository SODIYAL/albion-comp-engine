# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.864 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~14% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Castle Outpost (design doc §3.1, §3.3).
#
# Templates are DATA, not code — tunable per patch without a redeploy.
#
# Fitted and validated at party size 7 ONLY. `base_size: 7` means every
# `scales: true` target below is stated in units-for-7 and is divided by 7 and
# re-multiplied for other sizes. Sizes other than 7 are extrapolation and are
# flagged as such in the UI until Tier-2 validation covers them (VALIDATION V3).
#
# target   — units of supply wanted across the whole party (a score of 3 = 3 units)
# weight   — importance; drives both fitness and the weakness ranking
# soft_cap — supply beyond this starts costing points (over-stacking is a real
#            failure mode, not a neutral outcome)
# scales   — true: need grows with party size (healing, frontline, damage)
#            false: threshold need where one or two copies is enough regardless
#                   of size (cleanse, disengage, purge)

content: castle_outpost
name: Castle Outpost
base_size: 7
validated_sizes: [7]

requirements:
  heal_sustain:   {target: 2.6, weight: 10, soft_cap: 4.3, scales: true}
  heal_burst:     {target: 1.7, weight: 6,  soft_cap: 3.5, scales: true}
  tankiness:      {target: 3.5, weight: 9,  soft_cap: 6.0, scales: true}
  peel:           {target: 2.6, weight: 8,  soft_cap: 5.2, scales: true}
  burst_aoe:      {target: 4.3, weight: 8,  soft_cap: 7.8, scales: true}
  clump_create:   {target: 1.7, weight: 7,  soft_cap: 3.5, scales: false}
  engage:         {target: 1.7, weight: 7,  soft_cap: 4.3, scales: false}
  purge:          {target: 1.7, weight: 6,  soft_cap: 3.5, scales: false}
  # PROVISIONAL WEIGHT — needs the domain expert. anti_zone (removing enemy
  # ground areas) is enemy-dependent: worth a lot against Permafrost/Frost-heavy
  # zone comps, near-worthless otherwise, exactly like purge vs buff-less comps
  # (design doc §4.4.5). Set low and flat until the expert tunes it, so it can
  # never dominate a recommendation on an unvalidated number.
  # REWEIGHT 2026-08-18 (see blackzone_roam.yaml note): 3 -> 1 — concave
  # from-zero coverage made weight 3 a +3.0 windfall that DID dominate tail
  # recommendations, defeating this row's own rule.
  anti_zone:      {target: 0.9, weight: 1,  soft_cap: 1.7, scales: false}
  # PROVISIONAL WEIGHT — promoted 2026-08-12 with the anti_zone treatment:
  # low and flat so an unvalidated number can never dominate a recommendation.
  # Scored so far only on the defining carriers (Black Monk 2, Incubus Mace 2,
  # Spirithunter/Quarterstaff/DBS/Evensong 1); many more lines carry small
  # versions (Weakening, Frost Beam, Intimidating Presence) left at 0 pending
  # expert weighting. REWEIGHT 2026-08-18: 3 -> 1 (same rationale as anti_zone).
  damage_debuff:  {target: 0.9, weight: 1,  soft_cap: 1.7, scales: false}
  heal_reduction: {target: 0.9, weight: 6,  soft_cap: 2.6, scales: false}
  resist_shred:   {target: 1.7, weight: 5,  soft_cap: 3.5, scales: false}
  cleanse:        {target: 0.9, weight: 5,  soft_cap: 2.6, scales: false}
  disengage:      {target: 0.9, weight: 4,  soft_cap: 2.6, scales: false}
  zone_control:   {target: 2.6, weight: 4,  soft_cap: 6.0, scales: true}
  silence:        {target: 0.9, weight: 4,  soft_cap: 2.6, scales: false}
  stun:           {target: 1.7, weight: 4,  soft_cap: 4.3, scales: true}
  sustained_dps:  {target: 2.6, weight: 5,  soft_cap: 6.0, scales: true}
  mobility:       {target: 1.7, weight: 3,  soft_cap: 5.2, scales: true}

# HARD FLOORS — capabilities where near-zero supply is catastrophic, not merely
# suboptimal. Load-bearing: the first prototype run omitted these and failed 4/9
# because breadth weapons out-ranked a healer fixing the single critical gap.
#
# PROVISIONAL penalty_mult 2.0 (was 1.5) — batch-2 curation (2026-08-12)
# reproduced the same failure mode at a finer margin: with Permafrost Prism's
# curated catch 2, Heavy Mace picked up the (engage, catch) synergy bonus and
# out-ranked every healer for slot 4 of a healer-less party BY 0.014 — synergy
# and meta-prior leakage outvoted a hard-floor violation. 1.5 made the floor
# almost decisive; 2.0 makes it actually decisive. Needs expert confirmation
# (or a structural fix: floors as lexicographic gates rather than penalties).
hard_floors:
  heal_sustain: {min_party_size: 4, floor_units: 1.7, penalty_mult: 2.0}
  tankiness:    {min_party_size: 5, floor_units: 1.7, penalty_mult: 1.0}
