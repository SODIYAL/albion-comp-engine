weight_fit: {"method": "choice_fit", "source": "out/choice_weights_ancient_lands.json", "train_drops": 5780, "pull": 1000.0, "date": "2026-09-30", "population": "dominant portal killer parties of 2-7, training split", "curated": {"anti_dive": 1, "buff_allies": 2, "burst_aoe": 5, "burst_st": 7, "catch": 7, "cleanse": 5, "clump_create": 3, "damage_debuff": 1, "disengage": 6, "engage": 5, "execute": 4, "heal_burst": 5, "heal_reduction": 7, "heal_sustain": 10, "interrupt": 1, "knockback_displace": 1, "max_health_cut": 1, "mobility": 8, "peel": 8, "purge": 4, "resist_shred": 4, "root": 1, "self_sustain": 3, "silence": 5, "slow": 1, "stun": 5, "sustained_dps": 5, "tankiness": 7, "zone_control": 2}}

