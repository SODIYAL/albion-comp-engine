# Content template — Dragon Portal (the Ancient Lands).
#
# The Ancient Lands are reached through open-world portals and fought in
# matchmaking pools: solo, 2-3, 4-5, 5-7 and 15-20 players, each pool
# matched against groups of the same pool. Partial-loot instances open
# from yellow zones, full-loot instances from red and black zones; both
# are one content here, the loot type is recorded per party where the
# harvest can see it. A 1200 item-power soft cap applies. Knockdowns go
# through a bleedout state with revives before a death registers, so kill
# counts undercount fights that ended in revives.
#
# EVIDENCE STATUS: none harvested yet. `fit.stat: none` (rows borrowed
# from a sibling content, the rule the fit-provenance block documents):
# the requirement rows below are the Roads of Avalon rows, the small-scale
# template whose pools (2-7, hard cap 7) match the three small portal
# pools; at 10+ the harvest's style x size rows carry the targets as they
# do for every content. The engine reports every row as `content_min`
# (a thin row, never read as what winners field) and the page shows the
# borrowed-evidence notice while this block says none. The rows are
# replaced by measured medians once the kill-feed poll (sample_parties.py
# --poll-events) has filled the pools: harvested parties tagged with this
# content's KillArea, at least 40 distinct rosters per pool.
#
# validated_sizes is EMPTY: no size has been validated, so the page flags
# every size as extrapolated until a validation round covers a pool.
# size_prompt lists the pools the page asks for before it forges.

content: ancient_lands
name: Dragon Portal
base_size: 5
validated_sizes: []
max_size: 20
size_prompt:
  question: "Which portal are you building for?"
  sizes: [3, 5, 7, 20]
  labels: {3: "small portal, 2-3", 5: "small portal, 4-5", 7: "medium portal, 5-7", 20: "large portal, 15-20"}
fit: {comps: 0, stat: none, source: borrowed, borrowed_from: roads}
# Small-scale kill pressure keeps full single-target value at every size
# (the roads rule: composition.yaml st_value_mult would tax it at 6-7).
st_full_value: true

requirements:
  heal_sustain:   {target: 2.65, weight: 10, soft_cap: 5.5, scales: true}
  heal_burst:     {target: 1.3, weight: 5,  soft_cap: 4.61, scales: true}
  tankiness:      {target: 10.08, weight: 7,  soft_cap: 33.07, scales: true}
  peel:           {target: 2.6, weight: 8,  soft_cap: 7.69, scales: true}
  burst_st:       {target: 3.4, weight: 7,  soft_cap: 16.73, scales: true}
  sustained_dps:  {target: 6.73, weight: 5,  soft_cap: 24.09, scales: true}
  burst_aoe:      {target: 3.4, weight: 5,  soft_cap: 13.1, scales: true}
  mobility:       {target: 3.4, weight: 8,  soft_cap: 13.44, scales: true}
  catch:          {target: 2.6, weight: 7,  soft_cap: 5.28, scales: true}
  stun:           {target: 3.59, weight: 5,  soft_cap: 5.93, scales: true}
  self_sustain:   {target: 1.7, weight: 3,  soft_cap: 4.3, scales: true}
  engage:         {target: 1.7, weight: 5,  soft_cap: 5.61, scales: false}
  disengage:      {target: 1.7, weight: 6,  soft_cap: 12.75, scales: false}
  heal_reduction: {target: 1.7, weight: 7,  soft_cap: 33.86, scales: false}
  silence:        {target: 0.9, weight: 5,  soft_cap: 12.44, scales: false}
  cleanse:        {target: 2.7, weight: 5,  soft_cap: 3.9, scales: false}
  purge:          {target: 0.9, weight: 4,  soft_cap: 6.93, scales: false}
  execute:        {target: 1.7, weight: 4,  soft_cap: 3.4, scales: false, optional: true}
  resist_shred:   {target: 1.76, weight: 4,  soft_cap: 3.09, scales: false}
  clump_create:   {target: 0.93, weight: 3,  soft_cap: 3.56, scales: false}
  zone_control:   {target: 1.3, weight: 2,  soft_cap: 11.33, scales: true}
  buff_allies:    {target: 4.17, weight: 2,  soft_cap: 17.34, scales: false}
  damage_debuff:  {target: 1.35, weight: 1,  soft_cap: 6.57, scales: false}
  slow:               {target: 3.6, weight: 1, soft_cap: 14.88, scales: true}
  root:               {target: 6.97, weight: 1, soft_cap: 43.65, scales: true}
  knockback_displace: {target: 2.22, weight: 1, soft_cap: 17.21,  scales: true}
  anti_dive:          {target: 7.71, weight: 1, soft_cap: 30.42, scales: false}
  interrupt:          {target: 0.9, weight: 1, soft_cap: 3.29,  scales: false}
  max_health_cut:     {target: 0.9, weight: 1, soft_cap: 2.33,  scales: false}

# Floors arm by size, as on roads: a trio without a healer is a gap to
# know about, a 6-7 without one is broken.
hard_floors:
  heal_sustain: {min_party_size: 5, floor_units: 1.7, penalty_mult: 2.0}
  tankiness:    {min_party_size: 6, floor_units: 1.7, penalty_mult: 1.0}
