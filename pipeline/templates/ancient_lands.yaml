  burst_st:           {min: 0, target: 1.45, weight: 5.8, soft_cap: 6.3, scales: true}
  sustained_dps:      {min: 17.55, target: 22.55, weight: 6.5, soft_cap: 31.85, scales: true}
  burst_aoe:          {min: 2.5, target: 6.4, weight: 6.4, soft_cap: 11.04, scales: true}
  mobility:           {min: 6, target: 9, weight: 7.4, soft_cap: 13.8, scales: true}
  catch:              {min: 1, target: 3, weight: 5.9, soft_cap: 7.19, scales: true}
  stun:               {min: 0, target: 2.1, weight: 4.4, soft_cap: 10.56, scales: true}
  self_sustain:       {min: 1, target: 3, weight: 2.9, soft_cap: 6.47, scales: true}
  engage:             {min: 2, target: 4, weight: 3.7, soft_cap: 6.9, scales: false}
  disengage:          {min: 2.5, target: 4.5, weight: 3.9, soft_cap: 9.77, scales: false}
