  root:               {min: 1, target: 3.38, weight: 1.9, soft_cap: 9.73, scales: true}
  knockback_displace: {min: 0, target: 1.81, weight: 0.2, soft_cap: 5.75, scales: true}
  anti_dive:          {min: 0, target: 1, weight: 1.1, soft_cap: 3.45, scales: false}
  interrupt:          {min: 0, target: 1, weight: 1.2, soft_cap: 2.3, ramp: {none_until: 7, full_at: 10}, scales: false}
