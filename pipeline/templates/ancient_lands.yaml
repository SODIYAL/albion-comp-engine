  silence:            {min: 0.9, target: 0.9, weight: 5.3, soft_cap: 12.44, ramp: {none_until: 7, full_at: 10}, scales: false}
  cleanse:            {min: 2.7, target: 2.7, weight: 5.3, soft_cap: 3.9, ramp: {none_until: 7, full_at: 10}, scales: false}
