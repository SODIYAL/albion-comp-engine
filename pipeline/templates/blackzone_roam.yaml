# ---------------------------------------------------------------------------
# COMP-FITTED RECALIBRATION 2026-08-21 (owner directive: real comps set the
# numbers). Targets/soft caps below marked (comp-fit) were re-fitted from the
# TWO independent real blackzone brawl comps measured in CURRENT engine units
# (geometric AoE included): Timothy's blap (20) + Bist's "Roam 15" (15,
# albioncompo - independent of the original calibration). Rule: target = 0.9x
# the least any good comp fields, soft = 1.15x the most; rows where the two
# comps disagree (burst_aoe, clump_create, heal_reduction, tankiness) were
# left untouched, and ranged_presence was deliberately NOT lowered - both
# evidence comps are brawl balls and that row is the style carrier (needs
# kite-comp evidence before its balanced target moves). This resolves the
# 2026-08-21 audit's F1 (geometric units), F4 (bundled-supply softs) and F6
# (heal caps below real healer counts) for this template.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.837 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~16% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Blackzone Roaming (20-man open-world brawl).
#
# PROVISIONAL — created 2026-08-12, weights NOT yet expert-adjudicated.
# Role-ratio calibration comes from the first real comp for this content:
# Timothy's "blap" (data/published_comps/, 1×20 — 5 tank, 4 support, 7 dps
# incl. dedicated heal-cut / hp-cut / pierce / purge slots, 4 healers).
# CIRCULARITY NOTE (VALIDATION V4): because this template's role ratios were
# calibrated against blap, a V4 leave-one-out run on blap itself is weakened
# evidence. It still tests weapon-level ranking (the calibration used role
# counts, not weapon identities), but the clean test needs an independent
# blackzone comp from a different caller.
#
# Identity vs castle_outpost: roaming means you CHOOSE fights — catch,
# mobility, engage and disengage all matter more; zone_control and anti_zone
# matter less (open field, no fixed point to hold). Cleanse target is low
# because in practice cleanse comes from helms (gear), not weapons — blap
# runs three "Leather Hood(cleanse)" slots and zero cleanse weapons.
#
# Sanity check on the scale: castle_outpost wants heal_sustain 3.0 at size 7
# (0.43/head); blap fields 4 healers ≈ 9–10 supply units at size 20
# (0.45–0.5/head). The per-head need is stable across content; the targets
# below are stated in units-for-20 (base_size: 20).

content: blackzone_roam
name: Blackzone Roam
base_size: 20
validated_sizes: [20]

requirements:
  heal_sustain:   {target: 7.5,  weight: 10, soft_cap: 13.8, scales: true}  # (comp-fit 2026-08-21)
  heal_burst:     {target: 8.1,  weight: 6,  soft_cap: 10.7,  scales: true}  # (comp-fit 2026-08-21)
  tankiness:      {target: 9.2, weight: 9,  soft_cap: 13.4, scales: true}
  peel:           {target: 40.3,  weight: 8,  soft_cap: 58.9, scales: true}  # (comp-fit 2026-08-21)
  engage:         {target: 11.7,  weight: 8,  soft_cap: 23.0, scales: true}  # (comp-fit 2026-08-21)
  catch:          {target: 12.2,  weight: 7,  soft_cap: 23.2,  scales: true}  # (comp-fit 2026-08-21)
  mobility:       {target: 19.8,  weight: 6,  soft_cap: 30.7, scales: true}  # (comp-fit 2026-08-21)
  burst_aoe:      {target: 10.0, weight: 8,  soft_cap: 16.7, scales: true}
  sustained_dps:  {target: 14.4,  weight: 5,  soft_cap: 19.9, scales: true}  # (comp-fit 2026-08-21)
  # Resilience (focus-fire damage reduction) overpower damage piled on one
  # player, so a dedicated single-target slot buys little (expert ruling
  # 2026-08-14, "single-target dive isn't needed past ~5 players"). Kept a
  # token weight (kill-secure still happens) — not zeroed like castle_outpost.
  burst_st:       {target: 1.7,  weight: 1,  soft_cap: 3.3,  scales: true}  # NOT comp-fit: blap's 7.0 is incidental melee cleave; golden T15's expert scale ruling outranks the fitting rule
  stun:           {target: 4.2,  weight: 4,  soft_cap: 36.2, scales: true}  # (comp-fit 2026-08-21)
  zone_control:   {target: 9.0,  weight: 3,  soft_cap: 13.8,  scales: true}  # (comp-fit 2026-08-21)
  # Since 2026-08-19 derived per spell bundle from the curated burst_aoe
  # claim + the spell's own delivery/cast range with cited overrides
  # (build_dataset.derive_ranged_presence, audit in
  # out/ranged_presence_report.json). Added because the model could not
  # tell a ranged bomb
  # core from a melee ball: both supplied burst_aoe identically, so a "clap"
  # request returned 10 frontline bodies and one real ranged bomb.
  # Target is deliberately MODEST and the weight LOW at content level: the
  # calibration comp (blap) fields ZERO ranged weapons and is a perfectly
  # good blackzone comp, so range is a STYLE demand (clap/kite want it, a
  # brawl melee ball legitimately does not), not a content floor. The style
  # multipliers in styles.yaml carry the real signal.
  ranged_presence: {target: 5.0, weight: 4,  soft_cap: 10.0, scales: true}
  # threshold needs — one or two dedicated slots regardless of size
  clump_create:   {target: 2.5,  weight: 7,  soft_cap: 4.2,  scales: false}
  purge:          {target: 4.5,  weight: 6,  soft_cap: 6.9,  scales: false}  # (comp-fit 2026-08-21)
  heal_reduction: {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  resist_shred:   {target: 5.0,  weight: 5,  soft_cap: 12.6,  scales: false}  # (comp-fit 2026-08-21)
  disengage:      {target: 6.3,  weight: 5,  soft_cap: 9.2,  scales: false}  # (comp-fit 2026-08-21)
  execute:        {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}  # NOT comp-fit: same T15 guard as burst_st
  buff_allies:    {target: 2.5,  weight: 4,  soft_cap: 5.0,  scales: false}
  cleanse:        {target: 0.8,  weight: 4,  soft_cap: 4.6,  scales: false}  # (comp-fit 2026-08-21)
  silence:        {target: 7.1,  weight: 4,  soft_cap: 10.2,  scales: false}  # (comp-fit 2026-08-21)
  # ---------------------------------------------------------------------
  # PROMOTED 2026-08-27 (owner: "first let's add those missing items").
  # These six were curated on every weapon sheet and carried by the fight
  # chain, but NO template scored them — a weapon's AoE root earned zero.
  # Fitted from the four real blackzone comps by the standing 2026-08-21
  # convention (target = 0.9x the least any good comp fields, soft = 1.15x
  # the most), measured in the same weapon+spell-pick unit as every row
  # above. WEIGHT 1 is the documented low-and-flat start for a newly
  # promoted capability (design doc; anti_zone/damage_debuff precedent) —
  # an unvalidated number must never dominate a recommendation. Raising
  # them is an owner ruling once the effect on real picks is seen.
  # slow/root/knockback scale with fight size (mechanics.yaml
  # geometric_caps); the dedicated-slot tools do not.
  slow:               {target: 8.1, weight: 1, soft_cap: 23.5, scales: true}
  root:               {target: 5.5, weight: 1, soft_cap: 20.6, scales: true}
  knockback_displace: {target: 4.2, weight: 1, soft_cap: 11.2, scales: true}
  anti_dive:          {target: 1.2, weight: 1, soft_cap: 9.2,  scales: false}
  interrupt:          {target: 0.9, weight: 1, soft_cap: 2.3,  scales: false}
  max_health_cut:     {target: 0.9, weight: 1, soft_cap: 3.4,  scales: false}
  # capabilities must never dominate a recommendation on unvalidated numbers.
  # REWEIGHT 2026-08-18: still PROVISIONAL and deliberately "low and flat so
  # an unvalidated number can never dominate a recommendation" — but concave
  # from-zero coverage hands the FULL weight to a sole supplier, so weight 3
  # was a +3.0 windfall that made the damage_debuff carriers (Incubus Mace,
  # Black Monk, Evensong) the constant top pick for every tail slot of a
  # 20-man. Lowered to actually honor the rule; the expert pass owns finals.
  anti_zone:      {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}
  damage_debuff:  {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}

# Floors are absolute units (the engine does not scale them): at 20-man a
# comp with fewer than ~2 real healers (5 units) or ~2 real tanks (4 units)
# is catastrophically broken, not merely suboptimal. penalty_mult 2.0
# inherits the castle_outpost PROVISIONAL (raised from 1.5 when synergy +
# meta leakage out-ranked healers past the floor).
hard_floors:
  heal_sustain: {min_party_size: 10, floor_units: 4.2, penalty_mult: 2.0}
  tankiness:    {min_party_size: 10, floor_units: 3.3, penalty_mult: 1.0}
