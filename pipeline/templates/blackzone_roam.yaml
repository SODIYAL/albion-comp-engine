# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.837 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~16% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Blackzone Roaming (20-man open-world brawl).
#
# PROVISIONAL — created 2026-08-12, weights NOT yet expert-adjudicated.
# Role-ratio calibration comes from the first real comp for this content:
# Timothy's "blap" (tests/meta_comps.yaml, 1×20 — 5 tank, 4 support, 7 dps
# incl. dedicated heal-cut / hp-cut / pierce / purge slots, 4 healers).
# CIRCULARITY NOTE (VALIDATION V4): because this template's role ratios were
# calibrated against blap, a V4 leave-one-out run on blap itself is weakened
# evidence. It still tests weapon-level ranking (the calibration used role
# counts, not weapon identities), but the clean test needs an independent
# blackzone comp from a different caller.
#
# Identity vs castle_outpost: roaming means you CHOOSE fights — catch,
# mobility, engage and disengage all matter more; zone_control and anti_zone
# matter less (open field, no fixed point to hold). Cleanse target is low
# because in practice cleanse comes from helms (gear), not weapons — blap
# runs three "Leather Hood(cleanse)" slots and zero cleanse weapons.
#
# Sanity check on the scale: castle_outpost wants heal_sustain 3.0 at size 7
# (0.43/head); blap fields 4 healers ≈ 9–10 supply units at size 20
# (0.45–0.5/head). The per-head need is stable across content; the targets
# below are stated in units-for-20 (base_size: 20).

content: blackzone_roam
name: Blackzone Roam
base_size: 20
validated_sizes: [20]

requirements:
  heal_sustain:   {target: 7.5,  weight: 10, soft_cap: 10.9, scales: true}
  heal_burst:     {target: 4.2,  weight: 6,  soft_cap: 6.7,  scales: true}
  tankiness:      {target: 9.2, weight: 9,  soft_cap: 13.4, scales: true}
  peel:           {target: 6.7,  weight: 8,  soft_cap: 11.7, scales: true}
  engage:         {target: 5.0,  weight: 8,  soft_cap: 8.4, scales: true}
  catch:          {target: 4.2,  weight: 7,  soft_cap: 7.5,  scales: true}
  mobility:       {target: 6.7,  weight: 6,  soft_cap: 13.4, scales: true}
  burst_aoe:      {target: 10.0, weight: 8,  soft_cap: 16.7, scales: true}
  sustained_dps:  {target: 6.7,  weight: 5,  soft_cap: 13.4, scales: true}
  # single-target damage is WEAK in 20-man group content: enemy heals +
  # Resilience (focus-fire damage reduction) overpower damage piled on one
  # player, so a dedicated single-target slot buys little (expert ruling
  # 2026-08-14, "single-target dive isn't needed past ~5 players"). Kept a
  # token weight (kill-secure still happens) — not zeroed like castle_outpost.
  burst_st:       {target: 1.7,  weight: 1,  soft_cap: 3.3,  scales: true}
  stun:           {target: 4.2,  weight: 4,  soft_cap: 8.4, scales: true}
  zone_control:   {target: 2.5,  weight: 3,  soft_cap: 6.7,  scales: true}
  # PROVISIONAL 2026-08-18. Positioning, derived from role_hint (see
  # build_dataset.inject_positioning) — "can this comp put damage on a clump
  # from outside it". Added because the model could not tell a ranged bomb
  # core from a melee ball: both supplied burst_aoe identically, so a "clap"
  # request returned 10 frontline bodies and one real ranged bomb.
  # Target is deliberately MODEST and the weight LOW at content level: the
  # calibration comp (blap) fields ZERO ranged weapons and is a perfectly
  # good blackzone comp, so range is a STYLE demand (clap/kite want it, a
  # brawl melee ball legitimately does not), not a content floor. The style
  # multipliers in styles.yaml carry the real signal.
  ranged_presence: {target: 5.0, weight: 4,  soft_cap: 10.0, scales: true}
  # threshold needs — one or two dedicated slots regardless of size
  clump_create:   {target: 2.5,  weight: 7,  soft_cap: 4.2,  scales: false}
  purge:          {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  heal_reduction: {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  resist_shred:   {target: 2.5,  weight: 5,  soft_cap: 5.0,  scales: false}
  disengage:      {target: 1.7,  weight: 5,  soft_cap: 3.3,  scales: false}
  execute:        {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}  # single-target kill-secure; weak at scale (see burst_st)
  buff_allies:    {target: 2.5,  weight: 4,  soft_cap: 5.0,  scales: false}
  cleanse:        {target: 0.8,  weight: 4,  soft_cap: 2.5,  scales: false}
  silence:        {target: 0.8,  weight: 4,  soft_cap: 2.5,  scales: false}
  # PROVISIONAL low-and-flat (castle_outpost precedent): enemy-dependent
  # capabilities must never dominate a recommendation on unvalidated numbers.
  anti_zone:      {target: 0.8,  weight: 2,  soft_cap: 1.7,  scales: false}
  damage_debuff:  {target: 0.8,  weight: 3,  soft_cap: 1.7,  scales: false}

# Floors are absolute units (the engine does not scale them): at 20-man a
# comp with fewer than ~2 real healers (5 units) or ~2 real tanks (4 units)
# is catastrophically broken, not merely suboptimal. penalty_mult 2.0
# inherits the castle_outpost PROVISIONAL (raised from 1.5 when synergy +
# meta leakage out-ranked healers past the floor).
hard_floors:
  heal_sustain: {min_party_size: 10, floor_units: 4.2, penalty_mult: 2.0}
  tankiness:    {min_party_size: 10, floor_units: 3.3, penalty_mult: 1.0}
