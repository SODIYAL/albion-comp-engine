# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.836 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~16% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Faction Warfare, Red Zone (15-man default).
#
# PROVISIONAL — created 2026-08-13, weights NOT expert-adjudicated. Faction
# fights are open-world brawls around outposts with respawns nearby and
# wildly variable numbers — mixed groups, lots of pugs, fights that reset
# and re-engage repeatedly. Deliberate shifts vs blackzone_roam: dying is
# cheaper (respawn close, no gear-fear discipline) so raw tankiness is
# weighted a touch lower and sustained skirmish output a touch higher;
# re-engage cycles reward catch/mobility like roam does; outpost capture
# points give zone_control real weight, unlike open-field roam. Party size
# is whatever the faction musters — 6 or 30 both happen; base is 15.

content: faction_war
name: Faction War (Red Zone)
base_size: 15
validated_sizes: [15]

requirements:
  heal_sustain:   {target: 5.51,  weight: 10, soft_cap: 10.74, scales: true}
  heal_burst:     {target: 3.3,  weight: 6,  soft_cap: 8.87,  scales: true}
  tankiness:      {target: 24.41,  weight: 8,  soft_cap: 64.84, scales: true}
  peel:           {target: 5,  weight: 7,  soft_cap: 12.66, scales: true}
  engage:         {target: 3.8,  weight: 7,  soft_cap: 11.05,  scales: true}
  catch:          {target: 3.3,  weight: 7,  soft_cap: 6.11,  scales: true}
  mobility:       {target: 5,  weight: 6,  soft_cap: 19.48, scales: true}
  burst_aoe:      {target: 7.5,  weight: 8,  soft_cap: 23.72, scales: true}
  sustained_dps:  {target: 15.28,  weight: 6,  soft_cap: 43.76, scales: true}
  burst_st:       {target: 2.9,  weight: 4,  soft_cap: 13.94,  scales: true}
  stun:           {target: 6.98,  weight: 4,  soft_cap: 9.23,  scales: true}
  zone_control:   {target: 3.8,  weight: 5,  soft_cap: 25,  scales: true}
  # PROVISIONAL (2026-08-18) — ranged positioning, same rationale and
  # per-player rate as blackzone_roam (0.25/player, weight 4). Was only on
  # blackzone_roam, so this template forged melee balls for clap comps.
  ranged_presence: {target: 3.8,  weight: 4,  soft_cap: 7.5,  scales: true}
  # threshold needs
  clump_create:   {target: 1.75,  weight: 6,  soft_cap: 4.52,  scales: false}
  purge:          {target: 0.8,  weight: 5,  soft_cap: 6.67,  scales: false}
  heal_reduction: {target: 1.7,  weight: 6,  soft_cap: 32.86,  scales: false}
  resist_shred:   {target: 2.29,  weight: 4,  soft_cap: 3.92,  scales: false}
  cleanse:        {target: 2.4,  weight: 4,  soft_cap: 3.75,  scales: false}
  silence:        {target: 0.8,  weight: 3,  soft_cap: 11.96,  scales: false}
  buff_allies:    {target: 7.87,  weight: 3,  soft_cap: 28.01,  scales: false}
  disengage:      {target: 1.7,  weight: 4,  soft_cap: 12.38,  scales: false}
  # OPTIONAL (owner 2026-08-28): five single-target melee weapons carry it;
  #   9 of 10 published comps field none. Keep the target, do not require it.
  execute:        {target: 0.8,  weight: 3,  soft_cap: 2.5,  scales: false, optional: true}
  # REWEIGHT 2026-08-18 (see blackzone_roam.yaml note): from-zero windfall of
  # these provisional niche weights dominated tail recommendations.
  # OPTIONAL (owner 2026-08-28): supplied by ONE weapon in the catalogue
  #   (Exalted Staff, the crystal holy staff) and fielded mainly by 30+ ZvZ
  #   groups. Real target, but a comp without it is not missing anything.
  anti_zone:      {target: 1.8,  weight: 1,  soft_cap: 2.3,  scales: false, optional: true}
  damage_debuff:  {target: 1.2,  weight: 1,  soft_cap: 6.57,  scales: false}

# Floors slightly lower than blackzone_roam: respawns nearby make a
# healer-less pug survivable-ish, but it is still the biggest single
# mistake a faction group makes — the floor stays, tuned softer.
hard_floors:
  heal_sustain: {min_party_size: 8, floor_units: 3.3, penalty_mult: 1.75}
  tankiness:    {min_party_size: 8, floor_units: 2.5, penalty_mult: 1.0}
