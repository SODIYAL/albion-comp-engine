# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.836 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~16% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Castle Fight (25-man default, the big-blob objective).
#
# PROVISIONAL — created 2026-08-13, weights NOT expert-adjudicated. Castles
# are the largest fixed-objective fights: chokes at the gates, a capture
# point inside, multiple parties per side. Calibration leans on the same
# evidence as territory_defense (Deadlyhooker's comp is explicitly "for
# castles, terry, massive alliance roam") with two deliberate shifts:
# even more clump punishment (gate chokes force stacking harder than an
# open terry point) and a bigger silence/stun weight (Camlann-class point
# control). Party size is whatever your alliance fields — the base is 25
# but nothing blocks 15 or 40 (per-head targets scale; floors are absolute).

content: castle
name: Castle Fight
base_size: 25
validated_sizes: [25]

requirements:
  heal_sustain:   {target: 8.4, weight: 10, soft_cap: 12.5, scales: true}
  heal_burst:     {target: 5.0,  weight: 6,  soft_cap: 8.4, scales: true}
  tankiness:      {target: 12.5, weight: 9,  soft_cap: 17.6, scales: true}
  peel:           {target: 9.2, weight: 8,  soft_cap: 14.2, scales: true}
  burst_aoe:      {target: 14.2, weight: 9,  soft_cap: 20.9, scales: true}
  zone_control:   {target: 8.4, weight: 6,  soft_cap: 14.2, scales: true}
  engage:         {target: 5.0,  weight: 7,  soft_cap: 9.2, scales: true}
  stun:           {target: 5.9,  weight: 5,  soft_cap: 10.9, scales: true}
  sustained_dps:  {target: 7.5,  weight: 4,  soft_cap: 14.2, scales: true}
  catch:          {target: 2.5,  weight: 3,  soft_cap: 5.9,  scales: true}
  mobility:       {target: 5.0,  weight: 3,  soft_cap: 12.5, scales: true}
  burst_st:       {target: 2.5,  weight: 3,  soft_cap: 5.9,  scales: true}
  # PROVISIONAL (2026-08-18) — ranged positioning, same rationale and
  # per-player rate as blackzone_roam (0.25/player, weight 4): the bomb has
  # to land on the gate choke from OUTSIDE it. Was only on blackzone_roam,
  # so every other large template forged melee balls for clap comps.
  ranged_presence: {target: 6.3, weight: 4,  soft_cap: 12.5, scales: true}
  # threshold needs
  clump_create:   {target: 3.3,  weight: 8,  soft_cap: 5.0,  scales: false}
  purge:          {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  heal_reduction: {target: 1.7,  weight: 6,  soft_cap: 3.3,  scales: false}
  resist_shred:   {target: 2.5,  weight: 5,  soft_cap: 5.0,  scales: false}
  cleanse:        {target: 1.7,  weight: 5,  soft_cap: 3.3,  scales: false}
  silence:        {target: 2.5,  weight: 5,  soft_cap: 4.2,  scales: false}
  buff_allies:    {target: 2.5,  weight: 4,  soft_cap: 5.0,  scales: false}
  disengage:      {target: 0.8,  weight: 3,  soft_cap: 2.5,  scales: false}
  # OPTIONAL (owner 2026-08-28): five single-target melee weapons carry it;
  #   9 of 10 published comps field none. Keep the target, do not require it.
  execute:        {target: 0.8,  weight: 3,  soft_cap: 2.5,  scales: false, optional: true}
  # REWEIGHT 2026-08-18 (see blackzone_roam.yaml note): from-zero windfall of
  # these provisional niche weights dominated tail recommendations. anti_zone
  # kept ABOVE the other contents (2, not 1): the standing Exalted slot in
  # all Deadlyhooker parties is castle/territory evidence.
  # OPTIONAL (owner 2026-08-28): supplied by ONE weapon in the catalogue
  #   (Exalted Staff, the crystal holy staff) and fielded mainly by 30+ ZvZ
  #   groups. Real target, but a comp without it is not missing anything.
  anti_zone:      {target: 0.8,  weight: 2,  soft_cap: 1.7,  scales: false, optional: true}
  damage_debuff:  {target: 0.8,  weight: 1,  soft_cap: 1.7,  scales: false}

hard_floors:
  heal_sustain: {min_party_size: 10, floor_units: 4.2, penalty_mult: 2.0}
  tankiness:    {min_party_size: 10, floor_units: 3.3, penalty_mult: 1.0}
