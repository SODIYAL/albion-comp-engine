# Global combat mechanics — data, not code.
#
# Source: Albion Online wiki ("Focus Fire", "AoE Escalation" pages), recorded
# 2026-08-13; tables reflect the Realm Divided update (30.000.1, 2025-11-24).
#
# STATUS: NOT yet consumed by build_dataset.py or the engine. Wiring is
# blocked on the open design questions in MECHANICS_TODO.md (supply-units to
# attackers mapping, enemy clumping model, double-counting audit vs gamma /
# soft caps / synergies). Numbers land here first so there is exactly ONE
# place to correct them after a patch — same rule as the capability sheets.

# ---------------------------------------------------------------------------
# Focus Fire (aka Resilience): percentage damage reduction applied to a
# player being attacked by multiple enemy players. Diminishing returns on
# stacked single-target damage.
focus_fire:
  lookback_seconds: 10      # window used to count attackers on the target
  buff_duration_seconds: 5
  # Damage reduction by number of attackers. Melee and ranged currently share
  # the same unmounted values (kept as one table until they diverge again).
  damage_reduction_unmounted:
    1: 0.000
    2: 0.143
    3: 0.259
    4: 0.353
    5: 0.420
    6: 0.466
    7: 0.500
    8: 0.524
    9: 0.546
    10: 0.566
    11: 0.585
    12: 0.602
    13: 0.618
    14: 0.633
    15: 0.646
    16: 0.659
    17: 0.671
    18: 0.682
    19: 0.692
    20: 0.702
    21: 0.711
    22: 0.720
    23: 0.728
    24: 0.736
    25: 0.743
    26: 0.750   # cap — flat 75% for 26+ attackers
  damage_reduction_mounted:
    1: 0.000
    2: 0.143
    3: 0.259
    4: 0.353
    5: 0.430
    6: 0.494
    7: 0.547
    8: 0.592
    9: 0.630
    10: 0.662
    11: 0.690
    12: 0.713
    13: 0.734
    14: 0.752
    15: 0.768
    16: 0.782
    17: 0.795
    18: 0.800   # cap — flat 80% for 18+ attackers
  caps:
    unmounted: {attackers: 26, value: 0.750}   # was 0.80 @ 25+ pre-Realm-Divided
    mounted:   {attackers: 18, value: 0.800}
  # Resilience Penetration: per-weapon/ability stat letting an attacker ignore
  # a % of this reduction (melee-heavy; cut across the board in Realm
  # Divided). Per-weapon values NOT yet recorded — MECHANICS_TODO.md Q7.
  resilience_penetration: null

# ---------------------------------------------------------------------------
# AoE Escalation: AoE damage spells (designed to hit 3+ players) deal bonus
# damage per player hit. AoE root/stun/silence spells get increased CC
# duration instead ("CC Escalation").
aoe_escalation:
  starts_at_targets: 2
  bonus_per_extra_target: 0.08   # bonus = 0.08 * (targets_hit - 1)
  cap_targets: 8
  max_bonus: 0.56                # flat 56% for 8+ targets hit
  damage_bonus_by_targets:
    1: 0.00
    2: 0.08
    3: 0.16
    4: 0.24
    5: 0.32
    6: 0.40
    7: 0.48
    8: 0.56    # cap — 9+ targets stays 56%
  # Applied after all other buffs; NOT reduced by the ~150% damage soft cap.
  applied_after_buffs: true
  bypasses_damage_soft_cap: true
  # Escalation is per-ability ELIGIBILITY, global MAGNITUDE: which spells
  # escalate is a per-spell flag (Wild Blood 23.000.1 fixed/improved ~40
  # damage + 9 CC spells); the curve above is the same for all of them.
  # Eligibility extraction from ao-bin-dumps: MECHANICS_TODO.md Q9.
  # CC escalation duration curve values: NOT yet recorded — Q8.
  cc_escalation_duration_curve: null

# ---------------------------------------------------------------------------
# CC diminishing returns (PvP interaction layer, 2026-08-19): repeated
# crowd control on one target within a window is reduced in duration.
# PLACEHOLDER — the curve, window and which CC classes share a DR bucket are
# NOT recorded from a citable source yet; numbers land here first when they
# are, same rule as resilience_penetration above. The interaction records
# (pipeline/interactions.yaml) can already mark per-spell DR facts when
# verified; nothing is invented meanwhile.
cc_diminishing_returns: null

# Healing-modifier rules (PvP interaction layer, 2026-08-19): global
# penalties/modifiers on healing (e.g. reduced healing received under
# repeated sources, "healing sickness"-type debuffs where they exist).
# PLACEHOLDER — no citable table recorded; per-spell healing-received
# reductions (Dawnsong's Flaming Phoenix -40%) live in the interaction
# records with their sources instead.
healing_modifiers: null

# ---------------------------------------------------------------------------
# Disarray (zerg debuff): reduces DAMAGE OUTPUT and CC DURATION when attacking
# targets with a LOWER Disarray level; no effect vs same-or-higher level.
# Debuff % = (attacker's level − target's level), i.e. 1% per level of
# difference. RELATIVE mechanic: in a mirror fight (equal sizes) it is a
# no-op — it prices OUTNUMBERING, not composition (MECHANICS_TODO.md Q11).
# Wiki, recorded 2026-08-13.
disarray:
  debuff_pct_per_level_difference: 0.01
  affects: [damage_vs_players, cc_duration_vs_players]
  max_level: 99          # extended from 67 in Radiant Wilds (31.000.1, 2026-04)
  # Disarray level by group size. SOURCE VERSION 22.090.1 — the wiki table
  # predates Radiant Wilds' extension to 99 levels; re-verify against current
  # dumps/forum before wiring (MECHANICS_TODO.md Q12). Key: level, value:
  # minimum group size that reaches it. Level 0 for groups of 20 or fewer.
