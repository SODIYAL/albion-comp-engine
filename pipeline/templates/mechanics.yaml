  # Radiant Wilds (31.000.1): battle mounts add fixed Disarray points to the
  # group; only the excess above 15 total is added to the alliance's Disarray.
  # Recorded for completeness — the engine rosters WEAPONS only; mounts are
  # out of scope until mount slots exist.
  battle_mount_points:
    threshold_before_effect: 15
    values:
      ancient_ent: 2
      battle_eagle: 4
      battle_rhino: 2
      behemoth: 4
      colossus_beetle: 5
      command_mammoth: 5
      flame_basilisk: 5
      goliath_horseeater: 3
      juggernaut: 4
      phalanx_beetle: 2
      roving_bastion: 5
      siege_ballista: 2
      tower_chariot: 5
      venom_basilisk: 5
  # Homesick (Rogue Frontier 28.000.1): +20 percentage points on the Disarray
  # debuff (level 1: 1% → 21%) when entering Outlands from a Portal Town with
  # home set in an Outlands Hideout / Smuggler's Den, groups of 21+. Player-
  # state debuff, not a comp property — out of scope for scoring.
  homesick_extra_debuff: 0.20
  # Abyssal Depths P4 (29.040.1): forced dismount grants NO cleanse/CC
  # immunity while Disarray is active (solo/small groups keep it). Relevant
  # to `catch` value at 21+ sizes: dismount-bombing a blob is more lethal.
  forced_dismount_immunity_removed_with_disarray: true
