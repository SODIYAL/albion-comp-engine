# Global combat mechanics — data, not code.
#
# Source: Albion Online wiki ("Focus Fire", "AoE Escalation" pages), recorded
# 2026-08-13; tables reflect the Realm Divided update (30.000.1, 2025-11-24).
#
# STATUS: CONSUMED since 2026-08-13 — build_dataset.py embeds this file and
# both engine ports apply focus_fire / aoe_escalation / aoe_geometry /
# build_stats as supply-side effectiveness multipliers (MECHANICS_TODO.md
# implementation checklist). Numbers land here so there is exactly ONE
# place to correct them after a patch — same rule as the capability sheets.

# ---------------------------------------------------------------------------
# Focus Fire (aka Resilience): percentage damage reduction applied to a
# player being attacked by multiple enemy players. Diminishing returns on
# stacked single-target damage.
# OWNER-CONFIRMED CURRENT 2026-08-25: the owner pasted the live wiki table
# (post-Realm-Divided) and every cell below matches it exactly — both
# columns, both caps, lookback and buff durations.
focus_fire:
  lookback_seconds: 10      # window used to count attackers on the target
  buff_duration_seconds: 5
  # Damage reduction by number of attackers. Melee and ranged currently share
  # the same unmounted values (kept as one table until they diverge again).
  damage_reduction_unmounted:
    1: 0.000
    2: 0.143
    3: 0.259
    4: 0.353
    5: 0.420
    6: 0.466
    7: 0.500
    8: 0.524
    9: 0.546
    10: 0.566
    11: 0.585
    12: 0.602
    13: 0.618
    14: 0.633
    15: 0.646
    16: 0.659
    17: 0.671
    18: 0.682
    19: 0.692
    20: 0.702
    21: 0.711
    22: 0.720
    23: 0.728
    24: 0.736
    25: 0.743
    26: 0.750   # cap — flat 75% for 26+ attackers
  damage_reduction_mounted:
    1: 0.000
    2: 0.143
    3: 0.259
    4: 0.353
    5: 0.430
    6: 0.494
    7: 0.547
    8: 0.592
    9: 0.630
    10: 0.662
    11: 0.690
    12: 0.713
    13: 0.734
    14: 0.752
    15: 0.768
    16: 0.782
    17: 0.795
    18: 0.800   # cap — flat 80% for 18+ attackers
  caps:
    unmounted: {attackers: 26, value: 0.750}   # was 0.80 @ 25+ pre-Realm-Divided
    mounted:   {attackers: 18, value: 0.800}
  # Resilience Penetration: per-weapon/ability stat letting an attacker ignore
  # a % of this reduction (melee-heavy; cut across the board in Realm
  # Divided). Per-weapon values NOT yet recorded — MECHANICS_TODO.md Q7.
  resilience_penetration: null

# ---------------------------------------------------------------------------
# AoE Escalation: AoE damage spells (designed to hit 3+ players) deal bonus
# damage per player hit. AoE root/stun/silence spells get increased CC
# duration instead ("CC Escalation").
# OWNER-CONFIRMED CURRENT 2026-08-25: the owner pasted the live wiki table
# and every value below matches it exactly (8%/target from 2, 56% cap at
# 8+, applied after buffs, bypasses the ~150% soft cap).
aoe_escalation:
  starts_at_targets: 2
  bonus_per_extra_target: 0.08   # bonus = 0.08 * (targets_hit - 1)
  cap_targets: 8
  max_bonus: 0.56                # flat 56% for 8+ targets hit
  damage_bonus_by_targets:
    1: 0.00
    2: 0.08
    3: 0.16
    4: 0.24
    5: 0.32
    6: 0.40
    7: 0.48
    8: 0.56    # cap — 9+ targets stays 56%
  # Applied after all other buffs; NOT reduced by the ~150% damage soft cap.
  applied_after_buffs: true
  bypasses_damage_soft_cap: true
  # Escalation is per-ability ELIGIBILITY, per-effect MAGNITUDE — both now
  # extracted from ao-bin-dumps (Q9 answered 2026-08-20, parse_dumps v4):
  # spell_index.json carries `escalation: {value, duration}` per spell
  # (@targetcountvaluebonusfactor / @targetcountdurationbonusfactor).
  # 174/559 weapon-reachable spells escalate; standard factor 0.08/target
  # (Spirit Animal: 0.25). Q8 answered by the same extraction: CC DURATION
  # escalation uses the same per-target factor as damage; the per-spell
  # factor in the dataset is authoritative, this note is documentation.
  cc_escalation_duration_curve: same_factor_per_target_as_damage

# ---------------------------------------------------------------------------
# AoE GEOMETRY (2026-08-20, geometric-AoE step 1 — expert ruling in
# MECHANICS_TODO.md): an area effect does one target's worth of WORK per
# enemy it actually affects. Utility supply delivered by an AoE spell
# (weapon cap_delivery, from the evidence spell's structural footprint)
# scales with expected targets affected — normalized to (balanced,
# base_size), so template calibration at the anchor is untouched and only
# bigger fights / clumpier styles diverge. Single-target and self-buff
# supply stays flat: +40% self move speed catches ONE runner at any size.
aoe_geometry:
  # Expected enemies AFFECTED when an area of the given radius sweeps the
  # style's clump: step table radius -> targets (largest breakpoint <= r).
  # PROVISIONAL shape — expert to tune; travel-distance (Tornado's 25m line)
  # deliberately not yet counted, radius only.
  radius_targets:
    0: 1
    2: 2
    3.5: 3
    5: 4
    6.5: 6
    8: 8
  # The utility capabilities that scale geometrically (the expert-ruled CC/
  # utility family). Damage families keep the existing escalation/Resilience
  # physics; zone_control is EXCLUDED (area is already its identity — scaling
  # it by area would double-count).
  geometric_caps: [catch, peel, slow, stun, root, silence, knockback_displace]
  # Of those, the ones whose in-game CC Escalation (duration per target hit)
  # composes ON TOP of the geometric term — applied only when the delivering
  # spell carries a duration escalation factor in the dumps.
  cc_duration_caps: [stun, root, silence]
  escalation_cap_targets: 8
  # The ANCHOR the geometric term is normalized against — where an AoE
  # utility spell counts exactly its curated ordinal score:
  #   null  -> (balanced, base_size) clump: calibration-preserving, but the
  #            base clumps (6.4-7) already exceed every spell's reach, so AoE
  #            utility can only be DE-rated at small sizes, never up-rated
  #            at the calibrated scale — cannot express the expert's ruling.
  #   N     -> a fixed reference clump: the ordinal unit is "one cast's worth
  #            at a small gang of N-target clumps"; above it, AoE utility
  #            supply grows toward min(clump, spell reach)/min(N, reach).
  # 2 = the ordinal curation intuition (a skirmish where an AoE slow catches
  # ~2). Measured 2026-08-20: V4 role 73% and all golden cases hold with 2.
  # PROVISIONAL — expert may retune; template targets for the geometric caps
  # were calibrated on flat supply and absorb the change via the same
  # measurement gates.
  reference_clump: 2

# ---------------------------------------------------------------------------
# BUILD STATS (full-build members, 2026-08-20): item base stats modify the
# PERSON, exactly as the expert framed it — a +50% damage chest multiplies
# the weapon's damage capabilities (it adds nothing on a control tank with
# no damage caps: "Heavy Mace on cloth defeats its purpose" is now a
# computable statement), while absolute defensive stats add tankiness.
# Values come from item_stats.json (the game's own numbers, T4-flat
# reference; tier scaling rides the IP curve like everything else).
build_stats:
  # armor + magic resistance -> tankiness units. PROVISIONAL calibration:
  # a plate chest (161+126 = 287 points) ~ 1.15 units; cloth (123) ~ 0.5.
  tankiness_per_armor_point: 0.004
  # crowd-control resistance -> tankiness units (plate 50 ccr ~ 0.15 units)
  tankiness_per_ccr_point: 0.003
  # % item stats MULTIPLY the member's capability supply
  damage_mult_caps: [burst_st, burst_aoe, sustained_dps, execute]
  heal_mult_caps: [heal_sustain, heal_burst]
  # CC-duration % (increment 2, owner 2026-08-25: "incubus is mostly
  # paired with leering cane for its +cc duration") multiplies the
  # wearer's own DURATION-BEARING CC — the pairing emerges from physics
  # for every CC carrier and never for a CC-less build. Knockbacks are
  # instantaneous displacement and stay out.
  cc_mult_caps: [stun, root, slow, silence]

# ---------------------------------------------------------------------------
# KILL PRESSURE (identity Phase D, owner checklist 2026-08-23): "did we
# bring pierce on the clump, did we give heal cuts so they don't heal up
# instantly, did we do enough damage within a short span to actually kill."
# The three lights are a LENS over the comp-fitted template targets — the
# enemy-toughness baseline is deliberately NOT a new physics model: the
# damage / pierce / heal-cut targets were fitted from what real comps field
# to kill things (VALIDATION.md, 2026-08-21 recalibration ruling), so
# "enough" is defined by the same evidence that calibrated everything else,
# and the focus-fire / escalation physics are already inside
# effective_supply. Deeper modeling (gear tier / IP, buffs, exact enemy
# effective HP) is the recorded v2 question — it becomes computable when
# the gear/companion layer supplies real item power per member.
# DESCRIPTIVE ONLY — a verdict panel, never a score term.
kill_pressure:
  pierce_caps: [resist_shred]
  heal_cut_caps: [heal_reduction]
  burst_caps: [burst_aoe, burst_st, execute]
  # a light is green at >= this share of its bar (the sum of the caps'
  # size-scaled template targets, over caps the content actually requires;
  # a content that demands none of a light's caps passes that light free)
  pass_ratio: 0.85   # PROVISIONAL — owner-tunable via MASTERSHEET tune:mechanics

# ---------------------------------------------------------------------------
# NEGATIVE RECOMMENDATIONS / REDUNDANCY WARNINGS (roadmap item 3,
# 2026-08-24): verdict thresholds for pick_report / swap_review /
# recommend annotations. The verdicts are a LENS over the exact pick
# marginal every suggestion path already computes (_eval_pick) — a
# scoring-side redundancy penalty was investigated and REJECTED
# (MECHANICS_TODO Q18, 2026-08-14); concavity + supply already collapse a
# redundant pick's marginal, this layer just SAYS so.
# DESCRIPTIVE ONLY — verdict text, never a score term.
negative_recs:
  # a pick whose summed coverage + floor-lift gain is at or under this is
  # "redundant": every capability it supplies is already covered — its
  # remaining score is meta prior / viability, not gap-closing value.
  # 0.05 is the same term floor explain() has always used to drop
  # negligible why-lines.
  redundant_gain_max: 0.05   # PROVISIONAL — owner-tunable via MASTERSHEET tune:mechanics

# ---------------------------------------------------------------------------
# CC diminishing returns (PvP interaction layer, 2026-08-19): repeated
# crowd control on one target within a window is reduced in duration.
# PLACEHOLDER — the curve, window and which CC classes share a DR bucket are
# NOT recorded from a citable source yet; numbers land here first when they
# are, same rule as resilience_penetration above. The interaction records
# (pipeline/interactions.yaml) can already mark per-spell DR facts when
# verified; nothing is invented meanwhile.
cc_diminishing_returns: null

# Healing-modifier rules (PvP interaction layer, 2026-08-19): global
# penalties/modifiers on healing (e.g. reduced healing received under
# repeated sources, "healing sickness"-type debuffs where they exist).
# PLACEHOLDER — no citable table recorded; per-spell healing-received
# reductions (Dawnsong's Flaming Phoenix -40%) live in the interaction
# records with their sources instead.
healing_modifiers: null

# ---------------------------------------------------------------------------
# Disarray (zerg debuff): reduces DAMAGE OUTPUT and CC DURATION when attacking
# targets with a LOWER Disarray level; no effect vs same-or-higher level.
# Debuff % = (attacker's level − target's level), i.e. 1% per level of
# difference. RELATIVE mechanic: in a mirror fight (equal sizes) it is a
# no-op — it prices OUTNUMBERING, not composition (MECHANICS_TODO.md Q11).
# Wiki, recorded 2026-08-13.
