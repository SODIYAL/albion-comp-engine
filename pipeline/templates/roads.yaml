# ---------------------------------------------------------------------------
# UNIT RESCALE 2026-08-18 — targets, soft caps and floor units below are
# expressed in LOADOUT-RESOLVED units (x0.857 from the previous flat-union
# units). Nothing here was re-tuned: the engine used to credit a party member
# with every spell on its sheet at once, including mutually exclusive picks
# from the same Q/W slot, and these thresholds were originally fitted against
# that inflated measurement. engine.py now resolves one spell per slot
# (Engine._equipped), so the same real comp measures ~14% smaller and the
# thresholds are converted to match. Same comps pass, same comps fail.
# Weights, penalty multipliers and min_party_size are dimensionless and were
# NOT touched.
# ---------------------------------------------------------------------------
# Content template — Roads of Avalon (small-group roaming, party cap 7).
#
# PROVISIONAL — created 2026-08-15, weights NOT expert-adjudicated. Roads
# parties are hard-capped at 7 by the game; real groups run anywhere from 2
# (gank pair) to the full 7 (chest-fight squad). Sizes above 7 are not
# meaningful for this content — the UI should treat 7 as the ceiling.
#
# Identity vs the other templates — Roads is the SMALL-SCALE inversion of
# the ZvZ sheets:
#   - Single-target kill pressure WORKS here. Resilience at 2–4 attackers is
#     only 14–35% (mechanics.yaml focus-fire table), so focused damage is a
#     primary win condition, not a taxed afterthought. burst_st carries real
#     weight for the first time (compare blackzone_roam weight 1) and
#     execute is a genuine capability (finishing through the last heal).
#     The Q16 size physics reinforces this direction automatically: below
#     base size the expected pile-on shrinks, boosting ST effectiveness.
#   - Anti-heal is comp-defining. At 5v5–7v7 one enemy healer can out-heal
#     an entire team's damage; heal_reduction/silence stop being situational
#     luxuries and become near-mandatory (weight 7 vs blackzone's 6 at
#     nearly 3x the party size).
#   - Mobility, catch and disengage rule the map. Fights happen around
#     portals that close; enemies flee through them and so do you. Catch
#     converts sightings into fights, disengage converts bad fights into
#     nothing.
#   - Self-sustain is a real requirement (first template to use it): duos
#     and trios routinely run healer-less, living on lifesteal/bruiser
#     sustain. Low weight so it never outranks a real healer at 5+, where
#     the heal floor takes over.
#   - AoE matters less (max 7 targets, usually fewer and spread), zone
#     control barely (chest-room chokes exist, but most fights are open
#     mist). clump_create is a nice-to-have, not the fight-winner it is
#     at 20+.
#
# Size behavior is deliberate (the whole point of this template): at 2–4 the
# floors are silent — a trio of assassins with self-sustain is a legitimate
# comp, and scaled targets are small enough that "no healer" reads as a gap,
# not a catastrophe. From 5 the healer floor arms, from 6 the tank floor —
# by 7 the engine actively demands the classic 1 tank / 1–2 healers spine.
#
# Sanity check on the scale: per-head heal need is stable across content
# (castle_outpost 3.0@7 = 0.43/head; blap 9.0@20 = 0.45/head) — kept at
# 3.0@7 here.

content: roads
# Content rule (2026-08-18): Roads keeps FULL single-target value at every
# size — small-gang content where kill pressure on one target is the win
# condition (this template's header documents the small-scale inversion;
# burst_st weight 7 is the fitted expression of it). Without this flag the
# global size-banded ST devaluation (composition.yaml st_value_mult) would
# tax it at 6-7 players.
st_full_value: true
name: Roads of Avalon
base_size: 7
validated_sizes: [7]
# In-game hard cap: Roads zones refuse parties larger than 7. The engine will
# still score bigger sizes if asked (free-form size is a product rule); the
# UI reads this field to warn that such a party cannot actually field.
max_size: 7

requirements:
  heal_sustain:   {target: 2.6, weight: 10, soft_cap: 4.3, scales: true}
  heal_burst:     {target: 1.3, weight: 5,  soft_cap: 2.6, scales: true}
  tankiness:      {target: 2.6, weight: 7,  soft_cap: 5.1, scales: true}
  peel:           {target: 2.6, weight: 8,  soft_cap: 5.1, scales: true}
  # small-scale kill pressure — the inversion vs ZvZ templates (see header)
  burst_st:       {target: 3.4, weight: 7,  soft_cap: 6.0, scales: true}
  sustained_dps:  {target: 2.6, weight: 5,  soft_cap: 6.0, scales: true}
  burst_aoe:      {target: 3.4, weight: 5,  soft_cap: 6.9, scales: true}
  mobility:       {target: 3.4, weight: 8,  soft_cap: 6.9, scales: true}
  catch:          {target: 2.6, weight: 7,  soft_cap: 5.1, scales: true}
  stun:           {target: 1.7, weight: 5,  soft_cap: 4.3, scales: true}
  # healer-less small groups live on this; low weight so it never outranks
  # a real healer once the floor arms at 5 (first template to use the cap)
  self_sustain:   {target: 1.7, weight: 3,  soft_cap: 4.3, scales: true}
  # threshold needs — one or two copies regardless of size
  engage:         {target: 1.7, weight: 5,  soft_cap: 3.4, scales: false}
  disengage:      {target: 1.7, weight: 6,  soft_cap: 3.4, scales: false}
  heal_reduction: {target: 1.7, weight: 7,  soft_cap: 3.4, scales: false}
  silence:        {target: 0.9, weight: 5,  soft_cap: 2.6, scales: false}
  cleanse:        {target: 0.9, weight: 5,  soft_cap: 2.6, scales: false}
  purge:          {target: 0.9, weight: 4,  soft_cap: 2.6, scales: false}
  # OPTIONAL (owner 2026-08-28): five single-target melee weapons carry it;
  #   9 of 10 published comps field none. Keep the target, do not require it.
  execute:        {target: 1.7, weight: 4,  soft_cap: 3.4, scales: false, optional: true}
  resist_shred:   {target: 1.3, weight: 4,  soft_cap: 2.6, scales: false}
  clump_create:   {target: 0.9, weight: 3,  soft_cap: 2.6, scales: false}
  zone_control:   {target: 1.3, weight: 2,  soft_cap: 3.4, scales: true}
  buff_allies:    {target: 0.9, weight: 2,  soft_cap: 2.6, scales: false}
  # PROVISIONAL low-and-flat (castle_outpost precedent): enemy-dependent
  # capabilities must never dominate a recommendation on unvalidated numbers.
  # REWEIGHT 2026-08-18 (see blackzone_roam.yaml note): from-zero windfall of
  # these provisional niche weights dominated tail recommendations.
  # OPTIONAL (owner 2026-08-28): supplied by ONE weapon in the catalogue
  #   (Exalted Staff, the crystal holy staff) and fielded mainly by 30+ ZvZ
  #   groups. Real target, but a comp without it is not missing anything.
  anti_zone:      {target: 0.9, weight: 1,  soft_cap: 1.7, scales: false, optional: true}
  damage_debuff:  {target: 0.9, weight: 1,  soft_cap: 1.7, scales: false}
  # PROMOTED 2026-08-27 — see blackzone_roam.yaml for the full rationale.
  # WEAKEST evidence of the four fitted contents: roads has ONE comp in the
  # corpus, so the target is 0.9x that single observation and the soft cap
  # cannot be observed at all — it uses the median soft/target spread the
  # multi-comp contents show for the same capability (~2.6-3.8x), because
  # a 1.15x band around a single point would flag overstack almost
  # immediately. Re-fit when a second roads comp lands.
  slow:               {target: 3.6, weight: 1, soft_cap: 10.7, scales: true}
  root:               {target: 6.3, weight: 1, soft_cap: 23.8, scales: true}
  knockback_displace: {target: 1.8, weight: 1, soft_cap: 6.9,  scales: true}
  anti_dive:          {target: 3.6, weight: 1, soft_cap: 13.1, scales: false}
  interrupt:          {target: 0.9, weight: 1, soft_cap: 2.3,  scales: false}
  max_health_cut:     {target: 0.9, weight: 1, soft_cap: 2.3,  scales: false}

# Floors are absolute units and arm BY SIZE — this is what makes a 3-man
# without a healer "fine, just know the gap" while a 6–7-man without one is
# flagged as broken. penalty_mult 2.0 inherits the castle_outpost
# PROVISIONAL (raised from 1.5 when synergy + meta leakage out-ranked
# healers past the floor).
hard_floors:
  heal_sustain: {min_party_size: 5, floor_units: 1.7, penalty_mult: 2.0}
  tankiness:    {min_party_size: 6, floor_units: 1.7, penalty_mult: 1.0}
