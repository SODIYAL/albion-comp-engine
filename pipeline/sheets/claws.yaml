# Claws — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 3 sightings, dominant role: melee.
#
# Identity: single-target lockdown assassin. The E (Disembowel) pins the
# target — a channeled root with REPEATED interrupts and a shield break,
# ending in a bleed. One person is removed from the fight while it channels.
# Shares the dagger Q/W pool with Bloodletter/Deathgivers; QW scores mirror
# those sheets. mobility 2 not 3: the E is a stationary channel, unlike the
# Bloodletter's dash E.

- weapon: 2H_CLAWPAIR                # Claws — single-target lockdown assassin
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/dagger.yaml)
  except:
    - {cap: catch, evidence: SKILLSHOT_TELEPORT}
    - {cap: sustained_dps, evidence: WEAPON_STATS}
  capabilities:
    - {cap: root,          score: 4, evidence: DISEMBOWEL}          # E: channeled pin, breaks if target moves 6m
    - {cap: catch,         score: 4, evidence: DISEMBOWEL}          # the pin IS the catch; W: Shadow Edge
    - {cap: burst_st,      score: 4, evidence: DISEMBOWEL}          # 45 every 0.3 + exit bleed + dagger stacking
    - {cap: purge,         score: 2, evidence: DISEMBOWEL}          # E: breaks active shields — narrow purge
