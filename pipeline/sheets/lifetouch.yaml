# Lifetouch Staff (1H) — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 5 sightings, dominant role: healer. Third holy weapon curated.
#
# Identity: THE cleanse healer. The E (Holy Touch) channels a single-ally
# heal that CLEANSES all CC and debuffs (except DoTs), grants OTHER allies
# immunity to all CC while channeling, buffs the target's damage +15%, and is
# castable while stunned or silenced. This is the settled cleanse finding
# (HANDOFF 2026-08-12): cleanse is per WEAPON, not per line — Lifetouch and
# Fallen have it inherent on E; the shared holy Q/W pool has none.
#
# Q/W pool scores mirror the Hallowfall/Redemption sheets (same spells).
# NO mobility — stationary like Redemption; the Hallowfall contrast stands.

- weapon: MAIN_HOLYSTAFF_MORGANA     # Lifetouch Staff — the cleanse healer
