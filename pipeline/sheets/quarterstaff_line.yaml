  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: QS_CRYSTAL_COMBO}  # E: projections slash + slam
    - {cap: slow,          score: 2, evidence: QS_CRYSTAL_COMBO}
    - {cap: knockback_displace, score: 2, evidence: QS_CRYSTAL_COMBO}  # 3rd-combo slam
    - {cap: zone_control,  score: 2, evidence: QS_CRYSTAL_COMBO}  # moving projection areas

- weapon: 2H_IRONCLADEDSTAFF         # Iron-clad Staff — mobile mass-displace tank
  curated_as_of: 2026-08-12
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/quarterstaff.yaml)
  except:
    - {cap: knockback_displace, evidence: LAUNCHER}
    - {cap: anti_dive, evidence: QS_WHIRLWIND2}
    - {cap: damage_debuff, evidence: QS_WHIRLWIND2}
    - {cap: peel, evidence: SEPARATING_SLAM}
  capabilities:
    - {cap: knockback_displace, score: 6, evidence: QSWHIRLWIND}  # E: mobile channel, 12m shove IGNORING CC resistance
    - {cap: peel,          score: 4, evidence: QSWHIRLWIND}       # walk the whirlwind over your backline
    - {cap: anti_dive,     score: 4, evidence: QSWHIRLWIND}       # divers get ejected; W: Forceful Swing (QW)
    # tankiness 2 -> 1 (2026-08-18 owner directive): the +15% resistance is
    # only up WHILE CHANNELING the E — a momentary, conditional buff, not
    # standing frontline bulk. One unit for the tank-class body + the buff;
    # two units equated it with Bedrock-class dedicated frontline, which is
    # how the forge sold it as a second frontliner in 11-mans.
    - {cap: tankiness,     score: 2, evidence: QSWHIRLWIND}

