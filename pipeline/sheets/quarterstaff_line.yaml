# Quarterstaff line — remaining 6 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the Quarterstaff / Double Bladed Staff sheets; each
# block below is that pool plus the weapon's own E. Line identity:
# displacement and disruption.

- weapon: 2H_COMBATSTAFF_MORGANA     # Black Monk Staff — anti-shield disruption
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/quarterstaff.yaml)
  except:
    - {cap: mobility, evidence: CARTWHEEL}
    - {cap: damage_debuff, evidence: QS_WHIRLWIND2}
  capabilities:
    - {cap: purge,         score: 4, evidence: COMBATSTAFF_SLASH}  # E: breaks shields AND prevents new ones, 3s zone
    - {cap: zone_control,  score: 2, evidence: COMBATSTAFF_SLASH}  # spinning blade zone
    - {cap: burst_aoe,     score: 2, evidence: COMBATSTAFF_SLASH}
    - {cap: damage_debuff, score: 4, evidence: COMBATSTAFF_SLASH}  # E: -40% damage dealt, stacking, in the blade zone

