# Crossbow line — remaining 5 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Energy Shaper / Siegebow / Boltcasters.

- weapon: 2H_CROSSBOW                # Crossbow — the sniper
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/crossbow.yaml)
  except:
    - {cap: resist_shred, evidence: SUNDERSHOT}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SNIPESHOT_CROSSBOW}  # E: 386 single shot
    - {cap: resist_shred,  score: 4, evidence: SNIPESHOT_CROSSBOW}  # E: -15%; W: Sunder Shot / Salvo stack more

- weapon: 2H_CROSSBOWLARGE           # Heavy Crossbow — line-pierce interrupter
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/crossbow.yaml)
  except:
    - {cap: burst_aoe, evidence: BOLTSHOT}
  capabilities:
    - {cap: burst_aoe,     score: 4, evidence: CROSSBOW_ARMORPIERCER}  # E: 225 pierce through the line
    - {cap: burst_st,      score: 2, evidence: CROSSBOW_ARMORPIERCER}
    - {cap: interrupt,     score: 2, evidence: CROSSBOW_ARMORPIERCER}  # the pierce interrupts every caster on the line (interrupt taxonomy 2026-08-21)

- weapon: 2H_DUALCROSSBOW_CRYSTAL    # Arclight Blasters — dash-blast skirmisher
