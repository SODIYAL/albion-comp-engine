# Quarterstaff — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 3 sightings, dominant role: tank.
#
# Identity: the displacement line. The E (Vault Leap) is a CC+damage-immune
# leap into an AoE air-throw, and the W row is wall-to-wall displacement:
# Rising Blow (cone air-throw, CD refund per player), Separator (2.2s root +
# 12m CC-resist-IGNORING AoE knockback), Forceful Swing (AoE shove, -50%
# damage dealt AND disables enemy Auto-Attacks). knockback_displace 3 and
# peel 3 — the highest displacement scores in the dataset, matching the
# line's in-game role as the dedicated peel bruiser.
# Forceful Swing's -50% damage-dealt debuff scored as damage_debuff since the
# 2026-08-12 §2.2 promotion (it was a founding poster child).

- weapon: 2H_QUARTERSTAFF            # Quarterstaff — the displacement line
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: tank
  capabilities:
    - {cap: knockback_displace, score: 3, evidence: VAULT_ATTACK}  # E air-throw; W: Rising Blow / Separator / Forceful Swing
    - {cap: peel,          score: 3, evidence: SEPARATING_SLAM}  # W: 12m CC-resist-ignoring shove off a target (QW)
    - {cap: engage,        score: 2, evidence: VAULT_ATTACK}     # CC+damage-immune leap in
    - {cap: mobility,      score: 2, evidence: VAULT_ATTACK}     # E leap; Q: Cartwheel dash
    - {cap: disengage,     score: 2, evidence: VAULT_ATTACK}     # immune leap out; Q: Cartwheel
    - {cap: catch,         score: 2, evidence: STUNRUN}          # W: Stun Run 2.11s opener + leap (QW)
    - {cap: anti_dive,     score: 2, evidence: QS_WHIRLWIND2}    # W: divers get shoved, damage-halved, AA-disabled (QW)
    - {cap: damage_debuff, score: 1, evidence: QS_WHIRLWIND2}    # W: -50% damage dealt + AA disable, 5s AoE (QW)
    - {cap: tankiness,     score: 2, evidence: WEAPON_STATS}     # tank-role bruiser; Q: Cartwheel +20% resists
    - {cap: stun,          score: 1, evidence: STUNRUN}          # W option; Q3: Concussive Blow; passive (QW)
    - {cap: root,          score: 1, evidence: SEPARATING_SLAM}  # W: 2.2s single-target (QW)
    - {cap: burst_aoe,     score: 1, evidence: VAULT_ATTACK}     # 161 on impact — modest
    - {cap: self_sustain,  score: 1, evidence: PASSIVE_HEALTHCHANCE_QUARTERSTAFF}  # PASSIVE: Life Leech
