# Quarterstaffs — one entry per weapon of the quarterstaff tree, carrying
# the weapon's E (its identity) and any override of a shared row. The tree's
# shared Q/W/passive rows (Concussive Combo, Cartwheel; Gale Dance, Stun
# Run, Forceful Swing, Rising Blow, Separator; Life Leech) live in
# pools/quarterstaff.yaml and compose into every quarterstaff that can equip
# them (sheets_lib.compose). Every row scores on its own spell
# (build_dataset.build_loadout; a WEAPON_STATS row is always on): an own row
# and a shared row of the same capability on different spells both score,
# and the member reads the larger, never the sum (engine._merge_max, F43).
# An `except:` entry is a deliberate non-take of a shared row (curation
# judgment). An E-row comment that names a Q/W spell marks that spell's
# share of the E row's score; the named spell's shared row, where it has
# one, still scores on its own slot, and the larger reads. Tree identity:
# displacement and disruption.

- weapon: 2H_COMBATSTAFF_MORGANA     # Black Monk Staff — anti-shield disruption
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: purge,         score: 2, evidence: COMBATSTAFF_SLASH}  # E: breaks damage shields and blocks new ones in a 3s spinning zone — a shield break, ranked below Fists of Avalon's true purge (curation judgment)
    - {cap: zone_control,  score: 2, evidence: COMBATSTAFF_SLASH}  # spinning blade zone
    - {cap: burst_aoe,     score: 2, evidence: COMBATSTAFF_SLASH}
    - {cap: damage_debuff, score: 4, evidence: COMBATSTAFF_SLASH}  # E: -40% damage dealt, stacking, in the blade zone

# Double Bladed Staff — skirmish bruiser. The E (Soaring Swipe) is a leap
# that deals 80 in 5r, slows every enemy hit by 50% for 3s and refunds part
# of its cooldown when it hits an enemy player: a skirmisher's engage/chase
# tool rather than the Quarterstaff's peel E. Stun comes from the shared
# rows (pool stun 2 on Concussive Combo, a Q option, and on Stun Run, a W
# option), as on every quarterstaff.

- weapon: 2H_DOUBLEBLADEDSTAFF       # Double Bladed Staff — skirmish bruiser
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: slow,          score: 4, evidence: DASH_KNOCKBACK}   # E: 50% AoE slow for 3s — the signature
    - {cap: mobility,      score: 4, evidence: DASH_KNOCKBACK}   # E leap w/ partial CD refund; Q: Cartwheel
    - {cap: engage,        score: 4, evidence: DASH_KNOCKBACK}   # leap in, slow the clump
    - {cap: catch,         score: 2, evidence: DASH_KNOCKBACK}   # leap + 50% slow = caught
    - {cap: disengage,     score: 4, evidence: DASH_KNOCKBACK}   # leap out; Q: Cartwheel
    - {cap: peel,          score: 4, evidence: SEPARATING_SLAM}  # W: Separator; override of the pool's 2: the Separator peel ladder is pool 2 / this 4 / Quarterstaff 6 (QW)
    - {cap: burst_aoe,     score: 2, evidence: DASH_KNOCKBACK}   # 80 on impact + Whirling — modest

- weapon: 2H_DOUBLEBLADEDSTAFF_CRYSTAL  # Phantom Twinblade — projection skirmisher
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: QS_CRYSTAL_COMBO}  # E: projections slash + slam
    - {cap: slow,          score: 2, evidence: QS_CRYSTAL_COMBO}
    - {cap: knockback_displace, score: 2, evidence: QS_CRYSTAL_COMBO}  # 3rd-combo slam
    - {cap: zone_control,  score: 2, evidence: QS_CRYSTAL_COMBO}  # moving projection areas

- weapon: 2H_IRONCLADEDSTAFF         # Iron-clad Staff — mobile mass-displace tank
  curated_as_of: 2026-10-07
  role_hint: tank
  capabilities:
    - {cap: knockback_displace, score: 2, evidence: QSWHIRLWIND}  # E: 12m knockback ignoring CC resistance, but self-centred: a body commit, useless in the ranged territory/castle fights where displacement matters (curation judgment)
    - {cap: peel,          score: 2, evidence: QSWHIRLWIND}       # body-commit peel — of little use at large scale, where Bedrock is far better (curation judgment)
    - {cap: anti_dive,     score: 4, evidence: QSWHIRLWIND}       # divers in the spin get knocked out; W: Forceful Swing folded in (its pool row, 2, scores on its own W; the larger reads). MASTERSHEET tune:sheets re-ranks this row to 2 (T19: Bedrock's wall over a contact spin)
    # tankiness 2 (one unit): the E's +15% resistances (5s) are a momentary,
    # conditional buff, not standing frontline bulk. One unit for the
    # tank-class body plus the buff; two units equated it with Bedrock-class
    # dedicated frontline, which is how the forge fielded it as a second
    # frontliner in 11-mans.
    - {cap: tankiness,     score: 2, evidence: QSWHIRLWIND}

# Quarterstaff — the dedicated peel bruiser. The E (Vault Leap) is a CC- and
# damage-immune leap into an AoE air-throw, and the shared W row is
# displacement: Rising Blow (cone air-throw, CD refund per player hit),
# Separator (2.2s root on the target, then every enemy player within 6m of it
# knocked back 12m, ignoring CC resistance), Forceful Swing (6r shove, -50%
# damage dealt, enemy Auto-Attacks disabled). knockback_displace 6 is the top
# of its board, a kit score pinned by T13 (the E's air-throw plus the W row);
# peel 6 tops the Separator ladder (pool 2, Double Bladed Staff 4).

- weapon: 2H_QUARTERSTAFF            # Quarterstaff — the displacement line
  curated_as_of: 2026-10-07
  role_hint: tank
  capabilities:
    - {cap: knockback_displace, score: 6, evidence: VAULT_ATTACK}  # E air-throw; W: Rising Blow / Separator / Forceful Swing (T13); the pool's Rising Blow and Separator rows (2) score on their own W, the larger reads
    - {cap: peel,          score: 6, evidence: SEPARATING_SLAM}  # W: Separator's 12m CC-resist-ignoring knockback around the rooted target; override of the pool's 2 (QW)
    - {cap: engage,        score: 4, evidence: VAULT_ATTACK}     # CC+damage-immune leap in
    - {cap: mobility,      score: 4, evidence: VAULT_ATTACK}     # E leap; Q: Cartwheel dash
    - {cap: disengage,     score: 4, evidence: VAULT_ATTACK}     # immune leap out; Q: Cartwheel
    - {cap: catch,         score: 4, evidence: STUNRUN}          # W: Stun Run 2.11s opener + leap (QW)
    - {cap: anti_dive,     score: 4, evidence: QS_WHIRLWIND2}    # W: divers get shoved, damage-halved, AA-disabled; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: tankiness,     score: 4, evidence: WEAPON_STATS}     # tank-role bruiser; Q: Cartwheel +20% resistances for 3s if hit while dashing
    - {cap: burst_aoe,     score: 2, evidence: VAULT_ATTACK}     # 161 on impact — modest

- weapon: 2H_QUARTERSTAFF_AVALON     # Grailseeker — root-wall zoner
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: root,          score: 4, evidence: SOULSHAKER}        # E: energy wall roots everyone touching it, 3.5s
    - {cap: zone_control,  score: 4, evidence: SOULSHAKER}        # the wall denies the line it stands on
    - {cap: peel,          score: 4, evidence: SOULSHAKER}        # wall between divers and backline; W: Separator (its pool row, 2, scores on its own W; the larger reads)
    - {cap: catch,         score: 4, evidence: SOULSHAKER}        # cast it ahead of runners
    - {cap: burst_aoe,     score: 2, evidence: SOULSHAKER}        # 125 line

- weapon: 2H_ROCKSTAFF_KEEPER        # Staff of Balance — anti-heal aura bruiser
  curated_as_of: 2026-10-07
  role_hint: tank
  capabilities:
    - {cap: heal_reduction, score: 4, evidence: QS_SLOWROPE}      # E: -35% Healing Received aura (negates own healing too)
    - {cap: slow,          score: 4, evidence: QS_SLOWROPE}       # 50% aura slow
    - {cap: zone_control,  score: 4, evidence: QS_SLOWROPE}       # 6.5m walking denial zone, up to 15s
    - {cap: anti_dive,     score: 4, evidence: QS_WHIRLWIND2}     # divers stand in the aura; W: Forceful Swing; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: tankiness,     score: 4, evidence: QS_SLOWROPE}       # +20% resists while active

- weapon: 2H_TWINSCYTHE_HELL         # Soulscythe — tornado displace skirmisher
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: knockback_displace, score: 4, evidence: TORNADO}      # E: line air-THROW, ignores CC resistance — no travel; the line knock-up is the rubric's S8 case (teammates' damage and CC land)
    - {cap: burst_aoe,     score: 4, evidence: TORNADO}           # 152 through the line
    - {cap: slow,          score: 4, evidence: TORNADO}           # 80% around the tornado
    - {cap: peel,          score: 4, evidence: TORNADO}           # send it through the divers
    - {cap: catch,         score: 4, evidence: TORNADO}           # the 80% slow shears escapes
