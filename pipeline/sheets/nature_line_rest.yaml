  except:
    - {cap: heal_burst, evidence: CLEANSEHEAL}
    - {cap: sustained_dps, evidence: THORNSAREA}
  capabilities:
    - {cap: heal_burst,   score: 4, evidence: NATURE_ULTIMATE_SINGLE}  # E: 208 delayed seed, recastable
    - {cap: heal_sustain, score: 4, evidence: NATURE_ULTIMATE_SINGLE}  # seeds woven into HoT rotation
