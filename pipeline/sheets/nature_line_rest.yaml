# Nature line — remaining 7 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the Blight Staff sheet (Cleanse Heal W — the settled
# conditional cleanse, Protection of Nature, Thorn Growth, Bramble Seed).

- weapon: 2H_NATURESTAFF             # Great Nature Staff — reactive-armor healer
  curated_as_of: 2026-08-12
  role_hint: healer
  # deliberate non-takes of tree-pool spells (see sheets/pools/naturestaff.yaml)
  except:
    - {cap: buff_allies, evidence: NATURERESILIENCE}
  capabilities:
    - {cap: heal_sustain, score: 4, evidence: BRIEROFLIFE}     # E: heal + heal-on-damage-taken armor
    - {cap: buff_allies,  score: 4, evidence: BRIEROFLIFE}     # +13% resistances on the target; W: Protection (QW)
    # peel 2 REMOVED (owner ruling 2026-08-28): resistances on the focused ally
    # are protection, not peel — nothing here touches the enemy.

- weapon: 2H_NATURESTAFF_KEEPER      # Rampant Staff — trail healer
  curated_as_of: 2026-08-12
  role_hint: healer
  # deliberate non-takes of tree-pool spells (see sheets/pools/naturestaff.yaml)
  except:
    - {cap: heal_burst, evidence: CLEANSEHEAL}
  capabilities:
    - {cap: heal_sustain, score: 6, evidence: SPIRITANIMAL}    # E: healing trail, 14/s for allies standing on it
    - {cap: heal_burst,   score: 2, evidence: SPIRITANIMAL}    # 110 on touch

- weapon: 2H_WILDSTAFF               # Wild Staff — the well healer
  curated_as_of: 2026-08-12
  role_hint: healer
  capabilities:
    - {cap: heal_sustain, score: 6, evidence: WELLOFLIFE2}     # E: 69/s to 20 allies inside the well

- weapon: MAIN_NATURESTAFF           # Nature Staff (1H) — self-centred group healer
  curated_as_of: 2026-08-12
  role_hint: healer
  # deliberate non-takes of tree-pool spells (see sheets/pools/naturestaff.yaml)
  except:
    - {cap: heal_burst, evidence: CLEANSEHEAL}
    - {cap: sustained_dps, evidence: THORNSAREA}
  capabilities:
    - {cap: heal_burst,   score: 4, evidence: CIRCLEOFLIFE}    # E: 107 instant to 15 allies around you
    - {cap: heal_sustain, score: 4, evidence: CIRCLEOFLIFE}    # rejuvenation charge engine
    - {cap: root,         score: 2, evidence: CIRCLEOFLIFE}    # thorn-charged enemies get rooted

- weapon: MAIN_NATURESTAFF_AVALON    # Ironroot Staff — the soul-link protector
  curated_as_of: 2026-08-12
  role_hint: healer
  # deliberate non-takes of tree-pool spells (see sheets/pools/naturestaff.yaml)
  except:
    - {cap: sustained_dps, evidence: THORNSAREA}
  capabilities:
    # peel 4 REMOVED and re-homed as buff_allies (owner ruling 2026-08-28).
    # Soul Link redirects half the damage off the focused ally and does nothing
    # to the enemy, so it is protection, not peel. Ironroot keeps its identity
    # as a protector — it just reads on the honest axis now, and the header
    # comment was corrected from "peeler" to match.
    #
    # MAGNITUDE IS ANCHORED, NOT INVENTED: Brier of Life (2H_NATURESTAFF, this
    # same file) scores buff_allies 4 for +13% resistances on one ally. Soul
    # Link halves incoming damage on one ally — strictly stronger protection on
    # the same single target — so 4 is a floor for it under this sheet's own
    # scale, not a number chosen to match the peel row it replaced.
    - {cap: buff_allies,  score: 4, evidence: SOUL_LINK}       # half the focus damage redirected off the ally
    - {cap: heal_sustain, score: 4, evidence: SOUL_LINK}       # link also transfers 75% of healing; W pool

- weapon: MAIN_NATURESTAFF_CRYSTAL   # Forgebark Staff — toggle shield/root healer
  curated_as_of: 2026-08-12
  role_hint: healer
  # deliberate non-takes of tree-pool spells (see sheets/pools/naturestaff.yaml)
  except:
    - {cap: buff_allies, evidence: NATURERESILIENCE}
    - {cap: sustained_dps, evidence: THORNSAREA}
  capabilities:
    - {cap: heal_sustain, score: 4, evidence: DUAL_NATURE}     # E: Fortify — shields + 32/0.85s to 10 targets
    - {cap: buff_allies,  score: 2, evidence: DUAL_NATURE}     # 171 damage shields
    - {cap: root,         score: 2, evidence: DUAL_NATURE}     # E: Ensnare toggle — 2.25s AoE root

- weapon: MAIN_NATURESTAFF_KEEPER    # Druidic Staff — seed-burst healer
  curated_as_of: 2026-08-12
