# Rotcaller Staff (1H) — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 6 sightings, dominant role: support — the only support-role weapon
# curated so far.
#
# Identity: anti-heal peel support. The E (Plaguebringer) is one cast doing
# three support jobs: 6m AoE knockback that IGNORES CC resistance, 161 damage,
# and a 2s Healing-Received NEGATION (with a 6s re-application immunity).
#
# DRAFT CORRECTIONS (verified against full dumps text):
#   - tankiness 2 + self_sustain 2 via Plaguebringer's prose:shield REMOVED —
#     nothing in the text shields anything; flag suppressed in overrides.
#   - engage/disengage/catch/mobility via the Hit and Run passive REMOVED:
#     +20% MS for 3s every 6 spells is a kiting nicety, not movement tooling.
# heal_reduction 2 not 3: the negate is one E application; the Spirithunter
# class (full-kit anti-heal) holds 3. Expert may bump — in practice this E is
# why the weapon gets picked.
# Armor Piercer (-17% for 4s) is the strongest single shred curated so far but
# is one W among five: held at the W-option ladder score of 1, flagged.

- weapon: MAIN_CURSEDSTAFF_CRYSTAL   # Rotcaller Staff — anti-heal peel support
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: support
  capabilities:
    - {cap: heal_reduction, score: 4, evidence: CURSE_SKELETON_BARF_FDHR}  # E: negates Healing Received 2s, AoE
    - {cap: burst_aoe,      score: 2, evidence: CURSE_SKELETON_BARF_FDHR}  # 161 magical across the miasma cone — "mostly used for its damage" (owner ruling 2026-08-21)
    - {cap: peel,           score: 2, evidence: CURSE_SKELETON_BARF_FDHR}  # Rift Glaive-pattern: slight knock-AWAY = self-peel, displace dropped (owner ruling 2026-08-21; was displace 4 + peel 4)
