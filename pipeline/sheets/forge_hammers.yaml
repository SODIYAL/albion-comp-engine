# +30% damage resistances, +AA range, and a 7m aura slowing everything near
# you by 35%, with repeatable Giant Smashes. The zone IS the tank: space
# denial that moves with you. Shares the hammer Q/W pool with Polehammer /
# Great Hammer / Hand of Justice; QW-conditional scores mirror those sheets.
# Knockout's 5s sleep grounds the stun score with the usual caveat (breaks
# on damage).

