# Spear line — remaining 7 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the Spirithunter sheet (Spirit Spear charges, Cripple,
# Deflecting Spin, Inner Focus, Harpoon).

- weapon: 2H_GLAIVE                  # Glaive — the pick weapon
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  except:
    - {cap: catch, evidence: LEGBREAKER}
  capabilities:
    - {cap: catch,         score: 4, evidence: SHOVEL}           # E: Fling — pulls the target 10m BEHIND you (override)
    - {cap: knockback_displace, score: 4, evidence: SHOVEL}      # enemy-directed forced repositioning

- weapon: 2H_GLAIVE_CRYSTAL          # Rift Glaive — charge-dump line burster
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: burst_aoe,     score: 4, evidence: SPEAR_AOE_FINISHER}  # E: charge-scaled line blast — the clap identity
    - {cap: peel,          score: 2, evidence: SPEAR_AOE_FINISHER}  # 4m knock-AWAY on the line: self-peel, not offensive displacement (owner ruling 2026-08-21; sanctioned band 2-3)

- weapon: 2H_SPEAR                   # Pike — single-target root lancer
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  # (peel non-take removed 2026-08-21: the pool no longer grants Legbreaker peel)
  except:
    - {cap: catch, evidence: LEGBREAKER}
    - {cap: root, evidence: SKILLSHOT_PULL}
  capabilities:
    - {cap: root,          score: 4, evidence: HALBERDSMASH}     # E: 2.79s single-target root
    - {cap: catch,         score: 4, evidence: HALBERDSMASH}     # root + Cripple anti-kite (QW)
    - {cap: peel,          score: 3, evidence: HALBERDSMASH}     # root the diver

- weapon: 2H_TRIDENT_UNDEAD          # Trinity Spear — immune-leap AoE rooter
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  except:
    - {cap: mobility, evidence: CHARGINGBLADE}
    - {cap: catch, evidence: LEGBREAKER}
    - {cap: peel, evidence: LEGBREAKER}
    - {cap: root, evidence: SKILLSHOT_PULL}
  capabilities:
    - {cap: engage,        score: 4, evidence: TRIDENTTHROW}     # E: CC+debuff+damage-immune leap
    - {cap: root,          score: 4, evidence: TRIDENTTHROW}     # 2.65s AoE root on impact
    - {cap: mobility,      score: 4, evidence: TRIDENTTHROW}     # the leap; Inner Focus (QW)
    - {cap: catch,         score: 4, evidence: TRIDENTTHROW}     # leap + root
    - {cap: buff_allies,   score: 3, evidence: TRIDENTTHROW}     # soul mist buffs allies inside
    - {cap: peel,          score: 2, evidence: TRIDENTTHROW}     # root the divers
    - {cap: disengage,     score: 2, evidence: TRIDENTTHROW}     # immune leap out
    # 2026-08-24 E-audit (round 7 method): the impact's own damage was
    # never scored — "Roots all enemies in a 3.0 radius on impact ...
    # Deals 191.65 physical damage." Modest area burst beside the root:
    # 191/r3 = 2 (Battle Bracers 264/r4 = 4 is the calibration point).
    - {cap: burst_aoe,     score: 2, evidence: TRIDENTTHROW}     # 191.65 phys to the rooted radius on impact

- weapon: MAIN_SPEAR                 # Spear (1H) — dash-through skirmisher
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  except:
    - {cap: mobility, evidence: CHARGINGBLADE}
    - {cap: peel, evidence: LEGBREAKER}
  capabilities:
    - {cap: engage,        score: 4, evidence: DASHDMG}          # E: dash-through air-throw
    - {cap: knockback_displace, score: 2, evidence: DASHDMG}     # path air-throw — no travel (magnitude pass 2026-08-13)
    - {cap: mobility,      score: 4, evidence: DASHDMG}          # the dash; Inner Focus (QW)
    - {cap: peel,          score: 2, evidence: DASHDMG}          # dash through the divers
    - {cap: disengage,     score: 2, evidence: DASHDMG}          # dash out

- weapon: MAIN_SPEAR_KEEPER          # Heron Spear — stun-skillshot skirmisher
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  except:
    - {cap: catch, evidence: LEGBREAKER}
    - {cap: peel, evidence: LEGBREAKER}
  capabilities:
    - {cap: stun,          score: 4, evidence: SPEARTHROW}       # E: 1.75s AoE shock on impact
    - {cap: catch,         score: 4, evidence: SPEARTHROW}       # ranged stun + Cripple (QW)
    - {cap: burst_aoe,     score: 3, evidence: SPEARTHROW}       # 210 in 4m
    - {cap: peel,          score: 2, evidence: SPEARTHROW}       # stun the diver

- weapon: MAIN_SPEAR_LANCE_AVALON    # Daybreaker — the purge lance
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/spear.yaml)
  # (peel non-take removed 2026-08-21: the pool no longer grants Legbreaker peel)
  except:
    - {cap: mobility, evidence: CHARGINGBLADE}
  capabilities:
    - {cap: purge,         score: 4, evidence: LANCE_CHARGE}     # E: strips ALL buffs on the dash path — held at 2:
                                                                 # line geometry reaches fewer targets than Heavy
                                                                 # Mace's radial Battle Howl (the purge-3 benchmark)
    - {cap: engage,        score: 4, evidence: LANCE_CHARGE}     # CC-immune dash
    - {cap: mobility,      score: 4, evidence: LANCE_CHARGE}     # the dash; Inner Focus (QW)
    - {cap: burst_aoe,     score: 2, evidence: LANCE_CHARGE}     # 222 to ALL passed through — line AoE (was burst_st; taxonomy pass 2026-08-21); held at 2: leather-archetype builds, modest burst (owner)
    - {cap: catch,         score: 2, evidence: LEGBREAKER}       # (QW)
