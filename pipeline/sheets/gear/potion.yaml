# Potions, one entry per item. Gear follows the weapon sheets' rules: 1-7
# scale (2 points = one supply unit). A potion has no ability menu: each
# row cites the spell drinking it casts (items.json @consumespell, indexed
# by parse_dumps as the item's `consume` spell in gear_spells.json), so the
# lint reads its text and effects; the row stays always-on. A self-only
# cleanse grounds tankiness, not cleanse.

- gear: T6_POTION_ENERGY             # Major Energy Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: POTION_ENERGY_P5} # energy restore + cooldown rate — cast economy

- gear: T6_POTION_HEAL               # Major Healing Potion
  slot: potion
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: self_sustain,  score: 2, evidence: POTION_HEAL_P5}

- gear: T7_POTION_ACID               # Major Acid Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: resist_shred,  score: 2, evidence: POTION_ACID_P5}   # thrown: -20% damage resistances on up to 10 enemies in 5m for 5s

- gear: T7_POTION_CLEANSE2           # Major Cleansing Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 2, evidence: POTION_CLEANSE2_P5} # self-cleanse of DoTs, CC and debuffs, usable under CC (a self-only cleanse)

- gear: T7_POTION_REVIVE             # Major Gigantify Potion
  slot: potion
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: tankiness,     score: 2, evidence: POTION_MAXHP_P5}  # max health up for 6s + immune to forced movement

- gear: T7_POTION_SLOWFIELD          # Major Sticky Potion
  slot: potion
  curated_as_of: 2026-10-07
  capabilities:
    - {cap: slow,          score: 2, evidence: POTION_AOE_SLOW_P5} # tar puddle 7s: slows enemies 57%
    - {cap: damage_debuff, score: 2, evidence: POTION_AOE_SLOW_P5} # -27% damage dealt in the puddle and for 5s after leaving it

- gear: T7_POTION_STONESKIN          # Major Resistance Potion
  slot: potion
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: tankiness,     score: 2, evidence: POTION_RESISTANCE_P5}

- gear: T8_POTION_BERSERK            # Major Berserk Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: POTION_BERSERK_P5} # +20% damage 5s at -10% defense

- gear: T8_POTION_CLEANSE            # Invisibility Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: disengage,     score: 2, evidence: POTION_INVISIBILITY_P5} # self invisibility up to 7s — the escape consumable

- gear: T8_POTION_COOLDOWN           # Major Poison Potion
  slot: potion
  curated_as_of: 2026-10-07
  capabilities:
    - {cap: slow,          score: 2, evidence: POTION_POISON_P5} # one enemy: every direct hit for 4s slows it by 0.397 for 0.2s, ignoring CC resistance
    - {cap: burst_st,      score: 2, evidence: POTION_POISON_P5} # 95 true damage a second for 5s on that enemy (unmounted players)

- gear: T8_POTION_LAVA               # Major Hellfire Potion
  slot: potion
  curated_as_of: 2026-10-07
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: POTION_LAVA_P5}   # hellfire puddle 3s: true damage every 0.5s
    - {cap: heal_reduction, score: 2, evidence: POTION_LAVA_P5}  # -50% Healing Received for 3s on every enemy the 4 radius puddle touches

- gear: T8_POTION_LIFEWARD           # Major Lifeward Potion
  slot: potion
  curated_as_of: 2026-10-07
  capabilities:
    # Thrown up to 11m, a 4m circle: every allied player inside is warded
    # for 4s. A warded ally held at 1 Health instead of dying is stunned
    # 2.5s and recovers 26% of max Health at once and 21% over the stun,
    # Healing Received cut 80% meanwhile; once per ally per 180s; 150s
    # cooldown. A death floor placed on the dived allies is the
    # damage-immunity class of the anti-dive rule: Glacial Prison's
    # one-ally freeze reads 2, Salvation's twenty-ally immunity on a
    # weapon cooldown 4.
    - {cap: anti_dive,     score: 2, evidence: POTION_REVIVE_P5}

- gear: T8_POTION_TORNADO            # Major Tornado in a Bottle
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: knockback_displace, score: 2, evidence: POTION_TORNADO_P5} # tornado 4.6s: knocks back enemies touching it 8.75m, ignores CCR
