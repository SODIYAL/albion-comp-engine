# Potions, one entry per item. Gear follows the weapon sheets' rules: 1-7
# scale (2 points = one supply unit). A potion has no gear_spells menu:
# each row cites the GEAR_STATS sentinel and reads the potion's consume
# spell (items.json @consumespell; parse_dumps does not index it, so the
# text is read in the pinned dumps). A self-only cleanse grounds
# tankiness, not cleanse.

- gear: T6_POTION_ENERGY             # Major Energy Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: GEAR_STATS}       # energy restore + cooldown rate — cast economy

- gear: T6_POTION_HEAL               # Major Healing Potion
  slot: potion
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: self_sustain,  score: 2, evidence: GEAR_STATS}

- gear: T7_POTION_ACID               # Major Acid Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: resist_shred,  score: 2, evidence: GEAR_STATS}       # thrown: -20% damage resistances on up to 10 enemies in 5m for 5s

- gear: T7_POTION_CLEANSE2           # Major Cleansing Potion
  slot: potion
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 2, evidence: GEAR_STATS}       # self-cleanse of DoTs, CC and debuffs, usable under CC (a self-only cleanse)

