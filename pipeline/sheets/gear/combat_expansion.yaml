# GEAR capability sheets — combat expansion (2026-08-27, owner directive
# "add the combat pieces in"). Same rules as core.yaml: 1-7 scale, no
# score without evidence (the item's real ability id from gear_spells, or
# GEAR_STATS for consumables). Scores are calibrated against core.yaml's
# anchors (Force Field kb=3, Windwall purge=4, Enfeeble=5, blink-class
# disengage=3, sprints=2) and follow the standing directionality rulings:
# self-buffs never ground buff_allies; a SELF-cleanse grounds tankiness,
# not cleanse (Hellion Hood precedent). Rows marked "owner review" carry
# a judgment the blind round should confirm.
# Skipped on purpose: gatherer sets, decorative capes, bags, fish/economy
# food (non-combat).

