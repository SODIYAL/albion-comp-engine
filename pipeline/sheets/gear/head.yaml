  capabilities:
    - {cap: sustained_dps, score: 2, evidence: PERPETUALENERGY}  # zero energy costs 15s — cast economy window

- gear: HEAD_CLOTH_SET1              # Scholar Cowl — energy-on-damage
  slot: head
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 2, evidence: ENERGYSHIELD2}    # +38% armor/MR 4s, restores energy when hit

- gear: HEAD_CLOTH_SET2              # Cleric Cowl
  slot: head
  curated_as_of: 2026-09-10
  # Group builds wear the Cleric Cowl for Ice Block, never for its Force
  # Field: the shove is a very-small-scale pick (1v1 to 5v5) at most
  # (curation judgment), and the recording builds that name the active
  # all run Ice Block (the doctrine's observed pick, F36b). The Force Field
  # rows live in pools/head_cloth.yaml and score only where a piece's
  # doctrine pick is Force Field, so a group comp is never credited a
  # shove nobody equips (F36c; golden T47).
  capabilities:
    - {cap: tankiness,     score: 2, evidence: ICEBLOCK2}        # Ice Block: damage-immune channel, usable while CC'd

- gear: HEAD_CLOTH_SET3              # Mage Cowl
  slot: head
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: HELMET_FIREBREATH}  # cone DoT

