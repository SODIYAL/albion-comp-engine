# Head pieces, one entry per item. Gear follows the weapon sheets' rules:
# 1-7 scale (2 points = one supply unit), every nonzero score cites an
# active on the item's dumps menu (out/gear_spells.json), and every row,
# own or shared, scores on its own active (build_dataset.build_loadout).
# A piece equips ONE active, so rows on different actives are
# alternatives: an own row and a shared row of one capability never add
# (engine._merge_max). The gear-active doctrine (build_dataset
# resolve_active_doctrine, F36) picks the one that scores: the active the
# recording builds equip, else the item's own (VALIDATION.md "The
# gear-active doctrine and the gear pools"). Every hood and helmet shares
# Energizing Shield; cloth adds Force Field, leather Cleanse, plate Stone
# Skin. Those rows live in pools/head_<class>.yaml and compose into every
# item whose menu carries them; an own row with the same (cap, evidence)
# overrides the pool row, and a repeat at the same score fails
# evidence_lint. Gatherer sets are not catalogued (non-combat).

# ----------------------------------------- cloth (pools/head_cloth.yaml)
- gear: HEAD_CLOTH_AVALON            # Cowl of Purity
  slot: head
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: interrupt,     score: 2, evidence: AVALON_BEAM}      # line beam: damage + interrupts casting + shock DoT

- gear: HEAD_CLOTH_FEY               # Feyscale Hat
  slot: head
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 2, evidence: HYPER_FOCUS}      # uninterruptible + debuff immunity up to 8s
    - {cap: sustained_dps, score: 2, evidence: HYPER_FOCUS}      # channels/casts cannot be stopped — cast uptime

- gear: HEAD_CLOTH_HELL              # Fiend Cowl
