# Food, one entry per meal. Gear follows the weapon sheets' rules: 1-7
# scale (2 points = one supply unit). A meal has no gear_spells menu: each
# row cites the GEAR_STATS sentinel and reads the meal's consume spell
# (items.json @consumespell), scored on the line of the meal it varies
# (curation judgment; a food row is one coarse step). Cabbage Soup
# (out-of-combat regeneration) and Pork Pie (load and gathering) have no
# row to give and are not catalogued.

- gear: T7_MEAL_OMELETTE             # Pork Omelette
  slot: food
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: GEAR_STATS}

- gear: T7_MEAL_OMELETTE_AVALON      # Avalonian Pork Omelette
  slot: food
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: GEAR_STATS}       # cooldown rate + cast speed (+ a little defense)

