# Capes, one entry per item. Gear follows the weapon sheets' rules: 1-7
# scale (2 points = one supply unit). A cape carries no active: each row
# cites the cape's passive on its dumps menu (out/gear_spells.json), and
# the passive needs no pick. No cape passive buffs an ally, so none
# grounds buff_allies (directionality rule); a self-only cleanse grounds
# tankiness, not cleanse. The plain Cape (no combat effect) is not
# catalogued.

- gear: CAPEITEM_AVALON              # Avalonian Cape — Force Pulse
  slot: cape
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: damage_debuff, score: 2, evidence: PASSIVE_CAPE_AVALON}  # AA proc: AoE hit, -15% enemy damage 4s

