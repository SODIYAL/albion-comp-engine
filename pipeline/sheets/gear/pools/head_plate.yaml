# Actives every plate helmet shares (dumps menu: ENERGY_BARRIER,
# STONESKIN beside the item's own third active). Composed into every
# HEAD_PLATE item; each row scores on its own active
# (build_dataset.build_loadout), beside the item's own rows of the same
# capability: a helmet equips one active, so the two are alternatives,
# never a sum. An item's own row for the same (cap, evidence) pair
# overrides the shared row; a repeat at the same score fails evidence_lint.
tree: HEAD_PLATE
curated_as_of: 2026-10-03
capabilities:
  # Energizing Shield: 192 absorb for 3s, self only, 25s cooldown.
  - {cap: tankiness,     score: 1, evidence: ENERGY_BARRIER}
  # Stone Skin: +50% defence for 4s, 30s cooldown. tankiness 2, as the
  # Mage Robe's Purging Shield reads the same +50% defence for 4s.
  - {cap: tankiness,     score: 2, evidence: STONESKIN}
