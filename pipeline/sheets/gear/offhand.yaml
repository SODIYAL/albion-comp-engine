# Off-hands, one entry per item. Gear follows the weapon sheets' rules:
# 1-7 scale (2 points = one supply unit). An offhand carries no active:
# its profile is its stats (out/item_stats.json), from which classify_gear
# derives the role affinity and the build-stat channel (engine
# build_extra, mechanics.yaml build_stats) reads armor, magic resistance,
# CC resistance, spell damage, heal bonus and CC duration vs players as
# supply. Thirteen carry no rows. Five carry hand-scored GEAR_STATS rows
# (curation judgment): tankiness on the Shield, Astral Aegis, Caitiff
# Shield and Sarcophagus, whose defence stat (bonusdefensevsplayers) the
# channel does not read, and heal_sustain on the Blueflame Torch.

- {gear: OFF_BOOK, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}            # Tome of Spells — cast-time reduction

- {gear: OFF_CENSER_AVALON, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}   # Celestial Censer — +heal output, -defense

- {gear: OFF_DEMONSKULL_HELL, slot: offhand, curated_as_of: "2026-08-25", capabilities: []} # Muisak — +damage +heal output, energy tax

- gear: OFF_HORN_KEEPER              # Mistcaller — magic cooldown reduction
  slot: offhand
  curated_as_of: 2026-08-25
  # No row: no active and no ally-targeted spell, so its stat buffs the
  # wielder alone and grounds no buff_allies (directionality rule). The
  # one stat, magic cooldown reduction, feeds classify_gear's role
  # affinity; the build-stat channel does not read it as supply.
  capabilities: []

- {gear: OFF_JESTERCANE_HELL, slot: offhand, curated_as_of: "2026-08-25", capabilities: []} # Leering Cane — +CC duration vs players + CDR; the stat channel multiplies the wielder's duration-bearing CC by it, the pairing with CC-delivery weapons (published 1H Mace and Incubus tank builds wear it)

- {gear: OFF_LAMP_UNDEAD, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}     # Cryptcandle — +spell damage, -defense

- {gear: OFF_ORB_MORGANA, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}     # Eye of Secrets — book class: raw item power (725 vs 700 baseline at T4)

- gear: OFF_SHIELD                   # Shield
  slot: offhand
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: tankiness,     score: 2, evidence: GEAR_STATS}

- gear: OFF_SHIELD_AVALON            # Astral Aegis
  slot: offhand
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: tankiness,     score: 2, evidence: GEAR_STATS}

- {gear: OFF_SHIELD_CRYSTAL, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}  # Unbreakable Ward — defense + threat (crystal shield)

- gear: OFF_SHIELD_HELL              # Caitiff Shield
  slot: offhand
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: tankiness,     score: 2, evidence: GEAR_STATS}

- {gear: OFF_SPIKEDSHIELD_MORGANA, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}  # Facebreaker — defense + damage hybrid shield

- {gear: OFF_TALISMAN_AVALON, slot: offhand, curated_as_of: "2026-08-25", capabilities: []} # Sacred Scepter — book class: highest raw item power (800 at T4)

- {gear: OFF_TOME_CRYSTAL, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}    # Timelocked Grimoire — cast time + cooldowns

- {gear: OFF_TORCH, slot: offhand, curated_as_of: "2026-08-25", capabilities: []}           # Torch — attack speed + cooldowns

