# Shoes, one entry per item. Gear follows the weapon sheets' rules: 1-7
# scale (2 points = one supply unit), every nonzero score cites an active
# on the item's dumps menu (out/gear_spells.json), and every row, own or
# shared, scores on its own active (build_dataset.build_loadout). A pair
# equips ONE active, so rows on different actives are alternatives: an
# own row and a shared row of one capability never add
# (engine._merge_max), and the gear-active doctrine (build_dataset
# resolve_active_doctrine, F36) picks the one that scores. Every pair
# shares Dodge plus its class's sprint (cloth Energetic, leather
# Refreshing, plate Rejuvenating; pools/shoes_<class>.yaml); an own row
# with the same (cap, evidence) overrides the pool row, and a repeat at
# the same score fails evidence_lint. Anchors: Blink and Evasive Jump
# read disengage 3; a sprint reads mobility 2. Gatherer sets are not
# catalogued (non-combat).

