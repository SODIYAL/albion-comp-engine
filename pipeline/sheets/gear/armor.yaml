# Chest armor, one entry per item. Gear follows the weapon sheets' rules:
# 1-7 scale (2 points = one supply unit), every nonzero score cites an
# active on the item's dumps menu (out/gear_spells.json). A chest equips
# ONE active, so rows on different actives are alternatives; the
# gear-active doctrine (build_dataset resolve_active_doctrine, F36) picks
# the one that scores. Every robe shares Frost Shield and every jacket
# Inferno Shield (pools/armor_cloth.yaml, pools/armor_leather.yaml); Mend
# Wounds, on every chest, and plate's Taunt score nothing
# (pools/armor_plate.yaml). An own row with the same (cap, evidence)
# overrides the pool row. `self_costs` charges what an item costs its own
# wearer (Demon Armor). Gatherer sets are not catalogued (non-combat).

# ---------------------------------------- cloth (pools/armor_cloth.yaml)
- gear: ARMOR_CLOTH_AVALON           # Robe of Purity
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: knockback_displace, score: 3, evidence: CASTBUBBLE}  # bubble knocks back 12m
    - {cap: peel,          score: 3, evidence: CASTBUBBLE}
    - {cap: tankiness,     score: 2, evidence: FROSTSHIELD}      # +30% resists 8s, reflects + slows
    - {cap: reflect,       score: 1, evidence: FROSTSHIELD}      # 15% self-only — the smallest reflect in the game
    # (both Frost Shield rows repeat the pools/armor_cloth.yaml rows)

- gear: ARMOR_CLOTH_FEY              # Feyscale Robe
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: WILD_MAGIC}       # rotating ring of fire / magical effects
    - {cap: zone_control,  score: 2, evidence: WILD_MAGIC}
    # Wild Magic rotates three effects, a recast picks one: Ring of Fire
    # (burn, enemies flee 1s), Storm Shield (+22% resists, shocks
    # attackers), Frozen Fragments (bonus damage on direct hits).

- gear: ARMOR_CLOTH_HELL             # Fiend Robe — the fear aura
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: peel,          score: 3, evidence: FEAR_AURA}        # 4m aura: enemies flee 2s
    # No anti_dive: the aura's only structural enemy effect is
    # forced_movement, which grounds displacement (knockback_displace,
    # clump_create, peel in the effect map), not dive punishment.
    - {cap: knockback_displace, score: 2, evidence: FEAR_AURA}   # fear physically moves them off

- gear: ARMOR_CLOTH_KEEPER           # Druid Robe
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: SPELLRUSH}        # stacking +6% damage/heal per cast
    - {cap: heal_sustain,  score: 2, evidence: SPELLRUSH}        # the same stack raises Healing Cast — healer throughput CD

- gear: ARMOR_CLOTH_MORGANA          # Cultist Robe
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: self_sustain,  score: 2, evidence: LEVITATE}         # channel: restore HP+energy, +resists

- gear: ARMOR_CLOTH_ROYAL            # Royal Robe — the ground rune
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: buff_allies,   score: 3, evidence: MAGICCIRCLE}      # rune: +10% magic dmg/heal and -10% cast time per second stood on it (6 stacks), up to 6 allies (stationary; Royal Banner aura=4)

- gear: ARMOR_CLOTH_SET1             # Scholar Robe
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: SPEEDCASTER}      # -50% cast time, -50% energy cost 8s

- gear: ARMOR_CLOTH_SET2             # Cleric Robe — Everlasting Spirit
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 3, evidence: LIFESAVIOR}       # next hit triggers 3s damage immunity (Mist=3)

- gear: ARMOR_CLOTH_SET3             # Mage Robe
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: purge,         score: 2, evidence: PURGINGSHIELD2}   # reactive: purges attackers while shielded
    - {cap: tankiness,     score: 2, evidence: PURGINGSHIELD2}   # +50% defense 4s

