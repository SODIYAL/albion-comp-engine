# ------------------------------------------ plate (pools/armor_plate.yaml)
- gear: ARMOR_PLATE_AVALON           # Armor of Valor — Requite
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: tankiness,     score: 2, evidence: REFLECT_CHANNEL}  # +40% resists channel
    - {cap: anti_dive,     score: 2, evidence: REFLECT_CHANNEL}  # silences attackers 2s per hit taken

- gear: ARMOR_PLATE_FEY              # Duskweaver Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: slow,          score: 3, evidence: ARMOR_WEB}        # 5s web zone under the wearer: 35% slow, purges move-speed buffs
    - {cap: zone_control,  score: 2, evidence: ARMOR_WEB}
    - {cap: anti_dive,     score: 2, evidence: ARMOR_WEB}

- gear: ARMOR_PLATE_HELL             # Demon Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    # The aura grants magicresistance+/physicalarmor+ to ALLIES and applies
    # magicresistance-/physicalarmor- to the WEARER: Demon Armor buys the
    # group's durability with its own, so buff_allies, never tankiness.
    - {cap: buff_allies,   score: 3, evidence: REFLECTAREA}      # group resistances aura (wearer pays with their own)
    - {cap: anti_dive,     score: 2, evidence: REFLECTAREA}      # a protective aura on the allies around the wearer: +43% damage
                                                                 # resistances, half the incoming damage reflected (the anti-dive rule)
    # The only team reflect in the game: every other reflect in the
    # catalogue is self-only (it raises the caster's own resistances); this
    # one reflects 50% for the wearer AND up to 9 allies, for 6s, while
    # mobile and uninterruptible. Wearers come in twos or more
    # (interactions.yaml REFLECTAREA). Top of the reflect ladder at 6; the
    # self-only reflects sit at 1-2.
    - {cap: reflect,       score: 6, evidence: REFLECTAREA}      # 50% reflect on the whole ball (structural: reflectdamageactive, friendotherplayers)
  # SELF-COST: what the wearer PAYS, charged on the wearer's own supply
  # (engine build_extra), never the team pool. The aura cuts the wearer's
  # damage resistances by 0.37 while it runs; with 2+ wearers each stands
  # in the other's aura and nobody pays (interactions.yaml REFLECTAREA,
  # self_cost_offset_min_copies 2).
  self_costs:
    - {cap: tankiness, points: 3, evidence: REFLECTAREA}         # -0.37 own damage resistances while channelling

- gear: ARMOR_PLATE_KEEPER           # Judicator Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    # No peel: Force Shield grants allies +25% resistances and touches no
    # enemy (peel touches the enemy); buff_allies carries the grant.
    - {cap: buff_allies,   score: 3, evidence: FORCESHIELD}
    - {cap: zone_control,  score: 2, evidence: FORCESHIELD}
    - {cap: anti_dive,     score: 2, evidence: FORCESHIELD}      # a protective zone dropped on the dived allies: +25% damage
                                                                 # resistances and Healing Received for 8s (the anti-dive rule)

- gear: ARMOR_PLATE_ROYAL            # Royal Armor — the energy font chest
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: buff_allies,   score: 3, evidence: MANADRAIN}        # energy to 10 allies, scales with nearby enemies (Energy Field=3)

- gear: ARMOR_PLATE_SET1             # Soldier Armor — Fury
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: sustained_dps, score: 2, evidence: ENRAGE}           # stacking +damage +CC duration when hit

- gear: ARMOR_PLATE_SET2             # Knight Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: purge,         score: 4, evidence: WINDWALL}         # wall purges all buffs from enemies
    - {cap: peel,          score: 3, evidence: WINDWALL}         # knocks back enemies touching it 8.75m
    - {cap: anti_dive,     score: 3, evidence: WINDWALL}

- gear: ARMOR_PLATE_SET3             # Guardian Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    - {cap: damage_debuff, score: 5, evidence: ENFEEBLEAURA}     # -60% damage dealt, 7m aura, 5s — the top of the damage_debuff ladder
    - {cap: peel,          score: 3, evidence: ENFEEBLEAURA}
    # The aura also reveals invisible enemies entering it without purging
    # them, as do Stalker Hood's Mortal Agony and the Sticky Potion: no row,
    # `reveal` stays unpromoted (effect_map.yaml).

- gear: ARMOR_PLATE_UNDEAD           # Graveguard Armor — Soul Chain
  slot: armor
  curated_as_of: 2026-08-27
  capabilities:
    - {cap: clump_create,  score: 3, evidence: ARMORCHAIN}       # chain the target; pulled to the wearer if within 30m after 2.1s
    - {cap: catch,         score: 2, evidence: ARMORCHAIN}
