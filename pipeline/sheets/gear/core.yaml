  capabilities:
    # peel 4 REMOVED (owner ruling 2026-08-28). This was the HIGHEST peel score
    # on any gear in the game, and it rested entirely on Force Shield granting
    # allies +25% resistances — nothing that touches an enemy. The owner's
    # challenge ("I thought things peel would be like something that directly
    # affects enemies in some way") found it. buff_allies below is the honest
    # home for the same evidence; no score was moved or invented to replace it.
    - {cap: buff_allies,   score: 3, evidence: FORCESHIELD}
    - {cap: zone_control,  score: 2, evidence: FORCESHIELD}

- gear: ARMOR_PLATE_SET2             # Knight Armor
