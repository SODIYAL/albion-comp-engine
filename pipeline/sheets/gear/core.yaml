# GEAR capability sheets — the full-build member model (2026-08-20).
# Same rules as weapon sheets: 1-7 scale (2 points = one supply unit), no
# score without evidence. Evidence = the item's ACTIVE ability id
# (gear_spells.json menu; a player equips ONE active per piece), or the
# GEAR_STATS sentinel for statless items (capes, offhands, potions, food)
# whose contribution is always-on. Starter set = the items the guild
# doctrine names (MASTERSHEET §8); curated from the dumps descriptions.

