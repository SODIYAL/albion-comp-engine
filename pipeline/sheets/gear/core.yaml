    - {cap: peel,          score: 3, evidence: WINDWALL}         # knocks back to wall edge
    - {cap: anti_dive,     score: 3, evidence: WINDWALL}

- gear: ARMOR_PLATE_HELL             # Demon Armor
  slot: armor
  curated_as_of: 2026-08-20
  capabilities:
    # was tankiness 3 — BACKWARDS, and the weapon-only catalogue hid it: the
    # aura grants magicresistance+/physicalarmor+ to ALLIES and applies
    # magicresistance-/physicalarmor- to the WEARER. Demon Armor buys the
    # group's durability with its own. Re-cited to what it actually does.
    - {cap: buff_allies,   score: 3, evidence: REFLECTAREA}      # group resistances aura (wearer pays with their own)
    # THE ONLY TEAM REFLECT IN THE GAME (2026-08-28). Every other reflect in
    # the catalogue is self-only ("increasing YOUR damage resistances");
    # this one reflects 50% for the wearer AND up to 9 allies, for 6s, while
    # mobile and uninterruptible. That is why ZvZ comps field 3-4 of these
    # and never one (observed effect quotas: 3,3,4,3,3 across five 20-mans).
    # Top of the reflect ladder at 6; the personal stances sit at 2.
    - {cap: reflect,       score: 6, evidence: REFLECTAREA}      # 50% reflect on the whole ball (structural: reflectdamageactive, friendotherplayers)
  # SELF-COST (new field, 2026-08-28): what the wearer PAYS. The aura cuts
  # the wearer's own damage resistances by 0.37 while it runs — the model
  # recorded only the upside before, which is how "tankiness 3" survived
  # review for so long. Applied to the WEARER's own supply, never the team
  # pool, and offset when the party fields 2+ (see interactions.yaml:
  # REFLECTAREA — wearers stand in each other's auras, which is the
  # mechanism behind the never-bring-just-one rule).
  self_costs:
    - {cap: tankiness, points: 3, evidence: REFLECTAREA}         # -0.37 own damage resistances while channelling

- gear: ARMOR_PLATE_SET3             # Guardian Armor
  slot: armor
