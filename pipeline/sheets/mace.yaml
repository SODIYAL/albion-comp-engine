# Maces: one entry per weapon of the mace tree. An entry carries the
# weapon's own rows: its E (the weapon's identity) and any override of a
# shared row. The shared Q/W/passive rows (Snare Charge, Guard Rune, Air
# Compressor, Sacred Ground, Defensive Slam, Life Leech, WEAPON_STATS
# tankiness 4) live in pools/mace.yaml and compose into every mace that can
# equip them (sheets_lib.compose). Every row scores on its own spell's slot,
# a WEAPON_STATS row on every loadout (build_dataset.build_loadout): an own
# row and a shared row of one capability on different spells both score,
# and the member reads the larger, never the sum (engine._merge_max). An
# E-row comment that names a Q, W or passive spell marks that spell's share
# of the E row's score; the named spell's shared row of that capability,
# where the pool has one, still scores on its own slot (the larger reads).
# An `except:` entry is a deliberate non-take of a shared row (curation
# judgment).

- weapon: 2H_DUALMACE_AVALON         # Oathkeepers — aurora support tank
  curated_as_of: 2026-10-07
  role_hint: tank
  capabilities:
    - {cap: buff_allies,  score: 4, evidence: BLESSED_MACES}   # E: group MS aurora + 400 absorb shields + heal
    - {cap: heal_sustain, score: 2, evidence: BLESSED_MACES}   # 50 Health to 10 allies in 8m per auto-attack for 5s
    - {cap: engage,       score: 2, evidence: BLESSED_MACES}   # the aurora is a group sprint lane

- weapon: 2H_FLAIL                   # Morning Star — the mass-root field
  curated_as_of: 2026-08-12
  role_hint: tank
  capabilities:
    - {cap: root,         score: 6, evidence: ROOTFIELD}       # E: Gravitas — channeled 5m root IGNORING CC resistance
    - {cap: engage,       score: 4, evidence: ROOTFIELD}       # Close In dash into the field
    - {cap: catch,        score: 4, evidence: ROOTFIELD}       # nothing leaves Gravitas
    - {cap: peel,         score: 4, evidence: ROOTFIELD}       # cast it on the divers; W: Guard Rune (QW)
    - {cap: mobility,     score: 2, evidence: ROOTFIELD}       # the Close In dash

