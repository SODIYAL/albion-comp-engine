    - {cap: peel,       score: 6, evidence: SHRIEKMACE}    # silence and purge the divers
    - {cap: engage,     score: 4, evidence: CHARGE_ROOT}   # W: Snare Charge, an 11m leap; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9)
    - {cap: zone_control, score: 4, evidence: SACRED_GROUND}  # Q: Sacred Ground, a 3m circle for 3s; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9)

