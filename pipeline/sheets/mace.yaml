- weapon: MAIN_ROCKMACE_KEEPER       # Bedrock Mace — the air-jet wall
  curated_as_of: 2026-08-12
  role_hint: tank
  capabilities:
    - {cap: knockback_displace, score: 2, evidence: PRIMALSLAM}  # E: the jets knock enemy players back 18m: a knock-away wall, not offensive repositioning (curation judgment)
    - {cap: peel,         score: 6, evidence: PRIMALSLAM}      # the 4s jet wall knocks divers off the backline and covers the retreat: that job is peel, not disengage (self-escape), and the lint grounds knockbacks as peel (curation judgment)
    - {cap: zone_control, score: 2, evidence: PRIMALSLAM}      # the jets hold the line they occupy
    - {cap: anti_dive,    score: 2, evidence: PRIMALSLAM}      # divers get knocked 18m back; MASTERSHEET tune:sheets re-ranks this own row to 6 (golden T19); the pool's Guard Rune row keeps its 2 on the W, and the member reads the E's 6 (golden T53)
