# Bow line — remaining 3 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Longbow / Mistpiercer / Bow of Badon / Bow / Wailing Bow.

- weapon: 2H_BOW_CRYSTAL             # Skystrider Bow — untargetable perch artillery
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/bow.yaml)
  except:
    - {cap: disengage, evidence: JUMPSHOT2}
    - {cap: mobility, evidence: SPEEDSHOT2}
  capabilities:
    - {cap: disengage,     score: 4, evidence: AIR_RAID}          # E: leap to an air foothold, UNTARGETABLE 3.75s
    - {cap: burst_aoe,     score: 4, evidence: AIR_RAID}          # 123 AoE bolts, recastable x3
    - {cap: mobility,      score: 4, evidence: AIR_RAID}          # the leap repositions; W: Speed Shot

- weapon: 2H_LONGBOW_UNDEAD          # Whispering Bow — glass-cannon AA bow
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/bow.yaml)
  except:
    - {cap: sustained_dps, evidence: WEAPON_STATS}
  capabilities:
    - {cap: sustained_dps, score: 6, evidence: UNDEADARROWS}      # E: +35% AA range/speed +50 bonus damage per AA
    # E costs -35% own Defense: the glass side of the cannon, unscoreable

- weapon: 2H_WARBOW                  # Warbow — skillshot nuke bow
  curated_as_of: 2026-08-12
  role_hint: range
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SKILLSHOT_STUN}    # E: Magic Arrow 232, CD refund on hit
