# Shapeshifter staffs: one entry per weapon of the shapeshifterstaff tree,
# carrying the weapon's own rows: its E (the weapon's identity) and any
# override of a shared row. The tree's Q/W/passive rows (Pulse Shock,
# Adapting Matter, Positional Drift, Distortion, Tether Shift, Polymorph,
# the Altered Beast passive) live in pools/shapeshifterstaff.yaml and
# compose into every weapon that can equip them (sheets_lib.compose). Form
# abilities are the payload: each E is scored on its form's stat line, its
# described mechanics and the form's own ability text, which sits on no
# equip menu (audit_form_abilities.py prints it; effect_overrides.yaml
# quotes it for each capability the lint checks). Most `except:` entries
# leave off a shared row whose capability the weapon's own row already
# carries: one slot per capability (VALIDATION.md 10, Form abilities and
# ally protection graded). An E-row comment that names a Q/W spell or a
# passive marks that spell's share of the E row's score.

- weapon: 2H_SHAPESHIFTER_AVALON     # Lightcaller — flying bomber
  curated_as_of: 2026-10-04
  role_hint: range
  # deliberate non-takes of shared rows (pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_aoe,     score: 5, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # Dawnbird: Judgment 350 in a 7 radius (30s, two Shift Charges),
                                                                            # Piercing Light 130 along a beam; above the ladder's 4 (232-264)
    - {cap: mobility,      score: 4, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # airborne, root-immune, +60% MS
    - {cap: disengage,     score: 4, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # fly out over what melee can't cross
    - {cap: engage,        score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}

- weapon: 2H_SHAPESHIFTER_CRYSTAL    # Stillgaze Staff — cobra skirmisher
  curated_as_of: 2026-10-04
  role_hint: range
  # deliberate non-takes of shared rows (pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Cobra strikes
    - {cap: disengage,     score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Slippery: self-cleanse + MS on CC
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}
    - {cap: stun,          score: 4, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Serpent's Gaze: a 3s channel petrifies unmounted enemies
                                                                          # (ignores CC resistance, cannot be cleansed); 30s, two Shift Charges
    - {cap: heal_reduction, score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA} # Crystalburst: -20% Healing Received in a 4 radius (via override)
    - {cap: damage_debuff, score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Neurotoxin: poisoned enemies deal 12% less damage (via override)
    # Slippery is a SELF-cleanse — never scored as the ally-cleanse capability

# Hellspawn Staff: shapeshifter AoE bomber. The E transforms into a
# Hellfire Imp ("Offensive: very high / Defensive: very low") with a
# cheat-death: at 3+ Shift Charges, lethal damage instead heals a share of
# Max Health while damage-immune. The human-form kit is utility: shields, a
# 5-target pull, Polymorph, a slow cloud. Not scored: stun (the cheat-death
# stuns the wielder, a drawback; the flag is suppressed), heal_sustain
# (Return from Hell heals the wielder alone: self_sustain) and buff_allies
# or tankiness from Altered Beast, a self-only Health grant (buff_allies
# comes from Adapting Matter's 5-ally absorb shield). Damage caps ground on
# the E: the imp-form spells are the weapon's real output and are not
# separately equippable.

- weapon: 2H_SHAPESHIFTER_HELL       # Hellspawn Staff — shapeshifter AoE bomber
  curated_as_of: 2026-10-04
  role_hint: range
  # self_sustain and mobility sit on the E (Return from Hell, Fireflash Orb's teleport): one slot per capability
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_aoe,     score: 4, evidence: SHAPESHIFT_IMP}   # E: imp-form fire AoE is the payload
    - {cap: self_sustain,  score: 4, evidence: SHAPESHIFT_IMP}   # cheat-death heal; passive: Altered Beast's health stacks
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_IMP}   # Fireflash Orb: the recast teleports the imp to the explosion (via override)
    - {cap: burst_st,      score: 2, evidence: SHAPESHIFT_IMP}   # Hellfire Barrage: a single-target channel, 30 every 0.2s (12s, three Shift Charges)
    # Melting Point's lava puddle: no row (curation judgment)

- weapon: 2H_SHAPESHIFTER_KEEPER     # Earthrune Staff — the golem tank
  curated_as_of: 2026-10-04
  role_hint: tank
  # deliberate non-takes of shared rows (pools/shapeshifterstaff.yaml);
  # self_sustain and clump_create sit on the E (Giant Consumption, Tectonic Shift): one slot per capability
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}  # no own mobility row: withholds Tether Shift's mobility (curation judgment)
    - {cap: clump_create, evidence: SHAPE_W_AREA_PULL}
  capabilities:
    - {cap: tankiness,     score: 6, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Golem: "Defensive: high", forced-movement
                                                                           # immune, charge-scaled Max Health
    - {cap: self_sustain,  score: 4, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # max/current Health grant on transform
    - {cap: engage,        score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # the golem walks in and cannot be moved
    - {cap: stun,          score: 4, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Boulder Crash: 1.2s stun in a 3.5 radius on a 4s cooldown (via override)
    - {cap: clump_create,  score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Tectonic Shift: enemies between the wall and the golem are pulled in (via override)
    - {cap: knockback_displace, score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # the wall knocks back 2; Tectonic Slam throws a 6 radius in the air (via override)
    - {cap: max_health_cut, score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL} # Tectonic Slam's Rune: -10% Max and Current Health inside, 5s

- weapon: 2H_SHAPESHIFTER_MORGANA    # Bloodmoon Staff — the werewolf
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of shared rows (pools/shapeshifterstaff.yaml)
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: catch, evidence: SHAPE_W_AREA_PULL}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_WEREWOLF}  # wolf melee combos
    - {cap: catch,         score: 4, evidence: SHAPESHIFT_WEREWOLF}  # wolf lunges run targets down
    - {cap: mobility,      score: 4, evidence: SHAPESHIFT_WEREWOLF}
    - {cap: self_sustain,  score: 2, evidence: SHAPESHIFT_WEREWOLF}  # Bloody Roar lifesteal below 40%

- weapon: 2H_SHAPESHIFTER_SET1       # Prowling Staff — the stealth panther
  curated_as_of: 2026-10-04
  role_hint: melee
  # deliberate non-takes of shared rows (pools/shapeshifterstaff.yaml);
  # mobility sits on the E (Sinister Swipes, Pounce): one slot per capability
  except:
    - {cap: zone_control, evidence: SHAPE_W_DAMAGE_AOE}  # no own zone_control row: withholds Distortion's zone_control (curation judgment)
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_PANTHER}  # pounce out of stealth
    - {cap: engage,        score: 4, evidence: SHAPESHIFT_PANTHER}  # On the Prowl invisibility opener (via override)
    - {cap: disengage,     score: 4, evidence: SHAPESHIFT_PANTHER}  # restealth and leave (via override)
    - {cap: execute,       score: 2, evidence: SHAPESHIFT_PANTHER}  # panther-form low-HP hunter kit (curation judgment)
    - {cap: heal_reduction, score: 2, evidence: SHAPESHIFT_PANTHER} # Infected Scrapes: -4% Healing Received a stack, five stacks (via override)
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_PANTHER}  # three charges through the target and the Pounce leap (via override)

# Rootbound Staff: group-sustain shapeshifter. The E (Sylvian
# Transformation) grants up to +8% Max AND Current Health to allies in 11m
# on transform (Growth). The form's two abilities are the payload and are
# scored on the E:
#   Seedling's Bloom — a ground heal zone cast at 12m on a 3s cooldown:
#     allies inside heal every second for 8s (7 a tick; 14 a tick and +10%
#     Max and Current Health in the grown Bloom a Shift Charge buys).
#   Barbed Roots — a 3s uninterruptible, damage-immune channel on a 30s
#     cooldown (three Shift Charges, castable while stunned or silenced):
#     allies within 11m gain a 175 absorb shield and Forced Movement
#     immunity for 3s; enemies within 11m are slowed by 50% and take 44
#     every 0.7s. The live description carries no cleanse (the ability's
#     retired text did).

- weapon: 2H_SHAPESHIFTER_SET2       # Rootbound Staff — group-sustain shapeshifter
  curated_as_of: 2026-10-04
  role_hint: support
  # buff_allies, peel, slow and anti_dive sit on the E (Growth, Barbed Roots): one slot per capability
  except:
    - {cap: buff_allies, evidence: SHAPE_Q_DAMAGE_AND_SHIELD}
    - {cap: peel, evidence: SHAPE_W_POLYMORPH}
    - {cap: slow, evidence: SHAPE_W_DAMAGE_AOE}
    - {cap: anti_dive, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: buff_allies,   score: 4, evidence: SHAPESHIFT_ENT}   # E: Growth +8% Max/Current HP, 11m (via override);
                                                                 # Barbed Roots: 175 absorb on allies in 11m;
                                                                 # Q: Adapting Matter's ally shields
    - {cap: heal_sustain,  score: 4, evidence: SHAPESHIFT_ENT}   # Seedling's Bloom: 8s heal zone on a 3s cooldown,
                                                                 # +10% Max/Current HP grown; Growth's Current-Health grant
    - {cap: peel,          score: 2, evidence: SHAPESHIFT_ENT}   # Barbed Roots: Forced Movement immunity for allies in 11m (via override)
    - {cap: slow,          score: 2, evidence: SHAPESHIFT_ENT}   # Barbed Roots: -50% on enemies in 11m for the 3s channel (via override)
    - {cap: anti_dive,     score: 2, evidence: SHAPESHIFT_ENT}   # Barbed Roots: the shield lands on the dived allies and the
                                                                 # slow on the divers standing among them (via override)

- weapon: 2H_SHAPESHIFTER_SET3       # Primal Staff — the enrage bear
  curated_as_of: 2026-10-04
  role_hint: melee
  # self_sustain, mobility, resist_shred and peel sit on the E (the bear form, its Wild Onslaught and Roar): one slot per capability
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
    - {cap: resist_shred, evidence: SHAPE_Q_CONE_MELEE}
    - {cap: peel, evidence: SHAPE_W_POLYMORPH}
  capabilities:
    - {cap: tankiness,     score: 4, evidence: WEAPON_STATS}   # the bear form's "Defensive: high" (SHAPESHIFT_BEAR's text): a bruiser frame
    - {cap: burst_aoe,     score: 2, evidence: SHAPESHIFT_BEAR}  # bear swipes
    - {cap: sustained_dps, score: 2, evidence: SHAPESHIFT_BEAR}  # Enrage ramps below 40% Health
    - {cap: self_sustain,  score: 2, evidence: SHAPESHIFT_BEAR}
    - {cap: stun,          score: 2, evidence: SHAPESHIFT_BEAR}  # Feral Bash: 0.9s stun in a 4 radius for a Shift Charge (via override)
    - {cap: resist_shred,  score: 2, evidence: SHAPESHIFT_BEAR}  # Wild Onslaught: -15% damage resistances for 3s (via override)
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_BEAR}  # the Wild Onslaught dash (via override)
    - {cap: peel,          score: 2, evidence: SHAPESHIFT_BEAR}  # Roar: enemies in the cone flee for 1s (via override)
    # Swipes' 20% slow for 1s: no row (curation judgment)
