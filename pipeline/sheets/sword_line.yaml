# Sword line — remaining 5 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Dual Swords / Carving Sword / Kingmaker.

- weapon: 2H_CLAYMORE                # Claymore — immune-charge duellist
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/sword.yaml)
  except:
    - {cap: catch, evidence: HAMSTRINGSWORD}
    - {cap: mobility, evidence: HEROICSTRIKE2}
  capabilities:
    - {cap: engage,        score: 3, evidence: CLAYMORECHARGE}    # E: CC+debuff+damage-immune 1s charge
    - {cap: catch,         score: 2, evidence: CLAYMORECHARGE}    # charge + 0.8s CC-resist-ignoring stun
    - {cap: mobility,      score: 2, evidence: CLAYMORECHARGE}    # charge + Q dash
    - {cap: stun,          score: 1, evidence: CLAYMORECHARGE}    # 0.8s on impact
    - {cap: burst_st,      score: 1, evidence: CLAYMORECHARGE}    # charge-scaled impact

