# Boltcasters — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 3 sightings, dominant role: range.
#
# Identity: single-target melter. The E (Deathward Climax) is a ramping
# barrage channel — 30 per 0.3s, growing per hit up to 12 stacks — pure
# focus-fire pressure. Shares the crossbow Q/W pool with Energy Shaper /
# Siegebow; QW-conditional scores mirror those sheets.

- weapon: 2H_DUALCROSSBOW_HELL       # Boltcasters — single-target melter
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/crossbow.yaml)
  except:
    - {cap: sustained_dps, evidence: WEAPON_STATS}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: DUAL_RAPIDFIRE}    # E: ramping barrage into one target
    - {cap: sustained_dps, score: 4, evidence: DUAL_RAPIDFIRE}    # E + Q: Auto Fire channel pattern
