    - {cap: peel,          score: 1, evidence: SHAPE_W_TETHERBEAM} # W: tether-pull a party ally OUT; Polymorph a diver (QW)
    - {cap: buff_allies,   score: 1, evidence: SHAPE_Q_DAMAGE_AND_SHIELD}  # Q: 150 absorb shield on 5 allies (QW)
    - {cap: zone_control,  score: 1, evidence: SHAPE_W_DAMAGE_AOE}  # W: Distortion cloud, 3s DoT + slow (QW)
