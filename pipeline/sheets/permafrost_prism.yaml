# Permafrost Prism — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 12 sightings, top uncurated at batch-2 start.
#
# Replaces the illustrative §2.3 block (burst_aoe 3, zone_control 3, slow 2,
# clump_create 2, root 1, mobility 1, tankiness 1). Differences, for expert review:
#   - clump_create DROPPED: nothing in the kit pulls or stacks enemies — the E
#     holds an existing clump still (stun); that is filed as stun/peel, not
#     clump creation. If shotcallers treat "frozen in place for the bomb" as
#     clump equivalent, restore it here.
#   - zone_control KEPT at 3: Frost Bomb + Frozen Surge + Obelisk + the E area
#     is the widest ground-denial kit curated so far — Longbow holds 2 on a
#     single channeled zone. Frost is the zone line; 3 is the honest ceiling.
#   - tankiness DROPPED: draft evidence (FROST_LANCE "prose:shield") is a
#     misread — Frost Lance SHREDS enemy resistances, it shields nothing.
#   - stun/peel/catch ADDED: the E is a large-radius AoE stun the illustrative
#     block never scored as CC.
# Draft's `damage_debuff` (Frost Beam AA-speed debuff) held at 0: the cap was
# promoted into §2.2 (2026-08-12) but small W-option carriers await expert weighting.
# No engage scored: a ranged stun can start a fight, but initiation-by-dive is
# not this kit's job — flag for expert if the templates disagree.

- weapon: 2H_ICECRYSTAL_UNDEAD       # Permafrost Prism — AoE stun-bomb mage
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: range
  capabilities:
    - {cap: burst_aoe,     score: 3, evidence: FROST_ULTIMATE}      # E: Ice Crystal — AoE stun, then 173 AoE explosion
    - {cap: stun,          score: 2, evidence: FROST_ULTIMATE}      # E: 1s AoE stun, large radius (W: Frost Nova stuns too)
    - {cap: peel,          score: 1, evidence: FROST_ULTIMATE}      # E on divers is real but OPPORTUNISTIC — it competes
                                                                    # with the offensive use; dedicated peel tools (Guard
                                                                    # Rune, Divine Jump) sit at 2-3 on this ladder
    - {cap: catch,         score: 2, evidence: FROST_ULTIMATE}      # ranged AoE lockdown; Q: Frostbite stacks to a stun
    - {cap: zone_control,  score: 3, evidence: FROSTBOMB_CASTSLOW}  # W: Frost Bomb + Q: Frozen Surge + W: Obelisk + E area (QW)
    - {cap: slow,          score: 2, evidence: FROSTBOMB_CASTSLOW}  # nearly every Q/W in the kit slows (QW)
    - {cap: root,          score: 1, evidence: PASSIVE_FROST}       # PASSIVE: every 4th cast, next AA roots
    - {cap: disengage,     score: 1, evidence: FROSTNOVA}           # W: Frost Nova teleport + brief damage immunity (QW)
    # mobility DROPPED (illustrative had 1): the only movement in the kit is
    # Frost Nova's teleport, which the effect map classes as engage/disengage
    # repositioning, not sustained mobility — disengage 1 above covers it.
    - {cap: resist_shred,  score: 1, evidence: FROST_LANCE}         # W: -12% resistances for 3s (QW)
    - {cap: buff_allies,   score: 1, evidence: ICE_SCULPTURE}       # W: Obelisk +20% dmg & CDR to 10 allies (QW)
    - {cap: sustained_dps, score: 1, evidence: WEAPON_STATS}        # burst-oriented kit; modest between-E pressure
