# Knuckles line — remaining 7 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the Battle Bracers sheet (dash-combo Qs, Backhand,
# Counter, Devastating Combo, Triple Kick).
#
# 2026-08-12 expert correction (owner): Triple Kick "Pulls up to 1 enemy
# player along with you" — the ZvZ "kidnap" (drag a healer/tank into your
# team). Drag/pull CREATES clumps per the standing ruling, so clump_create 1
# (QW) added line-wide. Black Hands is NOT in this pool (own W row, no
# Triple Kick). Corroborated by Timothy's blap comp ("kidnap healers or
# overcommitted tanks" on Ursine Maulers, running w1 = Triple Kick).

- weapon: 2H_KNUCKLES_AVALON         # Fists of Avalon — purifying diver
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/knuckles.yaml)
  except:
    - {cap: knockback_displace, evidence: BACKHAND_KNOCKBACK}
    - {cap: engage, evidence: DASHKICK}
    - {cap: mobility, evidence: DASHKICK}
  capabilities:
    - {cap: engage,        score: 4, evidence: TRIPLECOMBO_DIVEKICK}  # E: CC-immune dive kick
    - {cap: knockback_displace, score: 2, evidence: TRIPLECOMBO_DIVEKICK}  # air-throw — no travel; Backhand is single-target (QW) (magnitude pass 2026-08-13)
    - {cap: purge,         score: 3, evidence: TRIPLECOMBO_DIVEKICK}  # Purifying Fist strips ALL buffs — the true-purge benchmark above shield-break (owner ruling 2026-08-21; was 2)
    - {cap: mobility,      score: 4, evidence: TRIPLECOMBO_DIVEKICK}  # dive + Q dashes
    - {cap: disengage,     score: 2, evidence: TRIPLECOMBO_DIVEKICK}

- weapon: 2H_KNUCKLES_CRYSTAL        # Forcepulse Bracers — pulse-stack burster
  curated_as_of: 2026-08-12
