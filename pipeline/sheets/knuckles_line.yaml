# Knuckles line — remaining 7 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the Battle Bracers sheet (dash-combo Qs, Backhand,
# Counter, Devastating Combo, Triple Kick).
#
# 2026-08-12 expert correction (owner): Triple Kick "Pulls up to 1 enemy
# player along with you" — the ZvZ "kidnap" (drag a healer/tank into your
# team). Drag/pull CREATES clumps per the standing ruling, so clump_create 1
# (QW) added line-wide. Black Hands is NOT in this pool (own W row, no
# Triple Kick). Corroborated by Timothy's blap comp ("kidnap healers or
# overcommitted tanks" on Ursine Maulers, running w1 = Triple Kick).

- weapon: 2H_KNUCKLES_AVALON         # Fists of Avalon — purifying diver
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: engage,        score: 2, evidence: TRIPLECOMBO_DIVEKICK}  # E: CC-immune dive kick
    - {cap: knockback_displace, score: 2, evidence: TRIPLECOMBO_DIVEKICK}  # air-throw + Backhand (QW)
    - {cap: purge,         score: 1, evidence: TRIPLECOMBO_DIVEKICK}  # Purifying Fist strips buffs
    - {cap: mobility,      score: 2, evidence: TRIPLECOMBO_DIVEKICK}  # dive + Q dashes
    - {cap: disengage,     score: 1, evidence: TRIPLECOMBO_DIVEKICK}
    - {cap: peel,          score: 1, evidence: BACKHAND_KNOCKBACK}  # (QW)
    - {cap: catch,         score: 1, evidence: DASHKICK}       # (QW)
    - {cap: clump_create,  score: 1, evidence: TRIPLE_KICK}    # W: pulls 1 enemy player along the dash — the kidnap (QW)
    - {cap: burst_st,      score: 1, evidence: KNUCKLECOMBO}   # (QW)
    - {cap: stun,          score: 1, evidence: KNUCKLECOMBO}   # (QW)
    - {cap: resist_shred,  score: 1, evidence: BACKHAND_KNOCKBACK}  # (QW)
    - {cap: sustained_dps, score: 2, evidence: PASSIVE_KNUCKLE_BRAWLER_SPEED}

