    - {cap: burst_st, evidence: KNUCKLECOMBO}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: CONEPUNCH2}     # E: dash + pulse charges on everything you do
    - {cap: max_health_cut, score: 2, evidence: CONEPUNCH2}    # -3% max/current Health x5 stacks (was execute; taxonomy ruling 2026-08-21)
    - {cap: mobility,      score: 4, evidence: CONEPUNCH2}     # recastable dash + Q dashes
    - {cap: engage,        score: 2, evidence: CONEPUNCH2}

