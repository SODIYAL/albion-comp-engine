# Arcane staffs — one entry per weapon of the arcanestaff tree, carrying the
# weapon's E (its identity) and any override of a shared row. The tree's
# shared Q/W/passive rows (Arcane Protection, Magic Shock; Motivating
# Cleanse, Frazzle, Empowering Beam; Lingering Power) live in
# pools/arcanestaff.yaml and compose into every arcane staff that can equip
# them (sheets_lib.compose). The utility tree: five of its eight weapons sit
# outside the pure_dps role set (templates/scoring.yaml). Most `except:`
# entries leave off a shared row whose capability the weapon's own row
# already carries (one slot per capability, T53). An E-row comment that
# names a Q/W spell marks that spell's share of the E row's score.

- weapon: 2H_ARCANESTAFF             # Great Arcane Staff — the time-freeze support
  curated_as_of: 2026-08-12
  role_hint: support
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: peel, evidence: SHIELDFRIENDLY}
    - {cap: anti_dive, evidence: SHIELDFRIENDLY}
  capabilities:
    - {cap: stun,         score: 4, evidence: TIME_FREEZE}    # E: 2.5s AoE stasis, ignores CC resistance
    - {cap: peel,         score: 4, evidence: TIME_FREEZE}    # freeze the dive (targets are damage-immune too)
    - {cap: buff_allies,  score: 4, evidence: EMPOWERBEAM}    # W: stacking ally damage channel; override of the pool's 2 (QW)
    - {cap: anti_dive,    score: 2, evidence: TIME_FREEZE}    # divers get frozen out of their window

- weapon: 2H_ARCANESTAFF_CRYSTAL     # Astral Staff — starfall artillery
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: sustained_dps, evidence: PASSIVE_ATTACKBUFF_ARCANESTAFF}
  capabilities:
    - {cap: burst_aoe,    score: 4, evidence: STARFALL_DOT}   # E: 63/0.6s in 8m around the caster
    - {cap: zone_control, score: 2, evidence: STARFALL_DOT}   # standing in the shower is a choice
    - {cap: sustained_dps, score: 4, evidence: STARFALL_DOT}  # channel + Lingering Power weave

- weapon: 2H_ARCANESTAFF_HELL        # Occult Staff — the corridor enabler
  curated_as_of: 2026-08-12
  role_hint: support
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: buff_allies, evidence: EMPOWERBEAM}
  capabilities:
    - {cap: buff_allies,  score: 4, evidence: ARCANECORRIDOR} # E: +60% MS/AA speed corridor for the group, 8s
    - {cap: engage,       score: 4, evidence: ARCANECORRIDOR} # the corridor IS how the comp commits
    - {cap: slow,         score: 4, evidence: ARCANECORRIDOR} # -30% on enemies inside
    - {cap: zone_control, score: 2, evidence: ARCANECORRIDOR}

- weapon: 2H_ARCANE_RINGPAIR_AVALON  # Evensong — aura-debuff artillery
  curated_as_of: 2026-08-25
  role_hint: range
  capabilities:
    # heal_reduction 3: the Dark Auras cut Healing Received 15% in 5r around
    # up to 3 enemies for 5s, stacking 3x to -45% on overlap — weaker than the
    # class that holds 4 (Rotcaller's 100% negate, the -40/-50% one-shots;
    # heal-cut ladder, VALIDATION.md 08, Round 9; curation judgment).
    - {cap: heal_reduction, score: 3, evidence: ARCANE_METEOR}  # E: Dark Auras, -15% Healing Received, x3
    # burst_aoe 2: 112 in 5r sits below the E-damage ladder's 2-anchor
    # (Trinity Spear 191 in 3r = 2; Bracers/Fists 264/232 = 4; VALIDATION.md
    # C7-E); the identity is the aura blanket, not the hit.
    - {cap: burst_aoe,    score: 2, evidence: ARCANE_METEOR}  # 112 in 5r
    - {cap: slow,         score: 2, evidence: ARCANE_METEOR}  # aura slow 15%, stacks 3x
    - {cap: damage_debuff, score: 2, evidence: ARCANE_METEOR}  # Dark Aura: -15% damage dealt around 3 enemies, stacks 3x

- weapon: 2H_ENIGMATICORB_MORGANA    # Malevolent Locus — the cleanse bubble
  curated_as_of: 2026-10-04
  role_hint: support
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: cleanse, evidence: CLEANSESPEED2}
    - {cap: peel, evidence: SHIELDFRIENDLY}
    - {cap: anti_dive, evidence: SHIELDFRIENDLY}
  capabilities:
    - {cap: cleanse,      score: 4, evidence: VOID}           # E: growing bubble, CONTINUOUS group cleanse
    - {cap: peel,         score: 2, evidence: VOID}           # the divers' CC on allies inside it is cleansed
    - {cap: anti_dive,    score: 2, evidence: VOID}           # the bubble is a protective zone for the allies inside: +30% damage
                                                              # resistances beside the cleanse (the anti-dive rule, via override)

- weapon: 2H_ENIGMATICSTAFF          # Enigmatic Staff — the bubble-shield support
  curated_as_of: 2026-10-04
  role_hint: support
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: buff_allies, evidence: EMPOWERBEAM}
    - {cap: anti_dive, evidence: SHIELDFRIENDLY}
  capabilities:
    - {cap: buff_allies,  score: 4, evidence: INVULNERABILITY}  # E: refreshing 240 absorb bubble (via override)
    - {cap: anti_dive,    score: 4, evidence: INVULNERABILITY}  # the bubble is cast from 14m onto the dived ally and re-applies
                                                                # every second in 6.5m around them: the dive loses its kill
                                                                # (the anti-dive rule, via override)

- weapon: MAIN_ARCANESTAFF           # Arcane Staff (1H) — the purge orb
  curated_as_of: 2026-08-12
  role_hint: support
  # deliberate non-takes of shared rows (pools/arcanestaff.yaml)
  except:
    - {cap: silence, evidence: MAGICSHOCK}
  capabilities:
    - {cap: purge,        score: 4, evidence: ARCANEORB2}     # E: purges all buffs in 6r where the skillshot orb hits
    - {cap: silence,      score: 4, evidence: ARCANEORB2}     # 1.68s AoE on the same orb; Q: Magic Shock (QW)
    - {cap: burst_st,     score: 2, evidence: ARCANEORB2}     # modest orb damage

# Witchwork Staff (1H) — utility clump mage. The E (Black Hole) pulls every
# enemy in its radius to the centre (161 damage, 16% slow for 5s; T12 keeps
# its clump_create at 4 or more), beside the shared ally shield, damage
# empowerment and group cleanse. Not scored: energy_drain (no Q, W, E or
# passive on the menu drains energy).

- weapon: MAIN_ARCANESTAFF_UNDEAD    # Witchwork Staff — utility clump mage
  curated_as_of: 2026-08-12
  role_hint: support
  capabilities:
    - {cap: clump_create, score: 4, evidence: BLACKHOLE}      # E: pulls everything in radius to center
    - {cap: burst_aoe,    score: 4, evidence: BLACKHOLE}      # 161 on the pull; Q: Chain Missile bounces
    - {cap: buff_allies,  score: 4, evidence: EMPOWERBEAM}    # W: stacking +8%x10 ally damage channel; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: peel,         score: 4, evidence: SHIELDFRIENDLY} # Q: ally shield + forced-movement immunity; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9)
    - {cap: slow,         score: 2, evidence: BLACKHOLE}      # E: 16% for 5s
    - {cap: catch,        score: 2, evidence: BLACKHOLE}      # the pull is the catch
    - {cap: zone_control, score: 2, evidence: BLACKHOLE}      # brief area threat — modest
