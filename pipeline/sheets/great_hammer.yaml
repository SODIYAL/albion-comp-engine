# Great Hammer — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 5 sightings, dominant role: tank. Replaces the illustrative §2.3
# block (tankiness 2, engage 3, clump_create 3, stun 2, zone_control 2, peel 1).
#
# Identity: the engage/disrupt tank. The E (Tackle) dashes through the enemy
# line, knocking back everyone on the path and stunning them 2.35s, with the
# cooldown refunded per enemy player hit — engage, displacement and stun in
# one spammable button.
#
# EXPERT CORRECTION 2026-08-13: clump_create 3 REMOVED. Dumps text says
# "knocking back all enemies you pass through" — a knockback along the dash
# line DISPLACES enemies, it does not compress them to a point the way a
# drag/pull does (Hand of Justice's Onslaught, Camlann's Vendetta, Black
# Hole). Same ruling that stripped Grovekeeper and Permafrost: knock-ups/
# knockbacks/stuns HOLD or SCATTER, only drag/pull mechanics CREATE clumps.
# The displacement stays scored as knockback_displace 2; the stun holds
# clumps others make. This overrules the design doc's §2.3-era "Great
# Hammer clumps" example and the HAMMERTACKLE override (tombstoned there).
# Golden T12 pins this.
#
# Shares the hammer Q/W pool with the Polehammer sheet — QW-conditional
# scores (slow/anti_dive/zone via Inertia Ring, purge/shred via Iron Breaker,
# knock-up via Power Geyser, Life Leech) mirror it exactly.
#
# Differences vs the illustrative block, for expert review:
#   - zone_control 2 -> 1: same W pool as Polehammer (scored 1); nothing in
#     the kit denies ground beyond the Inertia Ring.
#   - peel 1 -> 2: Tackle + Power Geyser + Knockout + the ring is more
#     defensive tooling than the illustrative sketch credited.
#   - knockback_displace ADDED (E structured, enemy-directed, verified).

- weapon: 2H_HAMMER                  # Great Hammer — the clump engine
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/hammer.yaml)
  except:
    - {cap: disengage, evidence: CHARGESLOWAE}
    - {cap: engage, evidence: CHARGESLOWAE}
    - {cap: mobility, evidence: CHARGESLOWAE}
    - {cap: knockback_displace, evidence: GEYSER}
  capabilities:
    - {cap: engage,        score: 6, evidence: HAMMERTACKLE}     # E: dash-through, CD refund per player hit
    # clump_create removed 2026-08-13 (expert): knockback != pull — see header
    - {cap: stun,          score: 4, evidence: HAMMERTACKLE}     # 2.35s on everyone tackled; Stunning Strike passive
    - {cap: knockback_displace, score: 2, evidence: HAMMERTACKLE}  # dumps: knockback "by 2" (meters) — minor; W: Geyser knock-up (magnitude pass 2026-08-13)
    - {cap: peel,          score: 4, evidence: HAMMERTACKLE}     # tackle a diver; W: Knockout, Geyser, ring
    - {cap: catch,         score: 4, evidence: HAMMERTACKLE}     # dash + stun = caught
    - {cap: mobility,      score: 4, evidence: HAMMERTACKLE}     # the E is a real dash; W: Slowing Charge
    - {cap: disengage,     score: 4, evidence: HAMMERTACKLE}     # tackle OUT through the line, stunning pursuit
