    - {cap: slow,          score: 4, evidence: IMPULSE_PUNCH}  # 2s cone slow
    - {cap: catch,         score: 2, evidence: IMPULSE_PUNCH}
    - {cap: peel,          score: 2, evidence: IMPULSE_PUNCH}
