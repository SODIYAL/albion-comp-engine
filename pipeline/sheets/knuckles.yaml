# Battle Bracers — combo brawler. The E (Falcon Smash) floats CC-immune for up
# to 3s, then dives: "Deals physical damage within a 4 radius upon impact"
# (264 vs players), so the E damages everyone it lands on (burst_aoe 4, the
# moderate AoE class; T31 pins its group-scale verdict). Three of the four Qs
# dash; the W row carries Counter (Defense +300%, 150% reflect), Backhand
# Strike's 9m knockback and the Devastating Combo stun punch.

- weapon: 2H_KNUCKLES_SET2           # Battle Bracers — combo brawler
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: mobility,      score: 6, evidence: DIVEPUNCH_RISE}   # E float-dive; Q dashes; W: Triple Kick
    - {cap: engage,        score: 4, evidence: DIVEPUNCH_RISE}   # CC-immune float into a dive
    - {cap: disengage,     score: 4, evidence: DIVEPUNCH_RISE}   # the float IS the escape window
    - {cap: catch,         score: 4, evidence: DIVEPUNCH_RISE}   # Q: Dragon Leap; W: Triple Kick drag
    - {cap: burst_st,      score: 4, evidence: KNUCKLECOMBO}     # W: 30+153 punch combo; Q: Create Opening; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: burst_aoe,     score: 4, evidence: DIVEPUNCH_RISE}   # E impact: 264 phys in a 4 radius (T31)

- weapon: 2H_KNUCKLES_SET3           # Spiked Gauntlets — armor-punisher cone
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
