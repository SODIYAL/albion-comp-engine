# War gloves — one entry per weapon of the knuckles tree, carrying the
# weapon's E (its identity) and any override of a shared row. The tree's
# shared Q/W/passive rows (Dragon Leap; Triple Kick, Backhand Strike,
# Counter, Devastating Combo; the Fatal Fury passives) live in
# pools/knuckles.yaml and compose into every knuckles weapon that can equip
# them (sheets_lib.compose). Black Hands is the exception: a knuckles weapon
# on the dagger menu that takes the dagger pool's spell rows (its entry says
# how). Every row scores on its own spell (build_dataset.build_loadout): an
# own row and a shared row of the same capability on different spells both
# score, and the member reads the larger, never the sum (engine._merge_max,
# F43). An E-row comment that names a Q/W spell or a passive marks that
# spell's share of the E row's score; the named spell's shared row, where it
# has one, still scores on its own slot, and the larger reads.

- weapon: 2H_IRONGAUNTLETS_HELL      # Black Hands — combo striker
  curated_as_of: 2026-08-12
  role_hint: melee
  # Removed from the game (asserted, not detected): the dumps keep legacy
  # items, and the parsed line is structurally a live weapon (same
  # subcategory, full q/w/e/passive lists). weapon_usage_v2.json records it
  # in no size bucket while its sibling Hellfire Hands appears in every one.
  # The entry stays so an old permalink still loads and scores; `removed`
  # only bars it from recommendation. Same treatment for any weapon the game
  # retires.
  removed: true
  # Menu: the dagger Q/W/passive set under the knuckles subcategory. Its own
  # tree pool (pools/knuckles.yaml) reaches none of its menu spells, so it
  # takes the spell rows of the pool whose spells it equips: every
  # pools/dagger.yaml row but the dagger tree's WEAPON_STATS row (base-stat
  # rows come from a weapon's own tree only; sheets_lib.pool_rows_for,
  # F43d). Its own rows are the E's three.
  # The E's dumps description is empty: its rows rest on the structured
  # effects (stun, buff removal), which match the community description of
  # Devastating Strike as a two-hit combo (1st hit ~66% damage + purge, 2nd
  # ~33% + knockback). The 2nd-hit knockback has no structured candidate and
  # stays unscored.
  capabilities:
    - {cap: burst_st,      score: 4, evidence: PUNCHCOMBO}        # E: Devastating Strike combo
    - {cap: stun,          score: 2, evidence: PUNCHCOMBO}        # structured stun, enemy-directed
    - {cap: purge,         score: 2, evidence: PUNCHCOMBO}        # structured buff removal

- weapon: 2H_KNUCKLES_AVALON         # Fists of Avalon — purifying diver
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: engage,        score: 4, evidence: TRIPLECOMBO_DIVEKICK}  # E: CC-immune dive kick
    - {cap: knockback_displace, score: 2, evidence: TRIPLECOMBO_DIVEKICK}  # Dive Kick air-throw, no travel: Hallowfall's air-throw rung, 2 (T13); the pool's Backhand Strike row (3) scores on its own W; the larger reads
    - {cap: purge,         score: 3, evidence: TRIPLECOMBO_DIVEKICK}  # Purifying Fist strips ALL buffs — the true-purge benchmark above shield-break (curation judgment); MASTERSHEET tune:sheets sets 4 (T31d)
    - {cap: mobility,      score: 4, evidence: TRIPLECOMBO_DIVEKICK}  # dive + Q dashes
    - {cap: disengage,     score: 2, evidence: TRIPLECOMBO_DIVEKICK}
    # burst_aoe: Purifying Fist punches the area in front for 232 physical
    # damage on every enemy hit — the sibling of Battle Bracers' Falcon Smash
    # (264 in 4r = 4, T31).
    - {cap: burst_aoe,     score: 4, evidence: TRIPLECOMBO_DIVEKICK}  # 2nd combo: 232 phys, area punch, all enemies hit

