# Dual Swords — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 7 sightings, dominant role: melee.
#
# Identity: heroic-charge skirmisher. The E (Spinning Blades) is a CC-immune
# leap into stacked auto-attack buffs; the kit's damage is sustained melee
# pressure, not burst. Every W is a build fork: Parry (defensive stance,
# damage-immune channel + 125% reflect), Iron Will (MS + defense sprint),
# Splitting Slash (line root), Hamstring (slow + leap combo).
#
# DRAFT CORRECTIONS (all verified against full dumps text):
#   - purge/heal_reduction/peel/reveal via DEFENSERUN (Iron Will) REMOVED:
#     "Grants you immunity to purges" — the parser read the purge-immunity
#     references as purges the spell performs. It removes nothing from anyone.
#     Suppressed in effect_overrides.yaml.
#   - Interrupt (W) scores no silence, per the Forbidden Stab ruling: an
#     instant interrupt is not a cast-denial window.
#   - Weakening passive (stacking -2% enemy damage) noted, still unscored:
#     damage_debuff was promoted into §2.2 (2026-08-12) but the small
#     AA-stack carriers are held at 0 pending expert weighting.
# Parry's reflect is real anti-dive material but the map cannot express
# reflect; left unscored rather than grounded on a loose candidate.

- weapon: 2H_DUALSWORD               # Dual Swords — heroic-charge skirmisher
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/sword.yaml)
  except:
    - {cap: disengage, evidence: DEFENSERUN}
    - {cap: catch, evidence: HAMSTRINGSWORD}
    - {cap: mobility, evidence: HEROICSTRIKE2}
    - {cap: sustained_dps, evidence: HEROICSTRIKE2}
  capabilities:
    - {cap: mobility,      score: 6, evidence: SPINATTACK}       # E leap; Q: dash-to-target; W: Blade Cyclone / Heroic Leap
    - {cap: engage,        score: 4, evidence: SPINATTACK}       # CC-immune leap in
    - {cap: disengage,     score: 4, evidence: SPINATTACK}       # same leap out; W: Iron Will sprint
    - {cap: catch,         score: 4, evidence: SPINATTACK}       # Q: Heroic Strike dash; W: Hamstring slow-into-leap
    - {cap: sustained_dps, score: 4, evidence: SPINATTACK}       # E: +30% AA speed +65% AA damage; heroic charges stack
    - {cap: burst_aoe,     score: 2, evidence: SPINATTACK}       # 160 on impact in 5m; Q: Cleave — modest
