# ILLUSTRATIVE — NOT CURATED, NOT EVIDENCE-LINTED.
#
# These are the design-doc §2.3 hand-sketched numbers that the throwaway
# prototype (tests/prototype_engine.py) used to validate the model shape. They
# exist here for exactly one reason: to keep the 9 golden tests runnable while
# curation is in progress. They are NOT a data release.
#
# Every entry lacks an `evidence` field, so `evidence_lint.py` would reject all
# of them — that is intentional and correct. `build_dataset.py` refuses to mark
# a release clean while any illustrative sheet is present.
#
# CURATION PATH: when a weapon here gets a real curated sheet in ../ (with
# evidence spells), delete its block from this file. The loader gives curated
# sheets precedence, so a leftover block is shadowed rather than harmful — but
# delete it anyway so the illustrative count reports the truth.
#
# Weapon keys resolved against pipeline/out/weapon_lines.json (2026-08-12).

