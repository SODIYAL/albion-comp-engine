    - {cap: stun,         score: 2, evidence: VACUUMSLASH}     # 0.8s on the pile
    - {cap: catch,        score: 2, evidence: VACUUMSLASH}

- weapon: MAIN_MACE_CRYSTAL          # Dreadstorm Monarch — storm-combo tank
  curated_as_of: 2026-08-12
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/mace.yaml)
