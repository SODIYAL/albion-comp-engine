# Mace line — remaining 6 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with the mace_line.yaml sheets (Guard Rune, Snare Charge,
# Sacred Ground). Tank line: WEAPON_STATS tankiness 2 throughout.

- weapon: 2H_DUALMACE_AVALON         # Oathkeepers — aurora support tank
  curated_as_of: 2026-08-12
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/mace.yaml)
  except:
    - {cap: engage, evidence: CHARGE_ROOT}
  capabilities:
    - {cap: buff_allies,  score: 4, evidence: BLESSED_MACES}   # E: group MS aurora + 400 absorb shields + heal
    - {cap: heal_sustain, score: 2, evidence: BLESSED_MACES}   # 30 Health pulses to 10 allies
    - {cap: engage,       score: 2, evidence: BLESSED_MACES}   # the aurora is a group sprint lane

- weapon: 2H_FLAIL                   # Morning Star — the mass-root field
  curated_as_of: 2026-08-12
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/mace.yaml)
  except:
    - {cap: engage, evidence: CHARGE_ROOT}
    - {cap: root, evidence: CHARGE_ROOT}
    - {cap: peel, evidence: GUARDRUNE}
  capabilities:
    - {cap: root,         score: 6, evidence: ROOTFIELD}       # E: Gravitas — channeled AoE root IGNORING CC resistance
    - {cap: engage,       score: 4, evidence: ROOTFIELD}       # Close In dash into the field
    - {cap: catch,        score: 4, evidence: ROOTFIELD}       # nothing leaves Gravitas
    - {cap: peel,         score: 4, evidence: ROOTFIELD}       # cast it on the divers; W: Guard Rune (QW)
    - {cap: mobility,     score: 2, evidence: ROOTFIELD}       # the Close In dash

- weapon: 2H_MACE_MORGANA            # Camlann Mace — the vendetta clump
  curated_as_of: 2026-08-12
  role_hint: tank
  capabilities:
