# axe tree: the Q/W/passive rows the eight axes share. A row composes into
# every axe that can equip its evidence spell and scores while that spell
# is equipped (build_dataset.build_loadout); a WEAPON_STATS row applies
# tree-wide and is always on. A weapon's own row with the same (cap,
# evidence) is that weapon's deliberate override of the shared row
# (magnitude RULE queue, VALIDATION.md 08, Round 9). A weapon's own row of
# the same capability on another spell leaves the shared row standing:
# both score, and the member reads the larger, never the sum
# (engine._merge_max). An `except:` entry is a deliberate non-take of a
# shared row (curation judgment). (QW): the row holds only while the
# player equips that Q or W spell. Weapon entries: sheets/axe.yaml.
subcategory: axe
capabilities:
  - {cap: catch, score: 2, evidence: AXEBOOST}                         # W: Adrenaline Boost, +40% Move Speed for up to 9s (QW)
  - {cap: resist_shred, score: 3, evidence: AXESMASH}                  # W: Deadly Chop, -16% resistances for 8s on one target (QW)
  - {cap: buff_allies, score: 2, evidence: AXE_CHARGE}                 # W: Battle Rush, +20% Healing Received to allies in 5m (QW)
  - {cap: engage, score: 2, evidence: AXE_CHARGE}                      # W: Battle Rush, a 12m charge (QW)
  - {cap: self_sustain, score: 2, evidence: PASSIVE_HEALTHCHANCE_AXE}  # PASSIVE: Life Leech, heals the wielder only
  - {cap: mobility, score: 2, evidence: RENDINGCOMBO}                  # Q: Rending Rage's third hit, the Raging Leap (QW)
  - {cap: root, score: 2, evidence: RENDINGCOMBO}                      # Q: Raging Leap roots a 5m circle for 1s (QW)
  - {cap: heal_reduction, score: 2, evidence: RENDINGSTRIKE}           # Q: Rending bleed cap, -12% Healing Received for 5s at 3 stacks; the bleed class of the heal-cut ladder (VALIDATION.md 08, Round 9) (QW)
  - {cap: sustained_dps, score: 4, evidence: RENDINGSTRIKE}            # Q: stacking Rending Bleeds (QW)
