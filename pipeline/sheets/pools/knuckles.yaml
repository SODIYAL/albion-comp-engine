# knuckles tree: the Q/W/passive rows the eight knuckles weapons share. A
# row composes into every knuckles weapon that can equip its evidence spell
# (WEAPON_STATS: tree-wide, always on) and scores on that spell beside any
# own row of the same capability on another spell: the member reads the
# larger, never the sum (engine._merge_max, F43). A weapon's own row with
# the same (cap, evidence) is that weapon's deliberate override of the
# shared row (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:`
# entry, a deliberate non-take (curation judgment), drops the row from that
# weapon. (QW): the row holds only while the player equips that Q or W
# spell. Weapon entries: sheets/knuckles.yaml; Black Hands, the tree's ninth
# weapon, carries the dagger menu: it takes none of these rows and composes
# the dagger pool's spell rows instead (sheets_lib.pool_rows_for). Not
# scored: Backhand Strike's +100 damage on a wall collision (no capability
# axis).
subcategory: knuckles
curated_as_of: 2026-10-07
capabilities:
  - {cap: knockback_displace, score: 3, evidence: BACKHAND_KNOCKBACK}        # W: Backhand Strike knocks all enemies hit 9m back (9x5 rect) (QW)
  - {cap: peel, score: 3, evidence: BACKHAND_KNOCKBACK}                      # shove a diver into a wall (QW)
  - {cap: resist_shred, score: 2, evidence: BACKHAND_KNOCKBACK}              # W: -20% for 5s (QW)
  - {cap: resist_shred, score: 2, evidence: CREATE_OPENING}                  # Q: Create Opening, the 2nd hit cuts the target's damage resistances by 12% for 3s (QW)
  - {cap: catch, score: 2, evidence: DASHKICK}                               # Q: Dragon Leap dash-and-kick (QW)
  - {cap: engage, score: 2, evidence: DASHKICK}                              # (QW)
  - {cap: mobility, score: 4, evidence: DASHKICK}                            # Q dashes (QW)
  - {cap: burst_st, score: 2, evidence: KNUCKLECOMBO}                        # W: Devastating Combo, 30 + 153 (QW)
  - {cap: stun, score: 2, evidence: KNUCKLECOMBO}                            # W: 1.1s in the combo (QW)
  - {cap: sustained_dps, score: 4, evidence: PASSIVE_KNUCKLE_BRAWLER}        # PASSIVE: Fatal Fury, +2% damage per AA for 3s, 9 stacks
  - {cap: sustained_dps, score: 4, evidence: PASSIVE_KNUCKLE_BRAWLER_SPEED}  # PASSIVE: Fatal Fury, +1.5% damage per AA for 3s, 12 stacks
  # Triple Kick "Pulls up to 1 enemy player" along its dash: the kidnap that
  # drags a healer or tank into the team. A pull creates a clump, a knockback
  # does not (T12). The published blap comp (data/published_comps) runs it
  # on Ursine Maulers (w1): "kidnap healers or overcommitted tanks".
  - {cap: clump_create, score: 2, evidence: TRIPLE_KICK}                     # W: pulls 1 enemy player along the dash — the kidnap (QW)
  # reflect: Counter reflects 150% of incoming damage (reflectdamageactive
  # 1.50, target self), self-only and for a brief counter-stance: a personal
  # trick, not a comp tool.
  - {cap: reflect, score: 2, evidence: KNUCKLE_COUNTER}                      # W: self-only counter-stance (QW)
