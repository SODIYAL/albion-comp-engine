# shapeshifterstaff tree: the Q/W/passive rows the eight shapeshifter staffs
# share. A row composes into every shapeshifter staff that can equip its
# evidence spell (WEAPON_STATS: tree-wide). A weapon's own row with the same
# (cap, evidence) is that weapon's deliberate override of the shared row
# (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:` entry
# drops the row from that weapon. (QW): the row holds only while the player
# equips that Q or W spell. Weapon entries: sheets/shapeshifterstaff.yaml.
subcategory: shapeshifterstaff
capabilities:
  - {cap: self_sustain, score: 2, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}  # PASSIVE: Altered Beast, +2% Max and Current Health a Shift Charge on transforming (self)
  - {cap: resist_shred, score: 2, evidence: SHAPE_Q_CONE_MELEE}              # Q: Pulse Shock, -2% damage resistances a stack, three stacks (QW)
  - {cap: buff_allies, score: 2, evidence: SHAPE_Q_DAMAGE_AND_SHIELD}        # Q: Adapting Matter, a 150 absorb shield on the caster and up to 5 allies (QW)
  - {cap: catch, score: 2, evidence: SHAPE_W_AREA_PULL}                      # W: Positional Drift, pull + root = a caught runner (QW)
  - {cap: clump_create, score: 2, evidence: SHAPE_W_AREA_PULL}               # W: tendrils pull up to 5 enemies to the caster (QW)
  - {cap: root, score: 2, evidence: SHAPE_W_AREA_PULL}                       # same cast: 1.35s root (QW)
  - {cap: slow, score: 2, evidence: SHAPE_W_DAMAGE_AOE}                      # -10% inside the cloud — weak (QW)
  - {cap: zone_control, score: 2, evidence: SHAPE_W_DAMAGE_AOE}              # W: Distortion cloud, 3s DoT + slow (QW)
  - {cap: mobility, score: 2, evidence: SHAPE_W_TETHERBEAM}                  # W: Tether Shift on an enemy dashes the caster to it (QW)
  - {cap: anti_dive, score: 2, evidence: SHAPE_W_TETHERBEAM}                 # W: 300 absorb on the tethered ally, pulled to the caster (the anti-dive rule) (QW)
  # Polymorph turns the first unmounted player hit into a helpless animal
  # for 2.5s: enemy CC on a diver. Tether Shift shields and pulls the ALLY
  # and touches no enemy, so it grounds no peel (the peel rule).
  - {cap: peel, score: 2, evidence: SHAPE_W_POLYMORPH}                       # W: Polymorph a diver (QW)
