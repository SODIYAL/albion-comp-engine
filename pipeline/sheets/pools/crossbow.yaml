# crossbow tree: the Q/W/passive rows the eight crossbows share. A row
# composes into every crossbow that can equip its evidence spell
# (WEAPON_STATS: tree-wide, always on) and scores on that spell beside any
# own row of the same capability on another spell: the member reads the
# larger, never the sum (engine._merge_max, F43). A weapon's own row with
# the same (cap, evidence) is that weapon's deliberate override of the
# shared row (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:`
# entry, a deliberate non-take (curation judgment), drops the row from that
# weapon. (QW): the row holds only while the player equips that Q or W
# spell. Weapon entries: sheets/crossbow.yaml. Not scored: - any heal on
# Sunder Shot: "Health the targeted enemy has left" is a shred scaler; its
# heal flag is suppressed (effect_overrides.yaml). - engage / disengage /
# catch / mobility on Caltrops: +30% move speed only when an enemy triggers
# the trap is not movement tooling.
subcategory: crossbow
curated_as_of: 2026-10-07
capabilities:
  - {cap: resist_shred, score: 2, evidence: ACID_BOMB}             # W: Explosive Salvo's fumes cut damage resistances by 14% for 3.5s in a 4.5 radius (QW)
  - {cap: burst_aoe, score: 2, evidence: ACID_BOMB}                # W: Explosive Salvo, 135 in a 4.5 radius (QW)
  - {cap: zone_control, score: 2, evidence: ACID_BOMB}             # W: the corrosive fume field holds its 4.5 radius for 3.5s (QW)
  - {cap: burst_aoe, score: 2, evidence: BOLTSHOT}                 # Q: 130 in 3m (QW)
  - {cap: slow, score: 2, evidence: CALTROPS}                      # W: trap, 30% slow in 3r when triggered (QW)
  - {cap: zone_control, score: 2, evidence: CALTROPS}              # W: 12s trap (QW)
  - {cap: knockback_displace, score: 4, evidence: KNOCKBACKSHOT2}  # W: 10m bolt; Forceful Bolts passive (QW)
  - {cap: peel, score: 4, evidence: KNOCKBACKSHOT2}                # (QW)
  - {cap: silence, score: 4, evidence: SILENCINGBOLT}              # W: 3.83s on the first enemy hit — a single-target skillshot, below the Heavy Mace AoE class (QW)
  - {cap: resist_shred, score: 2, evidence: SUNDERSHOT}            # W: stacking shred (QW)
  - {cap: sustained_dps, score: 2, evidence: WEAPON_STATS}         # crossbow AA pattern
