# crossbow tree: the Q/W/passive rows the eight crossbows share. A row
# composes into every crossbow that can equip its evidence spell
# (WEAPON_STATS: tree-wide). A weapon's own row with the same
# (cap, evidence) is that weapon's deliberate override of the shared row
# (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:` entry
# drops the row from that weapon. (QW): the row holds only while the player
# equips that Q or W spell. Weapon entries: sheets/crossbow.yaml.
# Not scored:
#   - any heal on Sunder Shot: "Health the targeted enemy has left" is a
#     shred scaler; its heal flag is suppressed (effect_overrides.yaml).
#   - engage / disengage / catch / mobility on Caltrops: +30% move speed
#     only when an enemy triggers the trap is not movement tooling.
subcategory: crossbow
capabilities:
  - {cap: burst_aoe, score: 2, evidence: BOLTSHOT}                 # Q: 130 in 3m; W: Explosive Salvo (QW)
  - {cap: slow, score: 2, evidence: CALTROPS}                      # W: trap, 30% slow in 3r when triggered (QW)
  - {cap: zone_control, score: 2, evidence: CALTROPS}              # W: 12s trap; Explosive Salvo's 3.5s fumes folded in (QW)
  - {cap: knockback_displace, score: 4, evidence: KNOCKBACKSHOT2}  # W: 10m bolt; Forceful Bolts passive (QW)
  - {cap: peel, score: 4, evidence: KNOCKBACKSHOT2}                # (QW)
  - {cap: silence, score: 4, evidence: SILENCINGBOLT}              # W: 3.83s on the first enemy hit — a single-target skillshot, below the Heavy Mace AoE class (QW)
  - {cap: resist_shred, score: 2, evidence: SUNDERSHOT}            # W: stacking shred; Salvo fumes (QW)
  - {cap: sustained_dps, score: 2, evidence: WEAPON_STATS}         # crossbow AA pattern
