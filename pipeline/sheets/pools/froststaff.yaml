# froststaff tree: the Q/W/passive rows the eight frost staffs share. A row
# composes into every frost staff that can equip its evidence spell
# (WEAPON_STATS: tree-wide, always on) and scores on that spell beside any
# own row of the same capability on another spell: the member reads the
# larger, never the sum (engine._merge_max, F43). A weapon's own row with
# the same (cap, evidence) is that weapon's deliberate override of the
# shared row (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:`
# entry, a deliberate non-take (curation judgment), drops the row from that
# weapon. (QW): the row holds only while the player equips that Q or W
# spell. Weapon entries: sheets/froststaff.yaml.
subcategory: froststaff
capabilities:
  - {cap: slow, score: 4, evidence: FROSTBOMB_CASTSLOW}          # W: Frost Bomb, a 0.3 slow in a 5 radius, then 166 and a 0.2 slow for 5s (QW)
  - {cap: zone_control, score: 4, evidence: FROSTBOMB_CASTSLOW}  # W: the bomb's slowed circle; the frost zone ladder: Chillhowl 2, here 4, Permafrost 6 (QW)
  - {cap: disengage, score: 2, evidence: FROSTNOVA}              # W: Frost Nova, a teleport away from a stunned start point (QW)
  - {cap: stun, score: 2, evidence: FROSTNOVA}                   # W: the Nova's 1s stun in a 3 radius (QW)
  - {cap: resist_shred, score: 2, evidence: FROST_LANCE}         # W: Frost Lance, -12% damage resistances for 3s in a 3 radius (QW)
  - {cap: buff_allies, score: 2, evidence: ICE_SCULPTURE}        # W: Glacial Obelisk, +20% damage and cooldown rate for up to 10 allies (QW)
  - {cap: root, score: 2, evidence: PASSIVE_FROST}               # PASSIVE: after every 4 spells, the next auto-attack roots for 0.86s
  - {cap: sustained_dps, score: 2, evidence: WEAPON_STATS}       # tree-wide stand-in for the Q poke (Ice Shard, Frostbite): the kite-and-poke pattern
