# firestaff tree: the Q/W/passive rows the eight fire staffs share. A row
# composes into every fire staff that can equip its evidence spell
# (WEAPON_STATS: tree-wide, always on) and scores on that spell beside any
# own row of the same capability on another spell: the member reads the
# larger, never the sum (engine._merge_max, F43). A weapon's own row with
# the same (cap, evidence) is that weapon's deliberate override of the
# shared row (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:`
# entry, a deliberate non-take (curation judgment), drops the row from that
# weapon. (QW): the row holds only while the player equips that Q or W
# spell. Weapon entries: sheets/firestaff.yaml.
subcategory: firestaff
curated_as_of: 2026-10-07
capabilities:
  - {cap: knockback_displace, score: 2, evidence: FIRECONE}          # W: Fire Wave, a cone that knocks enemies back by 4 (QW)
  - {cap: peel, score: 2, evidence: FIRECONE}                        # the same cone pushes a diver off the backline (QW)
  - {cap: zone_control, score: 2, evidence: FIREWALL}                # W: Wall of Flames, a 5s wall: enemies touching it burn and flee for 0.5s (QW)
  - {cap: burst_aoe, score: 4, evidence: SKILLSHOT_FIREBALL}         # W: Raging Flare, 205 in a 5 radius and a 3s ignite (21.4 a second), 20s: the 232-264 rung (QW)
  - {cap: sustained_dps, score: 4, evidence: WEAPON_STATS}           # tree-wide stand-in for Fire Bolt's ignite stacking (Q, up to 5 stacks) and Fire Artillery's channel (W)
