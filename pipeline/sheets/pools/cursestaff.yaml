# cursestaff tree: the Q/W/passive rows the eight cursed staffs share. A row
# composes into every cursed staff that can equip its evidence spell
# (WEAPON_STATS: tree-wide, always on) and scores on that spell beside any
# own row of the same capability on another spell: the member reads the
# larger, never the sum (engine._merge_max, F43). A weapon's own row with
# the same (cap, evidence) is that weapon's deliberate override of the
# shared row (magnitude RULE queue, VALIDATION.md 08, Round 9); an `except:`
# entry, a deliberate non-take (curation judgment), drops the row from that
# weapon. (QW): the row holds only while the player equips that Q or W
# spell. Weapon entries: sheets/cursestaff.yaml.
subcategory: cursestaff
capabilities:
  - {cap: resist_shred, score: 2, evidence: ARMORPIERCER}        # W: Armor Piercer, -17% damage resistances for 4s along a beam (QW)
  - {cap: buff_allies, score: 2, evidence: CURSEDHANDS_STACKUP}  # W: Grudge, extra magical damage on an ally's auto-attacks for 10s (QW)
  - {cap: sustained_dps, score: 4, evidence: CURSEDOT}           # Q: Vile Curse, the curse DoT engine (charges stack to 4) (QW)
  - {cap: slow, score: 2, evidence: CURSED_SPLAT}                # Q: Cursed Tar, a 4.2s puddle slowing by 10% (QW)
  - {cap: zone_control, score: 2, evidence: CURSED_SPLAT}        # Q: the puddle applies a Vile Curse charge every 1s (QW)
  - {cap: root, score: 3, evidence: CURSENOVA}                   # W: Desecrate, a 2.6s root in a 4 radius cast at 13m (QW)
