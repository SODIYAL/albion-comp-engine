# Frost Staff (1H) — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 7 sightings, dominant role: range.
#
# Identity: the frost line's root mage. The E (Freezing Wind) is a 200-damage
# cone with a 2.5s AoE ROOT — the longest AoE immobilize curated so far, and
# the weapon's whole reason to exist. Shares the frost Q/W pool with the
# Permafrost Prism sheet, so the QW-conditional scores mirror that sheet;
# differences are all in slot E.
#
# Rulings carried over from the Permafrost curation for consistency:
#   - Frost Nova's teleport files as disengage, not mobility.
#   - tankiness NOT scored (Frost Nova's 0.2s immunity is trivial; nothing
#     else in the kit is defensive).
#   - No engage: a ranged root can start a fight but initiation-by-dive is
#     not this kit's job.
# Frost Beam's AA-speed debuff noted, still unscored: damage_debuff was
# promoted into §2.2 (2026-08-12) but the small W-option carriers are held
# at 0 pending expert weighting.

- weapon: MAIN_FROSTSTAFF            # Frost Staff — AoE root mage
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: range
  capabilities:
    - {cap: root,          score: 3, evidence: FREEZINGWIND}        # E: 2.5s AoE root cone — the signature
    - {cap: peel,          score: 2, evidence: FREEZINGWIND}        # root divers off the backline; enemy-directed
    - {cap: catch,         score: 2, evidence: FREEZINGWIND}        # 2.5s root = a caught runner; Q: Frostbite stacks
    - {cap: zone_control,  score: 2, evidence: FROSTBOMB_CASTSLOW}  # W: Frost Bomb + Q: Frozen Surge ground slows (QW)
    - {cap: slow,          score: 2, evidence: FROSTBOMB_CASTSLOW}  # nearly every Q/W in the pool slows (QW)
    - {cap: burst_aoe,     score: 1, evidence: FREEZINGWIND}        # 200 cone + Q: Ice Shard; 1H damage budget
    - {cap: stun,          score: 1, evidence: FROSTNOVA}           # W: Frost Nova AoE stun; Q: Frostbite stacks (QW)
    - {cap: disengage,     score: 1, evidence: FROSTNOVA}           # W: teleport + brief immunity (QW)
    - {cap: resist_shred,  score: 1, evidence: FROST_LANCE}         # W: -12% resistances for 3s (QW)
    - {cap: buff_allies,   score: 1, evidence: ICE_SCULPTURE}       # W: Obelisk +20% dmg & CDR to 10 allies (QW)
    - {cap: sustained_dps, score: 1, evidence: WEAPON_STATS}        # kite-and-poke pattern
