# Grovekeeper — curated 2026-08-12 from ao-bin-dumps spell text
# (effect_lookup dump). Replaces the illustrative §2.3 block (tankiness 2,
# engage 3, stun 2, clump_create 2, peel 1).
#
# CORRECTIONS vs the illustrative block:
#   - clump_create 2 REMOVED: Ground Pound throws enemies into the air where
#     they stand — it holds a clump, it does not create one. Same ruling as
#     Permafrost (stun) and Kingmaker (knock-up). The hammer-line clump
#     engines are Tackle and Onslaught (drag mechanics), which this E lacks.
#   - peel 1 -> 2: the E plus the hammer W pool (Geyser, Knockout, ring) is
#     more defensive tooling than the sketch credited.
#   - knockback_displace ADDED (E air-throw, scaling with enemies hit,
#     ignores CC resistance — structured, verified).
#
# Identity: immune-leap engage tank. The E (Ground Pound) is a CC+damage
# immune leap into a 2.5s stun in 5.5m with a scaling knock-up. Shares the
# hammer Q/W pool; QW-conditional scores mirror the other hammer sheets.

- weapon: 2H_RAM_KEEPER              # Grovekeeper — immune-leap engage tank
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/hammer.yaml)
  except:
    - {cap: disengage, evidence: CHARGESLOWAE}
    - {cap: engage, evidence: CHARGESLOWAE}
    - {cap: mobility, evidence: CHARGESLOWAE}
    - {cap: knockback_displace, evidence: GEYSER}
  capabilities:
    - {cap: engage,        score: 3, evidence: RAM_CHARGE}      # E: CC+damage-immune leap into the stun
    - {cap: stun,          score: 2, evidence: RAM_CHARGE}      # 2.5s in 5.5m; Stunning Strike passive
    - {cap: knockback_displace, score: 1, evidence: RAM_CHARGE} # scaling air-THROW — no travel; hold value is peel/stun (magnitude pass 2026-08-13)
    - {cap: peel,          score: 2, evidence: RAM_CHARGE}      # pound the divers; W: Geyser / Knockout (QW)
    - {cap: catch,         score: 2, evidence: RAM_CHARGE}      # leap + 2.5s stun = caught
    - {cap: mobility,      score: 2, evidence: RAM_CHARGE}      # the E moves you; W: Slowing Charge
    - {cap: disengage,     score: 2, evidence: RAM_CHARGE}      # immune leap OUT
