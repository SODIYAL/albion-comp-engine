# Identity: immune-leap engage tank. The E (Ground Pound) is a CC+damage
# immune leap into a 2.5s stun in 5.5m with a scaling knock-up. Shares the
# hammer Q/W pool; QW-conditional scores mirror the other hammer sheets.

