# Blazing Staff — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 6 sightings, dominant role: range.
#
# Identity: standing-zone DoT artillery. The E (Flame Tornado) parks a 5m
# persistent damage zone on a point or choke — enemies who leave keep burning.
# With Wall of Flames and Burning Field behind it, this is the most dedicated
# ground-denial kit in the fire line: zone_control 3 (the Permafrost
# precedent for a full denial kit).
#
# DRAFT CORRECTIONS:
#   - engage/disengage/mobility via Flame Blast's ally move speed REMOVED:
#     +60% MS for 1.6 seconds is a cast-enabler blip, not movement tooling
#     (same ruling as the Dawnsong sheet).
# No CC beyond the W knockback, no sustain, no shred: the sheet is deliberately
# narrow — this weapon buys zone pressure and nothing else.

- weapon: 2H_INFERNOSTAFF_MORGANA    # Blazing Staff — standing-zone DoT artillery
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/firestaff.yaml)
  except:
    - {cap: zone_control, evidence: FIREWALL}
    - {cap: sustained_dps, evidence: WEAPON_STATS}
  capabilities:
    - {cap: zone_control,   score: 6, evidence: FLAMETORNADO}    # E: persistent 5m tornado; W: firewall; Q: burning field
    - {cap: sustained_dps,  score: 4, evidence: FLAMETORNADO}    # tornado ticks + ignite stacks + Burn passive
    - {cap: burst_aoe,      score: 4, evidence: SKILLSHOT_FIREBALL}  # W: Raging Flare 205 in 5m; tornado on a clump (QW)
