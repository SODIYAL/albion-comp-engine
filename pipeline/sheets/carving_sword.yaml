# Carving Sword — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 5 sightings, dominant role: melee.
#
# Identity: the sword line's shred bruiser. The E (Fearless Strike) is a dash
# that cuts damage resistances of everyone on its path by up to 20% (scaling
# with Heroic Charges) — group shred delivered by initiation. Shares the
# sword Q/W pool with the Dual Swords sheet; QW-conditional scores mirror it.
#
# Rulings carried over from the Dual Swords curation:
#   - Iron Will grounds nothing offensive (purge-immunity artifact, suppressed).
#   - Interrupt scores no silence (instant interrupt != cast denial).
#   - Weakening passive noted, still unscored: damage_debuff was promoted
#     into §2.2 (2026-08-12) but the -2%-per-AA stack is held at 0 pending
#     expert weighting of the small carriers.
#   - Parry grounds NO tankiness (momentary-defensive ruling, 2026-08-12:
#     personal channel/dash defensives are not frontline durability).
# mobility 2 not 3: Fearless Strike's 25s cooldown is more than double the
# Spinning Blades cadence that earned Dual Swords its 3.

- weapon: 2H_CLEAVER_HELL            # Carving Sword — shred-on-dash bruiser
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/sword.yaml)
  except:
    - {cap: disengage, evidence: DEFENSERUN}
    - {cap: catch, evidence: HAMSTRINGSWORD}
    - {cap: mobility, evidence: HEROICSTRIKE2}
  capabilities:
    - {cap: resist_shred,  score: 2, evidence: CLAYMORESLASH}    # E: up to -20% AoE on the dash path — the signature
    - {cap: engage,        score: 2, evidence: CLAYMORESLASH}    # shred-by-initiation
    - {cap: mobility,      score: 2, evidence: CLAYMORESLASH}    # E dash; Q: Heroic Strike; W: Blade Cyclone / Heroic Leap
    - {cap: catch,         score: 2, evidence: CLAYMORESLASH}    # dash + W: Hamstring slow-into-leap
    - {cap: disengage,     score: 2, evidence: CLAYMORESLASH}    # same dash out; W: Iron Will sprint
    - {cap: burst_aoe,     score: 1, evidence: CLAYMORESLASH}    # 135 on the path; modest
