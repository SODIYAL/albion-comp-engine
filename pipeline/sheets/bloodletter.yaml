# Bloodletter — curated 2026-08-12 from ao-bin-dumps spell text (curate_helper.py).
# Usage: 9 sightings, dominant role: melee.
#
# Identity: the game's mobility ceiling — E dash, Q Deadly Swipe leap, and W
# options Dash / Chain Slash / Shadow Edge. The E (Lunging Stabs) deals
# health-threshold-scaled damage: the classic executioner. Agrees with the
# illustrative §2.3 block (mobility 3, execute 2, burst_st 2, catch 2,
# disengage 2); this sheet adds the evidence and the Q/W conditionals.
#
# DRAFT CORRECTIONS (directionality rule):
#   - heal_sustain 2 REMOVED: E lifesteal heals the WIELDER only.
#   - resist_shred evidence moved off ASSASSINSPIRIT (it lowers YOUR defense —
#     a self-debuff, not enemy shred) onto Q: Sunder Armor.
#   - tankiness 1 via CHAINDASH REMOVED: momentary charge iframes are not
#     frontline durability.
# Forbidden Stab's interrupt has no `silence` score: an instant interrupt is
# not a cast-denial window. Its 100% heal negation grounds heal_reduction.

