# Daggers — one entry per weapon of the dagger tree, carrying the weapon's E
# (its identity) and any override of a shared row. The tree's shared
# Q/W/passive rows (Sunder Armor, Deadly Swipe; Dash, Forbidden Stab, Shadow
# Edge, Chain Slash; the AA-speed and Life Leech passives) live in
# pools/dagger.yaml and compose into every dagger that can equip them
# (sheets_lib.compose). Black Hands carries the same menu under the knuckles
# subcategory (knuckles.yaml) and takes the pool's spell rows
# (sheets_lib.pool_rows_for). Every row scores on its own spell
# (build_dataset.build_loadout; a WEAPON_STATS row is always on): an own row
# and a shared row of the same capability on different spells both score,
# and the member reads the larger, never the sum (engine._merge_max, F43).
# An `except:` entry is a deliberate non-take of a shared row (curation
# judgment). An E-row comment that names a Q/W spell marks that spell's
# share of the E row's score; the named spell's shared row, where it has
# one, still scores on its own slot, and the larger reads.

# Claws — single-target lockdown assassin. The E (Disembowel) pins the target:
# a channeled root with repeated interrupts and a shield break, ending in a
# bleed. One person is removed from the fight while it channels. mobility
# comes from the pool's Deadly Swipe row (4), below Bloodletter's 6: the E is
# a stationary channel, not a dash.

- weapon: 2H_CLAWPAIR                # Claws — single-target lockdown assassin
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: root,          score: 4, evidence: DISEMBOWEL}          # E: channeled pin, breaks if target moves 6m
    - {cap: catch,         score: 4, evidence: DISEMBOWEL}          # the pin IS the catch; W: Shadow Edge
    - {cap: burst_st,      score: 4, evidence: DISEMBOWEL}          # 45 every 0.3 + exit bleed + dagger stacking
    - {cap: purge,         score: 2, evidence: DISEMBOWEL}          # E: breaks active shields — narrow purge
    - {cap: interrupt,     score: 2, evidence: DISEMBOWEL}          # repeatedly interrupts the pinned target's casting (interrupt taxonomy)

# Dagger Pair — the charge-burst assassin: Sunder Armor into Slit Throat is
# the canonical single-target deletion combo. Slit Throat scales with
# Assassin Spirit / Sunder Armor CHARGES (92 to 309 direct), not with the
# target's missing health, and grants no killing-blow reward, so it carries
# no execute row (taxonomy rule): burst_st 6 carries the finisher damage.
# execute is reserved for low-HP payoffs (Bloodletter, Infernal Scythe) and
# kill rewards (Broadsword, Kingmaker, Prowling Staff). Slit Throat also
# reduces the target's Healing Received (-20% for 4s; heal_flag_meaning:
# negate), a heal_reduction source beside Forbidden Stab.

- weapon: 2H_DAGGERPAIR              # Dagger Pair — charge-burst assassin
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: burst_st,       score: 6, evidence: EXECUTEDAGGER}      # E: charge-scaled devastating blow + bleed
    - {cap: sustained_dps,  score: 4, evidence: PASSIVE_AASPEEDCHANCE_DAGGER}  # dagger AA passives + spirit stacks; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9)
    - {cap: catch,          score: 4, evidence: SKILLSHOT_TELEPORT} # W: Shadow Edge; dashes; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: heal_reduction, score: 2, evidence: EXECUTEDAGGER}      # E: reduces Healing Received; W: Forbidden Stab

- weapon: 2H_DAGGERPAIR_CRYSTAL      # Twin Slayers — dagger-ring AoE assassin
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: burst_aoe,     score: 4, evidence: CRYSTAL_DAGGER_BLADE_RING}  # E: 6-dagger ring, pierce + DoT ring
    - {cap: mobility,      score: 4, evidence: CRYSTAL_DAGGER_BLADE_RING}  # MS on cast + dagger pool dashes

- weapon: 2H_DAGGER_KATAR_AVALON     # Bridled Fury — hit-and-fade burster
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: burst_st,      score: 4, evidence: BACK_SLASH}        # E: charge-scaled cone up to 238
    - {cap: disengage,     score: 4, evidence: BACK_SLASH}        # the E leaps the wielder 8m backwards as it hits
    - {cap: mobility,      score: 4, evidence: BACK_SLASH}        # back-leap + dagger pool dashes

# Deathgivers — stealth burst assassin. The E (Ghost Strike) charges through
# the target for 153, stealths for 1s, and skips its cooldown at full Sunder
# Armor (or Assassin Spirit) charges: the shred-then-burst loop. The E buffs
# no ally and shreds nothing: its cooldown-reset condition names the Q
# charges, and the parser's credit for those spells' effects is suppressed
# (effect_overrides.yaml); resist_shred grounds on Q: Sunder Armor (pool
# row). No execute: health-threshold damage is the Bloodletter E's mechanic;
# burst here is flat and stealth-delivered.

- weapon: 2H_DUALSICKLE_UNDEAD       # Deathgivers — stealth burst assassin
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: burst_st,      score: 4, evidence: GHOSTSTRIKE}         # E: 153 + repeatable at 3 Sunder charges
    - {cap: engage,        score: 4, evidence: GHOSTSTRIKE}         # charge-through opener, stealth reset
    - {cap: disengage,     score: 4, evidence: GHOSTSTRIKE}         # 1s invisibility out; W: Chain Slash iframes (its pool row, 2, scores on its own W; the larger reads)
    - {cap: mobility,      score: 4, evidence: GROUNDDASH}          # W: Dash; E charge; Q: Deadly Swipe leap; override of the pool's 2 (QW)
    - {cap: catch,         score: 4, evidence: SKILLSHOT_TELEPORT}  # W: Shadow Edge stun-teleport; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)

- weapon: MAIN_DAGGER                # Dagger (1H) — lifesteal AA skirmisher
  curated_as_of: 2026-08-12
  role_hint: melee
  capabilities:
    - {cap: sustained_dps, score: 4, evidence: BLOODTHIRSTYBLADE}  # E: +50 bonus damage per AA steroid
    - {cap: self_sustain,  score: 4, evidence: BLOODTHIRSTYBLADE}  # steals health via bonus damage (self-only)
    - {cap: mobility,      score: 4, evidence: BLOODTHIRSTYBLADE}  # +30% MS while active + pool dashes

- weapon: MAIN_DAGGER_HELL           # Demonfang — blood-cone caster dagger
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: burst_aoe,     score: 4, evidence: BLOOD_BLADE}       # E: 130 cone, recastable x3 (self max-HP cost)
    - {cap: burst_st,      score: 2, evidence: BLOOD_BLADE}       # three cones into one target

# Bloodletter — mobile executioner. The E (Lunging Stabs) dashes through
# enemies for damage keyed to their current health (153 above the threshold,
# 330 below): the clean health-threshold execute. mobility 6 (E dash, Q
# Deadly Swipe leap, W Dash / Chain Slash / Shadow Edge) ties the top of the
# mobility board. Not scored: heal_sustain (the E's lifesteal heals the
# wielder only; heal_flag_meaning: self_only).

- weapon: MAIN_RAPIER_MORGANA        # Bloodletter — mobile executioner
  curated_as_of: 2026-10-07
  role_hint: melee
  capabilities:
    - {cap: mobility,       score: 6, evidence: RAPIERSTAB}         # E dash; Q: Deadly Swipe; W: Dash / Chain Slash / Shadow Edge; the pool's Dash row (2) scores on its own W, the larger reads
    - {cap: execute,        score: 4, evidence: RAPIERSTAB}         # E: damage keyed to target health threshold
    - {cap: burst_st,       score: 4, evidence: RAPIERSTAB}         # E + stacked Assassin Spirit charges
    - {cap: catch,          score: 4, evidence: RAPIERSTAB}         # W: Chain Slash / Shadow Edge close anything (QW)
    - {cap: disengage,      score: 4, evidence: GROUNDDASH}         # W: Dash; override of the pool's 2: E-supplement upgrade (RULE queue, VALIDATION.md 08, Round 9) (QW)
    - {cap: engage,         score: 2, evidence: RAPIERSTAB}         # dives for itself, not a group initiation
