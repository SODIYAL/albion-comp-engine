# Shapeshifter line — remaining 6 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Hellspawn / Rootbound (Positional Drift, Tether Shift,
# Adapting Matter, Distortion, Pulse Shock). Form abilities are the payload,
# per the Hellspawn precedent; each E is scored on its form's stat line, its
# described mechanics and the form's own ability text, which sits on no equip
# menu (audit_form_abilities.py prints it; effect_overrides.yaml quotes it
# for each capability the lint checks). A capability the E carries leaves
# the tree pool's Q/W row on that weapon (`except:`): one slot per capability.

- weapon: 2H_SHAPESHIFTER_AVALON     # Lightcaller — flying bomber
  curated_as_of: 2026-10-04
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_aoe,     score: 5, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # Dawnbird: Judgment 350 in a 7 radius (30s, two Shift Charges),
                                                                            # Piercing Light 130 along a beam; above the ladder's 4 (232-264)
    - {cap: mobility,      score: 4, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # airborne, root-immune, +60% MS
    - {cap: disengage,     score: 4, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # fly out over what melee can't cross
    - {cap: engage,        score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}

- weapon: 2H_SHAPESHIFTER_CRYSTAL    # Stillgaze Staff — cobra skirmisher
  curated_as_of: 2026-10-04
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Cobra strikes
    - {cap: disengage,     score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Slippery: self-cleanse + MS on CC
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}
    - {cap: stun,          score: 4, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Serpent's Gaze: a 3s channel petrifies unmounted enemies
                                                                          # (ignores CC resistance, cannot be cleansed); 30s, two Shift Charges
    - {cap: heal_reduction, score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA} # Crystalburst: -20% Healing Received in a 4 radius (via override)
    - {cap: damage_debuff, score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Neurotoxin: poisoned enemies deal 12% less damage (via override)
    # Slippery is a SELF-cleanse — never scored as the ally-cleanse capability

- weapon: 2H_SHAPESHIFTER_KEEPER     # Earthrune Staff — the golem tank
  curated_as_of: 2026-10-04
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  # clump_create sits on the E (Tectonic Shift): one slot per capability
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
    - {cap: clump_create, evidence: SHAPE_W_AREA_PULL}
  capabilities:
    - {cap: tankiness,     score: 6, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Golem: "Defensive: high", forced-movement
                                                                           # immune, charge-scaled Max Health
    - {cap: self_sustain,  score: 4, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # max/current Health grant on transform
    - {cap: engage,        score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # the golem walks in and cannot be moved
    - {cap: stun,          score: 4, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Boulder Crash: 1.2s stun in a 3.5 radius on a 4s cooldown (via override)
    - {cap: clump_create,  score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Tectonic Shift: enemies between the wall and the golem are pulled in (via override)
    - {cap: knockback_displace, score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # the wall knocks back 2; Tectonic Slam throws a 6 radius in the air (via override)
    - {cap: max_health_cut, score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL} # Tectonic Slam's Rune: -10% Max and Current Health inside, 5s

- weapon: 2H_SHAPESHIFTER_MORGANA    # Bloodmoon Staff — the werewolf
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: catch, evidence: SHAPE_W_AREA_PULL}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_WEREWOLF}  # wolf melee combos
    - {cap: catch,         score: 4, evidence: SHAPESHIFT_WEREWOLF}  # wolf lunges run targets down
    - {cap: mobility,      score: 4, evidence: SHAPESHIFT_WEREWOLF}
    - {cap: self_sustain,  score: 2, evidence: SHAPESHIFT_WEREWOLF}  # Bloody Roar lifesteal below 40%

- weapon: 2H_SHAPESHIFTER_SET1       # Prowling Staff — the stealth panther
  curated_as_of: 2026-10-04
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  # mobility sits on the E (Sinister Swipes, Pounce): one slot per capability
  except:
    - {cap: zone_control, evidence: SHAPE_W_DAMAGE_AOE}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 4, evidence: SHAPESHIFT_PANTHER}  # pounce out of stealth
    - {cap: engage,        score: 4, evidence: SHAPESHIFT_PANTHER}  # On the Prowl invisibility opener (via override)
    - {cap: disengage,     score: 4, evidence: SHAPESHIFT_PANTHER}  # restealth and leave (via override)
    - {cap: execute,       score: 2, evidence: SHAPESHIFT_PANTHER}  # panther-form low-HP hunter kit (curation judgment)
    - {cap: heal_reduction, score: 2, evidence: SHAPESHIFT_PANTHER} # Infected Scrapes: -4% Healing Received a stack, five stacks (via override)
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_PANTHER}  # three charges through the target and the Pounce leap (via override)

- weapon: 2H_SHAPESHIFTER_SET3       # Primal Staff — the enrage bear
  curated_as_of: 2026-10-04
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  # resist_shred and peel sit on the E (Wild Onslaught, Roar): one slot per capability
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
    - {cap: resist_shred, evidence: SHAPE_Q_CONE_MELEE}
    - {cap: peel, evidence: SHAPE_W_POLYMORPH}
  capabilities:
    - {cap: tankiness,     score: 4, evidence: WEAPON_STATS}   # Bear: "Defensive: high" bruiser frame
    - {cap: burst_aoe,     score: 2, evidence: SHAPESHIFT_BEAR}  # bear swipes
    - {cap: sustained_dps, score: 2, evidence: SHAPESHIFT_BEAR}  # Enrage ramps below 40% Health
    - {cap: self_sustain,  score: 2, evidence: SHAPESHIFT_BEAR}
    - {cap: stun,          score: 2, evidence: SHAPESHIFT_BEAR}  # Feral Bash: 0.9s stun in a 4 radius for a Shift Charge (via override)
    - {cap: resist_shred,  score: 2, evidence: SHAPESHIFT_BEAR}  # Wild Onslaught: -15% damage resistances for 3s (via override)
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_BEAR}  # the Wild Onslaught dash (via override)
    - {cap: peel,          score: 2, evidence: SHAPESHIFT_BEAR}  # Roar: enemies in the cone flee for 1s (via override)
    # Swipes' 20% slow for 1s: no row (curation judgment)
