# Shapeshifter line — remaining 6 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Hellspawn / Rootbound (Positional Drift, Tether Shift,
# Adapting Matter, Distortion, Pulse Shock). Form abilities are the payload,
# per the Hellspawn precedent; each E is scored on its form's stat line and
# described mechanics.

- weapon: 2H_SHAPESHIFTER_AVALON     # Lightcaller — flying bomber
  curated_as_of: 2026-08-12
  role_hint: range
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # Dawnbird: "Offensive: high" aerial bombs
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # airborne, root-immune, +60% MS
    - {cap: disengage,     score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # fly out over what melee can't cross
    - {cap: engage,        score: 1, evidence: SHAPESHIFT_AVALONIAN_EAGLE}
    - {cap: clump_create,  score: 1, evidence: SHAPE_W_AREA_PULL}  # (QW)
    - {cap: root,          score: 1, evidence: SHAPE_W_AREA_PULL}  # (QW)
    - {cap: catch,         score: 1, evidence: SHAPE_W_AREA_PULL}  # (QW)
    - {cap: peel,          score: 1, evidence: SHAPE_W_TETHERBEAM} # (QW)
    - {cap: buff_allies,   score: 1, evidence: SHAPE_Q_DAMAGE_AND_SHIELD}  # (QW)
    - {cap: zone_control,  score: 1, evidence: SHAPE_W_DAMAGE_AOE} # (QW)
    - {cap: slow,          score: 1, evidence: SHAPE_W_DAMAGE_AOE} # (QW)
    - {cap: resist_shred,  score: 1, evidence: SHAPE_Q_CONE_MELEE} # (QW)
    - {cap: self_sustain,  score: 1, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}

