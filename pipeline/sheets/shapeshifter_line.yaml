# Shapeshifter line — remaining 6 weapons, curated 2026-08-12 (tree pass).
# Q/W pool parity with Hellspawn / Rootbound (Positional Drift, Tether Shift,
# Adapting Matter, Distortion, Pulse Shock). Form abilities are the payload,
# per the Hellspawn precedent; each E is scored on its form's stat line and
# described mechanics.

- weapon: 2H_SHAPESHIFTER_AVALON     # Lightcaller — flying bomber
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_aoe,     score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # Dawnbird: "Offensive: high" aerial bombs
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # airborne, root-immune, +60% MS
    - {cap: disengage,     score: 2, evidence: SHAPESHIFT_AVALONIAN_EAGLE}  # fly out over what melee can't cross
    - {cap: engage,        score: 1, evidence: SHAPESHIFT_AVALONIAN_EAGLE}

- weapon: 2H_SHAPESHIFTER_CRYSTAL    # Stillgaze Staff — cobra skirmisher
  curated_as_of: 2026-08-12
  role_hint: range
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 2, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Cobra strikes
    - {cap: disengage,     score: 1, evidence: SHAPESHIFT_CRYSTAL_COBRA}  # Slippery: self-cleanse + MS on CC
    - {cap: mobility,      score: 1, evidence: SHAPESHIFT_CRYSTAL_COBRA}
    # Slippery is a SELF-cleanse — never scored as the ally-cleanse capability

- weapon: 2H_SHAPESHIFTER_KEEPER     # Earthrune Staff — the golem tank
  curated_as_of: 2026-08-12
  role_hint: tank
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: tankiness,     score: 3, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # Golem: "Defensive: high", forced-movement
                                                                           # immune, charge-scaled Max Health
    - {cap: self_sustain,  score: 2, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # max/current Health grant on transform
    - {cap: engage,        score: 1, evidence: SHAPESHIFT_ROCK_ELEMENTAL}  # the golem walks in and cannot be moved

- weapon: 2H_SHAPESHIFTER_MORGANA    # Bloodmoon Staff — the werewolf
  curated_as_of: 2026-08-12
  role_hint: melee
  # deliberate non-takes of tree-pool spells (see sheets/pools/shapeshifterstaff.yaml)
  except:
    - {cap: self_sustain, evidence: PASSIVE_SHAPESHIFT_ATTACK_BUFF}
    - {cap: catch, evidence: SHAPE_W_AREA_PULL}
    - {cap: mobility, evidence: SHAPE_W_TETHERBEAM}
  capabilities:
    - {cap: burst_st,      score: 2, evidence: SHAPESHIFT_WEREWOLF}  # wolf melee combos
    - {cap: catch,         score: 2, evidence: SHAPESHIFT_WEREWOLF}  # wolf lunges run targets down
    - {cap: mobility,      score: 2, evidence: SHAPESHIFT_WEREWOLF}
    - {cap: self_sustain,  score: 1, evidence: SHAPESHIFT_WEREWOLF}  # Bloody Roar lifesteal below 40%

