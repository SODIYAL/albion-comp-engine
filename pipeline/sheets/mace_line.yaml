# Curated capability sheets — mace line (corrected after review, wiki + dump verified)
# Every nonzero score cites the spell that provides it (evidence lint enforces this).

- weapon: MAIN_MACE          # 1H Mace — mobility/stun bruiser-tank
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: tank             # was missing (2026-08-18): frontline bruiser-tank,
                              # fielded as "Tank" in Timothy's blap (data/published_comps)
  # deliberate non-takes of tree-pool spells (see sheets/pools/mace.yaml)
  except:
    - {cap: engage, evidence: CHARGE_ROOT}
    - {cap: slow, evidence: SACRED_GROUND}
    - {cap: zone_control, evidence: SACRED_GROUND}
  capabilities:
    - {cap: engage,     score: 4, evidence: MACELEAP}      # Deep Leap: gap-close
    - {cap: stun,       score: 4, evidence: MACELEAP}
    - {cap: mobility,   score: 4, evidence: MACELEAP}
    # NOTE: no purge — nothing in the mace Q/W kit nor Deep Leap removes buffs

- weapon: 2H_MACE            # Heavy Mace — disruption tank
  curated_as_of: 2026-08-12   # staleness check vs out/patch_history.json
  role_hint: tank             # was missing (2026-08-18): the archetypal
                              # disruption tank, "Tank" in Timothy's blap
  # deliberate non-takes of tree-pool spells (see sheets/pools/mace.yaml)
  except:
    - {cap: root, evidence: CHARGE_ROOT}
    - {cap: peel, evidence: GUARDRUNE}
  capabilities:
    - {cap: tankiness,  score: 6, evidence: WEAPON_STATS}
