    - {cap: peel,       score: 6, evidence: SHRIEKMACE}
    - {cap: engage,     score: 4, evidence: CHARGE_ROOT}   # Snare Charge: 11m charge
    - {cap: zone_control, score: 4, evidence: SACRED_GROUND}
