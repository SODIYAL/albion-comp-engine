# Resilience Penetration — per-weapon % of Focus Fire damage reduction the
# attacker ignores. A MELEE-ONLY stat: the wiki states it is "unique to
# melee weapons", so every ranged/magic weapon absent from this table is
# confidently 0 (the five shapeshifter staffs below are the only magic
# exceptions, active only while transformed).
#
# Source: https://wiki.albiononline.com/wiki/Resilience_Penetration
# (revision oldid=84609, page last edited 2026-08-25; values are
# post-Realm-Divided 30.000.1 — the general resil-pen reduction pass —
# unchanged through 31.030.1). Retrieved 2026-08-25, transcribed verbatim,
# nothing interpolated. Owner ruling wiring these (2026-08-25): "single
# target is just a non pick at 20+ usually because enemy will have too
# many defensives to protect that one person, you can wire it as partial
# rebate."
#
# `name` matches the catalog display_name; build_dataset resolves to ids
# and prints unmatched rows (a wiki weapon outside our combat catalog is
# skipped with a warning, never guessed).

rows:
  # Swords
  - {name: "Broadsword", pen: 0.30}
  - {name: "Claymore", pen: 0.30}
  - {name: "Dual Swords", pen: 0.25}
