name: Refresh killboard affinity

on:
  push:
    branches:
      - chatgpt/killboard-affinity
    paths:
      - .github/workflows/refresh-killboard-affinity.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/killboard-affinity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh AlbionBB sample
        run: python3 pipeline/sample_battles.py --battles 200 --server us

      - name: Rebuild dashboard
        run: python3 pipeline/build_dashboard.py

      - name: Validate generated affinity payload
        run: |
          python3 - <<'PY'
          import json
          p='pipeline/out/weapon_usage_v2.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          cohorts=d.get('cohorts') or {}
          total=sum(len(v) for v in cohorts.values()) if isinstance(cohorts, dict) else 0
          print('cohorts:', total)
          if total < 1:
              raise SystemExit('No organization cohorts generated; refusing to commit empty affinity data')
          PY

      - name: Commit regenerated evidence and dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/out/weapon_usage_v2.json dashboard/index.html docs/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Refresh killboard affinity sample'
            git push origin HEAD:chatgpt/killboard-affinity
          fi
