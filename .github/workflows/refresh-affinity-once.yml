name: One-shot refresh killboard affinity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-affinity-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affinity branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/killboard-affinity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh AlbionBB evidence
        run: python3 pipeline/sample_battles.py --battles 200 --server us

      - name: Rebuild dashboard
        run: python3 pipeline/build_dashboard.py

      - name: Validate cohort data
        run: |
          python3 - <<'PY'
          import json
          with open('pipeline/out/weapon_usage_v2.json', encoding='utf-8') as f:
              d=json.load(f)
          cohorts=d.get('cohorts') or {}
          total=sum(len(v) for v in cohorts.values()) if isinstance(cohorts, dict) else 0
          print('battles_sampled=', d.get('battles_sampled'))
          print('cohorts=', total)
          if total < 1:
              raise SystemExit('No organization cohorts generated; refusing to commit')
          PY

      - name: Commit refreshed generated files to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/out/weapon_usage_v2.json dashboard/index.html docs/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Refresh killboard affinity sample'
            git push origin HEAD:chatgpt/killboard-affinity
          fi
