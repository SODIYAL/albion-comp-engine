# The gate list from CLAUDE.md ("Tests" + "Build chain"), run on every push
# and pull request. No gate reads network data: the pinned snapshot and
# every generated artifact are committed, so the build chain verifies them
# (test_provenance rebuilds the dataset and checks it byte-identical). The
# network is used only to install pinned tooling (pip, and PGlite for the
# account database test).
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    # test_provenance rebuilds the dataset three times beside the build
    # chain's build, and hosted runners differ in speed (the same commit's
    # build chain varies by up to 1.7x): the limit leaves room for the slowest.
    timeout-minutes: 60
    # The toolchain is the one the committed artifacts are built with
    # (Python 3.14, Node 24): the byte-identical rebuild and the parity
    # gate's 1e-9 tolerance see float results, and Python's sum() of floats
    # changed its rounding at 3.12 (tests/VALIDATION.md, parity).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pip install -r requirements.txt

      - name: build chain
        run: |
          python3 pipeline/evidence_lint.py
          python3 pipeline/build_interactions.py
          python3 pipeline/build_builds.py
          python3 pipeline/build_dataset.py
          python3 pipeline/build_cohort_families.py
          python3 pipeline/build_portal_stats.py
          python3 dashboard/build.py

      - name: engine and evidence gates
        run: |
          python3 tests/test_golden.py
          python3 tests/test_forge.py
          python3 tests/test_builds.py
          python3 tests/test_interactions.py
          python3 tests/test_provenance.py
          python3 tests/test_patch_history.py
          python3 tests/test_js_parity.py
          python3 tests/test_dashboard_layout.py
          python3 tests/test_cohort_families.py
          python3 tests/test_usage_derive.py
          python3 tests/test_meta_pairs.py
          python3 tests/test_roles.py
          python3 tests/test_validation_modes.py
          python3 tests/test_skeletons.py
          python3 tests/test_tone.py
          python3 tests/test_content_tag.py
          python3 tests/test_portal_stats.py
          python3 tests/tier2_blindtest.py v4

      - name: display-layer gates
        run: |
          node tests/test_loadout_codec.js
          node tests/test_display_math.js
          node tests/test_live_party.js
          node tests/test_portal_page.js
          node tests/test_auth_ui.js
          node tests/test_profile.js
          node tests/test_guild.js
          node tests/test_comps.js
          node tests/test_events.js
          node tests/test_signup.js
          node tests/test_history.js
          node tests/test_import.js
          node tests/test_xlsx.js
          node tests/test_roster.js
          node tests/test_sheet_build.js

      - name: account database gates
        run: |
          python3 tests/test_supabase_schema.py
          npm install --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
          node tests/test_supabase_rls.mjs
